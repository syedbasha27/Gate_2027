<title>GATE CS 2027 — Pattern Study Guide</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#27415f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GATE CS"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f7f3e8;--card:#fffdf6;--ink:#2a2d34;--mute:#6b6f78;--navy:#27415f;--maroon:#7d3b43;--gold:#a8884a;--line:#e3dcc8;--ok:#4f7a5a}
@media (prefers-color-scheme:dark){:root{--bg:#f7f3e8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Segoe UI",system-ui,sans-serif}
h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;color:var(--navy);margin:.4em 0}
header{background:var(--navy);color:#f3ecd9;padding:18px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
header h1{color:#f3ecd9;margin:0;font-size:1.35rem}header nav button{background:none;border:1px solid #f3ecd955;color:#f3ecd9;padding:6px 14px;border-radius:20px;cursor:pointer;margin-left:6px}
header nav button.on{background:#f3ecd9;color:var(--navy)}
main{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0}
.crumb{font-size:.9rem;color:var(--mute);margin-bottom:4px}.crumb a{color:var(--maroon);cursor:pointer}
.home{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:20px;align-items:center}@media(max-width:720px){.home{grid-template-columns:1fr}}
.list .row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:8px 0;cursor:pointer;transition:.15s}
.list .row:hover{border-color:var(--gold);transform:translateX(2px)}.dot{width:12px;height:12px;border-radius:3px;flex:none}
.grow{flex:1}.pill{font-size:.8rem;color:var(--maroon);background:#f1e6e3;border-radius:12px;padding:2px 10px}
.bar{height:6px;background:#ece5d0;border-radius:3px;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:14px 0}.tabs button{background:none;border:0;padding:9px 16px;cursor:pointer;font-size:1rem;color:var(--mute);border-bottom:3px solid transparent}
.tabs button.on{color:var(--navy);border-color:var(--maroon);font-weight:600}
.q{white-space:pre-wrap;font-family:Consolas,monospace;font-size:.9rem;background:#faf7ec;border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0}
.meta{font-size:.8rem;color:var(--mute)}button.btn{background:var(--navy);color:#fff;border:0;padding:7px 14px;border-radius:8px;cursor:pointer;margin:4px 6px 4px 0}button.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.btn.done{background:var(--ok)}button.btn.alt.done{color:#fff;border-color:var(--ok)}.ans{display:none;background:#eef3ea;border-left:4px solid var(--ok);padding:10px 14px;margin-top:8px;border-radius:6px}.ans.show{display:block}
.opts div{padding:4px 10px;border:1px solid var(--line);border-radius:6px;margin:5px 0;background:#fff}
.note h4{color:var(--maroon);margin:14px 0 4px}.note li{margin:6px 0}table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}th{background:#efe8d3;color:var(--navy)}
.sim{background:#f3efe0;border:1px dashed var(--gold);border-radius:10px;padding:14px;margin:14px 0}.sim input,.sim select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.fr{display:inline-flex;flex-direction:column;margin:4px;vertical-align:top}.fr b{width:44px;height:30px;border:1px solid var(--navy);text-align:center;line-height:30px;background:#fff}.fr b.hit{background:#dce8d6}.fr b.miss{background:#f1d9d6}.fr span{font-size:.75rem;text-align:center;color:var(--mute)}
.cw{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:2px solid var(--navy);margin-top:8px}.cw i{width:26px;background:var(--navy);opacity:.75;position:relative;font-style:normal;font-size:.7rem;color:#fff;text-align:center}
.tip{font-size:.85rem;color:var(--mute)}.warn{background:#f6ecd4;border:1px solid #e2cf9c;border-radius:8px;padding:10px 14px;font-size:.88rem}
</style></head><body>

opriate word from the options given below to complete the following\nsentence.\nIf you are trying to make a strong impression on your audience, you cannot do so by being\nunderstated, tentative or *\n(A) hyperbolic\n(B) restrained\n(C) argumentative\n(D) indifferent"}, {"y": 2011, "p": "2011_CS", "n": 60, "m": 1, "s": "General Aptitude", "t": "Verbal ability", "q": "Choose the word from the options given below that is most nearly opposite in meaning to the given\nword:\nAmalgamate\n(A) merge\n(B) split\n(C) collect\n(D) separate"}, {"y": 2011, "p": "2011_CS", "n": 62, "m": 2, "s": "General Aptitude", "t": "Spatial & geometry", "q": "P,Q, Rand S are four types of dangerous microbes recently found in a human habitat. The area of\neach circle with its diameter printed in brackets represents the growth of a single microbe surviving\nhuman immunity system within 24 hours of entering the body. The danger to human beings varies\nproportionately with the toxicity, potency and growth attributed to a microbe shown in the figure\nbelow:\ne 1000\nBa\nSG\n2S 800\nge\nge\nese\n289 600\n\u00a38 &\nx\nces Q (40 mm)\nFSB 400\n+ O)\nxe} S (20 mm\nas R (30 mm) aN ( )\ni\u201d 7 | oy |\nos\nge\n\u2014 0\n0.2 0.4 0.6 0.8 1\nPotency\n(Probability that microbe will overcome human immunity system)\nA pharmaceutical company is contemplating the development of a vaccine against the most\ndangerous microbe. Which microbe should the company target in its first attempt?\n(A)P (B)Q (OR (@)s"}, {"y": 2011, "p": "2011_CS", "n": 63, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "The variable cost (V) of manufacturing a product varies according to the equation V= 4q, where q\nis the quantity produced. The fixed cost (F) of production of same product reduces with q according\nto the equation F = 100/q. How many units should be produced to minimize the total cost (V+F)?\n(A) 5 (B)4 (C)7 () 6"}, {"y": 2011, "p": "2011_CS", "n": 64, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "A transporter receives the same number of orders each day. Currently, he has some pending orders\n(backlog) to be shipped. If he uses 7 trucks, then at the end of the 4th day he can clear all the\norders. Alternatively, if he uses only 3 trucks, then all the orders are cleared at the end of the 10th\nday. What is the minimum number of trucks required so that there will be no pending order at the\nend of the 5th day?\n(Ay4 (B)5 \u00a9 6 (@)7"}, {"y": 2011, "p": "2011_CS", "n": 65, "m": 2, "s": "General Aptitude", "t": "Spatial & geometry", "q": "A container originally contains 10 litres of pure spirit. From this container 1 litre of spirit is\nreplaced with | litre of water. Subsequently, 1 litre of the mixture is again replaced with | litre of\nwater and this process is repeated one more time. How much spirit is now left in the container?\n(A) 7.58 litres (B) 7.84 litres (C) 7 litres (D) 7.29 litres\nEND OF THE QUESTION PAPER\nOY\nCSA 17720"}, {"y": 2012, "p": "2012_CS", "n": 2, "m": 1, "s": "Databases", "t": "Normalization & functional dependencies", "q": "Which of the following is TRUE?\n (A) Every relation in 3NF is also in BCNF\n (B) A relation R is in 3NF if every non-prime attribute of R is fully functionally dependent on every\n key of R\n (C) Every relation in BCNF is also in 3NF\n (D) No relation can be in both BCNF and 3NF"}, {"y": 2012, "p": "2012_CS", "n": 3, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "What will be the output of the following C program segment?\n char inChar = \u2018A\u2019 ;\n switch ( inChar ) {\n case \u2018A\u2019 : printf (\u201cChoice A\\ n\u201d) ;\n case \u2018B\u2019 :\n case \u2018C\u2019 : printf (\u201cChoice B\u201d) ;\n case \u2018D\u2019 :\n case \u2018E\u2019 :\n default : printf ( \u201c No Choice\u201d ) ; }\n (A) No Choice\n (B) Choice A\n (C) Choice A\n Choice B No Choice\n (D) Program gives no output as it is erroneous"}, {"y": 2012, "p": "2012_CS", "n": 4, "m": 1, "s": "Algorithms", "t": "NP-completeness", "q": "Assuming P \u2260 NP, which of the following is TRUE?\n (A) NP-complete = NP (B) NP-complete \u2229 P = \uf0c6\n (C) NP-hard = NP (D) P = NP-complete"}, {"y": 2012, "p": "2012_CS", "n": 5, "m": 1, "s": "Algorithms", "t": "Sorting & searching", "q": "The worst case running time to search for an element in a balanced binary search tree with n2n\n elements is\n (A) \u0398 (n log n) (B) \u0398 (n2n) (C) \u0398 (n) (D) \u0398 (log n)\nCS-A 2/20\n2012 COMPUTER SCIENCE & INFORMATION TECH. \u2013 CS"}, {"y": 2012, "p": "2012_CS", "n": 6, "m": 1, "s": "Digital Logic", "t": "Combinational circuits & K-maps", "q": "The truth table\n X Y f (X, Y)\n 0 0 0\n 0 1 0\n 1 0 1\n 1 1 1\n represents the Boolean function\n (A) X (B) X + Y (C) X \uf0c5 Y (D) Y"}, {"y": 2012, "p": "2012_CS", "n": 7, "m": 1, "s": "Computer Organization", "t": "Instruction set, addressing & control unit", "q": "The decimal value 0.5 in IEEE single precision floating point representation has\n (A) fraction bits of 000\u2026000 and exponent value of 0\n (B) fraction bits of 000\u2026000 and exponent value of \u22121\n (C) fraction bits of 100\u2026000 and exponent value of 0\n (D) no exact representation"}, {"y": 2012, "p": "2012_CS", "n": 8, "m": 1, "s": "Operating Systems", "t": "Files, disk, I/O, system calls", "q": "A process executes the code\n fork();\n fork();\n fork();\n The total number of child processes created is\n (A) 3 (B) 4 (C) 7 (D) 8"}, {"y": 2012, "p": "2012_CS", "n": 9, "m": 1, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "Consider the function f(x) = sin(x) in the interval x \uf0ce [\u03c0/4, 7\u03c0/4]. The number and location(s) of the\n local minima of this function are\n (A) One, at \u03c0/2\n (B) One, at 3\u03c0/2\n (C) Two, at \u03c0/2 and 3\u03c0/2\n (D) Two, at \u03c0/4 and 3\u03c0/2"}, {"y": 2012, "p": "2012_CS", "n": 10, "m": 1, "s": "Data Structures", "t": "Stacks, queues, linked lists", "q": "The protocol data unit (PDU) for the application layer in the Internet stack is\n (A) Segment (B) Datagram (C) Message (D) Frame"}, {"y": 2012, "p": "2012_CS", "n": 11, "m": 1, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "Let A be the 2 \u00d7 2 matrix with elements a11 = a12 = a21 = +1 and a22 = \u22121. Then the eigenvalues of\n the matrix A19 are\n (A) 1024 and \u22121024 (B) 1024\u221a2 and \u22121024\u221a2\n (C) 4\u221a2 and \u22124\u221a2 (D) 512\u221a2 and \u2212512\u221a2"}, {"y": 2012, "p": "2012_CS", "n": 12, "m": 1, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "What is the complement of the language accepted by the NFA shown below?\n Assume \uf053 = {a} and \uf065 is the empty string.\n a \uf065\n \uf065\n (A) \uf0c6 (B) {\uf065} (C) a* (D) {a , \uf065}\nCS-A 3/20\n2012 COMPUTER SCIENCE & INFORMATION TECH. \u2013 CS"}, {"y": 2012, "p": "2012_CS", "n": 14, "m": 1, "s": "Databases", "t": "ER model, indexing & B+ trees", "q": "Given the basic ER and relational models, which of the following is INCORRECT?\n (A) An attribute of an entity can have more than one value\n (B) An attribute of an entity can be composite\n (C) In a row of a relational table, an attribute can have more than one value\n (D) In a row of a relational table, an attribute can have exactly one value or a NULL value"}, {"y": 2012, "p": "2012_CS", "n": 15, "m": 1, "s": "Databases", "t": "SQL & relational algebra", "q": "Which of the following statements are TRUE about an SQL query?\n P : An SQL query can contain a HAVING clause even if it does not have a GROUP BY clause\n Q : An SQL query can contain a HAVING clause only if it has a GROUP BY clause\n R : All attributes used in the GROUP BY clause must appear in the SELECT clause\n S : Not all attributes used in the GROUP BY clause need to appear in the SELECT clause\n (A) P and R (B) P and S (C) Q and R (D) Q and S"}, {"y": 2012, "p": "2012_CS", "n": 16, "m": 1, "s": "Theory of Computation", "t": "Decidability & Turing machines", "q": "The recurrence relation capturing the optimal execution time of the Towers of Hanoi problem with\n n discs is\n (A) T(n) = 2T(n \u2212 2) + 2 (B) T(n) = 2T(n \u2212 1) + n\n (C) T(n) = 2T(n/2) + 1 (D) T(n) = 2T(n \u2212 1) + 1"}, {"y": 2012, "p": "2012_CS", "n": 17, "m": 1, "s": "Discrete Mathematics", "t": "Graph theory", "q": "Let G be a simple undirected planar graph on 10 vertices with 15 edges. If G is a connected graph,\n then the number of bounded faces in any embedding of G on the plane is equal to\n (A) 3 (B) 4 (C) 5 (D) 6"}, {"y": 2012, "p": "2012_CS", "n": 18, "m": 1, "s": "Algorithms", "t": "Complexity & recurrences", "q": "Let W(n) and A(n) denote respectively, the worst case and average case running time of an\n algorithm executed on an input of size n. Which of the following is ALWAYS TRUE?\n (A) A(n) = \u03a9 (W(n)) (B) A(n) = \u0398 (W(n))\n (C) A(n) = O (W(n)) (D) A(n) = o (W(n))"}, {"y": 2012, "p": "2012_CS", "n": 19, "m": 1, "s": "Digital Logic", "t": "Combinational circuits & K-maps", "q": "The amount of ROM needed to implement a 4 bit multiplier is\n (A) 64 bits (B) 128 bits (C) 1 Kbits (D) 2 Kbits"}, {"y": 2012, "p": "2012_CS", "n": 20, "m": 1, "s": "Computer Organization", "t": "Pipelining", "q": "Register renaming is done in pipelined processors\n (A) as an alternative to register allocation at compile time\n (B) for efficient access to function parameters and local variables\n (C) to handle certain kinds of hazards\n (D) as part of address translation"}, {"y": 2012, "p": "2012_CS", "n": 21, "m": 1, "s": "Discrete Mathematics", "t": "Combinatorics & probability", "q": "Consider a random variable X that takes values +1 and \u22121 with probability 0.5 each. The values of\n the cumulative distribution function F(x) at x = \u22121 and +1 are\n (A) 0 and 0.5 (B) 0 and 1 (C) 0.5 and 1 (D) 0.25 and 0.75\nCS-A 4/20\n2012 COMPUTER SCIENCE & INFORMATION TECH. \u2013 CS"}, {"y": 2012, "p": "2012_CS", "n": 22, "m": 1, "s": "Computer Networks", "t": "Transport layer (TCP/UDP)", "q": "Which of the following transport layer protocols is used to support electronic mail?\n (A) SMTP (B) IP (C) TCP (D) UDP"}, {"y": 2012, "p": "2012_CS", "n": 23, "m": 1, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "In the IPv4 addressing format, the number of networks allowed under Class C addresses is\n (A) 214 (B) 27 (C) 221 (D) 224"}, {"y": 2012, "p": "2012_CS", "n": 24, "m": 1, "s": "Theory of Computation", "t": "CFLs & pushdown automata", "q": "Which of the following problems are decidable?\n 1) Does a given program ever produce an output?\n 2) If L is a context-free language, then, is L also context-free?\n 3) If L is a regular language, then, is L also regular?\n 4) If L is a recursive language, then, is L also recursive?\n (A) 1, 2, 3, 4 (B) 1, 2 (C) 2, 3, 4 (D) 3, 4"}, {"y": 2012, "p": "2012_CS", "n": 27, "m": 2, "s": "Databases", "t": "Transactions & concurrency", "q": "Consider the following transactions with data items P and Q initialized to zero:\n T1 :read (P);\n read (Q);\n if P = 0 then Q := Q + 1 ;\n write (Q).\n T2 : read (Q);\n read (P);\n if Q = 0 then P := P + 1 ;\n write (P).\n Any non-serial interleaving of T1 and T2 for concurrent execution leads to\n (A) a serializable schedule\n (B) a schedule that is not conflict serializable\n (C) a conflict serializable schedule\n (D) a schedule for which a precedence graph cannot be drawn"}, {"y": 2012, "p": "2012_CS", "n": 28, "m": 2, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "The bisection method is applied to compute a zero of the function f(x) = x4 \u2013 x3 \u2013 x2 \u2013 4 in the\n interval [1,9]. The method converges to a solution after \u2013\u2013\u2013\u2013\u2013 iterations.\n (A) 1 (B) 3 (C) 5 (D) 7"}, {"y": 2012, "p": "2012_CS", "n": 29, "m": 2, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "Let G be a weighted graph with edge weights greater than one and G\uf0a2 be the graph constructed by\n squaring the weights of edges in G. Let T and T\uf0a2 be the minimum spanning trees of G and G\uf0a2,\n respectively, with total weights t and t\uf0a2. Which of the following statements is TRUE?\n (A) T\uf0a2 = T with total weight t\uf0a2 = t2\n (B) T\uf0a2 = T with total weight t\uf0a2 < t2\n (C) T\uf0a2 \u2260 T but total weight t\uf0a2 = t2\n (D) None of the above\nCS-A 6/20\n2012 COMPUTER SCIENCE & INFORMATION TECH. \u2013 CS"}, {"y": 2012, "p": "2012_CS", "n": 30, "m": 2, "s": "Digital Logic", "t": "Combinational circuits & K-maps", "q": "What is the minimal form of the Karnaugh map shown below? Assume that X denotes a don\u2019t care\n term.\n ab\n cd 00 01 11 10\n 00 1 X X 1\n 01 X 1\n 11\n 10 1 X\n (A) b d (B) b d \uf02b b c (C) b d \uf02b ab c d (D) b d \uf02b b c \uf02b c d"}, {"y": 2012, "p": "2012_CS", "n": 31, "m": 2, "s": "Operating Systems", "t": "Scheduling & deadlock", "q": "Consider the 3 processes, P1, P2 and P3 shown in the table.\n Process Arrival Time Units\n time Required\n P1 0 5\n P2 1 7\n P3 3 4\n The completion order of the 3 processes under the policies FCFS and RR2 (round robin scheduling\n with CPU quantum of 2 time units) are\n (A) FCFS: P1, P2, P3 RR2: P1, P2, P3 (B) FCFS: P1, P3, P2 RR2: P1, P3, P2\n (C) FCFS: P1, P2, P3 RR2: P1, P3, P2 (D) FCFS: P1, P3, P2 RR2: P1, P2, P3"}, {"y": 2012, "p": "2012_CS", "n": 32, "m": 2, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Fetch_And_Add(X,i) is an atomic Read-Modify-Write instruction that reads the value of\n memory location X, increments it by the value i, and returns the old value of X. It is used in the\n pseudocode shown below to implement a busy-wait lock. L is an unsigned integer shared variable\n initialized to 0. The value of 0 corresponds to lock being available, while any non-zero value\n corresponds to the lock being not available.\n AcquireLock(L){\n while (Fetch_And_Add(L,1))\n L = 1;\n }\n ReleaseLock(L){\n L = 0;\n }\n This implementation\n (A) fails as L can overflow\n (B) fails as L can take on a non-zero value when the lock is actually available\n (C) works correctly but may starve some processes\n (D) works correctly without starvation"}, {"y": 2012, "p": "2012_CS", "n": 33, "m": 2, "s": "Discrete Mathematics", "t": "Combinatorics & probability", "q": "Suppose a fair six-sided die is rolled once. If the value on the die is 1, 2, or 3, the die is rolled a\n second time. What is the probability that the sum total of values that turn up is at least 6?\n (A) 10/21 (B) 5/12 (C) 2/3 (D) 1/6\nCS-A 7/20\n2012 COMPUTER SCIENCE & INFORMATION TECH. \u2013 CS"}, {"y": 2012, "p": "2012_CS", "n": 34, "m": 2, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "An Internet Service Provider (ISP) has the following chunk of CIDR-based IP addresses available\n with it: 245.248.128.0/20. The ISP wants to give half of this chunk of addresses to Organization A,\n and a quarter to Organization B, while retaining the remaining with itself. Which of the following is\n a valid allocation of addresses to A and B?\n (A) 245.248.136.0/21 and 245.248.128.0/22\n (B) 245.248.128.0/21 and 245.248.128.0/22\n (C) 245.248.132.0/22 and 245.248.132.0/21\n (D) 245.248.136.0/24 and 245.248.132.0/21"}, {"y": 2012, "p": "2012_CS", "n": 35, "m": 2, "s": "Data Structures", "t": "Stacks, queues, linked lists", "q": "Suppose a circular queue of capacity (n \u22121) elements is implemented with an array of n elements.\n Assume that the insertion and deletion operations are carried out using REAR and FRONT as array\n index variables, respectively. Initially, REAR = FRONT = 0. The conditions to detect queue full\n and queue empty are\n (A) full: (REAR+1) mod n == FRONT (B) full: (REAR+1) mod n == FRONT\n empty: REAR == FRONT empty: (FRONT+1) mod n == REAR\n (C) full: REAR == FRONT (D) full: (FRONT+1) mod n == REAR\n empty: (REAR+1) mod n == FRONT empty: REAR == FRONT\nCS-A 8/20\n2012 COMPUTER SCIENCE & INFORMATION TECH. \u2013 CS"}, {"y": 2012, "p": "2012_CS", "n": 36, "m": 2, "s": "Compiler Design", "t": "Lexical analysis, optimisation & runtime", "q": "Consider the program given below, in a block-structured pseudo-language with lexical scoping and\n nesting of procedures permitted.\n Program main;\n Var ...\n Procedure A1;\n Var ...\n Call A2;\n End A1\n Procedure A2;\n Var ...\n Procedure A21;\n Var ...\n Call A1;\n End A21\n Call A21;\n End A2\n Call A1;\n End main.\n Consider the calling chain: Main \uf0e0 A1 \uf0e0 A2 \uf0e0 A21 \uf0e0 A1\n The correct set of activation records along with their access links is given by\n (A) (B)\n Main Main\n A1 A1\n A2 A2\n A21 A21\n A1 A1\n FRAME ACCESS FRAME ACCESS\n POINTER LINKS POINTER LINKS\n (C) (D)\n Main Main\n FRAME A1 A1\n POINTER\n A2 A2\n A21 A21\n ACCESS\n LINKS A1\n FRAME ACCESS\n POINTER LINKS\nCS-A 9/20\n2012 COMPUTER SCIENCE & INFORMATION TECH. \u2013 CS"}, {"y": 2012, "p": "2012_CS", "n": 37, "m": 2, "s": "Discrete Mathematics", "t": "Logic, sets, relations & algebra", "q": "How many onto (or surjective) functions are there from an n-element (n \uf0b3 2) set to a 2-element set?\n (A) 2n (B) 2n \u2212 1 (C) 2n \u2212 2 (D) 2(2n \u2013 2)"}, {"y": 2012, "p": "2012_CS", "n": 38, "m": 2, "s": "Discrete Mathematics", "t": "Graph theory", "q": "Let G be a complete undirected graph on 6 vertices. If vertices of G are labeled, then the number of\n distinct cycles of length 4 in G is equal to\n (A) 15 (B) 30 (C) 90 (D) 360"}, {"y": 2012, "p": "2012_CS", "n": 39, "m": 2, "s": "Algorithms", "t": "Complexity & recurrences", "q": "A list of n strings, each of length n, is sorted into lexicographic order using the merge-sort\n algorithm. The worst case running time of this computation is\n (A) O (n log n) (B) O (n2 log n) (C) O (n2 + log n) (D) O (n2)"}, {"y": 2012, "p": "2012_CS", "n": 40, "m": 2, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "Consider the directed graph shown in the figure below. There are multiple shortest paths between\n vertices S and T. Which one will be reported by Dijkstra\u2019s shortest path algorithm? Assume that, in\n any iteration, the shortest path to a vertex v is updated only when a strictly shorter path to v is\n discovered.\n 2\n E\n C 1 D 2\n G\n 1\n A 1\n 3\n 4\n 4 3\n 7 3\n S D\n 4\n 3 5\n 5 T\n 3\n B F\n (A) SDT (B) SBDT (C) SACDT (D) SACET"}, {"y": 2012, "p": "2012_CS", "n": 41, "m": 2, "s": "Operating Systems", "t": "Files, disk, I/O, system calls", "q": "A file system with 300 GByte disk uses a file descriptor with 8 direct block addresses, 1 indirect\n block address and 1 doubly indirect block address. The size of each disk block is 128 Bytes and the\n size of each disk block address is 8 Bytes. The maximum possible file size in this file system is\n (A) 3 KBytes\n (B) 35 KBytes\n (C) 280 KBytes\n (D) dependent on the size of the disk"}, {"y": 2012, "p": "2012_CS", "n": 42, "m": 2, "s": "Operating Systems", "t": "Memory management & virtual memory", "q": "Consider the virtual page reference string\n 1, 2, 3, 2, 4, 1, 3, 2, 4, 1\n on a demand paged virtual memory system running on a computer system that has main memory\n size of 3 page frames which are initially empty. Let LRU, FIFO and OPTIMAL denote the number\n of page faults under the corresponding page replacement policy. Then\n (A) OPTIMAL < LRU < FIFO (B) OPTIMAL < FIFO < LRU\n (C) OPTIMAL = LRU (D) OPTIMAL = FIFO"}, {"y": 2012, "p": "2012_CS", "n": 44, "m": 2, "s": "Operating Systems", "t": "Files, disk, I/O, system calls", "q": "Consider a source computer (S) transmitting a file of size 106 bits to a destination computer (D)\n over a network of two routers (R1 and R2) and three links (L1, L2, and L3). L1 connects S to R1; L2\n connects R1 to R2; and L3 connects R2 to D. Let each link be of length 100 km. Assume signals\n travel over each link at a speed of 108 meters per second. Assume that the link bandwidth on each\n link is 1Mbps. Let the file be broken down into 1000 packets each of size 1000 bits. Find the total\n sum of transmission and propagation delays in transmitting the file from S to D?\n (A) 1005 ms (B) 1010 ms (C) 3000 ms (D) 3003 ms"}, {"y": 2012, "p": "2012_CS", "n": 45, "m": 2, "s": "Computer Networks", "t": "Transport layer (TCP/UDP)", "q": "Consider an instance of TCP\u2019s Additive Increase Multiplicative Decrease (AIMD) algorithm where\n the window size at the start of the slow start phase is 2 MSS and the threshold at the start of the first\n transmission is 8 MSS. Assume that a timeout occurs during the fifth transmission. Find the\n congestion window size at the end of the tenth transmission.\n (A) 8 MSS (B) 14 MSS (C) 7 MSS (D) 12 MSS"}, {"y": 2012, "p": "2012_CS", "n": 46, "m": 2, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "Consider the set of strings on {0,1} in which, every substring of 3 symbols has at most two zeros.\n For example, 001110 and 011001 are in the language, but 100010 is not. All strings of length less\n than 3 are also in the language. A partially completed DFA that accepts this language is shown\n below.\n 00\n 0\n 1\n 0 01\n 0\n 0 1\n \uf065 q 0, 1\n 1 0\n 1 10\n 11\n 1\n The missing arcs in the DFA are\n (A) (B)\n 00 01 10 11 q 00 01 10 11 q\n 00 1 0 00 0 1\n 01 1 01 1\n 10 0 10 0\n 11 0 11 0\n (C) (D)\n 00 01 10 11 q 00 01 10 11 q\n 00 1 0 00 1 0\n 01 1 01 1\n 10 0 10 0\n 11 0 11 0\nCS-A 11/20\n2012 COMPUTER SCIENCE & INFORMATION TECH. \u2013 CS"}, {"y": 2012, "p": "2012_CS", "n": 47, "m": 2, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "The height of a tree is defined as the number of edges on the longest path in the tree. The function\n shown in the pseudocode below is invoked as height(root) to compute the height of a binary\n tree rooted at the tree pointer root.\n int height (treeptr n)\n { if (n == NULL) return -1;\n if (n \uf0e0 left == NULL)\n if (n \uf0e0 right == NULL) return 0;\n else return B1 ; // Box 1\n else { h1 = height (n \uf0e0 left);\n if (n \uf0e0 right == NULL) return (1+h1);\n else { h2 = height (n \uf0e0 right);\n return B2 ; // Box 2\n }\n }\n }\n The appropriate expressions for the two boxes B1 and B2 are\n (A) B1: (1+height(n \uf0e0 right)) (B) B1: (height(n \uf0e0 right))\n B2: (1+max(h1, h2)) B2: (1+max(h1,h2))\n (C) B1: height(n \uf0e0 right) (D) B1: (1+ height(n \uf0e0 right))\n B2: max(h1, h2) B2: max(h1, h2)\nCS-A 12/20\n2012 COMPUTER SCIENCE & INFORMATION TECH. \u2013 CS\nCommon Data Questions\n Common Data for Questions 48 and 49:\n Consider the following C c"}, {"y": 2012, "p": "2012_CS", "n": 50, "m": 2, "s": "Databases", "t": "SQL & relational algebra", "q": "How many tuples does the result of the following relational algebra expression contain? Assume\n that the schema of A\u222aB is the same as that of A.\n (A\u222aB) \u22c8 A.Id > 40 \uf0da C.Id < 15 C\n (A) 7 (B) 4 (C) 5 (D) 9"}, {"y": 2012, "p": "2012_CS", "n": 51, "m": 2, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "How many tuples does the result of the following SQL query contain?\n SELECT A.Id\n FROM A\n WHERE A.Age > ALL (SELECT B.Age\n FROM B\n WHERE B.Name = \u2018Arun\u2019)\n (A) 4 (B) 3 (C) 0 (D) 1\nCS-A 14/20\n2012 COMPUTER SCIENCE & INFORMATION TECH. \u2013 CS\nLinked Answer Questions\n Statement for Linked Answer Questions 52 and 53:\n For the grammar below, a partial LL(1) parsing table is also presented along with the grammar. Entries that\n need to be filled are indicated as E1, E2, and E3. \uf065 is the empty string, $ indicates end of input, and, |\n separates alternate right hand sides of productions.\n S\uf0e0aAbB | bAaB | \uf065\n A\uf0e0S\n B\uf0e0S\n a b $\n S E1 E2 S\uf0e0\uf065\n A A\uf0e0S A\uf0e0S error\n B B\uf0e0S B\uf0e0S E3"}, {"y": 2012, "p": "2012_CS", "n": 52, "m": 2, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "The FIRST and FOLLOW sets for the non-terminals A and B are\n (A) FIRST(A) = {a, b, \uf065} = FIRST(B) (B) FIRST(A) = {a, b, $}\n FOLLOW(A) = {a, b} FIRST(B) = {a, b, \uf065}\n FOLLOW(B) = {a, b, $} FOLLOW(A) = {a, b}\n FOLLOW(B) = {$}\n (C) FIRST(A) = {a, b, \uf065} = FIRST(B) (D) FIRST(A) = {a, b} = FIRST(B)\n FOLLOW(A) = {a, b} FOLLOW(A) = {a, b}\n FOLLOW(B) = \uf0c6 FOLLOW(B) = {a, b}"}, {"y": 2012, "p": "2012_CS", "n": 53, "m": 2, "s": "Computer Organization", "t": "Cache & memory hierarchy", "q": "The appropriate entries for E1, E2, and E3 are\n (A) E1: S \uf0e0 aAbB, A \uf0e0 S (B) E1: S \uf0e0 aAbB, S \uf0e0 \uf065\n E2: S \uf0e0 bAaB, B \uf0e0 S E2: S \uf0e0 bAaB, S \uf0e0 \uf065\n E3: B \uf0e0 S E3: S \uf0e0 \uf065\n (C) E1: S \uf0e0 aAbB, S \uf0e0 \uf065 (D) E1: A \uf0e0 S, S \uf0e0 \uf065\n E2: S \uf0e0 bAaB, S \uf0e0 \uf065 E2: B \uf0e0 S, S \uf0e0 \uf065\n E3: B \uf0e0 S E3: B \uf0e0 S\n Statement for Linked Answer Questions 54 and 55:\n A computer has a 256 KByte, 4-way set associative, write back data cache with block size of 32 Bytes. The\n processor sends 32 bit addresses to the cache controller. Each cache tag directory entry contains, in\n addition to address tag, 2 valid bits, 1 modified bit and 1 replacement bit."}, {"y": 2012, "p": "2012_CS", "n": 54, "m": 2, "s": "Computer Organization", "t": "Cache & memory hierarchy", "q": "The number of bits in the tag field of an address is\n (A) 11 (B) 14 (C) 16 (D) 27"}, {"y": 2012, "p": "2012_CS", "n": 55, "m": 2, "s": "Computer Organization", "t": "Cache & memory hierarchy", "q": "The size of the cache tag directory is\n (A) 160 Kbits (B) 136 Kbits (C) 40 Kbits (D) 32 Kbits\nCS-A 15/20\n2012 COMPUTER SCIENCE & INFORMATION TECH. \u2013 CS\nGeneral Aptitude (GA) Questions"}, {"y": 2012, "p": "2012_CS", "n": 57, "m": 1, "s": "General Aptitude", "t": "Verbal ability", "q": "Choose the most appropriate alternative from the options given below to complete the following\n sentence:\n Despite several \u2013\u2013\u2013\u2013\u2013\u2013\u2013\u2013\u2013 the mission succeeded in its attempt to resolve the conflict.\n (A) attempts (B) setbacks (C) meetings (D) delegations"}, {"y": 2012, "p": "2012_CS", "n": 58, "m": 1, "s": "General Aptitude", "t": "Verbal ability", "q": "Which one of the following options is the closest in meaning to the word given below?\n Mitigate\n (A) Diminish (B) Divulge (C) Dedicate (D) Denote"}, {"y": 2012, "p": "2012_CS", "n": 59, "m": 1, "s": "General Aptitude", "t": "Verbal ability", "q": "Choose the grammatically INCORRECT sentence:\n (A) They gave us the money back less the service charges of Three Hundred rupees.\n (B) This country\u2019s expenditure is not less than that of Bangladesh.\n (C) The committee initially asked for a funding of Fifty Lakh rupees, but later settled for a lesser\n sum.\n (D) This country\u2019s expenditure on educational reforms is very less."}, {"y": 2012, "p": "2012_CS", "n": 60, "m": 1, "s": "General Aptitude", "t": "Verbal ability", "q": "Choose the most appropriate alternative from the options given below to complete the following\n sentence:\n Suresh\u2019s dog is the one \u2013\u2013\u2013\u2013\u2013\u2013\u2013\u2013\u2013 was hurt in the stampede.\n (A) that (B) which (C) who (D) whom"}, {"y": 2012, "p": "2012_CS", "n": 62, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "A political party orders an arch for the entrance to the ground in which the annual convention is\n being held. The profile of the arch follows the equation y = 2x \u2013 0.1x2 where y is the height of the\n arch in meters. The maximum possible height of the arch is\n (A) 8 meters (B) 10 meters (C) 12 meters (D) 14 meters\nCS-A 16/20\n2012 COMPUTER SCIENCE & INFORMATION TECH. \u2013 CS"}, {"y": 2012, "p": "2012_CS", "n": 63, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "An automobile plant contracted to buy shock absorbers from two suppliers X and Y. X supplies\n 60% and Y supplies 40% of the shock absorbers. All shock absorbers are subjected to a quality test.\n The ones that pass the quality test are considered reliable. Of X\u2019s shock absorbers, 96% are reliable.\n Of Y\u2019s shock absorbers, 72% are reliable.\n The probability that a randomly chosen shock absorber, which is found to be reliable, is made by Y\n is\n (A) 0.288 (B) 0.334 (C) 0.667 (D) 0.720"}, {"y": 2012, "p": "2012_CS", "n": 64, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "Which of the following assertions are CORRECT?\n P: Adding 7 to each entry in a list adds 7 to the mean of the list\n Q: Adding 7 to each entry in a list adds 7 to the standard deviation of the list\n R: Doubling each entry in a list doubles the mean of the list\n S: Doubling each entry in a list leaves the standard deviation of the list unchanged\n (A) P, Q (B) Q, R (C) P, R (D) R, S"}, {"y": 2012, "p": "2012_CS", "n": 65, "m": 2, "s": "General Aptitude", "t": "Spatial & geometry", "q": "Given the sequence of terms, AD CG FK JP, the next term is\n (A) OV (B) OW (C) PV (D) PW\n END OF THE QUESTION PAPER\nCS-A 17/20\n GATE 2012 \u2010 Answer Key \u2010 Paper : CS\nPaper Question no. Code : A Code : B Code : C Code : D\n CS 1 B C B D\n CS 2 C C D C\n CS 3 Marks to All C C C\n CS 4 B D D C\n CS 5 C D C C\n CS 6 A C B C\n CS 7 B D A D\n CS 8 C C C C\n CS 9 D C B D\n CS 10 C C Marks to All D\n CS 11 D C C C\n CS 12 B C B C\n CS 13 C D C B\n CS 14 C B D C\n CS 15 C C C D\n CS 16 D Marks to All C C\n CS 17 D B C D\n CS 18 C C C C\n CS 19 D A D B\n CS 20 C B C A\n CS 21 C C D C\n CS 22 C D D B\n CS 23 C C C Marks to All\n CS 24 D D C C\n CS 25 C B C B\n CS 26 B C D D\n CS 27 B Marks to All A A\n CS 28 B Marks to All A Marks to All\n CS 29 Marks to All D B A\n CS 30 B B B A\n CS 31 C B C B\n CS 32 B A B B\n CS 33 B A Marks to All D\n CS 34 A Marks to All B Marks to All\n CS 35 A A B Marks to All\n CS 36 D D B C\n CS 37 C B D D\n CS "}, {"y": 2013, "p": "2013_CS", "n": 2, "m": 1, "s": "Discrete Mathematics", "t": "Combinatorics & probability", "q": "Suppose p is the number of cars per minute passing through a certain road junction between 5 PM\n and 6 PM, and p has a Poisson distribution with mean 3. What is the probability of observing fewer\n than 3 cars during any given minute in this interval?\n (A) 8/(2e3) (B) 9/(2e3) (C) 17/(2e3) (D) 26/(2e3)\n 1 x x2"}, {"y": 2013, "p": "2013_CS", "n": 4, "m": 1, "s": "Digital Logic", "t": "Number systems & arithmetic", "q": "The smallest integer that can be represented by an 8-bit number in 2\u2019s complement form is\n (A) -256 (B) -128 (C) -127 (D) 0"}, {"y": 2013, "p": "2013_CS", "n": 5, "m": 1, "s": "Digital Logic", "t": "Combinational circuits & K-maps", "q": "In the following truth table, V = 1 if and only if the input is valid.\n Inputs Outputs\n D0 D1 D2 D3 X0 X1 V\n 0 0 0 0 x x 0\n 1 0 0 0 0 0 1\n x 1 0 0 0 1 1\n x x 1 0 1 0 1\n x x x 1 1 1 1\n What function does the truth table represent?\n (A) Priority encoder (B) Decoder\n (C) Multiplexer (D) Demultiplexer"}, {"y": 2013, "p": "2013_CS", "n": 6, "m": 1, "s": "Algorithms", "t": "Sorting & searching", "q": "Which one of the following is the tightest upper bound that represents the number of swaps\n required to sort n numbers using selection sort?\n (A) O(log n) (B) O(n) (C) O(n log n) (D) O(n2)"}, {"y": 2013, "p": "2013_CS", "n": 7, "m": 1, "s": "Algorithms", "t": "Sorting & searching", "q": "Which one of the following is the tightest upper bound that represents the time complexity of\n inserting an object into a binary search tree of n nodes?\n (A) O(1) (B) O(log n) (C) O(n) (D) O(n log n)\nCS-A 2/20\n2013 COMPUTER SCIENCE & INFORMATION TECH. - CS"}, {"y": 2013, "p": "2013_CS", "n": 9, "m": 1, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "What is the maximum number of reduce moves that can be taken by a bottom-up parser for a\n grammar with no epsilon- and unit-production (i.e., of type A \u2192 \u0454 and A \u2192 a) to parse a string\n with n tokens?\n (A) n/2 (B) n-1 (C) 2n-1 (D) 2n"}, {"y": 2013, "p": "2013_CS", "n": 10, "m": 1, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "A scheduling algorithm assigns priority proportional to the waiting time of a process. Every process\n starts with priority zero (the lowest priority). The scheduler re-evaluates the process priorities every\n T time units and decides the next process to schedule. Which one of the following is TRUE if the\n processes have no I/O operations and all arrive at time zero?\n (A) This algorithm is equivalent to the first-come-first-serve algorithm.\n (B) This algorithm is equivalent to the round-robin algorithm.\n (C) This algorithm is equivalent to the shortest-job-first algorithm.\n (D) This algorithm is equivalent to the shortest-remaining-time-first algorithm."}, {"y": 2013, "p": "2013_CS", "n": 11, "m": 1, "s": "Discrete Mathematics", "t": "Logic, sets, relations & algebra", "q": "Match the problem domains in GROUP I with the solution technologies in GROUP II.\n GROUP I GROUP II\n (P) Service oriented computing (1) Interoperability\n (Q) Heterogeneous communicating systems (2) BPMN\n (R) Information representation (3) Publish-find-bind\n (S) Process description (4) XML\n (A) P-1, Q-2, R-3, S-4 (B) P-3, Q-4, R-2, S-1\n (C) P-3, Q-1, R-4, S-2 (D) P-4, Q-3, R-2, S-1"}, {"y": 2013, "p": "2013_CS", "n": 12, "m": 1, "s": "Computer Networks", "t": "Transport layer (TCP/UDP)", "q": "The transport layer protocols used for real time multimedia, file transfer, DNS and email,\n respectively are\n (A) TCP, UDP, UDP and TCP\n (B) UDP, TCP, TCP and UDP\n (C) UDP, TCP, UDP and TCP\n (D) TCP, UDP, TCP and UDP"}, {"y": 2013, "p": "2013_CS", "n": 13, "m": 1, "s": "Computer Networks", "t": "Application layer & security", "q": "Using public key cryptography, X adds a digital signature \u03c3 to message M, encrypts <M, \u03c3>, and\n sends it to Y, where it is decrypted. Which one of the following sequences of keys is used for the\n operations?\n (A) Encryption: X\u2019s private key followed by Y\u2019s private key; Decryption: X\u2019s public key followed\n by Y\u2019s public key\n (B) Encryption: X\u2019s private key followed by Y\u2019s public key; Decryption: X\u2019s public key followed\n by Y\u2019s private key\n (C) Encryption: X\u2019s public key followed by Y\u2019s private key; Decryption: Y\u2019s public key followed\n by X\u2019s private key\n (D) Encryption: X\u2019s private key followed by Y\u2019s public key; Decryption: Y\u2019s private key followed\n by X\u2019s public key\nCS-A 3/20\n2013 COMPUTER SCIENCE & INFORMATION TECH. - CS"}, {"y": 2013, "p": "2013_CS", "n": 14, "m": 1, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "Assume that source S and destination D are connected through two intermediate routers labeled R.\n Determine how many times each packet has to visit the network layer and the data link layer during\n a transmission from S to D.\n (A) Network layer \u2013 4 times and Data link layer \u2013 4 times\n (B) Network layer \u2013 4 times and Data link layer \u2013 3 times\n (C) Network layer \u2013 4 times and Data link layer \u2013 6 times\n (D) Network layer \u2013 2 times and Data link layer \u2013 6 times"}, {"y": 2013, "p": "2013_CS", "n": 15, "m": 1, "s": "Databases", "t": "ER model, indexing & B+ trees", "q": "An index is clustered, if\n (A) it is on a set of fields that form a candidate key.\n (B) it is on a set of fields that include the primary key.\n (C) the data records of the file are organized in the same order as the data entries of the index.\n (D) the data records of the file are organized not in the same order as the data entries of the index."}, {"y": 2013, "p": "2013_CS", "n": 16, "m": 1, "s": "Operating Systems", "t": "Process synchronization", "q": "Three concurrent processes X, Y, and Z execute three different code segments that access and\n update certain shared variables. Process X executes the P operation (i.e., wait) on semaphores\n a, b and c; process Y executes the P operation on semaphores b, c and d; process Z executes the\n P operation on semaphores c, d, and a before entering the respective code segments. After\n completing the execution of its code segment, each process invokes the V operation (i.e., signal) on\n its three semaphores. All semaphores are binary semaphores initialized to one. Which one of the\n following represents a deadlock-free order of invoking the P operations by the processes?\n (A) X: P(a)P(b)P(c) Y: P(b)P(c)P(d) Z: P(c)P(d)P(a)\n (B) X: P(b)P(a)P(c) Y: P(b)P(c)P(d) Z: P(a)P(c)P(d)\n (C) X: P(b)P(a)P(c) Y: P(c)P(b)P(d) Z: P(a)P(c)P(d)\n (D) X: P(a)P(b)P(c) Y: P(c)P(b)P(d) Z: P(c)P(d)P(a)"}, {"y": 2013, "p": "2013_CS", "n": 17, "m": 1, "s": "Theory of Computation", "t": "Decidability & Turing machines", "q": "Which of the following statements is/are FALSE?\n 1. For every non-deterministic Turing machine, there exists an equivalent deterministic\n Turing machine.\n 2. Turing recognizable languages are closed under union and complementation.\n 3. Turing decidable languages are closed under intersection and complementation.\n 4. Turing recognizable languages are closed under union and intersection.\n (A) 1 and 4 only (B) 1 and 3 only (C) 2 only (D) 3 only"}, {"y": 2013, "p": "2013_CS", "n": 18, "m": 1, "s": "Algorithms", "t": "NP-completeness", "q": "Which of the following statements are TRUE?\n 1. The problem of determining whether there exists a cycle in an undirected graph is in P.\n 2. The problem of determining whether there exists a cycle in an undirected graph is in NP.\n 3. If a problem A is NP-Complete, there exists a non-deterministic polynomial time algorithm\n to solve A.\n (A) 1, 2 and 3 (B) 1 and 2 only (C) 2 and 3 only (D) 1 and 3 only\nCS-A 4/20\n2013 COMPUTER SCIENCE & INFORMATION TECH. - CS"}, {"y": 2013, "p": "2013_CS", "n": 19, "m": 1, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "What is the time complexity of Bellman-Ford single-source shortest path algorithm on a complete\n graph of n vertices?\n (A) \u0398(n2) (B) \u0398(n2log n) (C) \u0398(n3) (D) \u0398(n3log n)"}, {"y": 2013, "p": "2013_CS", "n": 20, "m": 1, "s": "Computer Organization", "t": "Cache & memory hierarchy", "q": "In a k-way set associative cache, the cache is divided into v sets, each of which consists of k lines.\n The lines of a set are placed in sequence one after another. The lines in set s are sequenced before\n the lines in set (s+1). The main memory blocks are numbered 0 onwards. The main memory block\n numbered j must be mapped to any one of the cache lines from\n (A) (j mod v) * k to (j mod v) * k + (k-1) (B) (j mod v) to (j mod v) + (k-1)\n (C) (j mod k) to (j mod k) + (v-1) (D) (j mod k) * v to (j mod k) * v + (v-1)"}, {"y": 2013, "p": "2013_CS", "n": 21, "m": 1, "s": "Digital Logic", "t": "Combinational circuits & K-maps", "q": "Which one of the following expressions does NOT represent exclusive NOR of x and y?\n (A) xy + x \u2032 y \u2032 (B) x \u2295 y \u2032 (C) x \u2032 \u2295 y (D) x \u2032 \u2295 y \u2032"}, {"y": 2013, "p": "2013_CS", "n": 22, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Which one of the following functions is continuous at x = 3?\n \uf8f1\n \uf8f42, if x = 3 \uf8f14, if x =3\n \uf8f4 (B) f ( x ) = \uf8f2\n (A) f ( x ) = \uf8f2 x \u2212 1, if x > 3 \uf8f38 \u2212 x if x\u22603\n \uf8f4x +3\n \uf8f4 , if x<3\n \uf8f3 3\n \uf8f1 x + 3, if x\u22643 1\n (C) f ( x ) = \uf8f2 (D) f ( x ) = , if x \u22603\n \uf8f3x \u2212 4 if x>3 x 3 \u2212 27"}, {"y": 2013, "p": "2013_CS", "n": 23, "m": 1, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "Function f is known at the following points:\n x 0 0.3 0.6 0.9 1.2 1.5 1.8 2.1 2.4 2.7 3.0\n f(x) 0 0.09 0.36 0.81 1.44 2.25 3.24 4.41 5.76 7.29 9.00\n \u222b f (x ) dx computed using the trapezoidal rule is\n 3\n The value of\n 0\n (A) 8.983 (B) 9.003 (C) 9.017 (D) 9.045"}, {"y": 2013, "p": "2013_CS", "n": 24, "m": 1, "s": "Discrete Mathematics", "t": "Graph theory", "q": "Consider an undirected random graph of eight vertices. The probability that there is an edge\n between a pair of vertices is 1/2. What is the expected number of unordered cycles of length three?\n (A) 1/8 (B) 1 (C) 7 (D) 8"}, {"y": 2013, "p": "2013_CS", "n": 25, "m": 1, "s": "Discrete Mathematics", "t": "Graph theory", "q": "Which of the following statements is/are TRUE for undirected graphs?\n P: Number of odd degree vertices is even.\n Q: Sum of degrees of all vertices is even.\n (A) P only (B) Q only (C) Both P and Q (D) Neither P nor Q\nCS-A 5/20\n2013 COMPUTER SCIENCE & INFORMATION TECH. - CS"}, {"y": 2013, "p": "2013_CS", "n": 28, "m": 2, "s": "Computer Organization", "t": "Instruction set, addressing & control unit", "q": "Consider the following sequence of micro-operations.\n MBR \u2190 PC\n MAR \u2190 X\n PC \u2190 Y\n Memory \u2190 MBR\n Which one of the following is a possible operation performed by this sequence?\n (A) Instruction fetch (B) Operand fetch\n (C) Conditional branch (D) Initiation of interrupt service"}, {"y": 2013, "p": "2013_CS", "n": 29, "m": 2, "s": "Operating Systems", "t": "Files, disk, I/O, system calls", "q": "Consider a hard disk with 16 recording surfaces (0-15) having 16384 cylinders (0-16383) and each\n cylinder contains 64 sectors (0-63). Data storage capacity in each sector is 512 bytes. Data are\n organized cylinder-wise and the addressing format is <cylinder no., surface no., sector no.>. A file\n of size 42797 KB is stored in the disk and the starting disk location of the file is <1200, 9, 40>.\n What is the cylinder number of the last sector of the file, if it is stored in a contiguous manner?\n (A) 1281 (B) 1282 (C) 1283 (D) 1284"}, {"y": 2013, "p": "2013_CS", "n": 30, "m": 2, "s": "Algorithms", "t": "Sorting & searching", "q": "The number of elements that can be sorted in \u0398(log n) time using heap sort is\n (B) \u0398 ( log n )\n \uf8eb log n \uf8f6\n (A) \u0398(1) (C) \u0398 \uf8ec\uf8ec \uf8f7\uf8f7 (D) \u0398(log n)\n \uf8ed log log n \uf8f8\nCS-A 6/20\n2013 COMPUTER SCIENCE & INFORMATION TECH. - CS"}, {"y": 2013, "p": "2013_CS", "n": 31, "m": 2, "s": "Algorithms", "t": "Complexity & recurrences", "q": "Consider the following function:\n int unknown(int n){\n int i, j, k=0;\n for (i=n/2; i<=n; i++)\n for (j=2; j<=n; j=j*2)\n k = k + n/2;\n return (k);\n }\n The return value of the function is\n (A) \u0398(n2) (B) \u0398(n2log n) (C) \u0398(n3) (D) \u0398(n3logn)"}, {"y": 2013, "p": "2013_CS", "n": 32, "m": 2, "s": "Theory of Computation", "t": "CFLs & pushdown automata", "q": "Consider the following languages.\n { }\n L1 = 0 p 1q 0 r | p, q, r \u2265 0\n L2 = {0 1 0 | p, q, r \u2265 0, p \u2260 r }\n p q r\n Which one of the following statements is FALSE?\n (A) L2 is context-free.\n (B) L1\u2229 L2 is context-free.\n (C) Complement of L2 is recursive.\n (D) Complement of L1 is context-free but not regular."}, {"y": 2013, "p": "2013_CS", "n": 33, "m": 2, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "Consider the DFA A given below.\n Which of the following are FALSE?\n 1. Complement of L(A) is context-free.\n 2. L(A) = L((11*0+0)(0 + 1)*0*1*)\n 3. For the language accepted by A, A is the minimal DFA.\n 4. A accepts all strings over {0, 1} of length at least 2.\n (A) 1 and 3 only (B) 2 and 4 only (C) 2 and 3 only (D) 3 and 4 only"}, {"y": 2013, "p": "2013_CS", "n": 34, "m": 2, "s": "Operating Systems", "t": "Process synchronization", "q": "A shared variable x, initialized to zero, is operated on by four concurrent processes W, X, Y, Z as\n follows. Each of the processes W and X reads x from memory, increments by one, stores it to\n memory, and then terminates. Each of the processes Y and Z reads x from memory, decrements by\n two, stores it to memory, and then terminates. Each process before reading x invokes the P\n operation (i.e., wait) on a counting semaphore S and invokes the V operation (i.e., signal) on the\n semaphore S after storing x to memory. Semaphore S is initialized to two. What is the maximum\n possible value of x after all processes complete execution?\n (A) \u20132 (B) \u20131 (C) 1 (D) 2\nCS-A 7/20\n2013 COMPUTER SCIENCE & INFORMATION TECH. - CS"}, {"y": 2013, "p": "2013_CS", "n": 35, "m": 2, "s": "Databases", "t": "SQL & relational algebra", "q": "Consider the following relational schema.\n Students(rollno: integer, sname: string)\n Courses(courseno: integer, cname: string)\n Registration(rollno: integer, courseno: integer, percent: real)\n Which of the following queries are equivalent to this query in English?\n \u201cFind the distinct names of all students who score more than 90% in the course numbered 107\u201d\n (I) SELECT DISTINCT S.sname\n FROM Students as S, Registration as R\n WHERE R.rollno=S.rollno AND R.courseno=107 AND R.percent >90\n (II) \u220fsname(\u03c3courseno=107 \u2227 percent>90 (Registration \u22c8 Students))\n (III) {T | \u2203S\u2208Students, \u2203R\u2208Registration ( S.rollno=R.rollno \u2227\n R.courseno=107 \u2227 R.percent>90 \u2227T.sname=S.sname)}\n (IV) {<SN> | \u2203SR\u2203RP ( <SR, SN>\u2208Students \u2227 <SR, 107, RP>\u2208Registration \u2227 RP>90)}\n (A) I, II, III and IV (B) I, II and III only\n (C) I, II and IV only (D) II, III and IV only"}, {"y": 2013, "p": "2013_CS", "n": 36, "m": 2, "s": "Computer Networks", "t": "Data link, MAC & error control", "q": "Determine the maximum length of the cable (in km) for transmitting data at a rate of 500 Mbps in\n an Ethernet LAN with frames of size 10,000 bits. Assume the signal speed in the cable to be\n 2,00,000 km/s.\n (A) 1 (B) 2 (C) 2.5 (D) 5"}, {"y": 2013, "p": "2013_CS", "n": 37, "m": 2, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "In an IPv4 datagram, the M bit is 0, the value of HLEN is 10, the value of total length is 400 and\n the fragment offset value is 300. The position of the datagram, the sequence numbers of the first\n and the last bytes of the payload, respectively are\n (A) Last fragment, 2400 and 2789\n (B) First fragment, 2400 and 2759\n (C) Last fragment, 2400 and 2759\n (D) Middle fragment, 300 and 689"}, {"y": 2013, "p": "2013_CS", "n": 39, "m": 2, "s": "Data Structures", "t": "Arrays & misc", "q": "A certain computation generates two arrays a and b such that a[i]=f(i)for 0 \u2264 i < n and\n b[i] = g (a[i] )for 0 \u2264 i < n. Suppose this computation is decomposed into two concurrent processes\n X and Y such that X computes the array a and Y computes the array b. The processes employ two\n binary semaphores R and S, both initialized to zero. The array a is shared by the two processes. The\n structures of the processes are shown below.\n Process X: Process Y:\n private i; private i;\n for (i=0; i<n; i++) { for (i=0; i<n; i++) {\n a[i] = f(i); EntryY(R, S);\n ExitX(R, S); b[i] = g(a[i]);\n } }\n Which one of the following represents the CORRECT implementations of ExitX and EntryY?\n (A) ExitX(R, S) { (B) ExitX(R, S) {\n P(R); V(R);\n V(S); V(S);\n } }\n EntryY(R, S) { EntryY(R, S) {\n P(S); P(R);\n V(R); P(S);\n } }\n (C) ExitX(R, S) { (D) ExitX(R, S) {\n P(S); V(R);\n V(R); P(S);\n } }\n EntryY(R, S) { EntryY(R, S)"}, {"y": 2013, "p": "2013_CS", "n": 40, "m": 2, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "Consider the following two sets of LR(1) items of an LR(1) grammar.\n X \u2192 c.X, c/d X \u2192 c.X, $\n X \u2192 .cX, c/d X \u2192 .cX, $\n X \u2192 .d, c/d X \u2192 .d, $\n Which of the following statements related to merging of the two sets in the corresponding LALR\n parser is/are FALSE?\n 1. Cannot be merged since look aheads are different.\n 2. Can be merged but will result in S-R conflict.\n 3. Can be merged but will result in R-R conflict.\n 4. Cannot be merged since goto on c will lead to two different sets.\n (A) 1 only (B) 2 only (C) 1 and 4 only (D) 1, 2, 3 and 4"}, {"y": 2013, "p": "2013_CS", "n": 41, "m": 2, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "Which of the following is/are undecidable?\n 1. G is a CFG. Is L(G) = \u03a6?\n 2. G is a CFG. Is L(G) = \u2211*?\n 3. M is a Turing machine. Is L(M) regular?\n 4. A is a DFA and N is an NFA. Is L(A) = L(N)?\n (A) 3 only (B) 3 and 4 only (C) 1, 2 and 3 only (D) 2 and 3 only\nCS-A 9/20\n2013 COMPUTER SCIENCE & INFORMATION TECH. - CS"}, {"y": 2013, "p": "2013_CS", "n": 42, "m": 2, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "What is the return value of f(p,p), if the value of p is initialized to 5 before the call? Note that\n the first parameter is passed by reference, whereas the second parameter is passed by value.\n int f (int &x, int c) {\n c = c - 1;\n if (c==0) return 1;\n x = x + 1;\n return f(x,c) * x;\n }\n (A) 3024 (B) 6561 (C) 55440 (D) 161051"}, {"y": 2013, "p": "2013_CS", "n": 43, "m": 2, "s": "Algorithms", "t": "Sorting & searching", "q": "The preorder traversal sequence of a binary search tree is 30, 20, 10, 15, 25, 23, 39, 35, 42. Which\n one of the following is the postorder traversal sequence of the same tree?\n (A) 10, 20, 15, 23, 25, 35, 42, 39, 30 (B) 15, 10, 25, 23, 20, 42, 35, 39, 30\n (C) 15, 20, 10, 23, 25, 42, 35, 39, 30 (D) 15, 10, 23, 25, 20, 35, 42, 39, 30"}, {"y": 2013, "p": "2013_CS", "n": 44, "m": 2, "s": "Algorithms", "t": "Complexity & recurrences", "q": "Consider the following operation along with Enqueue and Dequeue operations on queues, where\n k is a global parameter.\n MultiDequeue(Q){\n m = k\n while (Q is not empty) and (m > 0) {\n Dequeue(Q)\n m = m \u2013 1\n }\n }\n What is the worst case time complexity of a sequence of n queue operations on an initially empty\n queue?\n (A) \u0398(n) (B) \u0398(n + k) (C) \u0398(nk) (D) \u0398(n2)"}, {"y": 2013, "p": "2013_CS", "n": 45, "m": 2, "s": "Computer Organization", "t": "Pipelining", "q": "Consider an instruction pipeline with five stages without any branch prediction: Fetch Instruction\n (FI), Decode Instruction (DI), Fetch Operand (FO), Execute Instruction (EI) and Write Operand\n (WO). The stage delays for FI, DI, FO, EI and WO are 5 ns, 7 ns, 10 ns, 8 ns and 6 ns, respectively.\n There are intermediate storage buffers after each stage and the delay of each buffer is 1 ns. A\n program consisting of 12 instructions I1, I2, I3, \u2026, I12 is executed in this pipelined processor.\n Instruction I4 is the only branch instruction and its branch target is I9. If the branch is taken during\n the execution of this program, the time (in ns) needed to complete the program is\n (A) 132 (B) 165 (C) 176 (D) 328"}, {"y": 2013, "p": "2013_CS", "n": 46, "m": 2, "s": "Digital Logic", "t": "Combinational circuits & K-maps", "q": "A RAM chip has a capacity of 1024 words of 8 bits each (1K \u00d7 8). The number of 2 \u00d7 4 decoders\n with enable line needed to construct a 16K \u00d7 16 RAM from 1K \u00d7 8 RAM is\n (A) 4 (B) 5 (C) 6 (D) 7"}, {"y": 2013, "p": "2013_CS", "n": 47, "m": 2, "s": "Computer Organization", "t": "Instruction set, addressing & control unit", "q": "Which one of the following is NOT logically equivalent to \u00ac \u2203x (\u2200 y (\u03b1 ) \u2227 \u2200z (\u03b2 )) ?\n (A) \u2200 x (\u2203 z (\u00ac \u03b2 ) \u2192 \u2200 y (\u03b1 )) (B) \u2200x (\u2200 z (\u03b2 ) \u2192 \u2203 y (\u00ac\u03b1 ))\n (C) \u2200x (\u2200 y (\u03b1 ) \u2192 \u2203 z (\u00ac \u03b2 )) (D) \u2200x (\u2203 y (\u00ac\u03b1 ) \u2192 \u2203 z (\u00ac \u03b2 ))\nCS-A 10/20\n2013 COMPUTER SCIENCE & INFORMATION TECH. - CS\nCommon Data Questions\n Common Data for Questions 48 and 49:\n The following code segment is executed on a processor which allows only register operands in its\n instructions. Each instruction can have atmost two source operands and one destination operand. Assume\n that all variables are dead after this code segment.\n c = a + b;\n d = c * a;\n e = c + a;\n x = c * c;\n if (x > a) {\n y = a * a;\n }\n else {\n d = d * d;\n e = e * e;\n }"}, {"y": 2013, "p": "2013_CS", "n": 48, "m": 2, "s": "Computer Organization", "t": "Instruction set, addressing & control unit", "q": "Suppose the instruction set architecture of the processor has only two registers. The only allowed\n compiler optimization is code motion, which moves statements from one place to another while\n preserving correctness. What is the minimum number of spills to memory in the compiled code?\n (A) 0 (B) 1 (C) 2 (D) 3"}, {"y": 2013, "p": "2013_CS", "n": 49, "m": 2, "s": "Computer Organization", "t": "Instruction set, addressing & control unit", "q": "What is the minimum number of registers needed in the instruction set architecture of the processor\n to compile this code segment without any spill to memory? Do not apply any optimization other\n than optimizing register allocation.\n (A) 3 (B) 4 (C) 5 (D) 6\n Common Data for Questions 50 and 51:\n The procedure given below is required to find and replace certain characters inside an input character string\n supplied in array A. The characters to be replaced are supplied in array oldc, while their respective\n replacement characters are supplied in array newc. Array A has a fixed length of five characters, while\n arrays oldc and newc contain three characters each. However, the procedure is flawed.\n void find_and_replace (char *A, char *oldc, char *newc) {\n for (int i=0; i<5; i++)\n for (int j=0; j<3; j++)\n if (A[i] == oldc[j]) A[i] = newc[j];\n }\n The procedure is tested with the following four"}, {"y": 2013, "p": "2013_CS", "n": 51, "m": 2, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "If array A is made to hold the string \u201cabcde\u201d, which of the above four test cases will be successful\n in exposing the flaw in this procedure?\n (A) None (B) 2 only\n (C) 3 and 4 only (D) 4 only\nCS-A 11/20\n2013 COMPUTER SCIENCE & INFORMATION TECH. - CS\nLinked Answer Questions\n Statement for Linked Answer Questions 52 and 53:\n A computer uses 46-bit virtual address, 32-bit physical address, and a three-level paged page table\n organization. The page table base register stores the base address of the first-level table (T1), which\n occupies exactly one page. Each entry of T1 stores the base address of a page of the second-level table (T2).\n Each entry of T2 stores the base address of a page of the third-level table (T3). Each entry of T3 stores a page\n table entry (PTE). The PTE is 32 bits in size. The processor used in the computer has a 1 MB 16-way set\n associative virtually indexed physicall"}, {"y": 2013, "p": "2013_CS", "n": 53, "m": 2, "s": "Databases", "t": "Normalization & functional dependencies", "q": "What is the minimum number of page colours needed to guarantee that no two synonyms map to\n different sets in the processor cache of this computer?\n (A) 2 (B) 4 (C) 8 (D) 16\n Statement for Linked Answer Questions 54 and 55:\n Relation R has eight attributes ABCDEFGH. Fields of R contain only atomic values.\n F={CH\u2192G, A\u2192BC, B\u2192CFH, E\u2192A, F\u2192EG} is a set of functional dependencies (FDs) so that F+ is\n exactly the set of FDs that hold for R."}, {"y": 2013, "p": "2013_CS", "n": 54, "m": 2, "s": "Databases", "t": "Normalization & functional dependencies", "q": "How many candidate keys does the relation R have?\n (A) 3 (B) 4 (C) 5 (D) 6"}, {"y": 2013, "p": "2013_CS", "n": 55, "m": 2, "s": "Databases", "t": "Normalization & functional dependencies", "q": "The relation R is\n (A) in 1NF, but not in 2NF. (B) in 2NF, but not in 3NF.\n (C) in 3NF, but not in BCNF. (D) in BCNF.\nCS-A 12/20\n2013 COMPUTER SCIENCE & INFORMATION TECH. - CS\nGeneral Aptitude (GA) Questions"}, {"y": 2013, "p": "2013_CS", "n": 57, "m": 1, "s": "General Aptitude", "t": "Verbal ability", "q": "Complete the sentence:\n Universalism is to particularism as diffuseness is to _______________.\n (A) specificity (B) neutrality (C) generality (D) adaptation"}, {"y": 2013, "p": "2013_CS", "n": 58, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "What will be the maximum sum of 44, 42, 40, ...... ?\n (A) 502 (B) 504 (C) 506 (D) 500"}, {"y": 2013, "p": "2013_CS", "n": 59, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "Were you a bird, you ___________________ in the sky.\n (A) would fly (B) shall fly (C) should fly (D) shall have flown"}, {"y": 2013, "p": "2013_CS", "n": 60, "m": 1, "s": "General Aptitude", "t": "Verbal ability", "q": "Choose the grammatically INCORRECT sentence:\n (A) He is of Asian origin.\n (B) They belonged to Africa.\n (C) She is an European.\n (D) They migrated from India to Australia."}, {"y": 2013, "p": "2013_CS", "n": 62, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "Out of all the 2-digit integers between 1 and 100, a 2-digit number has to be selected at random.\n What is the probability that the selected number is not divisible by 7?\n (A) 13/90 (B) 12/90 (C) 78/90 (D) 77/90\nCS-A 13/20\n2013 COMPUTER SCIENCE & INFORMATION TECH. - CS"}, {"y": 2013, "p": "2013_CS", "n": 63, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "After several defeats in wars, Robert Bruce went in exile and wanted to commit suicide. Just before\n committing suicide, he came across a spider attempting tirelessly to have its net. Time and again,\n the spider failed but that did not deter it to refrain from making attempts. Such attempts by the\n spider made Bruce curious. Thus, Bruce started observing the near-impossible goal of the spider to\n have the net. Ultimately, the spider succeeded in having its net despite several failures. Such act of\n the spider encouraged Bruce not to commit suicide. And then, Bruce went back again and won\n many a battle, and the rest is history.\n Which one of the following assertions is best supported by the above information?\n (A) Failure is the pillar of success.\n (B) Honesty is the best policy.\n (C) Life begins and ends with adventures.\n (D) No adversity justifies giving up hope."}, {"y": 2013, "p": "2013_CS", "n": 64, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "A tourist covers hal ists", "q": "Question Type : MCQ\nConsider the NPDA (Q = {45,41,42}, \u00a9 = {0,1}, T = {0,1,1}, 5, qo, 1, F = {q2}), where (as\nper usual convention) Q is the set of states, \u00a5 is the input alphabet, I is the stack alphabet, 5 is the\nstate transition function, go is the initial state, 1 is the initial stack symbol, and F is the set of\naccepting states. The state transition is as follows:\nCd 1Z7312 ab oe\n(a) 0.202 (1) 1,02 42 @\nO/l/e,Z > Z gle\nWhich one of the following sequences must follow the string 101100 so that the overall string is\naccepted by the automaton?\n(A) 10110 (B) 10010 (C) 01010 (D) 01001\nOptions :\n1*A\n278\n3% Cc\n4.%D"}, {"y": 2015, "p": "2015_CS", "n": 51, "m": 2, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "Question Type : MCQ\nLet G = (V, E) be a simple undirected graph, and s be a particular vertex in it called the source.\nFor x EV, let d(x) denote the shortest distance in G from s to x . A breadth first search (BFS) is\nperformed starting at s . Let T be the resultant BFS tree. If (u,v) is an edge of G that is not in T ,\nthen which one of the following CANNOT be the value of d(u) \u2014d(v)?\n(A) -1 (B) 0 (1 () 2\nOptions :\n1% A\n2.%B\n3.% Cc\n44D"}, {"y": 2015, "p": "2015_CS", "n": 52, "m": 2, "s": "Databases", "t": "Transactions & concurrency", "q": "Question Type : NAT\nConsider a uniprocessor system executing three tasks T), T2 and T3, each of which is composed of\nan infinite sequence of jobs (or instances) which arrive periodically at intervals of 3, 7 and 20\nmilliseconds, respectively. The priority of each task is the inverse of its period, and the available\ntasks are scheduled in order of priority, with the highest priority task scheduled first. Each instance\nof T;, T2 and T; requires an execution time of 1, 2 and 4 milliseconds, respectively. Given that all\ntasks initially arrive at the beginning of the 1* millisecond and task preemptions are allowed, the\nfirst instance of T; completes its execution at the end of milliseconds.\nCorrect Answer :\n12"}, {"y": 2015, "p": "2015_CS", "n": 53, "m": 2, "s": "Digital Logic", "t": "Sequential circuits", "q": "Question Type : MCQ\nA positive edge-triggered D flip-flop is connected to a positive edge-triggered JK flip-flop as\nfollows. The Q output of the D flip-flop is connected to both the J and K inputs of the JK flip-flop,\nwhile the Q output of the JK flip-flop is connected to the input of the D flip-flop. Initially, the\noutput of the D flip-flop is set to logic one and the output of the JK flip-flop is cleared. Which one\nof the following is the bit sequence (including the initial state) generated at the O output of the IK\nflip-flop when the flip-flops are connected to a free-running common clock? Assume that J = K = 1\nis the toggle mode and J = K = 0 is the state-holding mode of the JK flip-flop. Both the flip-flops\nhave non-zero propagation delays.\n(A) 0110110... (@) 0100100...\n(\u00a9) 011101110... (D) 011001100...\nOptions :\nYA\n2.*%8B\n3.% Cc\n4.\u00aeD"}, {"y": 2015, "p": "2015_CS", "n": 54, "m": 2, "s": "Operating Systems", "t": "Files, disk, I/O, system calls", "q": "Question Type : NAT\nConsider a disk pack with a seek time of 4 milliseconds and rotational speed of 10000 rotations per\nminute (RPM). It has 600 sectors per track and each sector can store 512 bytes of data. Consider a\nfile stored in the disk. The file contains 2000 sectors. Assume that every sector access necessitates a\nseek, and the average rotational latency for accessing each sector is half of the time for one\ncomplete rotation. The total time (in milliseconds) needed to read the entire file is s\nCorrect Answer:\n14020"}, {"y": 2015, "p": "2015_CS", "n": 55, "m": 2, "s": "Computer Organization", "t": "Pipelining", "q": "Question Type : NAT\nConsider a non-pipelined processor with a clock rate of 2.5 gigahertz and average cycles per\ninstruction of four. The same processor is upgraded to a pipelined processor with five stages;
