update two shared variables\n a and b. Assume that initially a = b = 1. Though context switching between\n threads can happen at any time, each statement of T1 or T2 is executed atomically\n without interruption.\n T1 T2\n a = a + 1; b = 2 * b;\n b = b + 1; a = 2 * a;\n Which one of the following options lists all the possible combinations of values of\n a and b after both T1 and T2 finish execution?\n (A) (a = 4, b = 4); (a = 3, b = 3); (a = 4, b = 3)\n (B) (a = 3, b = 4); (a = 4, b = 3); (a = 3, b = 3)\n (C) (a = 4, b = 4); (a = 4, b = 3); (a = 3, b = 4)\n (D) (a = 2, b = 2); (a = 2, b = 3); (a = 3, b = 4)"}, {"y": 2024, "p": "2024_CS1", "n": 41, "m": 2, "s": "Data Structures", "t": "Arrays & misc", "q": "An array [82, 101, 90, 11, 111, 75, 33, 131, 44, 93] is heapified. Which one of the\n following options represents the first three elements in the heapified array?\n (A) 82, 90, 101\n (B) 82, 11, 93\n (C) 131, 11, 93\n (D) 131, 111, 90"}, {"y": 2024, "p": "2024_CS1", "n": 42, "m": 2, "s": "Algorithms", "t": "Complexity & recurrences", "q": "Consider the following recurrence relation:\n \ud835\udc47(\ud835\udc5b) = {\u221a\ud835\udc5b\ud835\udc47(\u221a\ud835\udc5b) + \ud835\udc5b for \ud835\udc5b \u2265 1,\n 1 for \ud835\udc5b = 1.\n Which one of the following options is CORRECT?\n (A) \ud835\udc47(\ud835\udc5b) = \u0398(\ud835\udc5b log log \ud835\udc5b)\n (B) \ud835\udc47(\ud835\udc5b) = \u0398(\ud835\udc5b log \ud835\udc5b)\n (C) \ud835\udc47(\ud835\udc5b) = \u0398(\ud835\udc5b2 log \ud835\udc5b)\n (D) \ud835\udc47(\ud835\udc5b) = \u0398(\ud835\udc5b2 log log \ud835\udc5b)"}, {"y": 2024, "p": "2024_CS1", "n": 43, "m": 2, "s": "Data Structures", "t": "Trees, BST, AVL, heaps", "q": "Consider a binary min-heap containing 105 distinct elements. Let \ud835\udc58 be the index (in\n the underlying array) of the maximum element stored in the heap. The number of\n possible values of \ud835\udc58 is\n (A) 53\n (B) 52\n (C) 27\n (D) 1"}, {"y": 2024, "p": "2024_CS1", "n": 44, "m": 2, "s": "Databases", "t": "Normalization & functional dependencies", "q": "The symbol \u2192 indicates functional dependency in the context of a relational\n database. Which of the following options is/are TRUE?\n (A) (\ud835\udc4b, \ud835\udc4c) \u2192 (\ud835\udc4d, \ud835\udc4a) implies \ud835\udc4b \u2192 (\ud835\udc4d, \ud835\udc4a)\n (B) (\ud835\udc4b, \ud835\udc4c) \u2192 (\ud835\udc4d, \ud835\udc4a) implies (\ud835\udc4b, \ud835\udc4c) \u2192 \ud835\udc4d\n (C) ((\ud835\udc4b, \ud835\udc4c) \u2192 \ud835\udc4d and \ud835\udc4a \u2192 \ud835\udc4c) implies (\ud835\udc4b, \ud835\udc4a) \u2192 \ud835\udc4d\n (D) (\ud835\udc4b \u2192 \ud835\udc4c and \ud835\udc4c \u2192 \ud835\udc4d) implies \ud835\udc4b \u2192 \ud835\udc4d"}, {"y": 2024, "p": "2024_CS1", "n": 45, "m": 2, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "Let \ud835\udc3a be a directed graph and \ud835\udc47 a depth first search (DFS) spanning tree in \ud835\udc3a that\n is rooted at a vertex \ud835\udc63. Suppose \ud835\udc47 is also a breadth first search (BFS) tree in \ud835\udc3a,\n rooted at \ud835\udc63. Which of the following statements is/are TRUE for every such graph \ud835\udc3a\n and tree \ud835\udc47 ?\n (A) There are no back-edges in \ud835\udc3a with respect to the tree \ud835\udc47\n (B) There are no cross-edges in \ud835\udc3a with respect to the tree \ud835\udc47\n (C) There are no forward-edges in \ud835\udc3a with respect to the tree \ud835\udc47\n (D) The only edges in \ud835\udc3a are the edges in \ud835\udc47"}, {"y": 2024, "p": "2024_CS1", "n": 46, "m": 2, "s": "Databases", "t": "Transactions & concurrency", "q": "Consider the following read-write schedule \ud835\udc46 over three transactions\n \ud835\udc471 , \ud835\udc472 , and \ud835\udc473 , where the subscripts in the schedule indicate transaction IDs:\n \ud835\udc46: \ud835\udc5f1 (\ud835\udc67); \ud835\udc641 (\ud835\udc67); \ud835\udc5f2 (\ud835\udc65); \ud835\udc5f3 (\ud835\udc66); \ud835\udc643 (\ud835\udc66); \ud835\udc5f2 (\ud835\udc66); \ud835\udc642 (\ud835\udc65); \ud835\udc642 (\ud835\udc66);\n Which of the following transaction schedules is/are conflict equivalent to \ud835\udc46 ?\n (A) \ud835\udc471 \ud835\udc472 \ud835\udc473\n (B) \ud835\udc471 \ud835\udc473 \ud835\udc472\n (C) \ud835\udc473 \ud835\udc472 \ud835\udc471\n (D) \ud835\udc473 \ud835\udc471 \ud835\udc472"}, {"y": 2024, "p": "2024_CS1", "n": 47, "m": 2, "s": "Digital Logic", "t": "Combinational circuits & K-maps", "q": "Consider a Boolean expression given by \ud835\udc39(\ud835\udc4b, \ud835\udc4c, \ud835\udc4d) = \u2211(3,5,6,7).\n Which of the following statements is/are CORRECT?\n (A) \ud835\udc39(\ud835\udc4b, \ud835\udc4c, \ud835\udc4d) = \u03a0(0,1,2,4)\n (B) \ud835\udc39(\ud835\udc4b, \ud835\udc4c, \ud835\udc4d) = \ud835\udc4b\ud835\udc4c + \ud835\udc4c\ud835\udc4d + \ud835\udc4b\ud835\udc4d\n (C) \ud835\udc39(\ud835\udc4b, \ud835\udc4c, \ud835\udc4d) is independent of input \ud835\udc4c\n (D) \ud835\udc39(\ud835\udc4b, \ud835\udc4c, \ud835\udc4d) is independent of input \ud835\udc4b"}, {"y": 2024, "p": "2024_CS1", "n": 48, "m": 2, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Consider the following C function definition.\n int f(int x, int y) {\n for (int i=0; i<y; i++) {\n x=x+x+y;\n }\n return x;\n }\n Which of the following statements is/are TRUE about the above function?\n (A) If the inputs are x=20, y=10, then the return value is greater than 220\n (B) If the inputs are x=20, y=20, then the return value is greater than 220\n (C) If the inputs are x=20, y=10, then the return value is less than 210\n (D) If the inputs are x=10, y=20, then the return value is greater than 220"}, {"y": 2024, "p": "2024_CS1", "n": 49, "m": 2, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "Let \ud835\udc34 be any \ud835\udc5b \u00d7 \ud835\udc5a matrix, where \ud835\udc5a > \ud835\udc5b. Which of the following statements is/are\n TRUE about the system of linear equations \ud835\udc34\ud835\udc65 = 0 ?\n (A) There exist at least \ud835\udc5a \u2212 \ud835\udc5b linearly independent solutions to this system\n There exist \ud835\udc5a \u2212 \ud835\udc5b linearly independent vectors such that every solution is a linear\n (B)\n combination of these vectors\n (C) There exists a non-zero solution in which at least \ud835\udc5a \u2212 \ud835\udc5b variables are 0\n (D) There exists a solution in which at least \ud835\udc5b variables are non-zero"}, {"y": 2024, "p": "2024_CS1", "n": 50, "m": 2, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "Consider the 5-state DFA \ud835\udc40 accepting the language \ud835\udc3f(\ud835\udc40) \u2282 (0 + 1)\u2217 shown\n below. For any string \ud835\udc64 \u2208 (0 + 1)\u2217 let \ud835\udc5b0 (\ud835\udc64) be the number of 0\u2032 \ud835\udc60 in \ud835\udc64 and\n \ud835\udc5b1 (\ud835\udc64) be the number of 1\u2032\ud835\udc60 in \ud835\udc64 .\n Which of the following statements is/are FALSE?\n (A) States 2 and 4 are distinguishable in \ud835\udc40\n (B) States 3 and 4 are distinguishable in \ud835\udc40\n (C) States 2 and 5 are distinguishable in \ud835\udc40\n (D) Any string \ud835\udc64 with \ud835\udc5b0 (\ud835\udc64) = \ud835\udc5b1 (\ud835\udc64) is in \ud835\udc3f(\ud835\udc40)"}, {"y": 2024, "p": "2024_CS1", "n": 51, "m": 2, "s": "Discrete Mathematics", "t": "Graph theory", "q": "The chromatic number of a graph is the minimum number of colours used in a\n proper colouring of the graph. Let \ud835\udc3a be any graph with \ud835\udc5b vertices and chromatic\n number \ud835\udc58. Which of the following statements is/are always TRUE?\n (A) \ud835\udc3a contains a complete subgraph with \ud835\udc58 vertices\n (B) \ud835\udc3a contains an independent set of size at least \ud835\udc5b/\ud835\udc58\n (C) \ud835\udc3a contains at least \ud835\udc58(\ud835\udc58 \u2212 1)/2 edges\n (D) \ud835\udc3a contains a vertex of degree at least \ud835\udc58"}, {"y": 2024, "p": "2024_CS1", "n": 53, "m": 2, "s": "Computer Organization", "t": "Cache & memory hierarchy", "q": "Consider two set-associative cache memory architectures: WBC, which uses the\n write back policy, and WTC, which uses the write through policy. Both of them use\n the LRU (Least Recently Used) block replacement policy. The cache memory is\n connected to the main memory. Which of the following statements is/are TRUE?\n (A) A read miss in WBC never evicts a dirty block\n A read miss in WTC never triggers a write back operation of a cache block to\n (B)\n main memory\n (C) A write hit in WBC can modify the value of the dirty bit of a cache block\n A write miss in WTC always writes the victim cache block to main memory\n (D)\n before loading the missed block to the cache"}, {"y": 2024, "p": "2024_CS1", "n": 54, "m": 2, "s": "Operating Systems", "t": "Files, disk, I/O, system calls", "q": "Consider a 512 GB hard disk with 32 storage surfaces. There are 4096 sectors per\n track and each sector holds 1024 bytes of data. The number of cylinders in the hard\n disk is _________"}, {"y": 2024, "p": "2024_CS1", "n": 56, "m": 2, "s": "Computer Organization", "t": "Cache & memory hierarchy", "q": "A given program has 25% load/store instructions. Suppose the ideal CPI (cycles per\n instruction) without any memory stalls is 2. The program exhibits 2% miss rate on\n instruction cache and 8% miss rate on data cache. The miss penalty is 100 cycles.\n The speedup (rounded off to two decimal places) achieved with a perfect cache (i.e.,\n with NO data or instruction cache misses) is _________"}, {"y": 2024, "p": "2024_CS1", "n": 57, "m": 2, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Consider the following code snippet using the fork() and wait() system calls.\n Assume that the code compiles and runs correctly, and that the system calls run\n successfully without any errors.\n int x = 3;\n while(x > 0) {\n fork();\n printf(\"hello\");\n wait(NULL);\n x--;\n }\n The total number of times the printf statement is executed is _______"}, {"y": 2024, "p": "2024_CS1", "n": 58, "m": 2, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "Consider the entries shown below in the forwarding table of an IP router. Each entry\n consists of an IP prefix and the corresponding next hop router for packets whose\n destination IP address matches the prefix. The notation \u201c/N\u201d in a prefix indicates a\n subnet mask with the most significant N bits set to 1.\n Prefix Next hop router\n 10.1.1.0/24 R1\n 10.1.1.128/25 R2\n 10.1.1.64/26 R3\n 10.1.1.192/26 R4\n This router forwards 20 packets each to 5 hosts. The IP addresses of the hosts are\n 10.1.1.16, 10.1.1.72, 10.1.1.132, 10.1.1.191, and 10.1.1.205 . The number of\n packets forwarded via the next hop router R2 is _______"}, {"y": 2024, "p": "2024_CS1", "n": 59, "m": 2, "s": "Theory of Computation", "t": "CFLs & pushdown automata", "q": "Let \ud835\udc3a = (\ud835\udc49, \u03a3, \ud835\udc46, \ud835\udc43) be a context-free grammar in Chomsky Normal Form with\n \u03a3 = {\ud835\udc4e, \ud835\udc4f, \ud835\udc50} and \ud835\udc49 containing 10 variable symbols including the start\n symbol \ud835\udc46. The string \ud835\udc64 = \ud835\udc4e30 \ud835\udc4f 30 \ud835\udc50 30 is derivable from \ud835\udc46. The number of steps\n (application of rules) in the derivation \ud835\udc46 \u2192\u2217 \ud835\udc64 is _________"}, {"y": 2024, "p": "2024_CS1", "n": 60, "m": 2, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "The number of edges present in the forest generated by the DFS traversal of an\n undirected graph \ud835\udc3a with 100 vertices is 40. The number of connected components\n in \ud835\udc3a is _________"}, {"y": 2024, "p": "2024_CS1", "n": 61, "m": 2, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "Consider the following two regular expressions over the alphabet {0,1}:\n \ud835\udc5f = 0\u2217 + 1\u2217\n \ud835\udc60 = 01\u2217 + 10\u2217\n The total number of strings of length less than or equal to 5, which are\n neither in \ud835\udc5f nor in \ud835\udc60, is _________"}, {"y": 2024, "p": "2024_CS1", "n": 62, "m": 2, "s": "Operating Systems", "t": "Memory management & virtual memory", "q": "Consider a memory management system that uses a page size of 2 KB. Assume that\n both the physical and virtual addresses start from 0. Assume that the pages 0, 1, 2,\n and 3 are stored in the page frames 1, 3, 2, and 0, respectively. The physical address\n (in decimal format) corresponding to the virtual address 2500 (in decimal format)\n is _________"}, {"y": 2024, "p": "2024_CS1", "n": 63, "m": 2, "s": "Discrete Mathematics", "t": "Combinatorics & probability", "q": "A bag contains 10 red balls and 15 blue balls. Two balls are drawn randomly without\n replacement. Given that the first ball drawn is red, the probability (rounded off to 3\n decimal places) that both balls drawn are red is _________"}, {"y": 2024, "p": "2024_CS1", "n": 64, "m": 2, "s": "Digital Logic", "t": "Combinational circuits & K-maps", "q": "Consider a digital logic circuit consisting of three 2-to-1 multiplexers M1, M2, and\n M3 as shown below. X1 and X2 are inputs of M1. X3 and X4 are inputs of M2.\n A, B, and C are select lines of M1, M2, and M3, respectively.\n X1 0"}, {"y": 2024, "p": "2024_CS1", "n": 65, "m": 2, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "Consider sending an IP datagram of size 1420 bytes (including 20 bytes of IP\n header) from a sender to a receiver over a path of two links with a router between\n them. The first link (sender to router) has an MTU (Maximum Transmission Unit)\n size of 542 bytes, while the second link (router to receiver) has an MTU size of 360\n bytes. The number of fragments that would be delivered at the receiver is ________"}, {"y": 2024, "p": "2024_CS2", "n": 2, "m": 1, "s": "General Aptitude", "t": "Logical reasoning & data interpretation", "q": "Two wizards try to create a spell using all the four elements, water, air, fire, and\n earth. For this, they decide to mix all these elements in all possible orders. They\n also decide to work independently. After trying all possible combination of\n elements, they conclude that the spell does not work.\n How many attempts does each wizard make before coming to this conclusion,\n independently?\n (A) 24\n (B) 48\n (C) 16\n (D) 12"}, {"y": 2024, "p": "2024_CS2", "n": 3, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "In an engineering college of 10,000 students, 1,500 like neither their core branches\n nor other branches. The number of students who like their core branches is 1/4th of\n the number of students who like other branches. The number of students who like\n both their core and other branches is 500.\n The number of students who like their core branches is\n (A) 1,800\n (B) 3,500\n (C) 1,600\n (D) 1,500"}, {"y": 2024, "p": "2024_CS2", "n": 4, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "For positive non-zero real variables \ud835\udc65 and \ud835\udc66, if\n \ud835\udc65+\ud835\udc66 1\n ln ( ) = [ln\u2061(\ud835\udc65) + ln\u2061(\ud835\udc66)]\n 2 2\n \ud835\udc65 \ud835\udc66\n then, the value of + is\n \ud835\udc66 \ud835\udc65\n (A) 1\n (B) 1/2\n (C) 2\n (D) 4"}, {"y": 2024, "p": "2024_CS2", "n": 5, "m": 1, "s": "General Aptitude", "t": "Logical reasoning & data interpretation", "q": "In the sequence 6, 9, 14, x, 30, 41, a possible value of \ud835\udc65 is\n (A) 25\n (B) 21\n (C) 18\n (D) 20"}, {"y": 2024, "p": "2024_CS2", "n": 7, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "A person sold two different items at the same price. He made 10% profit in one\n item, and 10% loss in the other item. In selling these two items, the person made a\n total of\n (A) 1% profit\n (B) 2% profit\n (C) 1% loss\n (D) 2% loss"}, {"y": 2024, "p": "2024_CS2", "n": 8, "m": 2, "s": "General Aptitude", "t": "Logical reasoning & data interpretation", "q": "The pie charts depict the shares of various power generation technologies in the\n total electricity generation of a country for the years 2007 and 2023.\n Year Solar Year\n 2007 5% 2023\n Solar Coal\n Coal 20% 20%\n Hydro\n 35%\n 30% Gas\n 15%\n Hydro\n Gas 35%\n 25%\n Wind\n Wind\n 10%\n 5%\n The renewable sources of electricity generation consist of Hydro, Solar and Wind.\n Assuming that the total electricity generated remains the same from 2007 to 2023,\n what is the percentage increase in the share of the renewable sources of electricity\n generation over this period?\n (A) 25%\n (B) 50%\n (C) 77.5%\n (D) 62.5%"}, {"y": 2024, "p": "2024_CS2", "n": 9, "m": 2, "s": "General Aptitude", "t": "Spatial & geometry", "q": "A cube is to be cut into 8 pieces of equal size and shape. Here, each cut should be\n straight and it should not stop till it reaches the other end of the cube.\n The minimum number of such cuts required is\n (A) 3\n (B) 4\n (C) 7\n (D) 8"}, {"y": 2024, "p": "2024_CS2", "n": 10, "m": 2, "s": "General Aptitude", "t": "Logical reasoning & data interpretation", "q": "In the 4 \u00d7 4 array shown below, each cell of the first three rows has either a\n cross (X) or a number.\n The number in a cell represents the count of the immediate neighboring cells\n (left, right, top, bottom, diagonals) NOT having a cross (X). Given that the last row\n has no crosses (X), the sum of the four numbers to be filled in the last row is\n (A) 11\n (B) 10\n (C) 12\n (D) 9"}, {"y": 2024, "p": "2024_CS2", "n": 12, "m": 1, "s": "Discrete Mathematics", "t": "Logic, sets, relations & algebra", "q": "Let \ud835\udc5d and \ud835\udc5e\u2061be the following propositions:\n \ud835\udc5d: Fail grade can be given.\n \ud835\udc5e: Student scores more than 50% marks.\n Consider the statement: \u201cFail grade cannot be given when student scores more than\n 50% marks.\u201d\n Which one of the following is the CORRECT representation of the above statement\n in propositional logic?\n (A) \ud835\udc5e \u2192 \u00ac\u2061\ud835\udc5d\n (B) \ud835\udc5e\u2192\ud835\udc5d\n (C) \ud835\udc5d\u2192\ud835\udc5e\n (D) \u00ac\u2061\ud835\udc5d \u2192 \ud835\udc5e"}, {"y": 2024, "p": "2024_CS2", "n": 13, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Consider the following C program. Assume parameters to a function are evaluated\n from right to left.\n #include <stdio.h>\n int g(int p) { printf(\"%d\", p); return p; }\n int h(int q) { printf(\"%d\", q); return q; }\n void f(int x, int y) {\n g(x);\n h(y);\n }\n int main() {\n f(g(10),h(20));\n }\n Which one of the following options is the CORRECT output of the above\n C program?\n (A) 20101020\n (B) 10202010\n (C) 20102010\n (D) 10201020"}, {"y": 2024, "p": "2024_CS2", "n": 14, "m": 1, "s": "Computer Organization", "t": "Instruction set, addressing & control unit", "q": "The format of a single-precision floating-point number as per the\n IEEE 754 standard is:\n Sign Exponent Mantissa\n (1bit) (8 bits) (23 bits)\n Choose the largest floating-point number among the following options.\n Sign Exponent Mantissa\n 0 0111 1111 1111 1111 1111 1111 1111 111\n (A)\n Sign Exponent Mantissa\n 0 1111 1110 1111 1111 1111 1111 1111 111\n (B)\n Sign Exponent Mantissa\n 0 1111 1111 1111 1111 1111 1111 1111 111\n (C)\n Sign Exponent Mantissa\n (D)\n 0 0111 1111 0000 0000 0000 0000 0000 000"}, {"y": 2024, "p": "2024_CS2", "n": 15, "m": 1, "s": "Algorithms", "t": "Complexity & recurrences", "q": "Let \ud835\udc47(\ud835\udc5b) be the recurrence relation defined as follows:\n \ud835\udc47(0) = 1,\n \ud835\udc47(1) = 2, and\n \ud835\udc47(\ud835\udc5b) = 5\ud835\udc47(\ud835\udc5b \u2212 1) \u2212 6\ud835\udc47(\ud835\udc5b \u2212 2) for \ud835\udc5b \u2265 2\n Which one of the following statements is TRUE?\n (A) \ud835\udc47(\ud835\udc5b) = \u2061\u0398(2\ud835\udc5b )\u2061\n (B) \ud835\udc47(\ud835\udc5b) = \u2061\u0398(\ud835\udc5b2\ud835\udc5b )\n (C) \ud835\udc47(\ud835\udc5b) = \u2061\u0398(3\ud835\udc5b )\n (D) \ud835\udc47(\ud835\udc5b) = \u2061\u0398(\ud835\udc5b3\ud835\udc5b )"}, {"y": 2024, "p": "2024_CS2", "n": 16, "m": 1, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "Let \ud835\udc53(\ud835\udc65) be a continuous function from \u211d to \u211d such that\n \ud835\udc53(\ud835\udc65) = 1 \u2212 \ud835\udc53(2 \u2212 \ud835\udc65)\n 2\n Which one of the following options is the CORRECT value of \u222b0 \ud835\udc53(\ud835\udc65)\ud835\udc51\ud835\udc65 ?\n (A) 0\n (B) 1\n (C) 2\n (D) \u22121"}, {"y": 2024, "p": "2024_CS2", "n": 17, "m": 1, "s": "Discrete Mathematics", "t": "Graph theory", "q": "Let \ud835\udc34 be the adjacency matrix of a simple undirected graph \ud835\udc3a. Suppose \ud835\udc34 is its own\n inverse. Which one of the following statements is always TRUE?\n (A) \ud835\udc3a is a cycle\n (B) \ud835\udc3a is a perfect matching\n (C) \ud835\udc3a is a complete graph\n (D) There is no such graph \ud835\udc3a"}, {"y": 2024, "p": "2024_CS2", "n": 18, "m": 1, "s": "Discrete Mathematics", "t": "Combinatorics & probability", "q": "When six unbiased dice are rolled simultaneously, the probability of getting all\n distinct numbers (i.e., 1, 2, 3, 4, 5, and 6) is\n 1\n (A)\n 324\n 5\n (B)\n 324\n 7\n (C)\n 324\n 11\n (D)\n 324"}, {"y": 2024, "p": "2024_CS2", "n": 19, "m": 1, "s": "Databases", "t": "Transactions & concurrency", "q": "Once the DBMS informs the user that a transaction has been successfully\n completed, its effect should persist even if the system crashes before all its changes\n are reflected on disk. This property is called\n (A) durability\n (B) atomicity\n (C) consistency\n (D) isolation"}, {"y": 2024, "p": "2024_CS2", "n": 20, "m": 1, "s": "Databases", "t": "ER model, indexing & B+ trees", "q": "In the context of owner and weak entity sets in the ER (Entity-Relationship) data\n model, which one of the following statements is TRUE?\n (A) The weak entity set MUST have total participation in the identifying relationship\n (B) The owner entity set MUST have total participation in the identifying relationship\n Both weak and owner entity sets MUST have total participation in the identifying\n (C)\n relationship\n Neither weak entity set nor owner entity set MUST have total participation in the\n (D)\n identifying relationship"}, {"y": 2024, "p": "2024_CS2", "n": 21, "m": 1, "s": "Compiler Design", "t": "Lexical analysis, optimisation & runtime", "q": "Consider the following two sets:\n Set X Set Y\n P. Lexical Analyzer 1. Abstract Syntax Tree\n Q. Syntax Analyzer 2. Token\n R. Intermediate Code Generator 3. Parse Tree\n S. Code Optimizer 4. Constant Folding\n Which one of the following options is the CORRECT match from Set X to Set Y ?\n (A) P \u2013 4; Q \u2013 1; R \u2013 3; S \u2013 2\n (B) P \u2013 2; Q \u2013 3; R \u2013 1; S \u2013 4\n (C) P \u2013 2; Q \u2013 1; R \u2013 3; S \u2013 4\n (D) P \u2013 4; Q \u2013 3; R \u2013 2; S \u2013 1"}, {"y": 2024, "p": "2024_CS2", "n": 22, "m": 1, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "Which one of the following regular expressions is equivalent to the language\n accepted by the DFA given below?\n 0\n 1 0\n 1\n (A) 0\u2217 1(0 + 10\u2217 1)\u2217\n (B) 0\u2217 (10\u2217 11)\u2217 0\u2217\n (C) 0\u2217 1(010\u2217 1)\u2217 0\u2217\n (D) 0(1 + 0\u2217 10\u2217 1)\u2217 0\u2217"}, {"y": 2024, "p": "2024_CS2", "n": 23, "m": 1, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "Node X has a TCP connection open to node Y. The packets from X to Y go through\n an intermediate IP router R. Ethernet switch S is the first switch on the network path\n between X and R. Consider a packet sent from X to Y over this connection.\n Which of the following statements is/are TRUE about the destination IP and MAC\n addresses on this packet at the time it leaves X?\n (A) The destination IP address is the IP address of R\n (B) The destination IP address is the IP address of Y\n (C) The destination MAC address is the MAC address of S\n (D) The destination MAC address is the MAC address of Y"}, {"y": 2024, "p": "2024_CS2", "n": 24, "m": 1, "s": "Operating Systems", "t": "Memory management & virtual memory", "q": "Which of the following tasks is/are the responsibility/responsibilities of the memory\n management unit (MMU) in a system with paging-based memory management?\n (A) Allocate a new page table for a newly created process\n (B) Translate a virtual address to a physical address using the page table\n (C) Raise a trap when a virtual address is not found in the page table\n Raise a trap when a process tries to write to a page marked with read-only\n (D)\n permission in the page table"}, {"y": 2024, "p": "2024_CS2", "n": 25, "m": 1, "s": "Operating Systems", "t": "Files, disk, I/O, system calls", "q": "Consider a process P running on a CPU. Which one or more of the following events\n will always trigger a context switch by the OS that results in process P moving to a\n non-running state (e.g., ready, blocked)?\n (A) P makes a blocking system call to read a block of data from the disk\n (B) P tries to access a page that is in the swap space, triggering a page fault\n (C) An interrupt is raised by the disk to deliver data requested by some other process\n (D) A timer interrupt is raised by the hardware"}, {"y": 2024, "p": "2024_CS2", "n": 26, "m": 1, "s": "Databases", "t": "ER model, indexing & B+ trees", "q": "Which of the following file organizations is/are I/O efficient for the scan operation\n in DBMS?\n (A) Sorted\n (B) Heap\n (C) Unclustered tree index\n (D) Unclustered hash index"}, {"y": 2024, "p": "2024_CS2", "n": 27, "m": 1, "s": "Databases", "t": "Transactions & concurrency", "q": "Which of the following statements about the Two Phase Locking (2PL) protocol\n is/are TRUE?\n (A) 2PL permits only serializable schedules\n With 2PL, a transaction always locks the data item being read or written just\n (B)\n before every operation and always releases the lock just after the operation\n With 2PL, once a lock is released on any data item inside a transaction, no more\n (C)\n locks on any data item can be obtained inside that transaction\n (D) A deadlock is possible with 2PL"}, {"y": 2024, "p": "2024_CS2", "n": 28, "m": 1, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "Which of the following statements about IPv4 fragmentation is/are TRUE?\n The fragmentation of an IP datagram is performed only at the source of the\n (A)\n datagram\n The fragmentation of an IP datagram is performed at any IP router which finds\n (B)\n that the size of the datagram to be transmitted exceeds the MTU\n (C) The reassembly of fragments is performed only at the destination of the datagram\n The reassembly of fragments is performed at all intermediate routers along the\n (D)\n path from the source to the destination"}, {"y": 2024, "p": "2024_CS2", "n": 29, "m": 1, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "Which of the following statements is/are FALSE?\n An attribute grammar is a syntax-directed definition (SDD) in which the functions\n (A)\n in the semantic rules have no side effects\n The attributes in a L-attributed definition cannot always be evaluated in a depth-\n (B)\n first order\n (C) Synthesized attributes can be evaluated by a bottom-up parser as the input is parsed\n All L-attributed definitions based on LR(1) grammar can be evaluated using a\n (D)\n bottom-up parsing strategy"}, {"y": 2024, "p": "2024_CS2", "n": 30, "m": 1, "s": "Digital Logic", "t": "Combinational circuits & K-maps", "q": "For a Boolean variable \ud835\udc65, which of the following statements is/are FALSE?\n (A) \ud835\udc65. 1 = \ud835\udc65\n (B) \ud835\udc65+1=\ud835\udc65\n (C) \ud835\udc65. \ud835\udc65 = 0\n (D) \ud835\udc65 + \ud835\udc65\u0305 = 1"}, {"y": 2024, "p": "2024_CS2", "n": 31, "m": 1, "s": "Computer Organization", "t": "Pipelining", "q": "An instruction format has the following structure:\n Instruction Number: Opcode destination reg, source reg-1, source reg-2\n Consider the following sequence of instructions to be executed in a pipelined\n processor:\n I1: DIV R3, R1, R2\n I2: SUB R5, R3, R4\n I3: ADD R3, R5, R6\n I4: MUL R7, R3, R8\n Which of the following statements is/are TRUE?\n (A) There is a RAW dependency on R3 between I1 and I2\n (B) There is a WAR dependency on R3 between I1 and I3\n (C) There is a RAW dependency on R3 between I2 and I3\n (D) There is a WAW dependency on R3 between I3 and I4"}, {"y": 2024, "p": "2024_CS2", "n": 32, "m": 1, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "Which of the following fields of an IP header is/are always modified by any router\n before it forwards the IP packet?\n (A) Source IP Address\n (B) Protocol\n (C) Time to Live (TTL)\n (D) Header Checksum"}, {"y": 2024, "p": "2024_CS2", "n": 33, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Consider the following C function definition.\n int fX(char *a){\n char *b = a;\n while(*b)\n b++;\n return b - a;}\n Which of the following statements is/are TRUE?\n (A) The function call fX(\u201dabcd\u201d) will always return a value\n Assuming a character array c is declared as char c[] = \u201dabcd\u201d in main(),\n (B)\n the function call fX(c)will always return a value\n (C) The code of the function will not compile\n (D) Assuming a character pointer c is declared as char *c = \u201dabcd\u201d in main(),\n the function call fX(c)will always return a value"}, {"y": 2024, "p": "2024_CS2", "n": 34, "m": 1, "s": "Discrete Mathematics", "t": "Logic, sets, relations & algebra", "q": "Let \ud835\udc43 be the partial order defined on the set {1,2,3,4} as follows\n \ud835\udc43 = {(\ud835\udc65, \ud835\udc65)\u2061|\u2061\ud835\udc65\u2061 \u2208 {1,2,3,4}} \u222a {(1,2), (3,2), (3,4)}\n The number of total orders on {1,2,3,4} that contain \ud835\udc43 is __________"}, {"y": 2024, "p": "2024_CS2", "n": 35, "m": 1, "s": "Data Structures", "t": "Arrays & misc", "q": "Let \ud835\udc34\u2061be an array containing integer values. The distance of \ud835\udc34 is defined as the\n minimum number of elements in \ud835\udc34 that must be replaced with another integer so\n that the resulting array is sorted in non-decreasing order. The distance of the array\n [2, 5, 3, 1, 4, 2, 6] is ___________"}, {"y": 2024, "p": "2024_CS2", "n": 37, "m": 2, "s": "Operating Systems", "t": "Scheduling & deadlock", "q": "Consider a single processor system with four processes A, B, C, and D, represented\n as given below, where for each process the first value is its arrival time, and the\n second value is its CPU burst time.\n A (0, 10), B (2, 6), C (4, 3), and D (6, 7).\n Which one of the following options gives the average waiting times when\n preemptive Shortest Remaining Time First (SRTF) and Non-Preemptive Shortest\n Job First (NP-SJF) CPU scheduling algorithms are applied to the processes?\n (A) SRTF = 6, NP-SJF = 7\n (B) SRTF = 6, NP-SJF = 7.5\n (C) SRTF = 7, NP-SJF = 7.5\n (D) SRTF = 7, NP-SJF = 8.5\n Which one of the following CIDR prefixes exactly represents the range of"}, {"y": 2024, "p": "2024_CS2", "n": 38, "m": 2, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "IP addresses 10.12.2.0 to 10.12.3.255?\n (A) 10.12.2.0/23\n (B) 10.12.2.0/24\n (C) 10.12.0.0/22\n (D) 10.12.2.0/22"}, {"y": 2024, "p": "2024_CS2", "n": 39, "m": 2, "s": "Algorithms", "t": "Sorting & searching", "q": "You are given a set \ud835\udc49 of distinct integers. A binary search tree \ud835\udc47 is created by\n inserting all elements of \ud835\udc49 one by one, starting with an empty tree. The tree \ud835\udc47\n follows the convention that, at each node, all values stored in the left subtree of the\n node are smaller than the value stored at the node. You are not aware of the sequence\n in which these values were inserted into \ud835\udc47, and you do not have access to \ud835\udc47.\n Which one of the following statements is TRUE?\n (A) Inorder traversal of \ud835\udc47 can be determined from \ud835\udc49\n (B) Root node of \ud835\udc47 can be determined from \ud835\udc49\n (C) Preorder traversal of \ud835\udc47 can be determined from \ud835\udc49\n (D) Postorder traversal of \ud835\udc47 can be determined from \ud835\udc49"}, {"y": 2024, "p": "2024_CS2", "n": 40, "m": 2, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "Consider the following context-free grammar where the start symbol is \ud835\udc46 and the\n set of terminals is {\ud835\udc4e,\ud835\udc4f,\ud835\udc50,\ud835\udc51}.\n \ud835\udc46 \u2192 \ud835\udc34\ud835\udc4e\ud835\udc34\ud835\udc4f\u2061|\u2061\ud835\udc35\ud835\udc4f\ud835\udc35\ud835\udc4e\n \ud835\udc34 \u2192 \ud835\udc50\ud835\udc46\u2061|\u2061\ud835\udf16\n \ud835\udc35 \u2192 \ud835\udc51\ud835\udc46\u2061|\u2061\ud835\udf16\n The following is a partially-filled LL(1) parsing table.\n \ud835\udc4e \ud835\udc4f \ud835\udc50 \ud835\udc51 $\n \ud835\udc46 \ud835\udc46 \u2192 \ud835\udc34\ud835\udc4e\ud835\udc34\ud835\udc4f \ud835\udc46 \u2192 \ud835\udc35\ud835\udc4f\ud835\udc35\ud835\udc4e (1) (2)\n \ud835\udc34 \ud835\udc34\u2192\ud835\udf16 (3) \ud835\udc34 \u2192 \ud835\udc50\ud835\udc46\n \ud835\udc35 (4) \ud835\udc35\u2192\ud835\udf16 \ud835\udc35 \u2192 \ud835\udc51\ud835\udc46\n Which one of the following options represents the CORRECT combination for the\n numbered cells in the parsing table?\n Note: In the options, \u201cblank\u201d denotes that the corresponding cell is empty.\n (A) (1) \ud835\udc46 \u2192 \ud835\udc34\ud835\udc4e\ud835\udc34\ud835\udc4f (2) \ud835\udc46 \u2192 \ud835\udc35\ud835\udc4f\ud835\udc35\ud835\udc4e (3) \ud835\udc34 \u2192 \ud835\udf16 (4) \ud835\udc35 \u2192 \ud835\udf16\n (B) (1) \ud835\udc46 \u2192 \ud835\udc35\ud835\udc4f\ud835\udc35\ud835\udc4e (2) \ud835\udc46 \u2192 \ud835\udc34\ud835\udc4e\ud835\udc34\ud835\udc4f (3) \ud835\udc34 \u2192 \ud835\udf16 (4) \ud835\udc35 \u2192 \ud835\udf16\n (C) (1) \ud835\udc46 \u2192 \ud835\udc34\ud835\udc4e\ud835\udc34\ud835\udc4f (2) \ud835\udc46 \u2192 \ud835\udc35\ud835\udc4f\ud835\udc35\ud835\udc4e (3) blank (4) blank\n (D) (1) \ud835\udc46 \u2192 \ud835\udc35\ud835\udc4f\ud835\udc35\ud835\udc4e (2) \ud835\udc46 \u2192 \ud835\udc34\ud835\udc4e\ud835\udc34\ud835\udc4f (3) blank (4) blank"}, {"y": 2024, "p": "2024_CS2", "n": 41, "m": 2, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "Let \ud835\udc40 be the 5-state NFA with \ud835\udf16-transitions shown in the diagram below.\n Which one of the following regular expressions represents the language accepted\n by \ud835\udc40 ?\n (A) \u2061(00)\u2217 \u2061 + \u20611(11)\u2217\n (B) \u20610\u2217 + (1 + 0(00)\u2217 )(11)\u2217 \u2061\n (C) \u2061(00)\u2217 + (1 + (00)\u2217 )(11)\u2217 \u2061\n (D) \u20610+ + 1(11)\u2217 + 0(11)\u2217 \u2061\n Consider an array X that contains n positive integers. A subarray of X is defined to"}, {"y": 2024, "p": "2024_CS2", "n": 42, "m": 2, "s": "Algorithms", "t": "Complexity & recurrences", "q": "be a sequence of array locations with consecutive indices.\n The C code snippet given below has been written to compute the length of the\n longest subarray of X that contains at most two distinct integers. The code has two\n missing expressions labelled (\ud835\udc43)\u2061and (\ud835\udc44).\n int first=0, second=0, len1=0, len2=0, maxlen=0;\n for (int i=0; i < n; i++) {\n if (X[i] == first) {\n len2++; len1++;\n } else if (X[i] == second) {\n len2++;\n len1 = \u2061\u2061\u2061\u2061\u2061(\ud835\udc43)\u2061\u2061\u2061\u2061\u2061\u2061\u2061;\n second = first;\n } else {\n len2 = \u2061\u2061\u2061\u2061\u2061(\ud835\udc44)\u2061\u2061\u2061\u2061\u2061\u2061;\n len1 = 1; second = first;\n }\n if (len2 > maxlen) {\n maxlen = len2;\n }\n first = X[i];\n }\n Which one of the following options gives the CORRECT missing expressions?\n (Hint: At the end of the i-th iteration, the value of len1 is the length of the longest\n subarray ending with X[i] that contains all equal values, and len2 is the length\n of the longest subarray ending with X[i] that contains at most two"}, {"y": 2024, "p": "2024_CS2", "n": 43, "m": 2, "s": "Data Structures", "t": "Trees, BST, AVL, heaps", "q": "Consider the following expression: \ud835\udc65[\ud835\udc56] = (\ud835\udc5d + \ud835\udc5f) \u2217 \u2212\ud835\udc60[\ud835\udc56] + \ud835\udc62/\ud835\udc64. The following\n sequence shows the list of triples representing the given expression, with entries\n missing for triples (1), (3), and (6).\n (0) + \ud835\udc5d \ud835\udc5f\n (1)\n (2) uminus (1)\n (3)\n (4) / \ud835\udc62 \ud835\udc64\n (5) + (3) (4)\n (6)\n (7) = (6) (5)\n Which one of the following options fills in the missing entries CORRECTLY?\n (A) (1) =[]\u2061\u2061\ud835\udc60\u2061\u2061\ud835\udc56 (3) * (0) (2) (6) []=\u2061\u2061\ud835\udc65\u2061\u2061\ud835\udc56\n (B) (1) []=\u2061\u2061\ud835\udc60\u2061\u2061\ud835\udc56 (3) \u2013\u2061(0)\u2061(2) (6) =[] \u2061\ud835\udc65\u2061\u2061(5)\n (C) (1) =[] \u2061\ud835\udc60\u2061\ud835\udc56 (3) * (0)\u2061\u2061(2) (6) []= \u2061\ud835\udc65\u2061\u2061(5)\n (D) (1) []= \u2061\ud835\udc60\u2061\u2061\ud835\udc56 (3) \u2013\u2061(0)\u2061(2) (6) =[] \ud835\udc65\u2061\u2061\ud835\udc56"}, {"y": 2024, "p": "2024_CS2", "n": 44, "m": 2, "s": "Discrete Mathematics", "t": "Combinatorics & probability", "q": "Let \ud835\udc65 and \ud835\udc66 be random variables, not necessarily independent, that take real values\n in the interval [0,1]. Let \ud835\udc67 = \ud835\udc65\ud835\udc66 and let the mean values of \ud835\udc65, \ud835\udc66, \ud835\udc67 be \ud835\udc65\u0305 , \ud835\udc66\u0305, \ud835\udc67\u0305,\n respectively. Which one of the following statements is TRUE?\n (A) \ud835\udc67\u0305 = \u2061 \ud835\udc65\u0305 \ud835\udc66\u0305\n (B) \ud835\udc67\u0305 \u2061 \u2264 \u2061 \ud835\udc65\u0305 \ud835\udc66\u0305\n (C) \ud835\udc67\u0305 \u2061 \u2265 \u2061 \ud835\udc65\u2061\n \u0305 \ud835\udc66\u0305\n (D)\n \ud835\udc67\u0305 \u2061 \u2264 \u2061 \ud835\udc65\u0305 \u2061"}, {"y": 2024, "p": "2024_CS2", "n": 45, "m": 2, "s": "Operating Systems", "t": "Files, disk, I/O, system calls", "q": "The relation schema, Person(pid,city), describes the city of residence for\n every person uniquely identified by pid. The following relational algebra operators\n are available: selection, projection, cross product, and rename.\n To find the list of cities where at least 3 persons reside, using the above operators,\n the minimum number of cross product operations that must be used is\n (A) 1\n (B) 2\n (C) 3\n (D) 4\n Consider a multi-threaded program with two threads T1 and T2. The threads share"}, {"y": 2024, "p": "2024_CS2", "n": 46, "m": 2, "s": "Operating Systems", "t": "Process synchronization", "q": "two semaphores: s1 (initialized to 1) and s2 (initialized to 0). The threads also\n share a global variable x (initialized to 0). The threads execute the code shown\n below.\n // code of T1 // code of T2\n wait(s1); wait(s1);\n x = x+1; x = x+1;\n print(x); print(x);\n wait(s2); signal(s2);\n signal(s1); signal(s1);\n Which of the following outcomes is/are possible when threads T1 and T2 execute\n concurrently?\n (A) T1 runs first and prints 1, T2 runs next and prints 2\n (B) T2 runs first and prints 1, T1 runs next and prints 2\n (C) T1 runs first and prints 1, T2 does not print anything (deadlock)\n (D) T2 runs first and prints 1, T1 does not print anything (deadlock)\n Let \ud835\udc34 be an \ud835\udc5b \u00d7 \ud835\udc5b matrix over the set of all real numbers \u211d. Let \ud835\udc35 be a matrix"}, {"y": 2024, "p": "2024_CS2", "n": 47, "m": 2, "s": "Computer Networks", "t": "Application layer & security", "q": "obtained from \ud835\udc34 by swapping two rows. Which of the following statements is/are\n TRUE?\n (A) The determinant of \ud835\udc35 is the negative of the determinant of \ud835\udc34\n (B) If \ud835\udc34 is invertible, then \ud835\udc35 is also invertible\n (C) If \ud835\udc34\u2061is symmetric, then \ud835\udc35 is also symmetric\n (D) If the trace of \ud835\udc34 is zero, then the trace of \ud835\udc35\u2061is also zero"}, {"y": 2024, "p": "2024_CS2", "n": 48, "m": 2, "s": "Data Structures", "t": "Stacks, queues, linked lists", "q": "Let S1 and S2 be two stacks. S1 has capacity of 4 elements. S2 has capacity of\n 2 elements. S1 already has 4 elements: 100, 200, 300, and 400, whereas S2 is\n empty, as shown below.\n 400 (Top)\n 300\n 200 Stack S2\n 100\n Stack S1\n Only the following three operations are available:\n PushToS2: Pop the top element from S1 and push it on S2.\n PushToS1: Pop the top element from S2 and push it on S1.\n GenerateOutput: Pop the top element from S1 and output it to the\n user.\n Note that the pop operation is not allowed on an empty stack and the push operation\n is not allowed on a full stack.\n Which of the following output sequences can be generated by using the above\n operations?\n (A) 100, 200, 400, 300\n (B) 200, 300, 400, 100\n (C) 400, 200, 100, 300\n (D) 300, 200, 400, 100"}, {"y": 2024, "p": "2024_CS2", "n": 49, "m": 2, "s": "Digital Logic", "t": "Number systems & arithmetic", "q": "Which of the following is/are EQUAL to 224 in radix-5 (i.e., base-5) notation?\n (A) 64 in radix-10\n (B) 100 in radix-8\n (C) 50 in radix-16\n (D) 121 in radix-7"}, {"y": 2024, "p": "2024_CS2", "n": 51, "m": 2, "s": "Discrete Mathematics", "t": "Graph theory", "q": "Let \ud835\udc3a be an undirected connected graph in which every edge has a positive integer\n weight. Suppose that every spanning tree in \ud835\udc3a has even weight. Which of the\n following statements is/are TRUE for every such graph \ud835\udc3a ?\n (A) All edges in \ud835\udc3a have even weight\n (B) All edges in \ud835\udc3a have even weight OR all edges in \ud835\udc3a have odd weight\n (C) In each cycle \ud835\udc36 in \ud835\udc3a, all edges in \ud835\udc36 have even weight\n In each cycle \ud835\udc36 in \ud835\udc3a, either all edges in \ud835\udc36 have even weight OR all edges in \ud835\udc36\n (D)\n have odd weight"}, {"y": 2024, "p": "2024_CS2", "n": 52, "m": 2, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "Consider a context-free grammar \ud835\udc3a with the following 3 rules.\n \ud835\udc46 \u2192 \ud835\udc4e\ud835\udc46, \ud835\udc46 \u2192 \ud835\udc4e\ud835\udc46\ud835\udc4f\ud835\udc46, \ud835\udc46 \u2192 \ud835\udc50\n Let \ud835\udc64 \u2208 \u2061\ud835\udc3f(\ud835\udc3a). Let \ud835\udc5b\ud835\udc4e (\ud835\udc64), \ud835\udc5b\ud835\udc4f (\ud835\udc64), \ud835\udc5b\ud835\udc50 (\ud835\udc64)\u2061denote the number of times \ud835\udc4e, \ud835\udc4f, \ud835\udc50\n occur in \ud835\udc64, respectively. Which of the following statements is/are TRUE?\n (A) \ud835\udc5b\ud835\udc4e (\ud835\udc64) > \ud835\udc5b\ud835\udc4f (\ud835\udc64)\u2061\n (B) \ud835\udc5b\ud835\udc4e (\ud835\udc64) > \ud835\udc5b\ud835\udc50 (\ud835\udc64) \u2212 2\n (C) \ud835\udc5b\ud835\udc50 (\ud835\udc64) = \ud835\udc5b\ud835\udc4f (\ud835\udc64) + 1\n (D) \ud835\udc5b\ud835\udc50 (\ud835\udc64) = \ud835\udc5b\ud835\udc4f (\ud835\udc64) \u2217 2"}, {"y": 2024, "p": "2024_CS2", "n": 53, "m": 2, "s": "Operating Systems", "t": "Files, disk, I/O, system calls", "q": "Consider a disk with the following specifications: rotation speed of 6000 RPM,\n average seek time of 5 milliseconds, 500 sectors/track, 512-byte sectors.\n A file has content stored in 3000 sectors located randomly on the disk. Assuming\n average rotational latency, the total time (in seconds, rounded off to 2 decimal\n places) to read the entire file from the disk is _________"}, {"y": 2024, "p": "2024_CS2", "n": 54, "m": 2, "s": "Computer Networks", "t": "Transport layer (TCP/UDP)", "q": "Consider a TCP connection operating at a point of time with the congestion window\n of size 12 MSS (Maximum Segment Size), when a timeout occurs due to packet\n loss. Assuming that all the segments transmitted in the next two RTTs (Round Trip\n Time) are acknowledged correctly, the congestion window size (in MSS) during the\n third RTT will be _________"}, {"y": 2024, "p": "2024_CS2", "n": 55, "m": 2, "s": "Computer Networks", "t": "Data link, MAC & error control", "q": "Consider an Ethernet segment with a transmission speed of 108 bits/sec and a\n maximum segment length of 500 meters. If the speed of propagation of the signal\n in the medium is 2\u00d7108 meters/sec, then the minimum frame size (in bits) required\n for collision detection is _________"}, {"y": 2024, "p": "2024_CS2", "n": 56, "m": 2, "s": "Databases", "t": "Normalization & functional dependencies", "q": "A functional dependency \ud835\udc39:\u2061\ud835\udc4b \u2192 \ud835\udc4c is termed as a useful functional dependency if\n and only if it satisfies all the following three conditions:\n \u2022 \ud835\udc4b is not the empty set.\n \u2022 \ud835\udc4c is not the empty set.\n \u2022 Intersection of \ud835\udc4b and \ud835\udc4c is the empty set.\n For a relation \ud835\udc45 with 4 attributes, the total number of possible useful functional\n dependencies is ________"}, {"y": 2024, "p": "2024_CS2", "n": 57, "m": 2, "s": "Computer Organization", "t": "Instruction set, addressing & control unit", "q": "A processor with 16 general purpose registers uses a 32-bit instruction format. The\n instruction format consists of an opcode field, an addressing mode field, two register\n operand fields, and a 16-bit scalar field. If 8 addressing modes are to be supported,\n the maximum number of unique opcodes possible for every addressing mode\n is _________"}, {"y": 2024, "p": "2024_CS2", "n": 58, "m": 2, "s": "Computer Organization", "t": "Pipelining", "q": "A non-pipelined instruction execution unit operating at 2 GHz takes an average of\n 6 cycles to execute an instruction of a program P. The unit is then redesigned to\n operate on a 5-stage pipeline at 2 GHz. Assume that the ideal throughput of the\n pipelined unit is 1 instruction per cycle. In the execution of program P,\n 20% instructions incur an average of 2 cycles stall due to data hazards and\n 20% instructions incur an average of 3 cycles stall due to control hazards. The\n speedup (rounded off to one decimal place) obtained by the pipelined design over\n the non-pipelined design is _________"}, {"y": 2024, "p": "2024_CS2", "n": 59, "m": 2, "s": "Discrete Mathematics", "t": "Graph theory", "q": "The number of distinct minimum-weight spanning trees of the following graph\n is _________\n 3\n b c\n 1 2 2 1\n 2 2\n a g d\n 2 2\n 1 1\n f e\n 3"}, {"y": 2024, "p": "2024_CS2", "n": 60, "m": 2, "s": "Discrete Mathematics", "t": "Graph theory", "q": "The chromatic number of a graph is the minimum number of colours used in a\n proper colouring of the graph. The chromatic number of the following graph\n is _________"}, {"y": 2024, "p": "2024_CS2", "n": 61, "m": 2, "s": "Computer Organization", "t": "Instruction set, addressing & control unit", "q": "A processor uses a 32-bit instruction format and supports byte-addressable memory\n access. The ISA of the processor has 150 distinct instructions. The instructions are\n equally divided into two types, namely R-type and I-type, whose formats are shown\n below.\n R-type Instruction Format:\n OPCODE UNUSED DST Register SRC Register1 SRC Register 2\n I-type Instruction Format:\n OPCODE DST Register SRC Register # Immediate value/address\n In the OPCODE, 1 bit is used to distinguish between I-type and R-type instructions\n and the remaining bits indicate the operation. The processor has 50 architectural\n registers, and all register fields in the instructions are of equal size.\n Let \ud835\udc4b be the number of bits used to encode the UNUSED field, \ud835\udc4c be the number\n of bits used to encode the OPCODE field, and \ud835\udc4d be the number of bits used to\n encode the immediate value/address field. The value of \ud835\udc4b + 2\ud835\udc4c + \ud835\udc4d is "}, {"y": 2024, "p": "2024_CS2", "n": 63, "m": 2, "s": "Discrete Mathematics", "t": "Logic, sets, relations & algebra", "q": "Let \ud835\udc4d\ud835\udc5b be the group of integers {0, 1, 2, \u2026 , \ud835\udc5b \u2212 1} with addition modulo \ud835\udc5b as the\n group operation. The number of elements in the group \ud835\udc4d2 \u00d7 \ud835\udc4d3 \u00d7 \ud835\udc4d4 that are their\n own inverses is ________"}, {"y": 2024, "p": "2024_CS2", "n": 64, "m": 2, "s": "Operating Systems", "t": "Memory management & virtual memory", "q": "Consider a 32-bit system with 4 KB page size and page table entries of size 4 bytes\n each. Assume 1 KB = 210 bytes. The OS uses a 2-level page table for memory\n management, with the page table containing an outer page directory and an inner\n page table. The OS allocates a page for the outer page directory upon process\n creation. The OS uses demand paging when allocating memory for the inner page\n table, i.e., a page of the inner page table is allocated only if it contains at least one\n valid page table entry.\n An active process in this system accesses 2000 unique pages during its execution,\n and none of the pages are swapped out to disk. After it completes the page accesses,\n let X denote the minimum and Y denote the maximum number of pages across the\n two levels of the page table of the process.\n The value of X+Y is ________"}, {"y": 2024, "p": "2024_CS2", "n": 65, "m": 2, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "Consider the following augmented grammar, which is to be parsed with a SLR\n parser. The set of terminals is {\ud835\udc4e,\ud835\udc4f,\ud835\udc50,\ud835\udc51,#,@}\n \ud835\udc46\u2032 \u2192 \ud835\udc46\n \ud835\udc46 \u2192 \ud835\udc46\ud835\udc46\u2061|\u2061\ud835\udc34\ud835\udc4e\u2061|\u2061\ud835\udc4f\ud835\udc34\ud835\udc50\u2061|\u2061\ud835\udc35\ud835\udc50\u2061|\u2061\ud835\udc4f\ud835\udc35\ud835\udc4e\n \ud835\udc34 \u2192 \ud835\udc51#\n \ud835\udc35\u2192@\n Let \ud835\udc3c0 = \ud835\udc36\ud835\udc3f\ud835\udc42\ud835\udc46\ud835\udc48\ud835\udc45\ud835\udc38({\ud835\udc46 \u2032 \u2192\u2061\u2022 \ud835\udc46}). The number of items in the set \ud835\udc3a\ud835\udc42\ud835\udc47\ud835\udc42(\ud835\udc3c0 , \ud835\udc46)\n is ___________"}, {"y": 2025, "p": "2025_CS1", "n": 2, "m": 1, "s": "General Aptitude", "t": "Verbal ability", "q": "The CEO\u2019s decision to downsize the workforce was considered myopic because it\n sacrificed long-term stability to accommodate short-term gains.\n Select the most appropriate option that can replace the word \u201cmyopic\u201d without\n changing the meaning of the sentence.\n (A) visionary\n (B) shortsighted\n (C) progressive\n (D) innovative"}, {"y": 2025, "p": "2025_CS1", "n": 3, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "The average marks obtained by a class in an examination were calculated as 30.8.\n However, while checking the marks entered, the teacher found that the marks of one\n student were entered incorrectly as 24 instead of 42. After correcting the marks, the\n average becomes 31.4. How many students does the class have?\n (A) 25\n (B) 28\n (C) 30\n (D) 32"}, {"y": 2025, "p": "2025_CS1", "n": 4, "m": 1, "s": "General Aptitude", "t": "Logical reasoning & data interpretation", "q": "Consider the relationships among P, Q, R, S, and T:\n \u2022 P is the brother of Q.\n \u2022 S is the daughter of Q.\n \u2022 T is the sister of S.\n \u2022 R is the mother of Q.\n The following statements are made based on the relationships given above.\n (1) R is the grandmother of S.\n (2) P is the uncle of S and T.\n (3) R has only one son.\n (4) Q has only one daughter.\n Which one of the following options is correct?\n (A) Both (1) and (2) are true.\n (B) Both (1) and (3) are true.\n (C) Only (3) is true.\n (D) Only (4) is true."}, {"y": 2025, "p": "2025_CS1", "n": 5, "m": 1, "s": "General Aptitude", "t": "Spatial & geometry", "q": "According to the map shown in the figure, which one of the following statements is\n correct?\n Note: The figure shown is representative.\n 1st Main Road\n Library Canteen\n Physics Lab Hospital\n 5th Cross Road\n Hostels Chemistry\n Lab\n N\n Classrooms\n W E\n S\n (A) The library is located to the northwest of the canteen.\n (B) The hospital is located to the east of the chemistry lab.\n (C) The chemistry lab is to the southeast of physics lab.\n (D) The classrooms and canteen are next to each other."}, {"y": 2025, "p": "2025_CS1", "n": 7, "m": 2, "s": "General Aptitude", "t": "Spatial & geometry", "q": "In the diagram, the lines QR and ST are parallel to each other. The shortest distance\n between these two lines is half the shortest distance between the point P and line\n QR. What is the ratio of the area of the triangle PST to the area of the trapezium\n SQRT?\n Note: The figure shown is representative.\n P\n S T\n Q R\n (A) 1\n 3\n (B) 1\n 4\n (C) 2\n 5\n (D) 1\n 2"}, {"y": 2025, "p": "2025_CS1", "n": 8, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "A fair six-faced dice, with the faces labelled \u20181\u2019, \u20182\u2019, \u20183\u2019, \u20184\u2019, \u20185\u2019, and \u20186\u2019, is rolled\n thrice. What is the probability of rolling \u20186\u2019 exactly once?\n (A) 75\n 216\n (B) 1\n 6\n (C) 1\n 18\n (D) 25\n 216"}, {"y": 2025, "p": "2025_CS1", "n": 9, "m": 2, "s": "General Aptitude", "t": "Spatial & geometry", "q": "A square paper, shown in figure (I), is folded along the dotted lines as shown in the\n figures (II) and (III). Then a few cuts are made as shown in figure (IV). Which one\n of the following patterns will be obtained when the paper is unfolded?\n Note: The figures shown are representative.\n (I) (II) (III) (IV)\n (A)\n (B)\n (C)\n (D)"}, {"y": 2025, "p": "2025_CS1", "n": 10, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "A shop has 4 distinct flavors of ice-cream. One can purchase any number of scoops\n of any flavor. The order in which the scoops are purchased is inconsequential.\n If one wants to purchase 3 scoops of ice-cream, in how many ways can one make\n that purchase?\n (A) 4\n (B) 20\n (C) 24\n (D) 48"}, {"y": 2025, "p": "2025_CS1", "n": 12, "m": 1, "s": "Algorithms", "t": "Sorting & searching", "q": "Which ONE of the following statements is FALSE regarding the symbol table?\n (A) Symbol table is responsible for keeping track of the scope of variables.\n (B) Symbol table can be implemented using a binary search tree.\n (C) Symbol table is not required after the parsing phase.\n (D) Symbol table is created during the lexical analysis phase."}, {"y": 2025, "p": "2025_CS1", "n": 13, "m": 1, "s": "Compiler Design", "t": "Lexical analysis, optimisation & runtime", "q": "Which ONE of the following techniques used in compiler code optimization uses\n live variable analysis?\n (A) Run-time function call management\n (B) Register assignment to variables\n (C) Strength reduction\n (D) Constant folding"}, {"y": 2025, "p": "2025_CS1", "n": 14, "m": 1, "s": "Operating Systems", "t": "Memory management & virtual memory", "q": "Consider a demand paging memory management system with 32-bit logical\n address, 20-bit physical address, and page size of 2048 bytes. Assuming that the\n memory is byte addressable, what is the maximum number of entries in the page\n table?\n (A) 221\n (B) 220\n (C) 222\n (D) 224"}, {"y": 2025, "p": "2025_CS1", "n": 15, "m": 1, "s": "Databases", "t": "Transactions & concurrency", "q": "A schedule of three database transactions \ud835\udc471 , \ud835\udc472 , and \ud835\udc473 is shown. \ud835\udc45\ud835\udc56 (\ud835\udc34) and\n \ud835\udc4a\ud835\udc56 (\ud835\udc34) denote read and write of data item \ud835\udc34 by transaction \ud835\udc47\ud835\udc56 , \ud835\udc56 = 1,2,3. The\n transaction \ud835\udc471 aborts at the end. Which other transaction(s) will be required to be\n rolled back?\n \ud835\udc451 (\ud835\udc4b) \ud835\udc4a1 (\ud835\udc4c) \ud835\udc452 (\ud835\udc4b) \ud835\udc452 (\ud835\udc4c) \ud835\udc453 (\ud835\udc4c) \ud835\udc34\ud835\udc35\ud835\udc42\ud835\udc45\ud835\udc47(\ud835\udc471 )\n (A) Only \ud835\udc472\n (B) Only \ud835\udc473\n (C) Both \ud835\udc472 and \ud835\udc473\n (D) Neither \ud835\udc472 nor \ud835\udc473"}, {"y": 2025, "p": "2025_CS1", "n": 16, "m": 1, "s": "Discrete Mathematics", "t": "Graph theory", "q": "Identify the ONE CORRECT matching between the OSI layers and their\n corresponding functionalities as shown.\n OSI Layers Functionalities\n (a) Network layer (I) Packet routing\n (b) Transport layer (II) Framing and error handling\n (c) Datalink layer (III) Host to host communication\n (A) (a)-(I), (b)-(II), (c)-(III)\n (B) (a)-(I), (b)-(III), (c)-(II)\n (C) (a)-(II), (b)-(I), (c)-(III)\n (D) (a)-(III), (b)-(II), (c)-(I)"}, {"y": 2025, "p": "2025_CS1", "n": 17, "m": 1, "s": "Discrete Mathematics", "t": "Logic, sets, relations & algebra", "q": "\ud835\udc54(. ) is a function from \ud835\udc34 to \ud835\udc35, \ud835\udc53(. ) is a function from \ud835\udc35 to \ud835\udc36, and their\n composition defined as \ud835\udc53(\ud835\udc54(. )) is a mapping from \ud835\udc34 to \ud835\udc36.\n If \ud835\udc53(. ) and \ud835\udc53(\ud835\udc54(. )) are onto (surjective) functions, which ONE of the following\n is TRUE about the function \ud835\udc54(. )?\n (A) \ud835\udc54(. ) must be an onto (surjective) function.\n (B) \ud835\udc54(. ) must be a one-to-one (injective) function.\n (C) \ud835\udc54(. ) must be a bijective function, that is, both one-to-one and onto.\n (D) \ud835\udc54(. ) is not required to be a one-to-one or onto function."}, {"y": 2025, "p": "2025_CS1", "n": 18, "m": 1, "s": "Discrete Mathematics", "t": "Graph theory", "q": "Let \ud835\udc3a be any undirected graph with positive edge weights, and \ud835\udc47 be a minimum\n spanning tree of \ud835\udc3a. For any two vertices, \ud835\udc62 and \ud835\udc63, let \ud835\udc511 (\ud835\udc62, \ud835\udc63) and \ud835\udc512 (\ud835\udc62, \ud835\udc63) be the\n shortest distances between \ud835\udc62 and \ud835\udc63 in \ud835\udc3a and \ud835\udc47, respectively. Which ONE of the\n options is CORRECT for all possible \ud835\udc3a, \ud835\udc47, \ud835\udc62 and \ud835\udc63?\n (A) \ud835\udc511 (\ud835\udc62, \ud835\udc63) = \ud835\udc512 (\ud835\udc62, \ud835\udc63)\n (B) \ud835\udc511 (\ud835\udc62, \ud835\udc63) \u2264 \ud835\udc512 (\ud835\udc62, \ud835\udc63)\n (C) \ud835\udc511 (\ud835\udc62, \ud835\udc63) \u2265 \ud835\udc512 (\ud835\udc62, \ud835\udc63)\n (D) \ud835\udc511 (\ud835\udc62, \ud835\udc63) \u2260 \ud835\udc512 (\ud835\udc62, \ud835\udc63)"}, {"y": 2025, "p": "2025_CS1", "n": 19, "m": 1, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "Consider the following context-free grammar \ud835\udc3a, where \ud835\udc46, \ud835\udc34, and \ud835\udc35 are the variables\n (non-terminals), \ud835\udc4e and \ud835\udc4f are the terminal symbols, \ud835\udc46 is the start variable, and the\n rules of \ud835\udc3a are described as:\n \ud835\udc46 \u2192 \ud835\udc4e\ud835\udc4e\ud835\udc35 | \ud835\udc34\ud835\udc4f\ud835\udc4f\n \ud835\udc34 \u2192 \ud835\udc4e | \ud835\udc4e\ud835\udc34\n \ud835\udc35 \u2192 \ud835\udc4f | \ud835\udc4f\ud835\udc35\n Which ONE of the languages \ud835\udc3f(\ud835\udc3a) is accepted by \ud835\udc3a?\n (A) \ud835\udc3f(\ud835\udc3a) = {\ud835\udc4e2 \ud835\udc4f \ud835\udc5b | \ud835\udc5b \u2265 1} \u222a {\ud835\udc4e\ud835\udc5b \ud835\udc4f 2 | \ud835\udc5b \u2265 1}\n (B) \ud835\udc3f(\ud835\udc3a) = {\ud835\udc4e\ud835\udc5b \ud835\udc4f 2\ud835\udc5b | \ud835\udc5b \u2265 1} \u222a {\ud835\udc4e2\ud835\udc5b \ud835\udc4f \ud835\udc5b | \ud835\udc5b \u2265 1}\n (C) \ud835\udc3f(\ud835\udc3a) = {\ud835\udc4e\ud835\udc5b \ud835\udc4f \ud835\udc5b | \ud835\udc5b \u2265 1}\n (D) \ud835\udc3f(\ud835\udc3a) = {\ud835\udc4e2\ud835\udc5b \ud835\udc4f 2\ud835\udc5b | \ud835\udc5b \u2265 1}\n Consider the following recurrence relation:"}, {"y": 2025, "p": "2025_CS1", "n": 20, "m": 1, "s": "Algorithms", "t": "Complexity & recurrences", "q": "\ud835\udc47(\ud835\udc5b) = 2\ud835\udc47(\ud835\udc5b \u2212 1) + \ud835\udc5b2\ud835\udc5b for \ud835\udc5b > 0, \ud835\udc47(0) = 1.\n Which ONE of the following options is CORRECT?\n (A) \ud835\udc47(\ud835\udc5b) = \u0398(\ud835\udc5b2 2\ud835\udc5b )\n (B) \ud835\udc47(\ud835\udc5b) = \u0398(\ud835\udc5b2\ud835\udc5b )\n (C) \ud835\udc47(\ud835\udc5b) = \u0398((log \ud835\udc5b)2 2\ud835\udc5b )\n (D) \ud835\udc47(\ud835\udc5b) = \u0398(4\ud835\udc5b )"}, {"y": 2025, "p": "2025_CS1", "n": 21, "m": 1, "s": "Data Structures", "t": "Trees, BST, AVL, heaps", "q": "Consider the following \ud835\udc35 + tree with 5 nodes, in which a node can store at most 3 key values.\n The value 23 is now inserted in the \ud835\udc35 + tree. Which of the following options(s) is/are\n CORRECT?\n (A) None of the nodes will split.\n (B) At least one node will split and redistribute.\n (C) The total number of nodes will remain same.\n (D) The height of the tree will increase."}, {"y": 2025, "p": "2025_CS1", "n": 22, "m": 1, "s": "Computer Networks", "t": "Transport layer (TCP/UDP)", "q": "Consider the 3-way handshaking protocol for TCP connection establishment. Let\n the three packets exchanged during the connection establishment be denoted as P1,\n P2, and P3, in order. Which of the following option(s) is/are TRUE with respect to\n TCP header flags that are set in the packets?\n (A) P3: SYN = 1, ACK = 1\n (B) P2: SYN = 1, ACK = 1\n (C) P2: SYN = 0, ACK = 1\n (D) P1: SYN = 1\n Consider the given system of linear equations for variables \ud835\udc65 and \ud835\udc66, where \ud835\udc58 is a"}, {"y": 2025, "p": "2025_CS1", "n": 24, "m": 1, "s": "Digital Logic", "t": "Combinational circuits & K-maps", "q": "Let \ud835\udc4b be a 3-variable Boolean function that produces output as \u20181\u2019 when at least\n two of the input variables are \u20181\u2019. Which of the following statement(s) is/are\n CORRECT, where \ud835\udc4e, \ud835\udc4f, \ud835\udc50, \ud835\udc51, \ud835\udc52 are Boolean variables?\n (A) \ud835\udc4b(\ud835\udc4e, \ud835\udc4f, \ud835\udc4b(\ud835\udc50, \ud835\udc51, \ud835\udc52)) = \ud835\udc4b(\ud835\udc4b(\ud835\udc4e, \ud835\udc4f, \ud835\udc50), \ud835\udc51, \ud835\udc52)\n (B) \ud835\udc4b(\ud835\udc4e, \ud835\udc4f, \ud835\udc4b(\ud835\udc4e, \ud835\udc4f, \ud835\udc50)) = \ud835\udc4b(\ud835\udc4e, \ud835\udc4f, \ud835\udc50)\n (C) \ud835\udc4b(\ud835\udc4e, \ud835\udc4f, \ud835\udc4b(\ud835\udc4e, \ud835\udc50, \ud835\udc51)) = (\ud835\udc4b(\ud835\udc4e, \ud835\udc4f, \ud835\udc4e) AND \ud835\udc4b(\ud835\udc50, \ud835\udc51, \ud835\udc50))\n (D) \ud835\udc4b(\ud835\udc4e, \ud835\udc4f, \ud835\udc50) = \ud835\udc4b(\ud835\udc4e, \ud835\udc4b(\ud835\udc4e, \ud835\udc4f, \ud835\udc50), \ud835\udc4b(\ud835\udc4e, \ud835\udc50, \ud835\udc50))"}, {"y": 2025, "p": "2025_CS1", "n": 25, "m": 1, "s": "Digital Logic", "t": "Number systems & arithmetic", "q": "The number \u22126 can be represented as 1010 in 4-bit 2\u2019s complement representation.\n Which of the following is/are CORRECT 2\u2019s complement representation(s) of \u22126?\n (A) 1000 1010 in 8-bits\n (B) 1111 1010 in 8-bits\n (C) 1000 0000 0000 1010 in 16-bits\n (D) 1111 1111 1111 1010 in 16-bits"}, {"y": 2025, "p": "2025_CS1", "n": 26, "m": 1, "s": "Algorithms", "t": "Sorting & searching", "q": "Which of the following statement(s) is/are TRUE for any binary search tree (BST)\n having \ud835\udc5b distinct integers?\n (A) The maximum length of a path from the root node to any other node is (\ud835\udc5b \u2212 1).\n (B) An inorder traversal will always produce a sorted sequence of elements.\n (C) Finding an element takes \ud835\udc42(log 2 \ud835\udc5b) time in the worst case.\n (D) Every BST is also a Min-Heap."}, {"y": 2025, "p": "2025_CS1", "n": 27, "m": 1, "s": "Computer Organization", "t": "Instruction set, addressing & control unit", "q": "A partial data path of a processor is given in the figure, where RA, RB, and RZ are\n 32-bit registers. Which option(s) is/are CORRECT related to arithmetic operations\n using the data path as shown?\n (A) The data path can implement arithmetic operations involving two registers.\n (B) The data path can implement arithmetic operations involving one register and one\n immediate value.\n (C) The data path can implement arithmetic operations involving two immediate values.\n (D) The data path can only implement arithmetic operations involving one register and\n one immediate value."}, {"y": 2025, "p": "2025_CS1", "n": 28, "m": 1, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "A regular language \ud835\udc3f is accepted by a non-deterministic finite automaton (NFA)\n with \ud835\udc5b states. Which of the following statement(s) is/are FALSE?\n (A) \ud835\udc3f may have an accepting NFA with < \ud835\udc5b states.\n (B) \ud835\udc3f may have an accepting DFA with < \ud835\udc5b states.\n (C) There exists a DFA with \u2264 2\ud835\udc5b states that accepts \ud835\udc3f.\n (D) Every DFA that accepts \ud835\udc3f has > 2\ud835\udc5b states."}, {"y": 2025, "p": "2025_CS1", "n": 29, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Suppose in a multiprogramming environment, the following C program segment is\n executed. A process goes into I/O queue whenever an I/O related operation is\n performed. Assume that there will always be a context switch whenever a process\n requests for an I/O, and also whenever the process returns from an I/O. The number\n of times the process will enter the ready queue during its lifetime (not counting the\n time the process enters the ready queue when it is run initially) is _______. (Answer\n in integer)\n int main()\n {\n int x=0,i=0;\n scanf(\"%d\",&x);\n for(i=0; i<20; i++)\n {\n x = x+20;\n printf(\"%d\\n\",x);\n }\n return 0;\n }"}, {"y": 2025, "p": "2025_CS1", "n": 32, "m": 1, "s": "Discrete Mathematics", "t": "Combinatorics & probability", "q": "A box contains 5 coins: 4 regular coins and 1 fake coin. When a regular coin is\n tossed, the probability \ud835\udc43(\u210e\ud835\udc52\ud835\udc4e\ud835\udc51) = 0.5 and for a fake coin, \ud835\udc43(\u210e\ud835\udc52\ud835\udc4e\ud835\udc51) = 1. You pick\n a coin at random and toss it twice, and get two heads. The probability that the coin\n you have chosen is the fake coin is _______. (rounded off to two decimal places)"}, {"y": 2025, "p": "2025_CS1", "n": 33, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "The pseudocode of a function fun() is given below:\n fun(int A[0,\u2026,n-1]){\n for i=0 to n-2\n for j=0 to n-i-2\n if (A[j]>A[j+1])\n then swap A[j] and A[j+1]\n }\n Let \ud835\udc34[0, \u2026 ,29] be an array storing 30 distinct integers in descending order. The\n number of swap operations that will be performed, if the function fun() is called\n with \ud835\udc34[0, \u2026 ,29] as argument, is __________. (Answer in integer)"}, {"y": 2025, "p": "2025_CS1", "n": 34, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "#include <stdio.h>\n void foo(int *p, int x){\n *p=x;\n }\n int main(){\n int *z;\n int a = 20, b = 25;\n z = &a;\n foo(z,b);\n printf(\"%d\",a);\n return 0;\n }\n The output of the given C program is __________. (Answer in integer)"}, {"y": 2025, "p": "2025_CS1", "n": 35, "m": 1, "s": "Data Structures", "t": "Trees, BST, AVL, heaps", "q": "The height of any rooted tree is defined as the maximum number of edges in the\n path from the root node to any leaf node.\n Suppose a Min-Heap \ud835\udc47 stores 32 keys. The height of \ud835\udc47 is _____________.\n (Answer in integer)"}, {"y": 2025, "p": "2025_CS1", "n": 37, "m": 2, "s": "Computer Organization", "t": "Instruction set, addressing & control unit", "q": "A processor has 64 general-purpose registers and 50 distinct instruction types. An\n instruction is encoded in 32-bits. What is the maximum number of bits that can be\n used to store the immediate operand for the given instruction?\n ADD R1, #25 // R1 = R1 + 25\n (A) 16\n (B) 20\n (C) 22\n (D) 24"}, {"y": 2025, "p": "2025_CS1", "n": 38, "m": 2, "s": "Operating Systems", "t": "Scheduling & deadlock", "q": "A computer has two processors, \ud835\udc401 and \ud835\udc402 . Four processes \ud835\udc431 , \ud835\udc432 , \ud835\udc433 , \ud835\udc434 with CPU\n bursts of 20, 16, 25, and 10 milliseconds, respectively, arrive at the same time and\n these are the only processes in the system. The scheduler uses non-preemptive\n priority scheduling, with priorities decided as follows:\n \u2022 \ud835\udc401 uses priority of execution for the processes as, \ud835\udc431 > \ud835\udc433 > \ud835\udc432 > \ud835\udc434 , i.e.,\n \ud835\udc431 and \ud835\udc434 have highest and lowest priorities, respectively.\n \u2022 \ud835\udc402 uses priority of execution for the processes as, \ud835\udc432 > \ud835\udc433 > \ud835\udc434 > \ud835\udc431 , i.e.,\n \ud835\udc432 and \ud835\udc431 have highest and lowest priorities, respectively.\n A process \ud835\udc43\ud835\udc56 is scheduled to a processor \ud835\udc40\ud835\udc58 , if the processor is free and no other\n process \ud835\udc43\ud835\udc57 is waiting with higher priority. At any given point of time, a process can\n be allocated to any one of the free processors without violating the execution\n priority rules. Ignore the context switch time. What wi"}, {"y": 2025, "p": "2025_CS1", "n": 39, "m": 2, "s": "Databases", "t": "SQL & relational algebra", "q": "Consider two relations describing \ud835\udc61\ud835\udc52\ud835\udc4e\ud835\udc5a\ud835\udc60 and \ud835\udc5d\ud835\udc59\ud835\udc4e\ud835\udc66\ud835\udc52\ud835\udc5f\ud835\udc60 in a sports league:\n \u2022 \ud835\udc61\ud835\udc52\ud835\udc4e\ud835\udc5a\ud835\udc60(\ud835\udc61\ud835\udc56\ud835\udc51, \ud835\udc61\ud835\udc5b\ud835\udc4e\ud835\udc5a\ud835\udc52): \ud835\udc61\ud835\udc56\ud835\udc51, \ud835\udc61\ud835\udc5b\ud835\udc4e\ud835\udc5ae are team-id and team-name, respectively\n \u2022 \ud835\udc5d\ud835\udc59\ud835\udc4e\ud835\udc66\ud835\udc52\ud835\udc5f\ud835\udc60(\ud835\udc5d\ud835\udc56\ud835\udc51, \ud835\udc5d\ud835\udc5b\ud835\udc4e\ud835\udc5a\ud835\udc52, \ud835\udc61\ud835\udc56\ud835\udc51): \ud835\udc5d\ud835\udc56\ud835\udc51, \ud835\udc5d\ud835\udc5b\ud835\udc4e\ud835\udc5a\ud835\udc52, and \ud835\udc61\ud835\udc56\ud835\udc51 denote player-id, player-\n name and the team-id of the player, respectively\n Which ONE of the following tuple relational calculus queries returns the name of the\n players who play for the team having \ud835\udc61\ud835\udc5b\ud835\udc4e\ud835\udc5a\ud835\udc52 as \u2032\ud835\udc40\ud835\udc3c\u2032?\n (A) { \ud835\udc5d. \ud835\udc5d\ud835\udc5b\ud835\udc4e\ud835\udc5a\ud835\udc52 | \ud835\udc5d \u2208 \ud835\udc5d\ud835\udc59\ud835\udc4e\ud835\udc66\ud835\udc52\ud835\udc5f\ud835\udc60 \u2227 \u2203\ud835\udc61 (\ud835\udc61 \u2208 \ud835\udc61\ud835\udc52\ud835\udc4e\ud835\udc5a\ud835\udc60 \u2227 \ud835\udc5d. \ud835\udc61\ud835\udc56\ud835\udc51 = \ud835\udc61. \ud835\udc61\ud835\udc56\ud835\udc51 \u2227 \ud835\udc61. \ud835\udc61\ud835\udc5b\ud835\udc4e\ud835\udc5a\ud835\udc52 = \u2032\ud835\udc40\ud835\udc3c\u2032)}\n (B) { \ud835\udc5d. \ud835\udc5d\ud835\udc5b\ud835\udc4e\ud835\udc5a\ud835\udc52 | \ud835\udc5d \u2208 \ud835\udc61\ud835\udc52\ud835\udc4e\ud835\udc5a\ud835\udc60 \u2227 \u2203\ud835\udc61 (\ud835\udc61 \u2208 \ud835\udc5d\ud835\udc59\ud835\udc4e\ud835\udc66\ud835\udc52\ud835\udc5f\ud835\udc60 \u2227 \ud835\udc5d. \ud835\udc61\ud835\udc56\ud835\udc51 = \ud835\udc61. \ud835\udc61\ud835\udc56\ud835\udc51 \u2227 \ud835\udc61. \ud835\udc61\ud835\udc5b\ud835\udc4e\ud835\udc5a\ud835\udc52 = \u2032\ud835\udc40\ud835\udc3c\u2032)}\n (C) { \ud835\udc5d. \ud835\udc5d\ud835\udc5b\ud835\udc4e\ud835\udc5a\ud835\udc52 | \ud835\udc5d \ are no don\u2019t care terms. Which ONE of the following\n options is the CORRECT minimized Boolean expression for \ud835\udc39?\n (A) \ud835\udc4f\u03051 \ud835\udc4f\u03050 + \ud835\udc4f\u03052 \ud835\udc4f\u03050 + \ud835\udc4f1 \ud835\udc4f\u03052 \ud835\udc4f3\n (B) \ud835\udc4f\u03051 \ud835\udc4f\u03050 + \ud835\udc4f\u03052 \ud835\udc4f\u03050\n (C) \ud835\udc4f\u03052 \ud835\udc4f\u03050 + \ud835\udc4f1 \ud835\udc4f2 \ud835\udc4f3\n (D) \ud835\udc4f\u03050 \ud835\udc4f\u03052 + \ud835\udc4f\u03053"}, {"y": 2025, "p": "2025_CS1", "n": 43, "m": 2, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "Let \ud835\udc3a(\ud835\udc49, \ud835\udc38) be an undirected and unweighted graph with 100 vertices. Let \ud835\udc51(\ud835\udc62, \ud835\udc63)\n denote the number of edges in a shortest path between vertices \ud835\udc62 and \ud835\udc63 in \ud835\udc49. Let the\n maximum value of \ud835\udc51(\ud835\udc62, \ud835\udc63), \ud835\udc62, \ud835\udc63 \u2208 \ud835\udc49 such that \ud835\udc62 \u2260 \ud835\udc63, be 30. Let \ud835\udc47 be any breadth-\n first-search tree of \ud835\udc3a. Which ONE of the given options is CORRECT for every such\n graph \ud835\udc3a?\n (A) The height of \ud835\udc47 is exactly 15.\n (B) The height of \ud835\udc47 is exactly 30.\n (C) The height of \ud835\udc47 is at least 15.\n (D) The height of \ud835\udc47 is at least 30."}, {"y": 2025, "p": "2025_CS1", "n": 44, "m": 2, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "Consider the following two languages over the alphabet {\ud835\udc4e, \ud835\udc4f}:\n \ud835\udc3f1 = { \ud835\udefc\ud835\udefd\ud835\udefc | \ud835\udefc \u2208 {\ud835\udc4e, \ud835\udc4f}+ AND \ud835\udefd \u2208 {\ud835\udc4e, \ud835\udc4f}+ }\n \ud835\udc3f2 = { \ud835\udefc\ud835\udefd\ud835\udefc | \ud835\udefc \u2208 {\ud835\udc4e}+ AND \ud835\udefd \u2208 {\ud835\udc4e, \ud835\udc4f}+ }\n Which ONE of the following statements is CORRECT?\n (A) Both \ud835\udc3f1 and \ud835\udc3f2 are regular languages.\n (B) \ud835\udc3f1 is a regular language but \ud835\udc3f2 is not a regular language.\n (C) \ud835\udc3f1 is not a regular language but \ud835\udc3f2 is a regular language.\n (D) Neither \ud835\udc3f1 nor \ud835\udc3f2 is a regular language."}, {"y": 2025, "p": "2025_CS1", "n": 45, "m": 2, "s": "Theory of Computation", "t": "CFLs & pushdown automata", "q": "Consider the following two languages over the alphabet {\ud835\udc4e, \ud835\udc4f, \ud835\udc50}, where \ud835\udc5a and \ud835\udc5b\n are natural numbers.\n \ud835\udc3f1 = {\ud835\udc4e\ud835\udc5a \ud835\udc4f \ud835\udc5a \ud835\udc50 \ud835\udc5a+\ud835\udc5b | \ud835\udc5a, \ud835\udc5b \u2265 1}\n \ud835\udc3f2 = {\ud835\udc4e\ud835\udc5a \ud835\udc4f \ud835\udc5b \ud835\udc50 \ud835\udc5a+\ud835\udc5b | \ud835\udc5a, \ud835\udc5b \u2265 1}\n Which ONE of the following statements is CORRECT?\n (A) Both \ud835\udc3f1 and \ud835\udc3f2 are context-free languages.\n (B) \ud835\udc3f1 is a context-free language but \ud835\udc3f2 is not a context-free language.\n (C) \ud835\udc3f1 is not a context-free language but \ud835\udc3f2 is a context-free language.\n (D) Neither \ud835\udc3f1 nor \ud835\udc3f2 are context-free languages."}, {"y": 2025, "p": "2025_CS1", "n": 46, "m": 2, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "Which of the following statement(s) is/are TRUE while computing First and Follow\n during top down parsing by a compiler?\n (A) For a production \ud835\udc34 \u2192 \ud835\udf16, \ud835\udf16 will be added to \ud835\udc39\ud835\udc56\ud835\udc5f\ud835\udc60\ud835\udc61(\ud835\udc34).\n (B) If there is any input right end marker, it will be added to \ud835\udc39\ud835\udc56\ud835\udc5f\ud835\udc60\ud835\udc61(\ud835\udc46), where \ud835\udc46 is the\n start symbol.\n (C) For a production \ud835\udc34 \u2192 \ud835\udf16, \ud835\udf16 will be added to \ud835\udc39\ud835\udc5c\ud835\udc59\ud835\udc59\ud835\udc5c\ud835\udc64(\ud835\udc34).\n (D) If 1\ud835\udc52\ud835\udc5e(\ud835\udc65, \ud835\udc66): \ud835\udc65 and \ud835\udc66 are not equal\n (A) \u2200\ud835\udc65\u2203\ud835\udc66\u2203\ud835\udc67(\ud835\udc5a\ud835\udc5c\ud835\udc61\u210e\ud835\udc52\ud835\udc5f(\ud835\udc66, \ud835\udc65) \u2227 \u00ac\ud835\udc5a\ud835\udc5c\ud835\udc61\u210e\ud835\udc52\ud835\udc5f(\ud835\udc67, \ud835\udc65))\n (B) \u2200\ud835\udc65\u2203\ud835\udc66[\ud835\udc5a\ud835\udc5c\ud835\udc61\u210e\ud835\udc52\ud835\udc5f(\ud835\udc66, \ud835\udc65) \u2227 \u2200\ud835\udc67(\ud835\udc5b\ud835\udc5c\ud835\udc61\ud835\udc52\ud835\udc5e(\ud835\udc67, \ud835\udc66) \u2192 \u00ac\ud835\udc5a\ud835\udc5c\ud835\udc61\u210e\ud835\udc52\ud835\udc5f(\ud835\udc67, \ud835\udc65))]\n (C) \u2200\ud835\udc65\u2200\ud835\udc66[\ud835\udc5a\ud835\udc5c\ud835\udc61\u210e\ud835\udc52\ud835\udc5f(\ud835\udc66, \ud835\udc65) \u2192 \u2203\ud835\udc67(\ud835\udc5a\ud835\udc5c\ud835\udc61\u210e\ud835\udc52\ud835\udc5f(\ud835\udc67, \ud835\udc65) \u2227 \u00ac\ud835\udc5b\ud835\udc5c\ud835\udc61\ud835\udc52\ud835\udc5e(\ud835\udc67, \ud835\udc66))]\n (D) \u2200\ud835\udc65\u2203\ud835\udc66[\ud835\udc5a\ud835\udc5c\ud835\udc61\u210e\ud835\udc52\ud835\udc5f(\ud835\udc66, \ud835\udc65) \u2227 \u00ac\u2203\ud835\udc67(\ud835\udc5b\ud835\udc5c\ud835\udc61\ud835\udc52\ud835\udc5e(\ud835\udc67, \ud835\udc66) \u2227 \ud835\udc5a\ud835\udc5c\ud835\udc61\u210e\ud835\udc52\ud835\udc5f(\ud835\udc67, \ud835\udc65))]"}, {"y": 2025, "p": "2025_CS1", "n": 49, "m": 2, "s": "Discrete Mathematics", "t": "Logic, sets, relations & algebra", "q": "\ud835\udc34 = {0, 1, 2, 3, \u2026 } is the set of non-negative integers. Let \u03dc be the set of functions\n from \ud835\udc34 to itself. For any two functions, \ud835\udc531 , \ud835\udc532 \u2208 \u03dc, we define\n (\ud835\udc531 \u2a00\ud835\udc532 )(\ud835\udc5b) = \ud835\udc531 (\ud835\udc5b) + \ud835\udc532 (\ud835\udc5b)\n for every number \ud835\udc5b in \ud835\udc34. Which of the following is/are CORRECT about the\n mathematical structure (\u03dc, \u2a00)?\n (A) (\u03dc, \u2a00) is an Abelian group.\n (B) (\u03dc, \u2a00) is an Abelian monoid.\n (C) (\u03dc, \u2a00) is a non-Abelian group.\n (D) (\u03dc, \u2a00) is a non-Abelian monoid."}, {"y": 2025, "p": "2025_CS1", "n": 50, "m": 2, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "Consider the following deterministic finite automaton (DFA) defined over the\n alphabet, \u03a3 = {\ud835\udc4e, \ud835\udc4f}. Identify which of the following language(s) is/are accepted by\n the given DFA.\n (A) The set of all strings containing an even number of \ud835\udc4f\u2019s.\n (B) The set of all strings containing the pattern \ud835\udc4f\ud835\udc4e\ud835\udc4f.\n (C) The set of all strings ending with the pattern \ud835\udc4f\ud835\udc4e\ud835\udc4f.\n (D) The set of all strings not containing the pattern \ud835\udc4e\ud835\udc4f\ud835\udc4e."}, {"y": 2025, "p": "2025_CS1", "n": 51, "m": 2, "s": "Operating Systems", "t": "Files, disk, I/O, system calls", "q": "A disk of size 512M bytes is divided into blocks of 64K bytes. A file is stored in\n the disk using linked allocation. In linked allocation, each data block reserves 4\n bytes to store the pointer to the next data block. The link part of the last data block\n contains a NULL pointer (also of 4 bytes). Suppose a file of 1M bytes needs to be\n stored in the disk. Assume, 1K = 210 and 1M = 220 . The amount of space in bytes\n that will be wasted due to internal fragmentation is ______. (Answer in integer)"}, {"y": 2025, "p": "2025_CS1", "n": 52, "m": 2, "s": "Compiler Design", "t": "Syntax-directed translation & intermediate code", "q": "Refer to the given 3-address code sequence. This code sequence is split into basic\n blocks. The number of basic blocks is ________. (Answer in integer)\n 1001: i = 1\n 1002: j = 1\n 1003: t1 = 10*i\n 1004: t2 = t1+j\n 1005: t3 = 8*t2\n 1006: t4 = t3-88\n 1007: a[t4] = 0.0\n 1008: j = j+1\n 1009: if j <= 10 go
