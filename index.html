"Discrete Mathematics|Graph theory":["<h4>Core facts</h4><ul><li>Σdeg = 2E; number of odd-degree vertices is even. Tree: E=V−1, connected+acyclic. Simple graph max edges n(n−1)/2.</li><li>Euler circuit: all degrees even + connected. Euler path: exactly 0 or 2 odd vertices. Planar: E ≤ 3V−6 (E ≤ 2V−4 if no triangles); V−E+F=2. K₅, K₃,₃ non-planar.</li><li>χ(G) ≥ ω(G); bipartite ⇔ no odd cycle ⇔ χ ≤ 2. Cayley: labelled trees on n vertices = n^(n−2).</li></ul><h4>Twists</h4><ul><li>'Maximum/minimum edges so that the graph is <i>necessarily</i> connected' → worst case: one isolated vertex + complete graph on n−1 ⇒ (n−1)(n−2)/2 + 1.</li><li>Counting spanning trees via Kirchhoff or by cutting a cycle; 'number of simple graphs' asks about labelled vs unlabelled — read twice.</li></ul>"],
"Discrete Mathematics|Combinatorics & probability":["<h4>Core facts</h4><ul><li>Distribute n identical objects into k bins: C(n+k−1,k−1); each bin ≥1: C(n−1,k−1). Derangements D(n)=n!Σ(−1)^i/i!. Inclusion–exclusion for 'at least one' counts.</li><li>E[X] is linear (even for dependent events) — indicator variables solve most 'expected number of …' questions. Bayes: P(A|B)=P(B|A)P(A)/P(B).</li><li>Recurrences: solve via characteristic roots; Fibonacci-type growth.</li></ul><h4>Twists</h4><ul><li>'At least one' ⇒ compute the complement. Conditional probability with 'given that at least one is …' shrinks the sample space — don't use 1/2 blindly.</li><li>Birthday/pigeonhole: guaranteed ≠ probable.</li></ul>"],
"Discrete Mathematics|Linear algebra & calculus":["<h4>Core facts</h4><ul><li>det = product of eigenvalues; trace = sum. Rank–nullity: rank + nullity = columns. Triangular matrix: eigenvalues are diagonal entries. Symmetric ⇒ real eigenvalues.</li><li>Ax=b: consistent iff rank(A)=rank([A|b]); unique iff rank = #unknowns.</li><li>Numerical methods: Newton–Raphson xₙ₊₁=xₙ−f/f′; bisection halves the interval; LU decomposition. Calculus: limits (L'Hôpital), maxima/minima via f′=0 & f″.</li></ul><h4>Twists</h4><ul><li>Eigenvalues of A², A⁻¹, A+kI are λ², 1/λ, λ+k. Cayley–Hamilton gives A⁻¹ quickly.</li></ul>"],
"Discrete Mathematics|Logic, sets, relations & algebra":["<h4>Core facts</h4><ul><li>Equivalences: p→q ≡ ¬p∨q; ¬∀x P ≡ ∃x ¬P. Quantifier order matters: ∀x∃y ≠ ∃y∀x.</li><li>Relation on n elements: 2^(n²) total; reflexive 2^(n²−n); symmetric 2^(n(n+1)/2). Equivalence relations = Bell number partitions. Partial order = reflexive+antisymmetric+transitive.</li><li>Group: closure, associativity, identity, inverse; subgroup order divides group order (Lagrange). Lattice: every pair has lub & glb.</li></ul><h4>Twists</h4><ul><li>'Which of these is a tautology/valid' — try to falsify by assigning truth values rather than building the table.</li></ul>"],
"Databases|SQL & relational algebra":["<h4>Core facts</h4><ul><li>Order: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY. WHERE filters rows, HAVING filters groups.</li><li>NULL: comparisons give UNKNOWN; COUNT(*) counts NULL rows, COUNT(col) doesn't; NOT IN with a NULL in the subquery returns nothing.</li><li>Division in RA = 'for all'. Outer joins keep unmatched rows with NULLs. Natural join joins on <i>all</i> same-named attributes.</li></ul><h4>Twists</h4><ul><li>Nested/correlated query that 'looks like' max but excludes ties; set operators remove duplicates (UNION ALL does not). Count minimum/maximum tuples in join results using key constraints.</li></ul>"],
"Databases|Normalization & functional dependencies":["<h4>Core facts</h4><ul><li>Closure X⁺ by repeatedly adding RHS of FDs whose LHS ⊆ current set. Candidate key: X⁺ = all attributes and minimal. Attributes never on any RHS must be in every key.</li><li>BCNF: every non-trivial X→Y has X a superkey. 3NF: or Y is prime. BCNF ⇒ 3NF ⇒ 2NF.</li><li>Lossless binary decomposition: R1∩R2 → R1 or R2 is implied. Dependency preserving: union of projected FDs implies original.</li></ul><h4>Twists</h4><ul><li>Count candidate keys when several attributes are cyclic (A→B, B→C, C→A). A relation with only 2 attributes is always in BCNF.</li></ul>"],
"Databases|Transactions & concurrency":["<h4>Core facts</h4><ul><li>Conflict-serializable ⇔ precedence graph acyclic (conflicts: RW, WR, WW on same item, different txns). Equivalent serial order = topological order.</li><li>Strict 2PL ⇒ conflict-serializable, cascadeless, but can still deadlock. 2PL alone doesn't prevent cascading aborts.</li><li>Recoverable: a txn commits only after the txns it read from commit. Cascadeless ⊂ recoverable; strict ⊂ cascadeless.</li></ul><h4>Twists</h4><ul><li>Questions give a schedule with commits placed deliberately — check the <i>commit order</i> for recoverability separately from serializability.</li></ul>"],
"Databases|ER model, indexing & B+ trees":["<h4>Core facts</h4><ul><li>Many-to-many → separate table; 1:N → FK on the N side. Weak entity key = owner key + partial key.</li><li>B+ tree: order p ⇒ internal node ≤ p pointers, ≤ p−1 keys; leaf has data pointers + next-leaf link. Height ≈ log_(fan-out)(records). Block count = ⌈records / blocking factor⌉; blocking factor = ⌊block size / record size⌋.</li></ul><h4>Twists</h4><ul><li>Max keys per node from block size: solve p·P + (p−1)·K ≤ B. Sparse vs dense index counts differ by key vs block.</li></ul>"],
"Operating Systems|Memory management & virtual memory":["<h4>Core facts</h4><ul><li>Pages = 2^(VA bits − offset bits). Page table size = #pages × entry size; multilevel tables: each level must fit one page.</li><li>EMAT = h(t+m) + (1−h)(t+2m) with TLB t, memory m; with page faults add p·(fault service time).</li><li>FIFO shows Belady's anomaly; LRU and Optimal do not (stack algorithms). Thrashing = too many processes, low CPU utilisation.</li></ul><h4>Twists</h4><ul><li>'Page table entries each 4 bytes, page size X, how many levels' — repeat: bits per level = log₂(page size / entry size).</li><li>Count page faults carefully when frames are initially empty (compulsory misses count).</li></ul>"],
"Operating Systems|Files, disk, I/O, system calls":["<h4>Core facts</h4><ul><li>fork() returns 0 to the child, child pid to parent; n successive forks ⇒ 2ⁿ processes (2ⁿ−1 children). Draw the process tree.</li><li>Disk access = seek + rotational (½ rotation avg) + transfer. Inode: direct + single/double/triple indirect → max file size = (direct + P + P² + P³)·block, P = block/ptr size.</li><li>Threads share code/data/heap/files, not stack/registers. Kernel-level threads: blocking one doesn't block the process.</li></ul><h4>Twists</h4><ul><li>fork inside loops/conditions with printf buffering — output may duplicate. SSTF/SCAN/C-SCAN head movement totals: list the order explicitly.</li></ul>"],
"Operating Systems|Scheduling & deadlock":["<h4>Core facts</h4><ul><li>TAT = CT−AT; WT = TAT−BT. SJF/SRTF minimise average waiting time; RR with large quantum → FCFS. Priority scheduling can starve (fix: aging).</li><li>Deadlock needs all four: mutual exclusion, hold-and-wait, no preemption, circular wait. n processes each needing max m, R resources: deadlock-free if R ≥ n(m−1)+1.</li><li>Banker's: safe state ⇔ some completion order exists using Need = Max − Allocation.</li></ul><h4>Twists</h4><ul><li>Gantt charts with arrival gaps (CPU idle) and ties — break ties by lower process id unless stated. Cycle in RAG ⇒ deadlock only if single-instance resources.</li></ul>"],
"Operating Systems|Process synchronization":["<h4>Core facts</h4><ul><li>Semaphore: wait(S): S−−, block if &lt;0; signal(S): S++, wake one. Binary semaphore ≈ mutex. Critical-section needs: mutual exclusion, progress, bounded waiting.</li><li>Peterson's works for 2 processes (flag[], turn). Test-and-Set/Compare-and-Swap give mutual exclusion but may violate bounded waiting.</li></ul><h4>Twists</h4><ul><li>Questions ask the <i>possible outputs/final value</i> of interleaved threads — enumerate which semaphore orderings are forced. Wrong order of wait() calls ⇒ deadlock; swapped signal/wait ⇒ no mutual exclusion.</li></ul>"],
"Computer Networks|IP, subnetting & routing":["<h4>Core facts</h4><ul><li>CIDR a.b.c.d/n: hosts = 2^(32−n) − 2. Subnet mask 255.255.255.192 = /26. Network address = IP AND mask; broadcast = host bits all 1. Routing picks the <b>longest prefix match</b>.</li><li>Distance-vector: Bellman-Ford, count-to-infinity, fixed by split horizon/poison reverse. Link-state: Dijkstra with full topology (OSPF). BGP is path-vector.</li><li>Fragmentation: offset in units of 8 bytes; each fragment's data is a multiple of 8 except the last.</li></ul><h4>Twists</h4><ul><li>Variable-length subnetting (VLSM): allocate largest subnets first. NAT rewrites addresses+ports — ports then become the limit.</li></ul>"],
"Computer Networks|Transport layer (TCP/UDP)":["<h4>Core facts</h4><ul><li>Slow start: cwnd doubles each RTT until ssthresh; then +1 MSS/RTT. On timeout: ssthresh = cwnd/2, cwnd = 1; on 3 dup-ACKs (fast recovery): cwnd = ssthresh.</li><li>Window = min(cwnd, rwnd). Throughput ≈ window/RTT. Sequence numbers count bytes. Three-way handshake SYN, SYN-ACK, ACK; 4-way close.</li></ul><h4>Twists</h4><ul><li>Sequence-number wraparound & maximum data rate for a given lifetime; 'ACK number' = next expected byte, not last received.</li></ul>"],
"Computer Networks|Data link, MAC & error control":["<h4>Core facts</h4><ul><li>Stop-and-wait utilisation = 1/(1+2a), a = Tprop/Ttrans. Sliding window: min(1, N/(1+2a)). GBN needs window ≤ 2ⁿ−1, SR ≤ 2ⁿ⁻¹.</li><li>CSMA/CD min frame = 2·Tprop·bandwidth. Hamming distance d detects d−1 and corrects ⌊(d−1)/2⌋ errors. CRC: divide by generator, append n zeros first.</li></ul><h4>Twists</h4><ul><li>Efficiency with frame size vs propagation delay; link utilisation with pipelined ACK delays — always draw the timeline.</li></ul>"],
"Computer Networks|Application layer & security":["<h4>Core facts</h4><ul><li>DNS iterative vs recursive; HTTP persistent vs non-persistent (RTTs per object); SMTP push, POP3/IMAP pull.</li><li>RSA: n=pq, φ=(p−1)(q−1), e·d ≡ 1 mod φ. Signature = sign with <i>private</i>, verify with public; encryption = public key to encrypt.</li></ul><h4>Twists</h4><ul><li>Order of packets leaving a client (DNS → SYN → GET). Which layer's protocol provides confidentiality vs integrity vs authentication.</li></ul>"],
"Computer Organization|Cache & memory hierarchy":["<h4>Core facts</h4><ul><li>Address = tag | index | offset. Offset = log₂(block); index = log₂(sets); sets = cache size / (block × associativity).</li><li>AMAT = hit time + miss rate × miss penalty. Write-through: no dirty bits; write-back: needs dirty bit. Tag bits = address − index − offset.</li><li>Miss types: compulsory, capacity, conflict.</li></ul><h4>Twists</h4><ul><li>Trace address sequences and count misses (LRU within sets). Direct-mapped vs 2-way: same capacity, different index bits. Multi-level cache AMAT nests.</li></ul>"],
"Computer Organization|Instruction set, addressing & control unit":["<h4>Core facts</h4><ul><li>IEEE-754 single: 1+8+23, bias 127; double 1+11+52, bias 1023; value = (−1)^s × 1.f × 2^(e−bias).</li><li>Addressing modes: immediate, direct, indirect, register, register-indirect, indexed, base-register, relative. Overflow in 2's complement: carry-in to MSB ≠ carry-out.</li><li>Hardwired vs microprogrammed control; horizontal microcode = wide, parallel; vertical = encoded, narrow.</li></ul><h4>Twists</h4><ul><li>Bits needed for instruction fields: opcode count × operand registers × immediate range — total ≤ word size. Interrupt vs DMA cycle-stealing times.</li></ul>"],
"Computer Organization|Pipelining":["<h4>Core facts</h4><ul><li>Time for n instructions in k stages = (k + n − 1) cycles; speedup → k. Hazards: structural, data (RAW,WAR,WAW), control. Forwarding removes most RAW stalls except load-use (1 stall).</li><li>Branch penalty adds to CPI: CPI = 1 + (branch freq × penalty).</li></ul><h4>Twists</h4><ul><li>Cycle time = slowest stage + latch delay. Counting stalls without forwarding when a register is written in the first half and read in the second half of a cycle.</li></ul>"],
"Data Structures|Trees, BST, AVL, heaps":["<h4>Core facts</h4><ul><li>BST with n keys: heights n..⌊log n⌋. Inorder of BST = sorted. Preorder+inorder (or postorder+inorder) uniquely identifies a tree; preorder+postorder does not.</li><li>Heap: build-heap O(n); insert/delete O(log n); n-node heap has ⌈n/2⌉ leaves. AVL: |balance| ≤ 1; min nodes N(h)=N(h−1)+N(h−2)+1.</li><li>Binary tree with n nodes: n−1 edges; leaves = internal(2-child) + 1.</li></ul><h4>Twists</h4><ul><li>Count distinct BSTs = Catalan(n); insertion order sequences that give the same BST. Max-heap: smallest element lies among leaves.</li></ul>"],
"Data Structures|Stacks, queues, linked lists":["<h4>Core facts</h4><ul><li>Stack: LIFO — valid output permutations from input 1..n = Catalan(n). Queue via two stacks; stack via two queues.</li><li>Linked list: insert at head O(1), search O(n); reversing needs 3 pointers; Floyd's cycle detection (slow/fast).</li></ul><h4>Twists</h4><ul><li>Operation sequences with a tail pointer only — deleting the last node is still O(n) in singly linked lists unless circular/doubly.</li></ul>"],
"Data Structures|Hashing":["<h4>Core facts</h4><ul><li>Load factor α = n/m. Linear probing causes primary clustering; quadratic causes secondary clustering. Expected probes: chaining ≈ 1+α.</li><li>Simulate insertions carefully with the given h(k) and probe rule; deleted slots need tombstones.</li></ul><h4>Twists</h4><ul><li>Questions ask which slot is <i>empty/last filled</i> — simulate the table in full.</li></ul>"],
"Programming in C|Pointers, recursion & output tracing":["<h4>Core facts</h4><ul><li>Array name decays to pointer; a[i] ≡ *(a+i); pointer arithmetic scales by sizeof. Operator precedence: ++ and * together are right-to-left (*p++ → *(p++)).</li><li>Static variables keep state across calls; pass by value copies — swap needs pointers. Recursion: write the call tree, evaluate bottom-up. Integer division truncates; unsigned wraps.</li></ul><h4>Twists</h4><ul><li>Evaluation order of function arguments is unspecified; side effects in the same expression are undefined (i = i++ + ++i). Macros expand textually (no brackets ⇒ wrong precedence).</li></ul>"],
"Theory of Computation|Regular languages & finite automata":["<h4>Core facts</h4><ul><li>Regular closed under union, concatenation, star, complement, intersection, difference, reversal, homomorphism. NFA→DFA: up to 2ⁿ states. Minimise by merging indistinguishable states (partition refinement).</li><li>Pumping lemma proves a language is <i>not</i> regular (e.g. aⁿbⁿ). L = {w | #a(w) mod k = r} needs k states.</li></ul><h4>Twists</h4><ul><li>'Minimal DFA for strings whose n-th symbol from the end is 1' needs 2ⁿ states. Finite ⇒ regular, but a subset of a regular language need not be regular.</li></ul>"],
"Theory of Computation|CFLs & pushdown automata":["<h4>Core facts</h4><ul><li>CFLs closed under union, concatenation, star, reversal; NOT under intersection or complement (but CFL ∩ regular is CFL). DPDA ⊊ PDA; DCFLs are closed under complement.</li><li>{aⁿbⁿ}, {wwʳ} are CFL; {aⁿbⁿcⁿ}, {ww} are not. Ambiguity is undecidable. CNF derivation of a length-n string takes 2n−1 steps.</li></ul><h4>Twists</h4><ul><li>Two counters compared ⇒ CFL; three ⇒ not. Language like {aⁱbʲcᵏ | i=j or j=k} is CFL but not DCFL.</li></ul>"],
"Theory of Computation|Decidability & Turing machines":["<h4>Core facts</h4><ul><li>Regular ⊂ DCFL ⊂ CFL ⊂ CSL ⊂ Recursive ⊂ RE. Recursive closed under complement; RE is not. L and L̄ both RE ⇒ L recursive.</li><li>Undecidable: halting, emptiness/equality of TMs, Rice's theorem (any non-trivial property of RE languages). Decidable for CFG: membership, emptiness, finiteness; equality & ambiguity are undecidable.</li></ul><h4>Twists</h4><ul><li>Reduction direction: to show B undecidable reduce a known-undecidable A to B.</li></ul>"],
"Compiler Design|Parsing (LL, LR)":["<h4>Core facts</h4><ul><li>FIRST(α): terminals that can start α; add ε if nullable. FOLLOW(A): terminals after A (add $ for start symbol).</li><li>LL(1): for A→α|β, FIRST sets disjoint & if ε∈FIRST(α) then FIRST(β)∩FOLLOW(A)=∅. Left-recursive or ambiguous ⇒ not LL(1).</li><li>Power: LR(0) ⊂ SLR(1) ⊂ LALR(1) ⊂ CLR(1). LALR merges CLR states with the same core → same number of states as SLR/LR(0) but can add reduce–reduce conflicts (never shift–reduce).</li></ul><h4>Twists</h4><ul><li>Count states/conflict entries: build the canonical item sets carefully; SLR uses FOLLOW, LR(1) uses lookaheads.</li></ul>"],
"Compiler Design|Syntax-directed translation & intermediate code":["<h4>Core facts</h4><ul><li>Synthesised attributes flow up; inherited flow down/sideways. S-attributed: only synthesised; L-attributed: inherited depend on left siblings/parent.</li><li>Three-address code: count temporaries; DAG shares common sub-expressions. Basic block: single entry, single exit (leaders: first instruction, targets, instructions after jumps).</li></ul><h4>Twists</h4><ul><li>Postfix evaluation traces via stack; number of nodes in the DAG vs tree.</li></ul>"],
"Compiler Design|Lexical analysis, optimisation & runtime":["<h4>Core facts</h4><ul><li>Lexer: longest match, then rule priority. Count tokens by scanning greedily (e.g. '&lt;=' is one token).</li><li>Liveness: backward analysis; minimum registers needed = max simultaneously live variables. Optimisations: constant folding, CSE, dead code, strength reduction, loop-invariant motion.</li><li>Call-by-reference vs value vs name: trace aliasing. Static scoping: lexical nesting; dynamic: call chain.</li></ul><h4>Twists</h4><ul><li>Same code printing different values under different scoping/parameter rules — evaluate each rule separately.</li></ul>"],
"Digital Logic|Combinational circuits & K-maps":["<h4>Core facts</h4><ul><li>NAND/NOR are universal. n-input MUX realises any function of n−1 variables when data inputs are variables/constants. Decoder + OR = any SOP. Full adder: sum=a⊕b⊕c, carry=ab+bc+ca.</li><li>K-map groups of 1,2,4,8 (wrap-around); essential prime implicants are mandatory; don't-cares only help.</li></ul><h4>Twists</h4><ul><li>Count minimal literals/gates; static hazards removed by adding redundant consensus terms (so the minimal form is <i>not</i> hazard-free).</li></ul>"],
"Digital Logic|Sequential circuits":["<h4>Core facts</h4><ul><li>D: Q⁺=D; T: Q⁺=Q⊕T; JK: Q⁺=JQ̄+K̄Q. Ripple counter modulus = count of states; n flip-flops count up to 2ⁿ. Ring counter n states; Johnson 2n.</li><li>Max clock frequency = 1/(tclk→Q + logic + tsetup).</li></ul><h4>Twists</h4><ul><li>Find the sequence from an excitation table; JK with J=K=1 toggles; counters with asynchronous reset at state N have mod N (state N is transient).</li></ul>"],
"Digital Logic|Number systems & arithmetic":["<h4>Core facts</h4><ul><li>n-bit 2's complement range −2ⁿ⁻¹…2ⁿ⁻¹−1; negation = invert + 1; sign-magnitude has two zeros; 1's complement also two zeros.</li><li>Excess-k, Gray (adjacent differ in 1 bit), BCD needs correction +6 when sum &gt; 9.</li></ul><h4>Twists</h4><ul><li>Sign extension when widening; the same bit pattern read in different representations.</li></ul>"],
"Algorithms|Complexity & recurrences":["<h4>Core facts</h4><ul><li>Master theorem T(n)=aT(n/b)+f(n): compare f(n) with n^(log_b a). Compare growth: log n &lt; n^ε &lt; n log n &lt; n² &lt; 2ⁿ &lt; n! &lt; nⁿ.</li><li>Loop analysis: nested loops with i doubling ⇒ log n; with i += i/… ⇒ harmonic sums give n log n.</li></ul><h4>Twists</h4><ul><li>Recurrences not fitting the theorem (T(n)=T(n−1)+n, T(√n)+1 ⇒ log log n). Amortised cost of dynamic arrays is O(1).</li></ul>"],
"Algorithms|Greedy & graph algorithms":["<h4>Core facts</h4><ul><li>Dijkstra: no negative edges; O(E log V) with heap. Bellman-Ford handles negatives, detects negative cycles. Kruskal/Prim give an MST; if edge weights are distinct the MST is unique.</li><li>DFS: classify edges (tree/back/forward/cross); BFS gives unweighted shortest paths; DFS finish times give topological order.</li></ul><h4>Twists</h4><ul><li>MST stays the same under monotone weight transformations; the shortest path may change when constants are added to all edges.</li></ul>"],
"Algorithms|Sorting & searching":["<h4>Core facts</h4><ul><li>Merge sort Θ(n log n) always; quicksort worst Θ(n²) (sorted input with first/last pivot); heap sort Θ(n log n) in-place; insertion sort Θ(n) best. Comparison lower bound Ω(n log n).</li><li>Stable: merge, insertion, bubble; unstable: quick, heap, selection.</li></ul><h4>Twists</h4><ul><li>Number of comparisons to find min and max together: ⌈3n/2⌉−2.</li></ul>"],
"Algorithms|Dynamic programming":["<h4>Core facts</h4><ul><li>LCS O(mn); 0/1 knapsack O(nW); matrix chain O(n³). Define the state, the recurrence and the base cases.</li></ul><h4>Twists</h4><ul><li>Fill the table by hand for tiny inputs; greedy fails for 0/1 knapsack but works for fractional.</li></ul>"],
"Algorithms|NP-completeness":["<h4>Core facts</h4><ul><li>P ⊆ NP; NP-complete = in NP + NP-hard. If any NP-complete problem is in P then P=NP. Standard chain: SAT → 3-SAT → Clique/Vertex Cover/Independent Set → Hamiltonian cycle.</li></ul><h4>Twists</h4><ul><li>2-SAT, Eulerian circuit, MST and shortest path are in P — graders love mixing them with hard problems.</li></ul>"],
"General Aptitude|Verbal, numerical & spatial reasoning":["<h4>Plan</h4><ul><li>10 questions = 15 marks and the easiest marks in the paper. Aim for 12+. Practise 20 minutes of verbal (grammar, analogies, critical reasoning) + numerical (time-work, ratios, percentages, data interpretation, Venn, number series, paper folding/cube) daily.</li></ul>"]
};
Object.assign(N,{
"General Aptitude|Quantitative aptitude":[`<p><b>How to use this:</b> GA is 15 marks and the most reliable score in the paper. Quant questions are only a handful of formulas plus careful reading. Learn the formulas below, then do 5 questions a day.</p>
<h4>1. Percentages (the master skill)</h4><ul><li>x% of y = y% of x (swap to make the sum easy: 8% of 50 = 50% of 8 = 4).</li><li>Increase by a% then decrease by a% → net change = −a²/100 %. (Up 20%, down 20% → −4%, <i>not</i> 0.)</li><li>Successive changes a% and b%: net = a + b + ab/100 %.</li><li>If A is x% more than B, then B is x/(100+x) × 100 % less than A. (A is 25% more than B → B is 20% less than A.)</li></ul>
<h4>2. Ratio, proportion, averages</h4><ul><li>Split N in ratio a:b → parts N·a/(a+b) and N·b/(a+b). Change one ratio term by a known number, then solve for the unit value k.</li><li>Average = sum/count. Adding a person with value v changes the average by (v − old average)/(new count). Weighted average: Σ(count×average)/Σcount.</li><li>Average speed over equal <i>distances</i> = 2ab/(a+b) (harmonic), over equal <i>times</i> = (a+b)/2.</li></ul>
<h4>3. Time–speed–distance</h4><ul><li>d = s·t. km/h → m/s: multiply by 5/18. Relative speed: opposite directions add, same direction subtract.</li><li>Train crossing a pole = length/speed; crossing a platform = (train + platform)/speed. Boats: downstream = b + c, upstream = b − c; b = (d+u)/2, c = (d−u)/2.</li><li>Two people meeting/catching up: use <i>relative</i> speed and the gap — the question is usually a one-line division.</li></ul>
<h4>4. Time & work</h4><ul><li>Rate = 1/time. Together: 1/T = 1/a + 1/b. Pipes: inlet +, outlet −. Work = rate × time; "m men d days" → man-days is constant (M₁D₁ = M₂D₂).</li></ul>
<h4>5. Profit, loss, interest, mixtures</h4><ul><li>Profit% = (SP − CP)/CP × 100 (always on cost unless said otherwise). Discount is on marked price. SP = CP·(1 + p/100).</li><li>Simple interest = PRT/100. Compound amount = P(1 + r/100)ⁿ. CI − SI for 2 years = P(r/100)².</li><li>Mixtures: <b>alligation</b> — cheaper : dearer = (dearer − mean) : (mean − cheaper).</li></ul>
<h4>6. Numbers, series, counting</h4><ul><li>Remainders: write the number as a multiple + remainder and add/multiply the remainders. Last digit repeats in cycles (2: 2,4,8,6; 3: 3,9,7,1).</li><li>AP: nth term a + (n−1)d, sum n/2·(2a + (n−1)d). GP sum a(rⁿ−1)/(r−1). Series puzzles: check differences, ratios, squares/cubes, then alternating patterns.</li><li>Knockout with n players → n−1 matches (every match eliminates exactly one). Handshakes among n people = n(n−1)/2.</li></ul>
<h4>How GATE makes it hard</h4><ul><li><b>Wording tricks:</b> "more than" vs "times as many", "per cent of" vs "per cent more than", "at least" vs "exactly". Underline the quantity you are asked for before computing.</li><li><b>Hidden equal-ness:</b> many 2-mark questions collapse to one unknown — set x = the smallest unit and write everything in x.</li><li><b>Option elimination:</b> check units and rough size (a ratio can't exceed 1, a speed can't be negative) before doing the full sum.</li><li><b>Time budget:</b> 1.5 min per 1-mark GA question, 2.5 min per 2-mark. Skip and return if stuck.</li></ul>`],
"General Aptitude|Verbal ability":[`<p><b>Goal:</b> 2–3 marks every year. Verbal rewards patience with grammar rules, not a huge vocabulary.</p>
<h4>1. Grammar rules that GATE actually tests</h4><ul><li><b>Subject–verb agreement:</b> the verb agrees with the <i>real</i> subject, not the noun nearest to it. "The list of items <u>is</u> long." "Neither the manager nor the employees <u>were</u> present" (verb agrees with the nearer subject for neither–nor/either–or).</li><li><b>Tense consistency:</b> a past event in a sentence keeps the other verbs in the past. "Had + past participle" shows the earlier of two past actions.</li><li><b>Articles:</b> a/an by <i>sound</i> (an hour, a university). "The" for a specific/known thing.</li><li><b>Prepositions:</b> fixed pairs — different <i>from</i>, prefer X <i>to</i> Y, capable <i>of</i>, interested <i>in</i>, comprise (never "comprise of").</li><li><b>Pronouns:</b> each/every/either/neither take singular verbs; "who/whom" — whom is the object (to whom, whom did you see).</li><li><b>Parallel structure:</b> "She likes <i>reading, writing and to swim</i>" is wrong → "reading, writing and swimming".</li><li><b>Modifiers:</b> a phrase at the start must describe the subject that follows. "Walking down the road, the trees looked tall" is wrong (trees don't walk).</li></ul>
<h4>2. Vocabulary: antonym, synonym, idioms</h4><ul><li>Read the word in context first; guess if the word is positive or negative, then eliminate options with the wrong "charge".</li><li>Break unknown words into prefix/root/suffix: <i>anti-</i> against, <i>mal-</i> bad, <i>bene-</i> good, <i>-phobia</i> fear, <i>un/in/im/dis</i> not.</li><li>For "antonym" questions the options often include a <i>synonym</i> as a trap — re-read the question after choosing.</li><li>Idioms: guess from the literal image, then check the sentence meaning ("a blessing in disguise" = apparent misfortune that turns out good).</li></ul>
<h4>3. Sentence completion & para-jumbles</h4><ul><li>Look for signal words: <b>but, however, although, despite</b> → contrast (the blank is the opposite of the clue); <b>and, moreover, hence</b> → same direction.</li><li>Para-jumble: find the <b>opening sentence</b> (introduces the topic, no "this/these/he"), then link pronouns to their nouns and look for time order or cause→effect.</li></ul>
<h4>4. Reading comprehension & critical reasoning</h4><ul><li>Answer only from the passage. Wrong options are usually: too extreme (<i>always, never, only</i>), outside the passage, or reversed.</li><li><b>Inference:</b> what <i>must</i> be true. <b>Strengthen/weaken:</b> look at the gap between evidence and conclusion; a weakener attacks that gap.</li><li>Statements like "All A are B" never prove "All B are A" — a very common trap.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>All four options look grammatical — decide by the <i>one</i> rule being tested (agreement, tense, preposition).</li><li>Long, formal sentences hide the subject; strike out the phrases between commas and read the skeleton "subject + verb + object".</li></ul>`],
"General Aptitude|Logical reasoning & data interpretation":[`<p><b>Goal:</b> 3 marks. The key habit: <b>draw it</b> — table, line, Venn diagram or tree — before thinking in your head.</p>
<h4>1. Seating / arrangement / scheduling puzzles</h4><ul><li>Draw the shape (row, circle, days of week) with empty slots. Place the <b>fixed</b> clues first (A is at the end), then the relative clues (B is to the left of C).</li><li>Count cases only when the clues leave a choice; otherwise one valid arrangement is enough. Circle: with a fixed first person, others can be arranged in (n−1)! ways.</li></ul>
<h4>2. Syllogisms & statements (Venn method)</h4><ul><li>Draw circles for each term. "All A are B" → A fully inside B. "Some A are B" → circles overlap. "No A is B" → separate circles.</li><li>A conclusion is valid only if it is true in <b>every</b> possible drawing. Test by drawing the <i>most unfriendly</i> picture.</li><li>"If P then Q" ⇔ "if not Q then not P" (contrapositive). It does <b>not</b> give "if Q then P".</li></ul>
<h4>3. Truth-tellers, liars, who-said-what</h4><ul><li>Assume one person is lying, check all statements for a contradiction; at most one assumption will survive. Exactly-one-true puzzles: test each statement as "the true one".</li></ul>
<h4>4. Blood relations, directions, series</h4><ul><li>Blood relations: write a mini family tree with +/− for gender. Directions: keep a coordinate grid; displacement = √(x² + y²).</li><li>Number/letter series: look at differences, then differences of differences, then alternate terms.</li></ul>
<h4>5. Data interpretation</h4><ul><li>Read the title, the units (thousands? percent?) and the axis labels first — most mistakes come from units.</li><li>Percentage change = (new − old)/old × 100. Percentage <i>points</i> are not percentages. Ratio comparisons: cross-multiply instead of dividing.</li><li>Round smartly: use 3 significant figures; only calculate precisely when the options are close.</li><li>Venn with 3 sets: |A∪B∪C| = ΣA − Σ(pairs) + |A∩B∩C|.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Extra irrelevant data in the chart; options that differ only in one row or year; "at least" versus "exactly" in sets; clues given in an unhelpful order (use the strongest clue first).</li></ul>`],
"General Aptitude|Spatial & geometry":[`<p><b>Goal:</b> 2–3 marks. These look scary but follow a few rules. Always <b>sketch</b> and label.</p>
<h4>1. Cubes</h4><ul><li>An n×n×n cube painted outside and cut into unit cubes: 3 faces painted = 8 (corners); 2 faces = 12(n−2); 1 face = 6(n−2)²; 0 faces = (n−2)³.</li><li>Removing one corner cube from a cube keeps the number of exposed faces the same (3 removed, 3 revealed).</li><li>Standard dice: opposite faces sum to 7. Two adjacent faces never share the same number.</li></ul>
<h4>2. Paper folding & cutting</h4><ul><li>Work <b>backwards</b>: unfold step by step, mirroring each hole/cut across each fold line. One fold doubles the cut shapes, two folds quadruple them.</li></ul>
<h4>3. Mirror & water images, rotation</h4><ul><li>Mirror (left–right swap) flips horizontally; water image flips vertically. Rotation keeps relative positions; reflection reverses them. Test using one asymmetric feature.</li></ul>
<h4>4. Patterns, tiles, counting figures</h4><ul><li>Count by size: all 1×1, then 2×2, etc. Squares in an n×n grid = Σk² = n(n+1)(2n+1)/6. Rectangles = [n(n+1)/2]².</li><li>Tiling: area of the space ÷ area of one tile gives the upper bound; then check shape fit.</li></ul>
<h4>5. Mensuration formulas</h4><table><tr><th>Shape</th><th>Area / Surface</th><th>Volume</th></tr><tr><td>Circle</td><td>πr², circumference 2πr</td><td>—</td></tr><tr><td>Triangle</td><td>½·b·h; equilateral (√3/4)a²</td><td>—</td></tr><tr><td>Cylinder</td><td>curved 2πrh, total 2πr(r+h)</td><td>πr²h</td></tr><tr><td>Cone</td><td>curved πrl, l = √(r²+h²)</td><td>⅓πr²h</td></tr><tr><td>Sphere</td><td>4πr²</td><td>(4/3)πr³</td></tr><tr><td>Cube / cuboid</td><td>6a² / 2(lb+bh+hl)</td><td>a³ / lbh</td></tr></table><ul><li>Similar figures: lengths scale by k, areas by k², volumes by k³. Diagonal of a square = a√2; of a cube = a√3. Pythagoras triples: 3-4-5, 5-12-13, 8-15-17.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>A shape described only in words (so you must draw it); scaling a figure and asking about area/volume change; asking for "minimum cuts/turns" which needs a clean sketch.</li></ul>`],
"Discrete Mathematics|Graph theory":[`<p><b>Why it matters:</b> graph theory is the single biggest topic in the paper (about 5–6 marks a year). Most questions use about 12 facts and one drawing.</p>
<h4>1. Basics in simple words</h4><ul><li>A graph = dots (vertices V) joined by lines (edges E). <b>Simple</b> = no self-loops, no parallel edges. <b>Degree</b> of a vertex = number of edges touching it (a loop counts 2).</li><li><b>Handshake lemma:</b> sum of all degrees = 2E. So the number of odd-degree vertices is always <b>even</b>. For a directed graph, Σ in-degree = Σ out-degree = E.</li><li>Complete graph Kₙ: every pair joined → n(n−1)/2 edges, every degree n−1. Complete bipartite K<sub>m,n</sub>: mn edges. Cycle Cₙ: n edges. Path Pₙ: n−1 edges.</li><li><b>Sequence test:</b> a list of degrees is graphical only if the sum is even and no degree exceeds n−1 (then use Havel–Hakimi: remove the largest d, subtract 1 from the next d largest, repeat).</li></ul>
<h4>2. Connectivity & trees</h4><ul><li>Connected = a path exists between every pair. A graph with c components needs at least n − c edges; with E &lt; n − 1 edges it can never be connected.</li><li>A <b>tree</b> is connected with no cycle. Any one of these implies the rest: E = n − 1 and connected; E = n − 1 and acyclic; exactly one path between every pair. A tree with n ≥ 2 has at least 2 leaves.</li><li>Number of labelled trees on n vertices = n^(n−2) (Cayley). Spanning tree has n − 1 edges; a graph has a spanning tree iff it is connected.</li><li><b>Cut vertex / bridge:</b> removing it disconnects the graph. Every edge of a tree is a bridge.</li></ul>
<h4>3. Euler and Hamilton</h4><table><tr><th></th><th>Euler (every <i>edge</i> once)</th><th>Hamilton (every <i>vertex</i> once)</th></tr><tr><td>Circuit</td><td>connected and all degrees even</td><td>no simple test (hard); Dirac: deg ≥ n/2 for all ⇒ yes</td></tr><tr><td>Path</td><td>connected and exactly 0 or 2 odd vertices</td><td>—</td></tr></table><ul><li>Memory trick: Euler = easy (count degrees); Hamilton = hard (NP-complete) so questions give small graphs or use Dirac.</li></ul>
<h4>4. Planarity (drawing without crossing)</h4><ul><li>Euler's formula: V − E + F = 2 (connected planar graph, F counts the outer face).</li><li>Simple planar graph: E ≤ 3V − 6. If it also has no triangles (or is bipartite): E ≤ 2V − 4. A planar graph always has a vertex of degree ≤ 5.</li><li>K₅ and K₃,₃ are non-planar; a graph is planar iff it has no subdivision of K₅ or K₃,₃ (Kuratowski). Dual graph: F of G = V of the dual.</li></ul>
<h4>5. Colouring, matching, independent sets</h4><ul><li>Chromatic number χ = fewest colours so adjacent vertices differ. Facts: χ(Kₙ) = n; χ(tree) = 2; χ(even cycle) = 2, χ(odd cycle) = 3; bipartite ⇔ χ ≤ 2 ⇔ no odd cycle. χ ≥ size of largest clique; χ ≤ Δ + 1; every planar graph ≤ 4 (four-colour theorem).</li><li>Matching = edges with no common vertex. Perfect matching covers all vertices (needs even n). Hall's condition for bipartite: every subset S of one side has |N(S)| ≥ |S|.</li><li>Independent set = no two adjacent; vertex cover = every edge touched. Max independent set + min vertex cover = n.</li></ul>
<h4>6. Worked examples</h4><ul><li><b>Q:</b> Minimum edges of a simple graph on 10 vertices that <i>guarantees</i> connectivity? <b>A:</b> worst case is K₉ plus an isolated vertex = 36 edges, so 37.</li><li><b>Q:</b> Can a simple graph have degrees 4,4,3,3,2,2? <b>A:</b> sum 18 is even; Havel–Hakimi: remove 4 → (3,2,2,1,2) → sort (3,2,2,2,1) → remove 3 → (1,1,1,1) → yes.</li><li><b>Q:</b> Planar graph, 8 vertices, every face has ≥ 4 sides — max edges? <b>A:</b> 2V − 4 = 12.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>"Number of graphs" — check whether vertices are <b>labelled</b> (2^(n(n−1)/2) simple graphs) or unlabelled (isomorphism classes).</li><li>Asking for "maximum degree" or "minimum edges" when the extremal case is a clique plus isolated vertices (not a nice-looking graph).</li><li>Mixing in algorithm language (BFS/DFS trees, spanning tree count) — recognise it is still graph facts: tree edges = V − 1.</li><li>Statements with "always/never": find one counter-example drawing with 4–5 vertices before trusting a rule.</li></ul>`]

"Discrete Mathematics|Combinatorics & probability":[`<p><b>Weight:</b> about 4 marks a year, plus probability reappears in other subjects. Everything here rests on two questions: <i>does order matter?</i> and <i>can things repeat?</i></p>
<h4>1. Counting basics</h4><ul><li><b>Sum rule:</b> if a task can be done in m ways <i>or</i> n ways (not both), total = m + n. <b>Product rule:</b> if it needs a step with m ways <i>and then</i> a step with n ways, total = m × n.</li><li><b>Permutation</b> (order matters, no repeats): P(n,r) = n!/(n−r)!. <b>Combination</b> (order doesn't matter): C(n,r) = n!/(r!(n−r)!). Remember C(n,r) = C(n,n−r) and C(n,r) = C(n−1,r−1) + C(n−1,r) (Pascal).</li><li>Arranging n objects where some are identical: n!/(a! b! c!…). Example: letters of MISSISSIPPI = 11!/(4!4!2!).</li><li>Circular arrangements of n people: (n−1)!; if clockwise and anticlockwise count as the same: (n−1)!/2.</li><li>Words with repetition allowed: nʳ (r positions, n choices each).</li></ul>
<h4>2. Distribution problems (stars and bars)</h4><ul><li>Number of solutions of x₁ + … + x<sub>k</sub> = n with xᵢ ≥ 0: C(n+k−1, k−1). With every xᵢ ≥ 1: C(n−1, k−1). With xᵢ ≥ lᵢ: subtract the minimums from n first.</li><li>Distinct objects into distinct boxes: kⁿ ways. Identical objects into distinct boxes: stars and bars.</li></ul>
<h4>3. Inclusion–exclusion, derangements, pigeonhole</h4><ul><li>|A∪B| = |A| + |B| − |A∩B|; for three sets: ΣA − Σ(pairs) + |A∩B∩C|. Use it for "at least one", "none of", "divisible by 2 or 3" counts.</li><li><b>Derangement</b> = permutation with no fixed point: D(n) = n!(1 − 1/1! + 1/2! − … ). Values: D(1)=0, D(2)=1, D(3)=2, D(4)=9, D(5)=44. Probability a random permutation is a derangement → 1/e ≈ 0.368.</li><li><b>Pigeonhole:</b> n+1 objects in n boxes ⇒ some box has ≥ 2. General: ⌈m/n⌉ in some box. To <i>guarantee</i> something, always think of the worst case.</li><li>Binomial theorem: (x+y)ⁿ = Σ C(n,k) xᵏ yⁿ⁻ᵏ. Σ C(n,k) = 2ⁿ. Catalan number Cₙ = C(2n,n)/(n+1) counts balanced brackets, binary trees with n nodes, stack permutations.</li></ul>
<h4>4. Recurrence relations</h4><ul><li><b>Setting one up:</b> look at the last step. Bit strings of length n with no two consecutive 0s: end in 1 → aₙ₋₁; end in 10 → aₙ₋₂, so aₙ = aₙ₋₁ + aₙ₋₂ (Fibonacci).</li><li><b>Solving aₙ = c₁aₙ₋₁ + c₂aₙ₋₂:</b> write r² = c₁r + c₂. Distinct roots r₁, r₂: aₙ = A r₁ⁿ + B r₂ⁿ. Repeated root r: aₙ = (A + Bn) rⁿ. Find A, B from initial values.</li><li>Easy ones to remember: aₙ = aₙ₋₁ + d is an AP; aₙ = r·aₙ₋₁ is a GP; Tower of Hanoi T(n) = 2T(n−1) + 1 ⇒ 2ⁿ − 1.</li></ul>
<h4>5. Probability from scratch</h4><ul><li><b>Probability</b> = favourable outcomes / total outcomes <i>when all outcomes are equally likely</i>. P(not A) = 1 − P(A). P(A∪B) = P(A) + P(B) − P(A∩B).</li><li><b>Conditional:</b> P(A|B) = P(A∩B)/P(B) — "shrink the sample space to B". <b>Independent</b> events: P(A∩B) = P(A)P(B). Mutually exclusive ≠ independent.</li><li><b>Total probability & Bayes:</b> if B₁…Bₖ partition the space, P(A) = ΣP(A|Bᵢ)P(Bᵢ), and P(Bᵢ|A) = P(A|Bᵢ)P(Bᵢ)/P(A). Use a tree diagram: multiply along branches, add across branches.</li></ul>
<h4>6. Random variables, expectation, distributions</h4><ul><li>E[X] = Σ x·P(x). <b>Linearity:</b> E[X+Y] = E[X]+E[Y] always (even if dependent). Var(X) = E[X²] − (E[X])²; Var(aX+b) = a²Var(X).</li><li><b>Indicator trick</b> for "expected number of …": let Xᵢ = 1 if the i-th thing happens, then E = Σ P(i-th thing happens). Example: expected fixed points of a random permutation = n × 1/n = 1.</li></ul><table><tr><th>Distribution</th><th>Use</th><th>Mean</th><th>Variance</th></tr><tr><td>Bernoulli(p)</td><td>one trial</td><td>p</td><td>pq</td></tr><tr><td>Binomial(n,p)</td><td>successes in n trials; P(k) = C(n,k)pᵏqⁿ⁻ᵏ</td><td>np</td><td>npq</td></tr><tr><td>Geometric(p)</td><td>trials until first success</td><td>1/p</td><td>q/p²</td></tr><tr><td>Poisson(λ)</td><td>rare events</td><td>λ</td><td>λ</td></tr><tr><td>Uniform[a,b]</td><td>equally likely on interval</td><td>(a+b)/2</td><td>(b−a)²/12</td></tr><tr><td>Exponential(λ)</td><td>waiting time</td><td>1/λ</td><td>1/λ²</td></tr><tr><td>Normal(μ,σ²)</td><td>bell curve; ≈68% within 1σ, 95% within 2σ</td><td>μ</td><td>σ²</td></tr></table>
<h4>7. Worked examples</h4><ul><li><b>Two fair dice, given at least one 6, P(sum 10)?</b> Sample space 11 outcomes; favourable (4,6),(6,4) ⇒ 2/11.</li><li><b>Expected tosses until the first head:</b> geometric, p = ½ ⇒ 2. Expected tosses until HH is 6; until HT is 4 (derive with states: "nothing yet / just got H").</li><li><b>Coupon collector:</b> n different coupons ⇒ expected draws n(1 + ½ + … + 1/n).</li></ul>
<h4>How GATE makes it hard</h4><ul><li>"At least one" → compute 1 − P(none). "Given that…" → conditional, not simple ratio (the 1/2 trap in two-child problems).</li><li>Distinguishable vs identical objects, and boxes with or without limits: first decide what is being counted before using any formula.</li><li>Dependent events that still have linear expectation: use indicators instead of the joint distribution.</li><li>Recurrences given in disguised form (T(n) = 2T(n/2) + n) — that is an algorithm question; the characteristic-equation method is only for constant-coefficient linear ones.</li></ul>`],
"Discrete Mathematics|Linear algebra & calculus":[`<p><b>Weight:</b> about 3 marks a year (matrices/eigenvalues, systems of equations, limits, maxima/minima, numerical methods). Questions are short; the marks go to people who know the properties well.</p>
<h4>1. Matrices — the vocabulary</h4><ul><li>A matrix is a table of numbers. (AB)ᵢⱼ = row i of A · column j of B, so A (m×n) times B (n×p) gives m×p; AB ≠ BA in general. (AB)ᵀ = BᵀAᵀ; (AB)⁻¹ = B⁻¹A⁻¹.</li><li><b>Special matrices:</b> symmetric (A = Aᵀ), skew-symmetric (A = −Aᵀ, diagonal zero), orthogonal (AᵀA = I), idempotent (A² = A), nilpotent (Aᵏ = 0).</li></ul>
<h4>2. Determinant</h4><ul><li>For 2×2 [a b; c d]: ad − bc. Swapping two rows changes the sign; a row of zeros or two equal rows ⇒ 0; multiplying one row by k multiplies det by k; so det(kA) = kⁿ det(A) for n×n. det(AB) = det(A)det(B); det(Aᵀ) = det(A); det(A⁻¹) = 1/det(A).</li><li>Triangular matrix: determinant = product of diagonal entries. Row operation "add a multiple of one row to another" does <i>not</i> change the determinant — use it to simplify.</li><li><b>Singular</b> (det = 0) ⇔ no inverse ⇔ rows dependent ⇔ 0 is an eigenvalue.</li></ul>
<h4>3. Rank and systems of equations</h4><ul><li>Rank = number of non-zero rows after row reduction = number of independent rows (= independent columns). rank(A) ≤ min(m,n); rank(AB) ≤ min(rank A, rank B). <b>Rank–nullity:</b> rank + nullity = number of columns.</li><li>For Ax = b with n unknowns: <b>no solution</b> if rank(A) &lt; rank([A|b]); <b>unique</b> if rank(A) = rank([A|b]) = n; <b>infinitely many</b> if rank(A) = rank([A|b]) &lt; n (n − rank free variables). Homogeneous Ax = 0 is always consistent; non-trivial solutions exist iff rank &lt; n (i.e. det = 0 for square A).</li><li>Rule for parametric questions ("for which k…"): reduce to echelon form and see when a row becomes [0 0 0 | non-zero] (no solution) or [0 0 0 | 0] (infinitely many).</li></ul>
<h4>4. Eigenvalues and eigenvectors</h4><ul><li>Idea: Av = λv — the matrix only stretches v by λ. Find λ from det(A − λI) = 0 (characteristic equation), then solve (A − λI)v = 0.</li><li><b>Properties to memorise:</b> sum of eigenvalues = trace; product = determinant; triangular matrix ⇒ eigenvalues are the diagonal entries; Aᵏ has λᵏ; A⁻¹ has 1/λ; A + cI has λ + c; A and Aᵀ have the same eigenvalues; symmetric matrix ⇒ real eigenvalues and orthogonal eigenvectors; eigenvectors of distinct eigenvalues are independent.</li><li><b>Cayley–Hamilton:</b> A satisfies its own characteristic equation — use it to find A⁻¹ or high powers of A. 2×2 shortcut: λ² − (trace)λ + det = 0.</li><li>Rank-1 matrix (all rows multiples of one) has one non-zero eigenvalue equal to its trace.</li></ul>
<h4>5. LU decomposition and vectors</h4><ul><li>A = LU (L lower triangular, U upper triangular) by Gaussian elimination without row swaps; solve Ly = b then Ux = y. Vectors are independent if the only combination giving 0 is the trivial one; a basis is a maximal independent set; dimension = size of a basis.</li></ul>
<h4>6. Calculus essentials</h4><ul><li><b>Limits:</b> sin x / x → 1, (1 − cos x)/x² → ½, (1 + 1/x)ˣ → e as x → ∞, (eˣ − 1)/x → 1. For 0/0 or ∞/∞ apply L'Hôpital (differentiate top and bottom). Standard order of growth as x → ∞: ln x ≪ xᵏ ≪ eˣ.</li><li><b>Continuity & differentiability:</b> differentiable ⇒ continuous, not conversely (|x| at 0). A function is continuous at a if limit from left = limit from right = f(a).</li><li><b>Rolle:</b> if f continuous on [a,b], differentiable inside and f(a) = f(b), some c has f′(c) = 0. <b>Mean value theorem:</b> some c has f′(c) = (f(b) − f(a))/(b − a).</li><li><b>Maxima/minima:</b> solve f′(x) = 0; f″ &lt; 0 ⇒ local max, f″ &gt; 0 ⇒ local min; check endpoints for a closed interval.</li><li><b>Integrals:</b> ∫₋ₐᵃ f = 0 if f is odd, = 2∫₀ᵃ f if even. ∫ₐᵇ f(x)dx = ∫ₐᵇ f(a+b−x)dx (a favourite trick). Taylor: eˣ = 1 + x + x²/2! + …, sin x = x − x³/3! + …</li></ul>
<h4>7. Numerical methods</h4><ul><li><b>Bisection:</b> repeatedly halve [a,b] where f changes sign; after n steps the interval is (b−a)/2ⁿ. <b>Newton–Raphson:</b> xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ); converges fast near a simple root (quadratic) but fails if f′ ≈ 0. Square root of a: iterate xₙ₊₁ = ½(xₙ + a/xₙ).</li><li><b>Trapezoidal rule:</b> ∫ ≈ h/2 [f₀ + 2(f₁+…+fₙ₋₁) + fₙ]; Simpson's 1/3: h/3 [f₀ + 4(odd) + 2(even) + fₙ] with an even number of intervals.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Giving only trace and determinant of a 2×2 matrix and asking for eigenvalues of a polynomial in it (use λ² − tλ + d = 0, then substitute).</li><li>Matrices with a parameter k where the rank/consistency changes at special values; statements about AB vs BA, or "rank(A+B)" (which can be anything below rank A + rank B).</li><li>Counting roots of an equation (e.g. eˣ + 0.5x² − 2 = 0) — sketch f and use sign changes plus monotonicity.</li></ul>`],
"Discrete Mathematics|Logic, sets, relations & algebra":[`<p><b>Weight:</b> about 2–3 marks a year. These are definition-heavy questions: if you know the definitions precisely, the answers come fast.</p>
<h4>1. Propositional logic</h4><ul><li>A <b>proposition</b> is a statement that is true or false. Connectives: ¬ (not), ∧ (and), ∨ (or), → (if…then), ↔ (if and only if). p → q is false <i>only</i> when p is true and q is false.</li><li><b>Key equivalences:</b> p → q ≡ ¬p ∨ q ≡ ¬q → ¬p (contrapositive). ¬(p∧q) ≡ ¬p ∨ ¬q and ¬(p∨q) ≡ ¬p ∧ ¬q (De Morgan). p ↔ q ≡ (p→q)∧(q→p). The <i>converse</i> (q→p) and <i>inverse</i> (¬p→¬q) are NOT equivalent to p→q.</li><li><b>Tautology</b> always true, <b>contradiction</b> always false, <b>satisfiable</b> true for at least one assignment. To check a tautology fast: try to make it false; if impossible, it is a tautology.</li><li><b>Inference rules:</b> modus ponens (p, p→q ⊢ q), modus tollens (¬q, p→q ⊢ ¬p), hypothetical syllogism (p→q, q→r ⊢ p→r), disjunctive syllogism (p∨q, ¬p ⊢ q). Fallacy to avoid: affirming the consequent (q, p→q ⊢ p).</li><li>Normal forms: CNF = AND of ORs, DNF = OR of ANDs. Number of distinct Boolean functions of n variables = 2^(2ⁿ).</li></ul>
<h4>2. Predicate (first-order) logic</h4><ul><li>∀x P(x): P holds for every x. ∃x P(x): at least one x. Negation flips the quantifier: ¬∀x P ≡ ∃x ¬P and ¬∃x P ≡ ∀x ¬P.</li><li><b>Translating English:</b> "All S are P" → ∀x (S(x) → P(x)). "Some S are P" → ∃x (S(x) ∧ P(x)). "No S is P" → ∀x (S(x) → ¬P(x)). Using ∧ with ∀ or → with ∃ is the classic wrong translation.</li><li>Order matters: ∀x∃y loves(x,y) (everyone loves someone) differs from ∃y∀x loves(x,y) (someone is loved by everyone). ∃y∀x implies ∀x∃y but not the reverse.</li></ul>
<h4>3. Sets</h4><ul><li>A set has no repeats and no order. |P(S)| = 2ⁿ for |S| = n. Subsets of size k: C(n,k). Cartesian product |A×B| = |A||B|. Union/intersection/complement and De Morgan work as in logic. |A∪B∪C| by inclusion–exclusion.</li></ul>
<h4>4. Relations</h4><ul><li>A relation R on a set A is a subset of A×A. Properties: <b>reflexive</b> (every (a,a) present), <b>symmetric</b> ((a,b)∈R ⇒ (b,a)∈R), <b>antisymmetric</b> ((a,b) and (b,a) ⇒ a = b), <b>transitive</b> ((a,b),(b,c) ⇒ (a,c)).</li><li>For |A| = n: total relations 2^(n²); reflexive 2^(n²−n); symmetric 2^(n(n+1)/2); antisymmetric 2ⁿ·3^(n(n−1)/2); equivalence relations = Bell numbers 1, 2, 5, 15, 52 (n = 1…5).</li><li><b>Equivalence relation</b> = reflexive + symmetric + transitive; it splits the set into disjoint <i>classes</i> (a partition). <b>Partial order</b> = reflexive + antisymmetric + transitive. <b>Total order</b> = partial order where every pair is comparable.</li><li><b>Hasse diagram:</b> draw only the covering relations (drop self-loops and edges implied by transitivity), with larger elements higher. <b>Maximal</b> element: nothing above it; <b>greatest</b>: above everything. A poset can have several maximal elements but at most one greatest.</li><li>Closures: reflexive closure adds (a,a); symmetric closure adds reverses; transitive closure (Warshall) adds all implied pairs.</li></ul>
<h4>5. Functions</h4><ul><li><b>Injective</b> (one-to-one): different inputs give different outputs. <b>Surjective</b> (onto): every element of the codomain is hit. <b>Bijective</b> = both. An inverse exists only for bijections.</li><li>Functions A→B with |A| = m, |B| = n: nᵐ total; injective n!/(n−m)! (needs m ≤ n); bijective n! when m = n; surjective Σ(−1)ᵏ C(n,k)(n−k)ᵐ (inclusion–exclusion). Composition of injective functions is injective; if g∘f is injective then f is injective.</li></ul>
<h4>6. Lattices and Boolean algebra</h4><ul><li>A <b>lattice</b> is a poset where every pair has a least upper bound (join) and greatest lower bound (meet). Divisibility on {divisors of n} is a lattice: join = lcm, meet = gcd. A lattice is <b>distributive</b> if a∧(b∨c) = (a∧b)∨(a∧c); it is <b>complemented</b> if every element has a complement. The divisor lattice Dₙ is a Boolean algebra exactly when n is square-free.</li><li><b>Boolean algebra</b> has 2ⁿ elements for n atoms; laws: identity, complement, De Morgan, absorption (x + xy = x), consensus (xy + x′z + yz = xy + x′z).</li></ul>
<h4>7. Algebraic structures (group theory)</h4><ul><li>Hierarchy: <b>semigroup</b> (closed, associative) → <b>monoid</b> (+ identity) → <b>group</b> (+ inverses) → <b>abelian group</b> (+ commutative). A ring has two operations (addition forms an abelian group; multiplication is associative and distributes); a field is a commutative ring where every non-zero element has an inverse.</li><li><b>Subgroup test:</b> non-empty and closed under the operation and inverses. <b>Lagrange:</b> order of a subgroup divides the order of the group; so does the order of every element. A group of prime order is cyclic. A cyclic group of order n has φ(n) generators.</li><li>Standard groups: (Zₙ, +ₙ) is cyclic of order n; (Zₙ*, ×ₙ) is the numbers coprime to n and has order φ(n). Z with subtraction is not a group (not associative).</li></ul>
<h4>8. Worked examples</h4><ul><li><b>Number of reflexive and symmetric relations on a 4-element set:</b> diagonal is forced; only the 6 pairs above the diagonal are free ⇒ 2⁶ = 64.</li><li><b>Is (p → q) ∧ (q → r) → (p → r) a tautology?</b> It is hypothetical syllogism ⇒ yes.</li><li><b>Order of 3 in (Z₇*, ×):</b> 3¹=3, 3²=2, 3³=6, 3⁴=4, 3⁵=5, 3⁶=1 ⇒ 6, so 3 is a generator.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>English statements whose wrong translation looks natural (∀ with ∧). Statements like "if a ≥ b and b ≥ a then a = b" are antisymmetry — read the symbols, not the story.</li><li>Relations given as sets of pairs or as a rule on integers (xRy iff x−y divisible by 3, or x² = y²): test each property with a small counterexample.</li><li>Group questions that hide cyclicity (every element has order dividing 2 ⇒ abelian, not necessarily cyclic) and Hasse diagrams where "minimal" vs "least" differ.</li></ul>`]

"Operating Systems|Memory management & virtual memory":[`<p><b>Weight:</b> the biggest OS topic (about 3 marks a year), mostly numerical. Plan: learn the address-split idea once, then every question is the same arithmetic.</p>
<h4>1. The problem memory management solves</h4><ul><li>The CPU generates <b>logical (virtual) addresses</b>; the hardware <b>MMU</b> translates them into <b>physical addresses</b> in RAM. This lets many programs share memory safely, and lets a program be bigger than RAM.</li><li><b>Contiguous allocation</b> gives each process one block. <i>Internal fragmentation</i> = wasted space <b>inside</b> an allocated block (fixed partitions, paging's last page). <i>External fragmentation</i> = free space exists but is scattered in pieces too small to use (variable partitions); fixed by <b>compaction</b> or by paging.</li><li>Placement: <b>first fit</b> (first hole big enough, fast), <b>best fit</b> (smallest hole that fits, leaves tiny useless holes), <b>worst fit</b> (largest hole). Simulate on the given hole list; do not guess which is best.</li></ul>
<h4>2. Paging — the core idea</h4><ul><li>Cut logical memory into equal <b>pages</b> and physical memory into equal <b>frames</b> (same size). A <b>page table</b> maps page number → frame number. No external fragmentation.</li><li><b>Address split:</b> logical address = <code>page number | offset</code>. Offset bits = log₂(page size). Page-number bits = VA bits − offset bits. Physical address = <code>frame number | offset</code> (offset is unchanged).</li><li><b>Sizes to compute:</b> number of pages = 2^(page-number bits) = virtual space / page size. Number of frames = physical memory / page size. <b>Page-table size</b> = number of pages × size of one entry.</li><li>An entry (PTE) holds the frame number plus control bits: <i>valid/present</i>, <i>dirty/modified</i>, <i>reference</i>, <i>protection</i>. If a question says "each entry has 2 extra bits", entry size = frame-number bits + 2 (rounded up to bytes only if told).</li><li><b>Inverted page table:</b> one entry per <i>frame</i> (not per page); saves space, slower to search (use hashing).</li></ul>
<h4>3. TLB and effective access time</h4><ul><li>The <b>TLB</b> is a small fast cache of recent page-table entries. Hit ratio h, TLB time t, memory time m (single-level paging):<br><b>EMAT = h(t + m) + (1 − h)(t + 2m)</b> (miss = TLB + page-table read + data read). With two-level paging a miss costs t + 3m; with k levels, t + (k+1)m. If the TLB lookup is overlapped/zero, set t = 0.</li><li>With page faults (rate p, service time S): <b>EMAT = (1 − p)·(normal access) + p·S</b>. S is usually in milliseconds, memory in nanoseconds — convert units first; even p = 10⁻⁶ hurts.</li></ul>
<h4>4. Multilevel paging</h4><ul><li>Problem: a single page table for a 32-bit space with 4 KB pages has 2²⁰ entries (4 MB with 4-byte entries) — too big to keep contiguous. Solution: page the page table.</li><li><b>Rule:</b> every page-table level must fit exactly in <b>one page</b>. Entries per table = page size / entry size. Index bits per level = log₂(entries per table).</li><li>Example: 32-bit VA, 4 KB page (12 offset bits), 4-byte PTE ⇒ 1024 entries per table ⇒ 10 index bits ⇒ 10 + 10 + 12 = 32, so <b>two levels</b>. For a 48-bit VA with 8-byte PTE: 9 bits per level, 36 bits of page number ⇒ 4 levels.</li><li>The outer table(s) are always fully allocated, inner ones only as needed — so the <i>minimum</i> size of a process's tables counts only the levels it actually touches.</li></ul>
<h4>5. Segmentation</h4><ul><li>Memory is divided by <i>meaning</i> (code, stack, heap) into variable-size <b>segments</b>. Address = <code>(segment no, offset)</code>. Segment table gives (base, limit). Hardware checks <b>offset &lt; limit</b> else trap; physical = base + offset. Causes external fragmentation but matches how programmers think; <b>segmentation with paging</b> (x86 style) pages each segment.</li></ul>
<h4>6. Virtual memory and demand paging</h4><ul><li>Pages are brought into RAM <i>only when touched</i>. If the valid bit says "not in memory" the access causes a <b>page fault</b>: trap to OS → find the page on disk → find a free frame (or choose a victim) → read it in → update the page table → restart the instruction.</li><li><b>Locality of reference</b> (programs reuse nearby/recent data) is why this works. <b>Thrashing</b> = the system spends more time swapping than computing because processes lack enough frames; CPU utilisation falls, and a naive OS adds even more processes. Cure: working-set model / page-fault-frequency control, lower the degree of multiprogramming.</li></ul>
<h4>7. Page replacement algorithms</h4><ul><li><b>FIFO:</b> evict the oldest loaded page. Simple but can evict a hot page, and shows <b>Belady's anomaly</b> (more frames ⇒ more faults).</li><li><b>Optimal (OPT):</b> evict the page used farthest in the future. Fewest faults possible; not implementable, used as a benchmark.</li><li><b>LRU:</b> evict the page unused for longest. Close to OPT. LRU and OPT are <b>stack algorithms</b> (the set of pages in n frames is always a subset of that in n+1), so no Belady anomaly. Real systems approximate LRU with <b>reference bits / clock (second-chance)</b>.</li><li>How to simulate: write the frames after each reference, mark FAULT/HIT, count faults. Frames start empty, so the first references to new pages are <b>compulsory faults</b> and count.</li></ul>
<h4>8. Worked examples</h4><ul><li><b>Page-table size:</b> 32-bit VA, 8 KB pages, 4-byte PTE ⇒ offset 13 bits, 2¹⁹ pages ⇒ table = 2¹⁹ × 4 B = 2 MB.</li><li><b>FIFO with 3 frames</b> on 7 0 1 2 0 3 0 4 2 3 0 3 2 1 2 0 1 7 0 1 ⇒ 15 faults; <b>LRU</b> ⇒ 12; <b>OPT</b> ⇒ 9. (Use the lab above to verify.)</li><li><b>Belady:</b> string 1 2 3 4 1 2 5 1 2 3 4 5, FIFO: 3 frames ⇒ 9 faults, 4 frames ⇒ 10.</li><li><b>EMAT:</b> TLB 10 ns, memory 100 ns, hit ratio 90% ⇒ 0.9(110) + 0.1(210) = 120 ns.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Giving physical memory size and asking for PTE size, then adding "valid/dirty bits" — recompute the entry width from <i>frame bits + control bits</i>.</li><li>Mixing units (KB vs bytes, ms vs ns) inside EMAT with page faults; asking "maximum page-fault rate for EMAT ≤ x".</li><li>Multilevel questions where one level is smaller than a page (choose bits so the <i>top</i> level absorbs the leftover).</li><li>Reference strings with a process's own pages versus global replacement; or asking which statement about LRU/FIFO/Belady is false.</li></ul>`],
"Operating Systems|Files, disk, I/O, system calls":[`<p><b>Weight:</b> about 3 marks a year. It is a mixed bag: fork-counting, inode size, disk-time arithmetic and kernel concepts. Each part is short.</p>
<h4>1. User mode, kernel mode, system calls, interrupts</h4><ul><li>The CPU has a <b>mode bit</b>: user mode (restricted) and kernel mode (all instructions). A <b>system call</b> is a controlled entry into the kernel: the program executes a <b>trap</b> instruction, the mode switches to kernel, the OS does the work, then returns. Privileged instructions (I/O, changing the mode bit, memory-management registers, disabling interrupts) work only in kernel mode.</li><li><b>Interrupt</b> = asynchronous signal from hardware (timer, disk). <b>Trap/exception</b> = synchronous, caused by the running instruction (divide by zero, page fault, system call). The timer interrupt is how the OS regains control for preemptive scheduling.</li></ul>
<h4>2. Processes, fork, exec, threads</h4><ul><li><b>fork()</b> creates a copy of the calling process. It returns <b>0 in the child</b> and the <b>child's pid in the parent</b> (−1 on failure). <b>exec()</b> replaces the process image with a new program. <b>wait()</b> lets the parent collect the child's exit status.</li><li><b>Zombie:</b> child finished but the parent has not yet called wait (entry stays in the table). <b>Orphan:</b> parent died first; the child is adopted by init.</li><li><b>Counting fork() outputs</b> — the key skill: every fork() doubles the number of processes that execute the following code. n unconditional forks in sequence ⇒ 2ⁿ processes (2ⁿ − 1 new children). Inside <code>for(i=0;i&lt;n;i++) fork();</code> ⇒ 2ⁿ processes. When code is <code>if (fork()==0) {…}</code>, only the child enters the block, so draw a process tree and follow each branch.</li><li><b>Threads</b> share code, data, heap, open files; each has its own stack, registers and program counter. User-level threads are fast to create/switch but one blocking call blocks the whole process and they cannot use multiple cores; kernel-level threads avoid both problems at higher cost. A context switch between threads of the same process is cheaper (no address-space change).</li><li><b>IPC:</b> pipes, message queues, shared memory (fastest, needs synchronisation), sockets, signals.</li></ul>
<h4>3. File system basics</h4><ul><li>A file has a name, type, size, owner, permissions and timestamps; the <b>inode</b> (Unix) stores everything except the name and the pointers to the data blocks. A directory maps names → inode numbers.</li><li><b>Allocation methods:</b> <i>Contiguous</i> (fast, fragmentation, hard to grow); <i>Linked</i> (no external fragmentation, slow random access; <b>FAT</b> keeps the links in one table); <i>Indexed</i> (an index block lists the data blocks; supports random access).</li><li><b>Unix inode:</b> 12 direct pointers, 1 single-indirect, 1 double-indirect, 1 triple-indirect. If block size = B and pointer size = p, one indirect block holds P = B/p pointers. <b>Maximum file size = (12 + P + P² + P³) × B.</b> Example: B = 1 KB, p = 4 B ⇒ P = 256 ⇒ about 16 GB.</li><li>Free space: a <b>bitmap</b> uses 1 bit per block (disk of N blocks ⇒ N bits); or a linked list of free blocks.</li><li>Hard link = another name for the same inode (link count); symbolic link = a small file holding a path.</li></ul>
<h4>4. Disk structure and access time</h4><ul><li>A disk has platters → tracks → sectors; the arm moves the heads across <b>cylinders</b>. <b>Disk access time = seek time + rotational latency + transfer time.</b></li><li><b>Rotational latency</b> (average) = half a rotation = ½ × (60/RPM) s. <b>Transfer time</b> = data size / transfer rate = (sectors to read / sectors per track) × rotation time. Example: 7200 RPM ⇒ one rotation 8.33 ms ⇒ average latency 4.17 ms.</li><li>Sequential reads need only one seek; <i>random</i> reads pay seek + latency for every block — questions often ask for the time to read a file spread over k blocks.</li></ul>
<h4>5. Disk scheduling</h4><ul><li><b>FCFS</b>: serve in arrival order. <b>SSTF</b>: nearest request next (can starve far requests). <b>SCAN (elevator)</b>: sweep to one end, then reverse; <b>C-SCAN</b>: sweep one way, jump back, sweep again (more uniform waits). <b>LOOK / C-LOOK</b>: like SCAN/C-SCAN but turn around at the last request instead of the disk end.</li><li>Always list the order of service, then add the absolute differences. Read the question for the <i>direction</i> the head is moving.</li><li><b>Example:</b> queue 98, 183, 37, 122, 14, 124, 65, 67; head at 53. FCFS = 640 cylinders. SSTF order 65, 67, 37, 14, 98, 122, 124, 183 = 236. SCAN moving down: 37, 14, 0, then 65 … 183 = 53 + 183 = 236.</li></ul>
<h4>6. I/O methods</h4><ul><li><b>Programmed I/O (polling):</b> CPU loops asking "ready?" — wastes CPU. <b>Interrupt-driven:</b> device signals when ready; CPU does other work meanwhile. <b>DMA:</b> a controller moves a whole block between device and memory without the CPU; one interrupt at the end. <b>Cycle stealing</b> = DMA takes bus cycles from the CPU.</li><li>Buffering and spooling smooth speed differences between fast CPU and slow devices.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>fork() inside loops with <code>wait()</code> or conditions, and printf output that appears twice because the buffer was copied by fork — count processes first, then count prints per process.</li><li>Inode questions where block size and pointer size are given indirectly (disk with N blocks ⇒ pointer needs ⌈log₂N⌉ bits ⇒ rounded up to bytes).</li><li>Disk questions combining seek per cylinder, rotation and transfer for non-contiguous blocks; scheduling with an <i>initial direction</i> or SCAN vs LOOK distinction.</li><li>"Which instructions must be privileged?" — anything that could break protection (I/O, mode change, interrupt masking), not ordinary arithmetic or reading the clock.</li></ul>`],
"Operating Systems|Scheduling & deadlock":[`<p><b>Weight:</b> about 2–3 marks a year. Scheduling is pure arithmetic with a Gantt chart; deadlock is a handful of rules and the Banker's algorithm.</p>
<h4>1. Basics</h4><ul><li>Process states: <b>new → ready → running → waiting (blocked) → ready → … → terminated</b>. The <b>scheduler</b> picks which ready process gets the CPU; the <b>dispatcher</b> does the switch; a <b>context switch</b> saves/loads the PCB and is pure overhead.</li><li><b>Preemptive</b> scheduling can take the CPU away (timer, higher priority); <b>non-preemptive</b> waits until the process blocks or ends.</li><li>Definitions (write these next to every Gantt chart): <b>Completion time CT</b>, <b>Turnaround TAT = CT − AT</b>, <b>Waiting WT = TAT − BT</b>, <b>Response RT = first time on CPU − AT</b>, <b>Throughput</b> = processes per unit time, <b>CPU utilisation</b>.</li></ul>
<h4>2. Algorithms</h4><ul><li><b>FCFS:</b> in arrival order, non-preemptive. Easy, but the <i>convoy effect</i> (short jobs stuck behind a long one) gives poor average waiting time.</li><li><b>SJF (non-preemptive)</b> and <b>SRTF (preemptive SJF)</b>: always choose the smallest (remaining) burst. <b>Provably minimum average waiting time</b> among all algorithms; problem: can starve long jobs and needs to know the burst (predicted by exponential averaging τₙ₊₁ = α·tₙ + (1 − α)τₙ).</li><li><b>Priority:</b> run the highest priority; can be preemptive or not. Starvation of low priority is fixed by <b>aging</b> (priority grows with waiting).</li><li><b>Round Robin:</b> each process gets a time quantum q, then goes to the back of the queue. Large q ⇒ behaves like FCFS; very small q ⇒ too many context switches. With n processes, a process waits at most (n − 1)q before its next turn. Good response time, usually larger average TAT than SJF.</li><li><b>Multilevel queue / multilevel feedback queue:</b> several queues with different policies; feedback lets a process move between queues (CPU-hungry jobs sink, interactive ones stay high) and so approximates SJF without knowing bursts.</li></ul>
<h4>3. How to solve a scheduling numerical</h4><ul><li>Step 1: sort by arrival. Step 2: build the Gantt chart one event at a time (an arrival can trigger preemption). Step 3: read CT from the chart, then compute TAT and WT. If the CPU becomes idle before the next arrival, draw the idle gap.</li><li>Tie-break rules (equal burst or arrival): the question usually says "lower process id first"; if not, use FCFS order.</li><li><b>Example (SRTF):</b> P1(AT 0, BT 8), P2(1, 4), P3(2, 9), P4(3, 5). Gantt: P1 0–1, P2 1–5, P4 5–10, P1 10–17, P3 17–26. Waiting times: P1 = 9, P2 = 0, P4 = 2, P3 = 15 ⇒ average 6.5. Non-preemptive SJF on the same data gives 7.75.</li></ul>
<h4>4. Deadlock — what and why</h4><ul><li>A set of processes is <b>deadlocked</b> when each waits for a resource held by another in the set. All four conditions must hold together: <b>mutual exclusion, hold-and-wait, no preemption, circular wait</b>. Break any one and deadlock is impossible.</li><li><b>Resource Allocation Graph (RAG):</b> request edge P → R, assignment edge R → P. If every resource has a <b>single instance</b>, a cycle ⇔ deadlock. With <b>multiple instances</b>, a cycle is necessary but <i>not</i> sufficient (a process outside the cycle may release an instance).</li></ul>
<h4>5. Handling deadlock</h4><ul><li><b>Prevention:</b> attack a condition — request all resources at once (no hold-and-wait), allow preemption, or impose a global <b>resource ordering</b> (no circular wait). Costs: low utilisation, starvation.</li><li><b>Avoidance:</b> the OS knows the maximum demand and grants a request only if the system stays in a <b>safe state</b> (some order exists in which all processes can finish). Safe ⇒ no deadlock; unsafe ⇒ <i>possible</i> deadlock, not certain.</li><li><b>Detection and recovery:</b> let it happen, detect by a graph cycle/algorithm, recover by killing processes or preempting resources. <b>Ignore (ostrich):</b> what Unix/Windows mostly do.</li></ul>
<h4>6. Banker's algorithm</h4><ul><li>Matrices: <b>Allocation</b>, <b>Max</b>, <b>Need = Max − Allocation</b>, vector <b>Available</b> (= total − sum of Allocation).</li><li>Safety check: Work = Available. Repeat: find an unfinished process with Need ≤ Work; pretend it finishes and add its Allocation to Work. If all processes can finish, the state is safe, and the order found is a safe sequence (there may be several).</li><li><b>Request check</b> by P: Request ≤ Need, Request ≤ Available; then pretend to grant it and run the safety check; grant only if still safe.</li><li><b>Example:</b> 12 identical units; P1 max 10 holds 5, P2 max 4 holds 2, P3 max 9 holds 2 ⇒ Available 3, Needs 5, 2, 7. P2 (2 ≤ 3) finishes → 5; P1 (5 ≤ 5) → 10; P3 (7 ≤ 10) ⇒ safe sequence P2, P1, P3.</li></ul>
<h4>7. The classic formula</h4><ul><li>n processes each needing at most m units of one resource type with R units in total: deadlock is impossible if <b>R ≥ n(m − 1) + 1</b> (worst case, everyone holds m − 1 and still needs one). If processes need different maxima mᵢ: R ≥ Σ(mᵢ − 1) + 1. Smallest R that <i>can</i> deadlock is one less than that bound.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Preemptive priority or RR with arrivals exactly at quantum expiry — decide whether a newly arrived process queues before or after the preempted one (the question states this; otherwise newly arrived goes first).</li><li>Questions about "minimum/maximum number of resources so that the system is always/never deadlock-free" — apply the formula carefully to <b>maximum</b> vs <b>minimum</b>.</li><li>RAG with multiple instances where a cycle exists but a safe order still exists; "unsafe" mistaken for "deadlocked".</li><li>Mixing I/O bursts with CPU bursts (a process leaves the CPU for I/O, then rejoins the ready queue) — draw separate timelines for CPU and I/O.</li></ul>`],
"Operating Systems|Process synchronization":[`<p><b>Weight:</b> about 1–2 marks a year, but the questions are among the trickiest in the paper — they test whether you can trace interleavings correctly.</p>
<h4>1. Why synchronisation is needed</h4><ul><li>When processes share data, the final result can depend on the order of interleaving — a <b>race condition</b>. Example: two processes each run <code>counter++</code>, which is really load → add → store; if both load 5, both store 6 and one increment is lost.</li><li>The part of the code that touches shared data is the <b>critical section (CS)</b>. A correct solution needs:<ul><li><b>Mutual exclusion</b> — at most one process inside the CS.</li><li><b>Progress</b> — if nobody is inside, one of the processes that wants in must be able to enter (decision cannot be postponed forever by outsiders).</li><li><b>Bounded waiting</b> — no process waits forever while others keep entering.</li></ul></li></ul>
<h4>2. Software solution: Peterson (2 processes)</h4><pre>flag[i]=true; turn=j;
while(flag[j] &amp;&amp; turn==j);   // wait
   ... critical section ...
flag[i]=false;</pre><ul><li>"I want in, but you go first if you also want in." It satisfies all three conditions for exactly 2 processes. A broken version (for example setting <code>turn = i</code> instead of <code>j</code>) can violate mutual exclusion — check the order of the two assignments.</li><li>A single shared <code>turn</code> variable alone gives mutual exclusion but violates <b>progress</b> (strict alternation: a process outside the CS can block the other).</li></ul>
<h4>3. Hardware support</h4><ul><li><b>Test-and-Set / Swap / Compare-and-Swap</b> are atomic instructions. A lock built from them gives mutual exclusion; it is a <b>spinlock</b> (busy waiting wastes CPU but is fine for very short sections). Plain TSL does <i>not</i> guarantee bounded waiting. Disabling interrupts works only on a single processor.</li></ul>
<h4>4. Semaphores</h4><ul><li>A semaphore S is an integer with two atomic operations: <b>wait(S) / P(S)</b>: S = S − 1; if S &lt; 0 block the caller. <b>signal(S) / V(S)</b>: S = S + 1; if S ≤ 0 wake one blocked process.</li><li><b>Counting semaphore</b> (any value): controls access to k identical resources — initialise to k. <b>Binary semaphore</b> (0 or 1): mutual exclusion — initialise to 1. Initialise to 0 to make one process <i>wait for an event</i> from another (ordering).</li><li><b>Value tracking:</b> final S = initial − (#P completed) + (#V). If S is negative, |S| processes are blocked. Example: S starts at 1, 10 P and 6 V operations ⇒ S = −3, three processes are blocked.</li><li>Mutual exclusion pattern: <code>wait(mutex); CS; signal(mutex);</code>. <b>Wrong order</b> (<code>signal</code> before <code>wait</code>) lets several processes in; <b>two wait()s</b> on the same semaphore in a row deadlocks.</li></ul>
<h4>5. Classic problems</h4><ul><li><b>Producer–consumer (bounded buffer of N):</b> semaphores <code>mutex = 1, empty = N, full = 0</code>. Producer: <code>wait(empty); wait(mutex); add item; signal(mutex); signal(full)</code>. Consumer: <code>wait(full); wait(mutex); remove; signal(mutex); signal(empty)</code>. If the producer waits on <code>mutex</code> <i>before</i> <code>empty</code> and the buffer is full, it sleeps holding the mutex ⇒ <b>deadlock</b>.</li><li><b>Readers–writers:</b> many readers may read together, a writer needs exclusive access. The reader-priority solution can starve writers. Uses a <code>readcount</code> protected by a mutex and a <code>wrt</code> semaphore that the first reader locks and the last reader releases.</li><li><b>Dining philosophers:</b> 5 philosophers, 5 forks. If everyone picks up the left fork first ⇒ deadlock. Fixes: allow at most 4 to sit, pick both forks atomically, or make one philosopher pick right-first (asymmetric ordering).</li></ul>
<h4>6. Monitors and other concepts</h4><ul><li>A <b>monitor</b> is a language construct: only one process can be active inside it, with <b>condition variables</b> (wait/signal) for waiting. Easier and safer than raw semaphores.</li><li><b>Priority inversion:</b> a high-priority process waits for a lock held by a low-priority one that is preempted by a medium-priority process; cure: priority inheritance. <b>Starvation</b> (indefinite waiting) is different from <b>deadlock</b> (circular wait).</li></ul>
<h4>7. How to solve a "trace the processes" question</h4><ul><li>Write the semaphore values in a small table. Move one process at a time to its next blocking point; list which processes are blocked and which semaphore can wake them. Ask: "which print orders are <i>possible</i>?" — a sequence is possible only if every wait had a matching earlier signal.</li><li><b>Example:</b> S = 0. P1: <code>print A; signal(S)</code>. P2: <code>wait(S); print B</code>. B can never print before A ⇒ output always "AB". Replace S = 0 with S = 1 and B may print first.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Several semaphores with different initial values (one at 0 to force alternation, one at 1 as a mutex) and a question like "what is the maximum number of A's printed before the first B" — track values, not intuition.</li><li>Code that "looks" like Peterson but with swapped lines, or with a shared variable written without a lock; ask which of the three conditions fails.</li><li>Statements mixing ideas: "spinlock gives bounded waiting" (false for TSL), "binary semaphore = mutex" (nearly, but a mutex has an owner), "disabling interrupts works on multiprocessors" (false).</li></ul>`]
