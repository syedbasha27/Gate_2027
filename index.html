"Programming in C|Pointers, recursion & output tracing":[`<p><b>Weight:</b> about 4–5 marks a year (the whole "Programming and Data Structures" C part). Every question is "what does this code print / return?". The method is always the same: <b>write down variable values line by line, and draw memory when pointers appear.</b> Every output quoted below was compiled and run to confirm it (64-bit gcc, int = 4 bytes).</p>
<h4>1. Data types, sizes and conversions</h4><ul><li>Typical sizes: <code>char</code> 1 byte, <code>short</code> 2, <code>int</code> 4, <code>long</code> 8 (4 on some systems), <code>float</code> 4, <code>double</code> 8, any <b>pointer</b> 8 on a 64-bit machine (4 on 32-bit). GATE usually states the sizes it wants — use those.</li><li><b>Integer division truncates toward zero</b> and the remainder takes the sign of the dividend: <code>-7/2 = -3</code>, <code>-7%2 = -1</code>, <code>7/-2 = -3</code>, <code>7%-2 = 1</code>. <code>5/2 = 2</code>, <code>5/2.0 = 2.5</code>; <code>(int)3.9 = 3</code> (truncation, not rounding).</li><li><b>Promotions:</b> <code>char</code> and <code>short</code> become <code>int</code> in expressions. If an <b>int and an unsigned int</b> meet, the int is converted to unsigned: <code>-1 &lt; 1u</code> is <b>false</b> (−1 becomes a huge number). Mixed int/float expressions convert to float/double.</li><li><b>Overflow:</b> unsigned arithmetic wraps modulo 2ⁿ (<code>unsigned char u = 255; u++;</code> gives 0). Signed overflow is undefined behaviour. Floating-point is inexact: <code>0.1 + 0.2 == 0.3</code> is false.</li></ul>
<h4>2. Operators — precedence and the traps</h4><ul><li>High → low: <code>() [] . -&gt;</code> and postfix <code>++ --</code>; then unary <code>! ~ ++ -- * &amp; sizeof</code> (right-to-left); <code>* / %</code>; <code>+ -</code>; <code>&lt;&lt; &gt;&gt;</code>; <code>&lt; &lt;= &gt; &gt;=</code>; <code>== !=</code>; <code>&amp;</code>; <code>^</code>; <code>|</code>; <code>&amp;&amp;</code>; <code>||</code>; <code>?:</code>; assignment (right-to-left); comma. Comparisons bind tighter than <code>&amp;</code>, so <code>x &amp; 1 == 0</code> means <code>x &amp; (1 == 0)</code> — a classic trap.</li><li><b>Short-circuit:</b> in <code>a &amp;&amp; b</code> the right side is skipped if <code>a</code> is 0; in <code>a || b</code> it is skipped if <code>a</code> is non-zero. So side effects (<code>i++</code>) on the right may never run: <code>int i = 5, j = 0; if (j &amp;&amp; i++); </code> leaves i = 5.</li><li><b>Unspecified / undefined order:</b> the order of evaluating function arguments and the operands of <code>+</code> is not defined, and modifying a variable twice between sequence points (<code>i = i++ + ++i</code>) is undefined. GATE avoids these or says "assume left to right"; if both appear, answer from the stated assumption.</li><li><b>Pre/post increment:</b> <code>x++</code> yields the old value, then increments; <code>++x</code> increments first. With pointers: <code>*p++</code> = <code>*(p++)</code> (read, then move the pointer), <code>(*p)++</code> increments the pointed value, <code>*++p</code> moves first then reads, <code>++*p</code> increments the value.</li><li><b>Bitwise:</b> <code>&amp; | ^ ~ &lt;&lt; &gt;&gt;</code>. <code>x &lt;&lt; k</code> = x·2ᵏ; <code>x &gt;&gt; k</code> = x/2ᵏ (floor, for non-negative). <code>x &amp; (x-1)</code> clears the lowest set bit (12 → 8); <code>x &amp; -x</code> isolates it (12 → 4); <code>x &amp; 1</code> tests odd. Counting set bits: <code>while(x){x &amp;= x-1; c++;}</code> loops once per 1-bit. <code>a ^ a = 0</code>, <code>a ^ 0 = a</code> (XOR swap).</li><li><b>Others:</b> the comma operator returns its last value (<code>x = (1,2,3)</code> gives 3); <code>if (x = 5)</code> is an assignment (true); a stray <code>;</code> after <code>if</code>/<code>for</code>/<code>while</code> makes the body empty; <b>dangling else</b> attaches to the nearest <code>if</code>; <code>printf</code> returns the number of characters printed (<code>printf("%d", printf("ab"))</code> prints <code>ab2</code>).</li></ul>
<h4>3. Control flow</h4><ul><li><b>switch:</b> execution falls through to the next case until a <code>break</code>; <code>default</code> runs when nothing matches, wherever it is written. Loops: <code>for(init; cond; update)</code> — the update runs after each body execution; <code>continue</code> jumps to the update; <code>break</code> leaves the loop.</li><li>For nested loops count iterations by multiplying (or summing a pattern like <code>for(j=i; j&lt;n; j++)</code> ⇒ n(n+1)/2). Loops with <code>i *= 2</code> run ⌈log₂ n⌉ times.</li></ul>
<h4>4. Storage classes, scope and memory layout</h4><ul><li><b>auto</b> (default for locals): new copy per call, holds garbage until assigned. <b>static</b> local: created once, keeps its value between calls, initialised once (to 0 by default). <b>register</b>: hint only (you cannot take its address). <b>extern</b>: declares a variable defined elsewhere. Global/static variables not explicitly initialised start at <b>0</b>.</li><li><b>Scope:</b> a name belongs to its enclosing block; an inner declaration <i>hides</i> the outer one (shadowing) only inside the inner block. C uses <b>static (lexical) scoping</b>.</li><li><b>Process memory layout</b> (low → high): code (text), initialised data, uninitialised data (bss), <b>heap</b> (grows up, <code>malloc</code>), <b>stack</b> (grows down, local variables and call frames). Deep recursion exhausts the stack (stack overflow).</li><li><b>Dynamic memory:</b> <code>malloc(n)</code> returns uninitialised memory (or NULL), <code>calloc</code> zeroes it, <code>realloc</code> resizes, <code>free</code> releases. Bugs: <b>memory leak</b> (never freed), <b>dangling pointer</b> (use after free, or returning the address of a local variable), <b>double free</b>.</li><li><b>Example:</b> <code>int g(){ static int c = 0; return ++c; }</code> — after calls g(); g(); the third call returns 3.</li></ul>
<h4>5. Functions and call by value</h4><ul><li>C passes <b>everything by value</b>: the function gets a copy, so changing a parameter does not change the caller's variable. To modify the caller's variable, pass its <b>address</b> and dereference (<code>void swap(int *a, int *b)</code>).</li><li>An <b>array argument decays to a pointer to its first element</b>, so changes to elements are visible to the caller, and <code>sizeof</code> of the parameter gives the pointer size, not the array size.</li><li>Function pointers: <code>int (*fp)(int,int) = add; fp(2,3);</code>.</li></ul>
<h4>6. Pointers and arrays — the heart of the topic</h4><ul><li><code>&amp;x</code> = address of x; <code>*p</code> = the value at address p. A pointer variable stores an address; <code>int **q = &amp;p</code> stores the address of a pointer. If <code>int a=10, *p=&amp;a, **q=&amp;p;</code> then <code>**q = 20;</code> sets a to 20.</li><li><b>Pointer arithmetic scales by the size of the pointed type:</b> <code>p + 1</code> moves 4 bytes for <code>int *</code>, 1 for <code>char *</code>. <code>p - q</code> (same array) gives the number of <i>elements</i> between. <code>a[i]</code> is exactly <code>*(a + i)</code>, so even <code>i[a]</code> works.</li><li>Example: <code>int a[] = {1,2,3,4}; int *p = a; p++; printf("%d", *p + *(p+1));</code> prints <b>5</b> (2 + 3).</li><li><b>2-D arrays</b> are stored row by row (<b>row-major</b>). For <code>int m[R][C]</code> the element <code>m[i][j]</code> is at address base + (i·C + j)·sizeof(int). <code>m + 1</code> jumps a whole row (C elements); <code>m[0]</code> is the first row; <code>*(*(m+i)+j)</code> equals <code>m[i][j]</code>. <code>sizeof(m)</code> for <code>int m[3][4]</code> is 48, <code>sizeof(m[0])</code> is 16.</li><li><b>Reading declarations:</b> <code>int *p[4]</code> = array of 4 pointers; <code>int (*p)[4]</code> = pointer to an array of 4 ints (<code>p + 1</code> moves 16 bytes). <code>const int *p</code> (cannot change the value) vs <code>int * const p</code> (cannot change the pointer).</li><li><b>Strings</b> are char arrays ending in <code>'\\0'</code>. <code>char s[] = "hello"</code> has <code>sizeof</code> 6 and <code>strlen</code> 5 and is modifiable; <code>char *t = "hello"</code> points to a read-only literal (<code>sizeof(t)</code> = 8; writing to it is undefined). <code>s1 == s2</code> compares addresses, not contents — use <code>strcmp</code>.</li></ul>
<h4>7. Structures and unions</h4><ul><li>A struct's members are placed in order; the compiler adds <b>padding</b> so each member sits at an address multiple of its own size, and the total size is a multiple of the largest member's alignment. <code>struct {char c; int i;}</code> = 8; <code>{int i; char c;}</code> = 8; <code>{char a; int i; char b;}</code> = 12; <code>{int i; char a, b;}</code> = 8; <code>{char c; double d;}</code> = 16. Putting small members together reduces padding.</li><li>A <b>union</b> shares one memory area: its size is that of its largest member (<code>union {char c; int i; double d;}</code> = 8); writing one member overwrites the others.</li></ul>
<h4>8. Macros</h4><ul><li>The preprocessor substitutes <b>text</b> before compilation — no evaluation. <code>#define SQR(x) x*x</code> makes <code>SQR(2+3)</code> become <code>2+3*2+3</code> = <b>11</b>, while <code>#define SQ2(x) ((x)*(x))</code> gives 25. A macro argument with side effects is evaluated each time it appears: <code>MAX(i++, j++)</code> may increment twice.</li></ul>
<h4>9. Recursion — how to trace it</h4><ul><li>Each call gets its own stack frame with its own parameters and locals; a call finishes only when the calls it made have returned. <b>Draw the stack</b> (or the call tree) and evaluate from the deepest call back up. The animation above does exactly this — run it on factorial, Fibonacci and the printing example.</li><li><b>Order rule:</b> statements <i>before</i> the recursive call run on the way <b>down</b> (n, n−1, …); statements <i>after</i> run on the way <b>up</b> (1, 2, …, n) in reverse order.</li><li><b>Example:</b> <code>void f(int n){ if(n&gt;0){ f(n-1); printf("%d ", n); f(n-1);} }</code> — f(3) prints <b>1 2 1 3 1 2 1</b>, using 2ⁿ⁺¹ − 1 = 15 calls.</li><li><b>Counting calls:</b> naive Fibonacci with fib(0)=0, fib(1)=1 makes 2·fib(n+1) − 1 calls (fib(5) ⇒ 15 calls, as the lab shows). The maximum <b>stack depth</b> is n (the longest chain of pending calls), not the number of calls.</li><li>Typical recursive functions: sum 1..n = n + sum(n−1); gcd(a,b) = b == 0 ? a : gcd(b, a % b); power(x,n) by halving is O(log n); digit sum; reversing a string/number; towers of Hanoi 2ⁿ − 1 moves. A <b>recursion with no base case</b> (or a wrong one) never ends and overflows the stack.</li><li>To get running time, write the recurrence from the code (one call on n/2 plus constant work ⇒ T(n) = T(n/2) + 1 ⇒ Θ(log n)); <b>tail recursion</b> (the recursive call is the last action) can be turned into a loop.</li></ul>
<h4>10. printf/scanf basics</h4><ul><li><code>%d</code> int, <code>%u</code> unsigned, <code>%ld</code> long, <code>%f</code> double, <code>%c</code> char, <code>%s</code> string, <code>%x</code> hex, <code>%p</code> pointer, <code>%%</code> percent. A <code>char</code> printed with <code>%d</code> shows its ASCII code ('A' = 65, 'a' = 97, '0' = 48). Printing with the wrong specifier or too few arguments is undefined. <code>scanf</code> needs addresses (<code>&amp;x</code>) and returns the number of items read.</li></ul>
<h4>11. A reliable method for any "what is the output?" question</h4><ul><li>(1) Make a table of every variable. (2) Execute line by line, updating the table; for loops, write each iteration. (3) For pointers, draw boxes with addresses (a[0] at 100, a[1] at 104, …) and write what each pointer holds. (4) For recursion, draw the stack. (5) Check for hidden traps: integer division, unsigned comparison, precedence, a semicolon after the <code>if</code>, <code>=</code> versus <code>==</code>.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Pointer expressions that combine several operators (<code>*p++ + *p</code>, <code>*(p+1)[2]</code>) — break them using precedence first, then evaluate step by step.</li><li>Strings modified through a pointer in a loop (<code>while(*s) *s++ = ...</code>) — track both the pointer and what it points to.</li><li>Recursive functions with static or global variables that keep state across calls — update the shared variable at every call.</li><li>Code that "looks" like it swaps or sorts but works on copies (call by value), or macro arguments with side effects.</li><li>Questions that deliberately use undefined behaviour — in GATE they usually have an option "compiler dependent / undefined" — choose it only when the code really has such an expression.</li></ul>`]

"Data Structures|Trees, BST, AVL, heaps":[`<p><b>Weight:</b> about 2–3 marks a year. Typical questions: traversals and reconstruction, counting nodes/height, BST insert/delete results, AVL rotations, heap operations and heap-building cost. Try the builder above on every example.</p>
<h4>1. Binary tree vocabulary and counting rules</h4><ul><li>A tree has a <b>root</b>; every other node has one <b>parent</b>; nodes with no children are <b>leaves</b>. <b>Depth</b> of a node = edges from the root; <b>height</b> of a tree = edges on the longest root-to-leaf path (a single node has height 0 — but some questions count levels, so check the convention stated).</li><li>Binary tree: each node has at most 2 children. <b>Max nodes at depth i = 2ⁱ; max nodes with height h = 2^(h+1) − 1; min nodes with height h = h + 1.</b> With n nodes the height lies between ⌊log₂ n⌋ and n − 1.</li><li><b>Leaves and degree-2 nodes:</b> n₀ = n₂ + 1 (leaves = nodes with two children + 1). A tree with n nodes has n − 1 edges and <b>n + 1 null pointers</b>.</li><li><b>Full</b> binary tree: every node has 0 or 2 children (n = 2L − 1 for L leaves). <b>Complete</b>: all levels full except possibly the last, filled left to right. <b>Perfect</b>: all leaves at the same depth.</li><li><b>Counting shapes:</b> the number of structurally different binary trees with n nodes (and of different BSTs on n distinct keys) is the Catalan number <b>Cₙ = C(2n, n)/(n + 1)</b>: 1, 1, 2, 5, 14, 42, …</li></ul>
<h4>2. Traversals</h4><ul><li><b>Preorder</b> (Node, Left, Right), <b>Inorder</b> (Left, Node, Right), <b>Postorder</b> (Left, Right, Node), <b>Level-order</b> (BFS using a queue). All visit each node once: O(n).</li><li><b>Reconstruction:</b> inorder + preorder, or inorder + postorder, determine the tree uniquely. Preorder + postorder determine it only if the tree is <b>full</b> (without inorder you can't tell whether a lone child is left or right). The first element of preorder / last of postorder is the root; find it in inorder to split left and right parts.</li></ul>
<h4>3. Binary search tree (BST)</h4><ul><li>For every node: all keys in its left subtree &lt; node &lt; all keys in its right subtree. <b>Inorder traversal of a BST gives the keys in sorted order.</b> Min = leftmost node, max = rightmost; successor = leftmost node of the right subtree (or the nearest ancestor for which we are in the left subtree).</li><li><b>Search / insert / delete cost O(h).</b> Inserting keys in sorted order produces a chain of height n − 1 (O(n) per operation); random insertion gives height ≈ O(log n). The <i>order</i> of insertion decides the shape (the same keys can give different trees), but the inorder sequence is always sorted.</li><li><b>Delete:</b> leaf — just remove; one child — replace the node by its child; two children — replace its key by the inorder successor (or predecessor) and delete that node (which has at most one child).</li><li>A BST is uniquely determined by its preorder (or postorder, or level-order) sequence: the first preorder key is the root and the later keys split into smaller ones (left) and larger ones (right).</li><li><b>Is this a valid search sequence?</b> While searching for a key the visited nodes must form a path where each next key lies inside the interval allowed by earlier comparisons — if a later node falls outside the interval, the sequence is impossible.</li><li><b>Example:</b> insert 50, 30, 70, 20, 40, 60, 80. Preorder 50 30 20 40 70 60 80; inorder 20 30 40 50 60 70 80; postorder 20 40 30 60 80 70 50; height 2.</li></ul>
<h4>4. AVL trees (height-balanced BSTs)</h4><ul><li>An AVL tree keeps <b>balance factor = height(left) − height(right) ∈ {−1, 0, +1}</b> at every node, so the height stays O(log n) (at most about 1.44 log₂(n + 2)).</li><li><b>Rotations</b> restore balance after an insertion; look at the lowest unbalanced node:<br><b>LL</b> (inserted in left child's left) ⇒ single <b>right rotation</b>. <b>RR</b> ⇒ single <b>left rotation</b>. <b>LR</b> ⇒ rotate the child left, then the node right. <b>RL</b> ⇒ rotate the child right, then the node left.</li><li><b>An insertion needs at most one rotation (single or double)</b>; a deletion can trigger O(log n) rotations. All operations O(log n).</li><li><b>Minimum nodes</b> for height h: N(h) = N(h − 1) + N(h − 2) + 1 with N(0) = 1, N(1) = 2: 1, 2, 4, 7, 12, 20, 33 … (Fibonacci-like). Conversely, for n nodes the maximum height grows like 1.44 log₂ n.</li><li><b>Example:</b> insert 10, 20, 30 ⇒ RR imbalance at 10 ⇒ left rotation ⇒ root 20 with children 10 and 30. Insert 10, 20, 30, 40, 50, 25 ⇒ final preorder <b>30 20 10 25 40 50</b> (one single rotation at 50's insertion and a double RL rotation at 25's).</li><li><b>Red–black tree</b> (the other balanced tree): root black, no two adjacent reds, equal black-height on all paths; height ≤ 2 log₂(n + 1); insertion ≤ 2 rotations, deletion ≤ 3 — fewer rotations than AVL but looser balance.</li></ul>
<h4>5. Heaps and priority queues</h4><ul><li>A <b>binary heap</b> is a <b>complete</b> binary tree with the <b>heap property</b>: in a max-heap every parent ≥ its children (min-heap: ≤). It is stored in an array: for index i (1-based) children are 2i and 2i + 1, parent is ⌊i/2⌋. Root = maximum (minimum for min-heap). Leaves occupy positions ⌊n/2⌋ + 1 … n (so there are ⌈n/2⌉ leaves).</li><li><b>Insert:</b> add at the end, <b>sift up</b> while larger than the parent — O(log n). <b>Delete-max (extract):</b> move the last element to the root, <b>sift down</b> (swap with the larger child) — O(log n). Finding the max is O(1); searching an arbitrary key is O(n).</li><li><b>Build-heap</b> (heapify from the bottom: call sift-down on nodes ⌊n/2⌋ down to 1) costs <b>O(n)</b>, not O(n log n), because most nodes are near the bottom. Building by n repeated insertions costs O(n log n) and can give a different array.</li><li><b>Heap sort:</b> build a max-heap, then repeatedly swap the root with the last element and sift down: O(n log n), in place.</li><li><b>Example (build-heap):</b> array [4, 10, 3, 5, 1]. Sift down index 2 (value 10): fine. Index 1 (value 4): swap with 10 ⇒ [10, 4, 3, 5, 1], then 4 swaps with 5 ⇒ <b>[10, 5, 3, 4, 1]</b>.</li><li>Useful facts: the minimum of a max-heap is among the leaves (⌈n/2⌉ candidates); the k-th largest element needs O(k log n) with repeated extraction; a sorted array is already a valid min-heap; the height of an n-element heap is ⌊log₂ n⌋.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Giving the preorder and postorder of a tree and asking how many trees fit, or giving two traversals where one is unusual (level-order + inorder) — still reconstructs by splitting at the root.</li><li>Asking for the number of BSTs with certain properties (height h, or with a given root) — compute counts for the left and right subtrees and multiply.</li><li>AVL/red–black questions about the <b>result after a sequence of insertions and deletions</b> — do each operation and rebalance before the next.</li><li>Heaps: comparing arrays after build-heap versus repeated insertion; asking in which positions the second largest can occur (children of the root: index 2 or 3).</li></ul>`],
"Data Structures|Stacks, queues, linked lists":[`<p><b>Weight:</b> about 2 marks a year. Typical items: expression conversion/evaluation, which output sequences a stack can produce, circular-queue conditions, linked-list pointer operations and their time complexity.</p>
<h4>1. Stack (LIFO — last in, first out)</h4><ul><li>Operations <b>push, pop, peek/top</b> — all O(1). Implemented with an array (with a top index; overflow when full, underflow when empty) or a linked list (push/pop at the head).</li><li><b>Uses:</b> function calls and recursion (call stack), undo, DFS, matching brackets, and expression evaluation.</li><li><b>Infix → postfix:</b> scan left to right: operands go straight to the output; for an operator, pop operators of higher or equal precedence (for left-associative ones; <b>^ is right-associative</b>, so it only pops strictly higher) and then push it; "(" is pushed, ")" pops until "(". At the end pop everything. Example: a + b * c − d ⇒ <code>a b c * + d −</code>; a ^ b ^ c ⇒ <code>a b c ^ ^</code>.</li><li><b>Postfix evaluation:</b> push operands; for an operator pop two (second popped is the <i>left</i> operand), apply, push the result. Example: <code>2 3 4 * + 5 −</code> ⇒ 3·4 = 12, 2 + 12 = 14, 14 − 5 = <b>9</b>. The maximum stack depth during evaluation is a common question — simulate and note the peak.</li><li><b>Stack permutations:</b> if 1, 2, …, n are pushed in order (pops can be interleaved), the number of possible pop sequences is the Catalan number Cₙ (n = 4 ⇒ 14). To test a given output: simulate — push until the required next output is on top, pop it, and fail if it's buried. A pattern like 3 1 2 is impossible because 1 can't leave before 2 once 3 has left.</li></ul>
<h4>2. Queue (FIFO — first in, first out)</h4><ul><li><b>Enqueue</b> at the rear, <b>dequeue</b> from the front, both O(1) when done right. Uses: BFS, CPU scheduling, buffers, printer spooling.</li><li><b>Circular queue in an array of size n</b> (front and rear indices wrap around with mod n): empty when <code>front == rear</code>; full when <code>(rear + 1) % n == front</code> — this convention wastes one slot, so it holds at most <b>n − 1</b> items. Number of items = (rear − front + n) % n. (If the question keeps a separate count variable, all n slots can be used.)</li><li><b>Deque</b> allows insertion/deletion at both ends. <b>Priority queue</b>: element with the highest priority leaves first (usually a heap: insert and delete both O(log n)).</li><li><b>Queue using two stacks:</b> push to stack 1; for dequeue, if stack 2 is empty move everything from stack 1 to stack 2 (this reverses the order), then pop stack 2. Each element moves at most twice ⇒ <b>amortised O(1)</b> per operation, though a single dequeue can cost O(n). <b>Stack using two queues</b> makes either push or pop O(n).</li></ul>
<h4>3. Linked lists</h4><ul><li>A list is a chain of <b>nodes</b>; each holds data and a pointer to the next node (singly), plus a previous pointer (doubly); in a <b>circular</b> list the last node points back to the first. No random access (reaching the i-th node costs O(i)), but insertion/deletion needs no shifting.</li><li><b>Costs:</b></li></ul><table><tr><th>Operation</th><th>Singly (head only)</th><th>Singly + tail pointer</th><th>Doubly + both pointers</th></tr><tr><td>Insert at front</td><td>O(1)</td><td>O(1)</td><td>O(1)</td></tr><tr><td>Insert at end</td><td>O(n)</td><td>O(1)</td><td>O(1)</td></tr><tr><td>Delete first</td><td>O(1)</td><td>O(1)</td><td>O(1)</td></tr><tr><td>Delete last</td><td>O(n) (need the previous node)</td><td>O(n)</td><td>O(1)</td></tr><tr><td>Search by value</td><td>O(n)</td><td>O(n)</td><td>O(n)</td></tr><tr><td>Delete a node given a pointer to it</td><td>O(n), or O(1) by copying the next node's data into it (not possible for the last node)</td><td>same</td><td>O(1)</td></tr></table><ul><li><b>Implementing a queue with a singly list:</b> enqueue at the tail, dequeue at the head ⇒ both O(1) with head + tail pointers. A <b>stack</b> uses the head for push and pop. A <b>circular list with only a tail pointer</b> gives O(1) insertion at both the front and the back.</li><li><b>Reverse a list</b> (three pointers): <code>prev = NULL; while (cur) { nxt = cur-&gt;next; cur-&gt;next = prev; prev = cur; cur = nxt; } head = prev;</code> — O(n) time, O(1) extra space.</li><li><b>Classic two-pointer tricks:</b> middle of a list (slow moves 1, fast moves 2 — when fast reaches the end, slow is in the middle); <b>cycle detection</b> (Floyd: if fast meets slow there is a cycle); n-th node from the end (advance one pointer n steps first); merge two sorted lists in O(m + n).</li><li><b>Pointer questions:</b> read the code carefully for the order of assignments — changing <code>p-&gt;next</code> before saving it loses the rest of the list. Draw boxes and arrows after each statement.</li></ul>
<h4>4. Choosing between array and linked list</h4><ul><li>Array: O(1) random access, compact, cache-friendly, but insertion/deletion in the middle is O(n) and the size is fixed (a dynamic array doubles when full: amortised O(1) append). Linked list: flexible size and O(1) insertion given the position, but extra memory per node and O(n) access.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Operation sequences with mixed pushes/pops and a "what is on the stack at the end" question — just simulate, one operation at a time.</li><li>Expression questions with <b>unary or right-associative</b> operators, or asking for the postfix/prefix of the same expression (prefix = scan right to left, or reverse the infix and adjust).</li><li>Circular-queue conditions given in code with different conventions (count variable, or front/rear initialised to −1) — test with a tiny array.</li><li>"Which operation is O(1)?" in a given implementation: check whether it needs the <b>previous</b> node or the <b>last</b> node.</li></ul>`],
"Data Structures|Hashing":[`<p><b>Weight:</b> about 1–2 marks a year. Questions ask for the final table after inserting keys, the number of probes/comparisons, or the effect of the load factor. The hash simulator above reproduces the examples — try different probing methods.</p>
<h4>1. The idea</h4><ul><li>A <b>hash table</b> stores keys in an array of m slots; a <b>hash function</b> h(k) turns a key into a slot index so that search/insert/delete take O(1) <i>on average</i>. Since there are more possible keys than slots, two keys may map to the same slot — a <b>collision</b> — and the table needs a collision-resolution method.</li><li><b>Load factor α = n / m</b> (stored keys ÷ slots). Performance depends on α; tables are resized/rehashed when α gets large (about 0.7 for open addressing).</li><li><b>Hash functions:</b> division method h(k) = k mod m (choose m prime and not close to a power of 2); multiplication method; folding; mid-square. A good function spreads keys uniformly.</li></ul>
<h4>2. Collision resolution I — chaining</h4><ul><li>Each slot holds a linked list of all keys that hash there. Inserting is O(1) (at the head); a search walks the list. With α = n/m and uniform hashing: <b>expected comparisons ≈ 1 + α/2 for a successful search and α (or 1 + α counting the slot) for an unsuccessful one</b>. The load factor may exceed 1. Worst case (all keys in one chain): O(n).</li><li>If a question inserts n keys into the same chain while checking for duplicates first, the total number of comparisons is 0 + 1 + … + (n − 1) = n(n − 1)/2.</li></ul>
<h4>3. Collision resolution II — open addressing</h4><ul><li>All keys live in the table itself (so α ≤ 1). On a collision we follow a <b>probe sequence</b> h(k, 0), h(k, 1), … until we find an empty slot.<ul><li><b>Linear probing:</b> h(k, i) = (h(k) + i) mod m. Simple, cache-friendly, but suffers <b>primary clustering</b> (long runs of occupied slots grow).</li><li><b>Quadratic probing:</b> h(k, i) = (h(k) + c₁i + c₂i²) mod m. Reduces primary clustering but causes <b>secondary clustering</b> (keys with the same start follow the same sequence); may not visit every slot unless m and constants are chosen well (e.g. m prime and α ≤ ½).</li><li><b>Double hashing:</b> h(k, i) = (h₁(k) + i·h₂(k)) mod m. Closest to ideal; h₂(k) must never be 0 and should be coprime with m (m prime works).</li></ul></li><li><b>Expected probes</b> (uniform hashing): unsuccessful ≈ 1/(1 − α); successful ≈ (1/α)·ln(1/(1 − α)). They explode as α → 1.</li><li><b>Deletion:</b> you cannot simply empty a slot (it would break the probe chain of other keys). Mark it with a <b>tombstone</b> ("deleted"): searches continue past it, inserts may reuse it.</li></ul>
<h4>4. Worked example (linear probing)</h4><ul><li>m = 10, h(k) = k mod 10, insert 12, 18, 13, 2, 3, 23, 5, 15. 12 → slot 2; 18 → 8; 13 → 3; 2 → slot 2 is taken, 3 taken, so 4; 3 → 3, 4 taken, so 5; 23 → 3, 4, 5 taken, so 6; 5 → 5, 6 taken, so 7; 15 → 5, 6, 7, 8 taken, so 9.<br>Final table: slot 2 = 12, 3 = 13, 4 = 2, 5 = 3, 6 = 23, 7 = 5, 8 = 18, 9 = 15. Note the primary cluster from slot 2 to 9.</li><li>Same keys with chaining: slot 2 → {12, 2}, slot 3 → {13, 3, 23}, slot 5 → {5, 15}, slot 8 → {18}.</li></ul>
<h4>5. Counting questions</h4><ul><li>Expected number of colliding pairs when n keys hash uniformly into m slots = C(n, 2)/m = n(n − 1)/(2m). Guaranteed collision once n &gt; m (pigeonhole).</li><li><b>Perfect hashing</b> (no collisions for a known static set) and <b>universal hashing</b> (random choice of function) are advanced variants; <b>consistent hashing</b> is used in distributed systems.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Asking <i>which</i> slot a given key finally occupies, or the number of probes for the <i>last</i> insertion — you must simulate every earlier insertion, including keys that collide indirectly.</li><li>Mixing a deletion with later searches (tombstone vs empty slot) or giving a second hash function in double hashing.</li><li>Statements like "chaining requires α ≤ 1" (false) or "linear probing never suffers clustering" (false) — check each claim against the definitions above.</li></ul>`],
"Data Structures|Arrays & misc":[`<p><b>Weight:</b> about 1 mark a year, but the formulas also support questions in C, OS and algorithms. Learn them once.</p>
<h4>1. Arrays and address calculation</h4><ul><li>An array stores elements in <b>contiguous memory</b>, so any element is found in O(1) from its index. <b>1-D:</b> address(A[i]) = base + (i − lower bound) × w, where w = element size.</li><li><b>2-D</b> array with R rows and C columns, 0-based: <b>row-major</b> address of A[i][j] = base + (i × C + j) × w; <b>column-major</b> = base + (j × R + i) × w. If bounds start at 1 (or any lower bound), subtract the lower bound from each index first. For 3-D A[l][m][n]: base + ((i × m + j) × n + k) × w.</li><li>Insertion or deletion in the middle shifts elements: O(n). Binary search needs a <b>sorted</b> array: O(log n). Appending to a dynamic array (doubling when full) is amortised O(1).</li></ul>
<h4>2. Special matrices — storing fewer elements</h4><ul><li><b>Lower triangular</b> n × n matrix (nonzero only for i ≥ j): n(n + 1)/2 elements; row-major index (1-based) of A[i][j] = i(i − 1)/2 + j (0-based: i(i + 1)/2 + j). <b>Upper triangular</b> uses the mirror formula; <b>symmetric</b> matrices need only one triangle. <b>Tri-diagonal</b>: 3n − 2 elements.</li><li><b>Sparse matrices</b> (mostly zeros) are stored as a list of (row, column, value) triples; the saving appears when 3 × (non-zeros) &lt; rows × columns, or in compressed row (CSR) form with three arrays.</li></ul>
<h4>3. Graph representations</h4><ul><li><b>Adjacency matrix</b>: V × V array; O(V²) space; edge test O(1); listing neighbours O(V); good for dense graphs. <b>Adjacency list</b>: array of lists; O(V + E) space; edge test O(degree); listing neighbours O(degree); best for sparse graphs. Sum of all adjacency-list lengths = 2E (undirected) or E (directed).</li></ul>
<h4>4. Cheat-sheet of operation costs</h4><table><tr><th>Structure</th><th>Search</th><th>Insert</th><th>Delete</th><th>Notes</th></tr><tr><td>Unsorted array</td><td>O(n)</td><td>O(1) append</td><td>O(n)</td><td>random access O(1)</td></tr><tr><td>Sorted array</td><td>O(log n)</td><td>O(n)</td><td>O(n)</td><td>binary search</td></tr><tr><td>Linked list</td><td>O(n)</td><td>O(1) at head</td><td>O(1) at head</td><td>no random access</td></tr><tr><td>BST</td><td>O(h)</td><td>O(h)</td><td>O(h)</td><td>h = n − 1 in worst case</td></tr><tr><td>AVL / red–black</td><td>O(log n)</td><td>O(log n)</td><td>O(log n)</td><td>always balanced</td></tr><tr><td>Binary heap</td><td>O(n)</td><td>O(log n)</td><td>O(log n) (max)</td><td>find max O(1); build O(n)</td></tr><tr><td>Hash table</td><td>O(1) avg</td><td>O(1) avg</td><td>O(1) avg</td><td>worst case O(n)</td></tr></table>
<h4>How GATE makes it hard</h4><ul><li>Address questions with unusual lower bounds (A[−2 … 5][3 … 9]) or element sizes — subtract the bounds first, then use the row-major formula.</li><li>Triangular storage where the question asks for the position of a given element in the 1-D array — use the sum 1 + 2 + … + (i − 1) for the rows above, then add the column offset.</li></ul>`]

"Theory of Computation|Regular languages & finite automata":[`<p><b>Weight:</b> about 3 marks a year — the most reliable TOC topic. Typical items: number of states in a minimal DFA, which language is not regular, closure properties, regular-expression identities. Use the DFA tester above to feel how states "remember" information.</p>
<h4>1. Basic vocabulary</h4><ul><li>An <b>alphabet</b> Σ is a finite set of symbols; a <b>string</b> is a finite sequence of symbols (ε = the empty string); Σ* is the set of all strings; a <b>language</b> is any subset of Σ*. Number of strings of length n over Σ = |Σ|ⁿ. Operations on languages: union, intersection, complement (Σ* − L), concatenation L₁L₂, Kleene star L* (zero or more concatenations), reversal Lᴿ.</li><li><b>Chomsky hierarchy</b> (bigger classes contain smaller ones): <b>Type 3 regular</b> (finite automata) ⊂ <b>Type 2 context-free</b> (pushdown automata) ⊂ <b>Type 1 context-sensitive</b> (linear-bounded automata) ⊂ <b>Type 0 recursively enumerable</b> (Turing machines).</li></ul>
<h4>2. DFA — the idea of "remembering just enough"</h4><ul><li>A <b>deterministic finite automaton</b> reads the input one symbol at a time, always in exactly one state; it has a start state, accepting states, and a transition function δ(state, symbol) → state defined for <b>every</b> pair (use a <b>dead (trap) state</b> for "already failed"). It has only finite memory, so it can't count without limit.</li><li><b>How to design one:</b> ask "what do I need to remember about the part already read?" and make one state per possible answer. Examples: <b>divisible by k</b> (binary numbers): remember the remainder, δ(r, b) = (2r + b) mod k ⇒ k states. <b>Ends with 01</b>: remember how much of the pattern is matched ⇒ 3 states. <b>Even number of 0s and even number of 1s</b> ⇒ 4 states (parity pairs). <b>No two consecutive 1s</b> ⇒ 3 states including the dead state.</li></ul>
<h4>3. NFA and ε-moves</h4><ul><li>A <b>nondeterministic</b> automaton may have several (or no) transitions for a symbol, and ε-transitions that consume no input. It accepts if <b>at least one</b> path ends in an accepting state. NFAs are often much smaller, but they recognise exactly the same languages as DFAs.</li><li><b>Subset construction (NFA → DFA):</b> each DFA state is a <i>set</i> of NFA states; start with the ε-closure of the start state; for each symbol take the union of moves, then the ε-closure. An n-state NFA gives at most <b>2ⁿ</b> DFA states. The classic worst case: "the k-th symbol from the right end is 1" has a (k + 1)-state NFA but needs <b>2ᵏ</b> DFA states (e.g., 3rd from the end ⇒ 8 states).</li></ul>
<h4>4. Regular expressions</h4><ul><li>Built from symbols, ∅, ε with union (+ or |), concatenation and star. A language is regular ⇔ some regular expression describes it ⇔ some DFA/NFA accepts it.</li><li><b>Identities worth knowing:</b> R* R* = R*; (R*)* = R*; R R* = R* R = R⁺; ε + R R* = R*; (a + b)* = (a* b*)* = (a* + b*)*; ∅* = ε; ε* = ε; ∅R = ∅; R + ∅ = R; (R + S)* ≠ R* + S*. Remember: <b>a*b* ≠ (ab)*</b> and <b>(a + b)* contains every string over a, b</b>.</li><li><b>Arden's theorem:</b> if R = Q + RP and P does not contain ε then R = QP*. It is used to convert a DFA to a regular expression by writing one equation per state. Other conversions: regular expression → NFA (Thompson construction), DFA → regular expression (state elimination).</li><li><b>Regular grammars:</b> right-linear (A → aB | a | ε) and left-linear grammars generate exactly the regular languages.</li></ul>
<h4>5. Minimal DFA</h4><ul><li><b>Minimisation:</b> remove unreachable states, then split states into groups: two states are <b>distinguishable</b> if one is accepting and the other not, or if some symbol sends them to distinguishable states. Refine the partition until it stops changing; each remaining group becomes one state. The minimal DFA is <b>unique</b> (up to renaming states).</li><li><b>Myhill–Nerode theorem:</b> the number of states in the minimal DFA = the number of equivalence classes of strings (x ~ y if for every z, xz ∈ L ⇔ yz ∈ L). A language is regular ⇔ this number is finite. This is the best tool for counting minimal states.</li><li><b>Quick counts (minimal complete DFA, including the dead state):</b> strings ending with a fixed pattern of length m: m + 1; strings containing a fixed substring of length m: m + 1; length divisible by n: n; value divisible by n: n; exactly k a's: k + 2; at least k a's: k + 1; strings of length exactly n: n + 2; starting with a given symbol: 3.</li></ul>
<h4>6. Closure and decision properties</h4><ul><li>Regular languages are closed under <b>union, intersection, complement, difference, concatenation, star, reversal, homomorphism and inverse homomorphism</b>. <b>Complement</b> of a DFA: make it complete, swap accepting and non-accepting states (this does <i>not</i> work directly on an NFA). <b>Intersection/union:</b> product construction with m × n states.</li><li>A finite language is always regular; a subset of a regular language need not be regular; an <i>infinite</i> union of regular languages need not be regular.</li><li><b>Decidable for regular languages:</b> membership, emptiness, finiteness, equivalence, universality (L = Σ*). A DFA with n states accepts an infinite language ⇔ it accepts some string of length between n and 2n − 1.</li></ul>
<h4>7. Pumping lemma — proving a language is not regular</h4><ul><li><b>Statement:</b> if L is regular there is a number p such that every string w ∈ L with |w| ≥ p can be written w = xyz with |xy| ≤ p, |y| ≥ 1, and xyⁱz ∈ L for every i ≥ 0.</li><li>It is a game: <i>you</i> pick a long string in L; the <i>adversary</i> picks any split satisfying the conditions; <i>you</i> choose i so that the pumped string leaves L. Example: for {aⁿbⁿ} take w = aᵖbᵖ; since |xy| ≤ p, y consists only of a's, so pumping up (i = 2) gives more a's than b's ⇒ not in L ⇒ not regular.</li><li>Not regular: {aⁿbⁿ}, {ww}, {wwᴿ}, {aⁿ²}, {aᵖ : p prime}, {a^(2ⁿ)}, {w : #a(w) = #b(w)}, balanced parentheses. Regular (a common trap): {w : #a(w) mod 3 = 1}, {a^(n)b^(m) : n, m ≥ 0}. <b>The lemma can only prove non-regularity, never regularity.</b></li></ul>
<h4>8. Machines with output</h4><ul><li><b>Moore machine:</b> output depends only on the current state — an input of length n produces n + 1 outputs. <b>Mealy machine:</b> output depends on the state and the input symbol (on transitions) — n outputs. Moore → Mealy keeps the same number of states; Mealy → Moore may need more states.</li></ul>
<h4>9. Worked examples</h4><ul><li><b>Binary strings divisible by 3:</b> states r0 (start, accepting), r1, r2; δ(r, b) = (2r + b) mod 3. The string 110 (= 6): r0 →1→ r1 →1→ r0 →0→ r0 ⇒ accepted. Check it in the tester.</li><li><b>Minimal DFA for (a + b)*abb:</b> NFA has 4 states; the minimal DFA also has 4 states (it remembers 0, 1, 2 or 3 symbols of "abb").</li><li><b>Is {aⁿbᵐ : n ≠ m} regular?</b> No — if it were, its complement intersected with a*b* would give {aⁿbⁿ}, which is not regular.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Languages described by conditions on <b>two counts with a bound</b> (|#a − #b| ≤ 2 is regular, but #a = #b is not) — a bounded difference needs only finitely many states.</li><li>Closure questions combining operations (e.g. "is L₁ − L₂ regular if L₁ is regular and L₂ is not?" — not necessarily either way; look for a counterexample).</li><li>"Minimum states of a DFA/NFA" where the NFA count is smaller than the DFA count — read which machine is asked for; remember the dead state.</li><li>Regular expressions that look equal but aren't; check with small strings (ε, a, b, ab, ba).</li></ul>`],
"Theory of Computation|CFLs & pushdown automata":[`<p><b>Weight:</b> about 2–3 marks a year. Typical items: which languages are context-free, closure properties, ambiguity, number of steps in a derivation, and PDA behaviour.</p>
<h4>1. Context-free grammars (CFG)</h4><ul><li>A CFG = (V, Σ, P, S): variables (non-terminals), terminals, production rules A → α, a start symbol. A string is in the language if it can be <b>derived</b> from S by repeatedly replacing a variable with the right side of a rule. Examples: S → aSb | ε generates {aⁿbⁿ}; S → aSa | bSb | ε generates even-length palindromes wwᴿ; S → SS | aSb | ε generates balanced "a…b" sequences.</li><li>A <b>derivation</b> is <b>leftmost</b> (always expand the leftmost variable) or <b>rightmost</b>; a <b>parse tree</b> shows the structure. Each parse tree corresponds to exactly one leftmost derivation.</li><li><b>Ambiguity:</b> a grammar is ambiguous if some string has <b>two different parse trees</b> (equivalently two leftmost derivations). Example: E → E + E | E * E | id is ambiguous (id + id * id). Removing ambiguity: encode precedence and associativity in layers: E → E + T | T, T → T * F | F, F → id. A language is <b>inherently ambiguous</b> if every grammar for it is ambiguous (example: {aⁱbʲcᵏ : i = j or j = k}). Deciding whether a grammar is ambiguous is undecidable.</li><li><b>Simplification:</b> remove useless symbols, ε-productions and unit productions (A → B). <b>Chomsky normal form (CNF):</b> every rule is A → BC or A → a. <b>Greibach normal form:</b> every rule is A → aα (a terminal first). Facts for CNF: a derivation of a string of length n takes exactly <b>2n − 1</b> steps; the parse tree is binary. The <b>CYK algorithm</b> tests membership in O(n³).</li></ul>
<h4>2. Pushdown automata (PDA)</h4><ul><li>A PDA is a finite automaton plus a <b>stack</b>. A move depends on the state, the input symbol (or ε) and the top of the stack; it changes state and pushes/pops stack symbols. Acceptance is by <b>final state</b> or by <b>empty stack</b> — the two modes are equivalent in power for nondeterministic PDAs.</li><li>CFG ⇔ nondeterministic PDA. The stack gives <i>one</i> unbounded memory, used in LIFO order — enough to match nested pairs or compare <b>two</b> counts.</li><li><b>Design example for {aⁿbⁿ}:</b> push a for each a; for each b pop one a; accept when the input ends and the stack is empty.</li><li><b>Deterministic PDAs are weaker:</b> DCFL ⊊ CFL. {wwᴿ} needs nondeterminism (the machine has to <i>guess</i> the middle) but {wcwᴿ} (with a marker) is deterministic. Languages like {aⁱbʲcᵏ : i = j or j = k} are CFL but not DCFL.</li></ul>
<h4>3. What is (and isn't) context-free</h4><ul><li><b>Context-free:</b> {aⁿbⁿ}, {aⁿb²ⁿ}, {aⁿbᵐ : n ≤ m}, {wwᴿ}, {w : #a = #b}, {aⁿbᵐcᵐdⁿ}, balanced parentheses, {aⁱbʲcᵏ : i = j or j = k}, complement of {ww} (!), anything regular.</li><li><b>Not context-free:</b> {aⁿbⁿcⁿ}, {ww}, {aⁿ²}, {aᵖ : p prime}, {aⁱbʲcᵏ : i &lt; j &lt; k}, {aⁿbⁿcⁿdⁿ}.</li><li><b>Rule of thumb:</b> one stack can compare two counts or match a reversal; it cannot compare three counts or copy a string (ww needs a queue, not a stack).</li><li><b>Pumping lemma for CFLs:</b> if L is context-free there is p such that every w ∈ L with |w| ≥ p can be split w = uvxyz with |vxy| ≤ p, |vy| ≥ 1 and uvⁱxyⁱz ∈ L for all i ≥ 0. Used to prove non-CFL (e.g. aᵖbᵖcᵖ: the window vxy cannot touch all three letters, so pumping breaks the equality).</li></ul>
<h4>4. Closure properties</h4><ul><li><b>CFLs are closed under:</b> union, concatenation, Kleene star, reversal, homomorphism, intersection <i>with a regular language</i>. <b>Not closed under:</b> intersection, complement, difference. (Reason: {aⁿbⁿcᵐ} ∩ {aᵐbⁿcⁿ} = {aⁿbⁿcⁿ}, which is not a CFL.)</li><li><b>DCFLs are closed under complement</b> and intersection with regular languages, but <b>not</b> under union, intersection, concatenation, star or reversal.</li></ul>
<h4>5. Decision problems for CFGs</h4><ul><li><b>Decidable:</b> membership (CYK), emptiness, finiteness. <b>Undecidable:</b> equivalence of two CFGs, ambiguity, whether L(G) = Σ*, whether the intersection of two CFLs is empty, whether L(G) is regular.</li></ul>
<h4>6. Worked examples</h4><ul><li><b>Steps in a derivation:</b> S → aSb | ε generates aᵏbᵏ in k + 1 steps (k uses of the first rule, then ε).</li><li><b>Is the grammar S → aS | Sb | a | b ambiguous?</b> Yes — "ab" can be derived by applying aS first or Sb first with different trees.</li><li><b>L = {aⁱbʲcᵏ : i = j or j = k}:</b> the union of two CFLs ({aⁿbⁿc*} and {a*bⁿcⁿ}) ⇒ context-free; and a PDA must guess which equality to check ⇒ not deterministic.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Statements like "the complement of a CFL is a CFL" (false) next to "the complement of a DCFL is a DCFL" (true).</li><li>Languages made from a CFL and a regular one (intersection with regular stays CFL; union of two CFLs stays CFL) — build the new language step by step.</li><li>Counting the number of leftmost derivations/parse trees for a string in an ambiguous grammar, or the length of the derivation in CNF.</li><li>Languages like {aⁿbᵐcᵏ : n ≠ m or m ≠ k} (a union of CFLs, so CFL) mixed with {aⁿbⁿcⁿ} (not) — find which pair of conditions is actually required simultaneously.</li></ul>`],
"Theory of Computation|Decidability & Turing machines":[`<p><b>Weight:</b> about 2–3 marks a year. Mostly conceptual: which problems are decidable, which languages are recursive/RE, closure properties of the language classes, and reductions.</p>
<h4>1. The Turing machine (TM)</h4><ul><li>A TM has a finite control and an <b>infinite tape</b> it can read, write and move along (left/right). It starts with the input on the tape and, for each input, <b>accepts, rejects or loops forever</b>. It models what any algorithm can compute (<b>Church–Turing thesis</b>).</li><li><b>Variants with the same power:</b> multi-tape, two-way infinite tape, nondeterministic (a deterministic TM simulates a nondeterministic one, with exponential slowdown), multi-head. A <b>linear-bounded automaton</b> (tape limited to the input length) = context-sensitive languages.</li><li><b>Typical designs:</b> {aⁿbⁿcⁿ} — repeatedly mark one a, one b, one c; palindromes — compare the first and last symbol, erase both, repeat; {ww} — compare the two halves by crossing off matching symbols.</li></ul>
<h4>2. Recursive vs recursively enumerable</h4><ul><li>A language is <b>recursively enumerable (RE)</b> (semi-decidable, Turing-recognisable) if some TM accepts exactly its strings — it may <i>loop</i> on strings outside the language. A language is <b>recursive</b> (decidable) if some TM <b>halts on every input</b>, accepting members and rejecting the rest.</li><li><b>Hierarchy:</b> Regular ⊂ DCFL ⊂ CFL ⊂ CSL ⊂ Recursive ⊂ RE ⊂ all languages. There are only countably many TMs but uncountably many languages (diagonal argument), so most languages are not even RE.</li><li><b>Key facts:</b> if L and its complement L̄ are <b>both RE</b> then L is recursive (run both machines in parallel; one must halt). Hence the complement of an RE-but-not-recursive language is <b>not RE</b>.</li></ul>
<h4>3. Closure properties — the table to memorise</h4><table><tr><th>Class</th><th>Union</th><th>Intersection</th><th>Complement</th><th>Concatenation</th><th>Star</th><th>Reversal</th></tr><tr><td>Regular</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>DCFL</td><td>✗</td><td>✗</td><td>✓</td><td>✗</td><td>✗</td><td>✗</td></tr><tr><td>CFL</td><td>✓</td><td>✗</td><td>✗</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>CSL</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>Recursive</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>RE</td><td>✓</td><td>✓</td><td><b>✗</b></td><td>✓</td><td>✓</td><td>✓</td></tr></table><ul><li>Memory aid: only the RE class loses complement among the big ones; only CFL/DCFL lose intersection.</li></ul>
<h4>4. Undecidability — the halting problem</h4><ul><li>A TM can be written as a string ⟨M⟩, so machines can take machines as input (a <b>universal TM</b> simulates any M on input w).</li><li><b>Halting problem:</b> HALT = {⟨M, w⟩ : M halts on w}. It is <b>undecidable</b>. Proof idea: suppose a decider H exists; build D that on input ⟨M⟩ runs H(⟨M⟩, ⟨M⟩) and does the <i>opposite</i> (loops if H says "halts", halts otherwise). Running D on ⟨D⟩ gives a contradiction. Similarly A<sub>TM</sub> = {⟨M, w⟩ : M accepts w} is RE but not recursive, and its complement is not RE.</li></ul>
<h4>5. Reductions — how undecidability spreads</h4><ul><li><b>To prove problem B undecidable, reduce a known undecidable problem A to B</b> (A ≤ B): show that a decider for B would give a decider for A. <b>The direction matters</b> — reducing B to A proves nothing.</li><li>If A ≤ B and B is decidable ⇒ A is decidable. If A ≤ B and A is undecidable ⇒ B is undecidable. Likewise for RE: if A ≤ B and B is RE ⇒ A is RE.</li></ul>
<h4>6. Rice's theorem</h4><ul><li><b>Every non-trivial property of the language accepted by a TM is undecidable.</b> "Non-trivial" = some TMs have the property and some don't; it must be a property of L(M), not of the machine's description.</li><li><b>Undecidable by Rice:</b> is L(M) empty? finite? regular? context-free? equal to Σ*? does it contain the string "abc"? is L(M₁) = L(M₂)? <b>Not covered by Rice (and often decidable):</b> "does M have at least 5 states", "does M halt on w within k steps" (just simulate k steps), "does M ever move left on input w".</li></ul>
<h4>7. Decidable vs undecidable — summary table</h4><table><tr><th>Problem</th><th>Regular</th><th>CFL</th><th>TM / RE</th></tr><tr><td>Membership</td><td>decidable</td><td>decidable (CYK)</td><td>undecidable</td></tr><tr><td>Emptiness</td><td>decidable</td><td>decidable</td><td>undecidable</td></tr><tr><td>Finiteness</td><td>decidable</td><td>decidable</td><td>undecidable</td></tr><tr><td>Equivalence</td><td>decidable</td><td>undecidable</td><td>undecidable</td></tr><tr><td>Universality (L = Σ*)</td><td>decidable</td><td>undecidable</td><td>undecidable</td></tr><tr><td>Is it ambiguous / regular?</td><td>—</td><td>undecidable</td><td>—</td></tr></table><ul><li>Other undecidable problems: <b>Post Correspondence Problem (PCP)</b>, emptiness of the intersection of two CFLs, ambiguity of a CFG, whether a TM accepts the empty string. Decidable: membership, emptiness, finiteness for CFGs and DFAs; <b>halting for a linear-bounded automaton</b> (finitely many configurations).</li></ul>
<h4>8. Worked examples</h4><ul><li>"Given a TM M, is L(M) = ∅?" — undecidable (Rice); but "is L(M) ≠ ∅" is RE (search over inputs and steps in parallel) while "L(M) = ∅" is not RE.</li><li>L₁ = {⟨M⟩ : M accepts at least one string} is RE but not recursive. Its complement is not RE.</li><li>If L is recursive and L′ is RE, then L ∩ L′ is RE; if L is recursive then L̄ is recursive too.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Statements that mix "decidable", "semi-decidable" and "not RE" — decide for each problem whether <i>both</i> the language and its complement are RE.</li><li>Reductions in the wrong direction, or "A reduces to B and B is RE" — apply the rules above literally.</li><li>Rice-style properties that look like machine properties (number of states, halting in bounded time) but are actually decidable.</li><li>Closure questions with a recursive/RE language and a regular/CFL one — use the table and look for a counterexample for "not closed".</li></ul>`]

"Compiler Design|Parsing (LL, LR)":[`<p><b>Weight:</b> about 2–3 marks a year — the core of compiler design in GATE. Questions: compute FIRST/FOLLOW, decide whether a grammar is LL(1)/LR(0)/SLR(1)/LALR(1), count states or table entries, or trace a shift-reduce parse. The calculator above does FIRST, FOLLOW and the LL(1) table for any grammar — use it to check your hand work.</p>
<h4>1. What a parser does</h4><ul><li>The parser takes the stream of <b>tokens</b> from the lexical analyser and checks that it follows the grammar, building a <b>parse tree</b>. There are two families: <b>top-down</b> (start from the start symbol and expand — builds a leftmost derivation; LL parsers) and <b>bottom-up</b> (start from the tokens and reduce to the start symbol — builds a rightmost derivation <i>in reverse</i>; LR parsers).</li><li>Parser power (languages handled): LL(1) ⊂ LR(1) = all deterministic CFLs. Every LL(k) grammar is also LR(k), but not conversely.</li></ul>
<h4>2. Top-down parsing and LL(1)</h4><ul><li><b>Problems that must be fixed first.</b> <b>Left recursion</b> (A → Aα | β) makes a top-down parser loop forever. Remove it: A → βA′, A′ → αA′ | ε. <b>Common prefixes</b> (A → αβ₁ | αβ₂) leave the parser unable to choose. <b>Left-factor</b>: A → αA′, A′ → β₁ | β₂.</li><li><b>FIRST(X)</b> = set of terminals that can begin a string derived from X (include ε if X can derive ε). Rules: FIRST(terminal) = {terminal}; for A → X₁X₂…, add FIRST(X₁) − {ε}; if X₁ can vanish, also FIRST(X₂), and so on; add ε only if <i>all</i> symbols can vanish.</li><li><b>FOLLOW(A)</b> = set of terminals that can appear immediately to the right of A in some sentential form. Rules: put $ in FOLLOW(start); for a rule B → αAβ add FIRST(β) − {ε} to FOLLOW(A); if β is empty or can vanish, add FOLLOW(B) to FOLLOW(A). FOLLOW never contains ε.</li><li><b>LL(1) condition</b> — a grammar is LL(1) iff for every pair of alternatives A → α | β: (1) FIRST(α) ∩ FIRST(β) = ∅; (2) at most one of α, β can derive ε; (3) if β can derive ε, then FIRST(α) ∩ FOLLOW(A) = ∅. Equivalent: the <b>LL(1) parsing table has no cell with two entries</b>.</li><li><b>Building the table M[A, a]:</b> for each rule A → α: put it in M[A, t] for every terminal t in FIRST(α); and if ε ∈ FIRST(α) put it in M[A, b] for every b in FOLLOW(A). Empty cells = errors.</li><li>The predictive parser uses a stack: pop the top; if it is a terminal, match it with the input; if it is a non-terminal, look up M[A, next token] and push the right side reversed. Time O(n).</li><li>Every LL(1) grammar is unambiguous; an ambiguous grammar, a left-recursive grammar, or one that is not left-factored is <b>never</b> LL(1).</li><li><b>Example (arithmetic):</b> E → T E′; E′ → + T E′ | ε; T → F T′; T′ → * F T′ | ε; F → ( E ) | id. FIRST(E) = FIRST(T) = FIRST(F) = {(, id}; FIRST(E′) = {+, ε}; FIRST(T′) = {*, ε}. FOLLOW(E) = FOLLOW(E′) = {), $}; FOLLOW(T) = FOLLOW(T′) = {+, ), $}; FOLLOW(F) = {*, +, ), $}. The grammar is LL(1).</li></ul>
<h4>3. Bottom-up (shift–reduce) parsing</h4><ul><li>The parser keeps a stack. <b>Shift</b> moves the next input token onto the stack; <b>reduce</b> replaces the symbols on top of the stack that match a rule's right side (the <b>handle</b>) with the rule's left side; <b>accept</b> when only the start symbol remains and the input is finished. A <b>viable prefix</b> is a stack content that can still lead to a valid parse.</li><li><b>Conflicts:</b> <b>shift–reduce</b> (the parser can't tell whether to shift or reduce) and <b>reduce–reduce</b> (two different rules match). Ambiguous grammars always create conflicts, but yacc-style tools can resolve them with precedence and associativity declarations.</li><li><b>Example:</b> E → E + id | id, input id + id: shift id; reduce E → id; shift +; shift id; reduce E → E + id; accept.</li></ul>
<h4>4. The LR family — how it works</h4><ul><li>An LR parser uses a table built from a <b>DFA of items</b>. An <b>LR(0) item</b> is a rule with a dot showing how much has been recognised: A → α·β. Steps: <b>augment</b> the grammar with S′ → S; <b>closure(I)</b> adds items B → ·γ for every non-terminal B right after a dot; <b>goto(I, X)</b> moves the dot over X; the <b>canonical collection</b> is the set of all item-sets reachable from closure({S′ → ·S}) — each set is a parser state.</li><li>The table has an <b>ACTION</b> part (shift sN, reduce r, accept, error — for terminals and $) and a <b>GOTO</b> part (for non-terminals).</li><li>Different LR parsers differ only in <b>when they allow a reduce</b>: <b>LR(0)</b> — reduce A → α· in <i>every</i> column of that state (so a state with a complete item plus any other item is a conflict). <b>SLR(1)</b> — reduce only on terminals in FOLLOW(A). <b>LALR(1)</b> and <b>CLR(1) (canonical LR(1))</b> — reduce only on the exact lookahead symbols carried in the items: [A → α·, a].</li><li><b>CLR(1) vs LALR(1):</b> CLR(1) builds a separate state for each distinct set of lookaheads — the most powerful, but with many states. <b>LALR(1)</b> merges CLR states that have the <b>same core</b> (same LR(0) items) and unions their lookaheads. So <b>LALR(1), SLR(1) and LR(0) have the same number of states</b> (the LR(0) count); CLR(1) has the same or more.</li><li><b>Power:</b> LR(0) ⊂ SLR(1) ⊂ LALR(1) ⊂ CLR(1). Merging can create <b>reduce–reduce</b> conflicts in LALR that CLR doesn't have, but it <b>never creates new shift–reduce conflicts</b>. Real tools (yacc, bison) use LALR(1).</li><li><b>Classic example:</b> S → L = R | R; L → * R | id; R → L. It is <b>not SLR(1)</b> (in the state with S → L · = R and R → L · there is a shift/reduce conflict on "=", because = ∈ FOLLOW(R)), but it <b>is LALR(1)/CLR(1)</b>, since the precise lookahead for R → L · there is only $.</li><li><b>LR vs LL:</b> LR parsers handle left recursion and a larger class of grammars; LL parsers are easier to write by hand (recursive descent).</li></ul>
<h4>5. How to answer typical questions</h4><ul><li><b>"Is the grammar LL(1)?"</b> Check left recursion and common prefixes; then compute FIRST/FOLLOW and test the three conditions (or the table).</li><li><b>"Number of states / entries in the table"</b>: build the LR(0) item sets carefully — start from S′ → ·S, close, then take goto on each symbol after a dot; give each new set a number.</li><li><b>"Which conflicts occur in SLR but not LALR?"</b> Compare FOLLOW(A) (large) with the actual lookahead (small).</li><li><b>Operator-precedence parsers</b> work only for operator grammars (no ε-rules, no two adjacent non-terminals) and use a precedence relation between terminals.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>A grammar that is LR(1) but not LALR(1), or SLR but not LL(1) — know the relationships by heart and use examples to decide "always / sometimes / never" statements.</li><li>Hidden left recursion through nullable symbols (A → B A…, B → ε), or ε-productions that make FOLLOW sets big enough to break LL(1).</li><li>FIRST/FOLLOW sets where FOLLOW of a non-terminal depends on <b>another</b> non-terminal's FOLLOW several steps away — iterate until nothing changes.</li><li>Asking for the number of <i>conflict entries</i> in a table or the number of states of the CLR(1) parser (don't try to build it if the options let you reason: CLR(1) ≥ LALR(1) = SLR(1) = LR(0) state count).</li></ul>`],
"Compiler Design|Syntax-directed translation & intermediate code":[`<p><b>Weight:</b> about 1–2 marks a year. Typical items: attribute types, evaluating an SDT, three-address code (count temporaries/instructions), quadruples versus triples, basic blocks and the control-flow graph.</p>
<h4>1. Syntax-directed definitions (SDD) and translation (SDT)</h4><ul><li>A <b>syntax-directed definition</b> attaches <b>attributes</b> to grammar symbols and <b>semantic rules</b> to productions. Example: E → E₁ + T { E.val = E₁.val + T.val } — the value of the left side is computed from the right side.</li><li><b>Synthesised attribute</b>: computed from the attributes of the <b>children</b> (information flows up). <b>Inherited attribute</b>: computed from the <b>parent and/or left siblings</b> (information flows down or sideways) — for example the type passed to every identifier in a declaration "int a, b, c".</li><li>An SDD with only synthesised attributes is <b>S-attributed</b>; it can be evaluated during bottom-up (LR) parsing by performing the actions at the reduce step. An SDD whose inherited attributes depend only on the parent and <b>left</b> siblings is <b>L-attributed</b>; it can be evaluated in a single left-to-right depth-first pass (suits LL parsing). Every S-attributed definition is also L-attributed.</li><li><b>SDT</b> = a grammar with <b>semantic actions in braces</b> embedded in the right sides. A <b>postfix SDT</b> places all actions at the end, so it works naturally with bottom-up parsing. The order of the actions follows the order of the parse tree traversal.</li><li>The attributes are evaluated in the order given by the <b>dependency graph</b> (no cycles allowed). An <b>annotated parse tree</b> is the parse tree with attribute values written on the nodes.</li><li><b>How to trace an SDT:</b> build the parse tree for the input, then evaluate the actions in the order of the depth-first traversal; or simulate the shift–reduce parse and execute the action at each reduction.</li></ul>
<h4>2. Intermediate code</h4><ul><li>The compiler translates the source to an <b>intermediate representation (IR)</b> that is independent of the machine: a <b>syntax tree</b>, a <b>DAG</b>, <b>postfix notation</b> or <b>three-address code</b>.</li><li><b>DAG:</b> like a syntax tree but identical sub-expressions are <b>shared</b> (common sub-expression elimination). The number of nodes in the DAG ≤ nodes in the tree. Example: a + a * (b − c) + (b − c) * d — the sub-expression b − c is one node.</li><li><b>Three-address code (TAC):</b> each instruction has at most one operator and three addresses: <code>x = y op z</code>, copies <code>x = y</code>, jumps <code>if x relop y goto L</code>, <code>goto L</code>, array access <code>x = a[i]</code>, calls. Example: a = b*c + d*e becomes <code>t1 = b * c; t2 = d * e; t3 = t1 + t2; a = t3</code> (3 temporaries; the last copy can be merged).</li><li><b>Representations of TAC:</b><ul><li><b>Quadruples</b> (op, arg1, arg2, result) — 4 fields; temporaries are named, so code can be moved freely during optimisation.</li><li><b>Triples</b> (op, arg1, arg2) — 3 fields; a result is referred to by the <i>position</i> of the triple, so reordering needs renumbering.</li><li><b>Indirect triples</b> — a separate list of pointers to triples fixes the order, so statements can be reordered without changing triples. Quadruples use the most space; triples the least.</li></ul></li><li><b>Boolean expressions and control flow:</b> use <b>short-circuit</b> code with labels; <b>backpatching</b> fills in jump targets later (keep lists of incomplete jumps). Array references: address = base + (i − low) × width; for 2-D arrays add the row-major term.</li></ul>
<h4>3. Basic blocks and the control-flow graph (CFG)</h4><ul><li>A <b>basic block</b> is a maximal sequence of consecutive instructions with <b>one entry (the first instruction) and one exit (the last)</b>, with no jumps into or out of the middle.</li><li><b>Finding blocks:</b> mark the <b>leaders</b>: (1) the first instruction; (2) every instruction that is the <b>target</b> of a jump; (3) every instruction that <b>immediately follows</b> a jump (conditional or unconditional). Each block runs from a leader up to (not including) the next leader.</li><li>The <b>flow graph</b> has a node per block and an edge from B₁ to B₂ if B₂ can execute right after B₁ (a fall-through, or a jump). <b>Dominator:</b> d dominates n if every path from the entry to n passes through d. A <b>back edge</b> n → d where d dominates n identifies a <b>natural loop</b>.</li><li><b>Example:</b> 1: i = 0; 2: if i &gt;= 10 goto 7; 3: a = a + i; 4: i = i + 1; 5: goto 2; 6: x = 5; 7: y = 6. Leaders: 1; 2 (target of goto at 5); 3 (follows the jump at 2); 6 (follows the jump at 5); 7 (target of the jump at 2) ⇒ blocks {1}, {2}, {3–5}, {6}, {7} = 5 basic blocks.</li></ul>
<h4>4. Code generation topics</h4><ul><li><b>Register allocation:</b> build the <b>interference graph</b> (nodes = variables; an edge if both are live at the same time); k registers ⇒ colour the graph with k colours; variables that cannot be coloured are <b>spilled</b> to memory. The <b>minimum registers</b> needed (without spilling) for straight-line code = the maximum number of simultaneously live variables (at most the chromatic number of the interference graph).</li><li><b>Registers for an expression tree (Ershov / Sethi–Ullman numbering):</b> a leaf that is a left child gets label 1 (a right leaf gets 0); an inner node whose two children have labels l₁ and l₂ gets max(l₁, l₂) if they differ and l + 1 if they are equal. The label of the root = the minimum number of registers.</li></ul>
<h4>Worked examples</h4><ul><li><b>Quadruples for a = b + c * d:</b> (*, c, d, t1); (+, b, t1, t2); (=, t2, , a).</li><li><b>Same as triples:</b> (0) (*, c, d); (1) (+, b, (0)); (2) (=, a, (1)).</li><li><b>Attribute type:</b> in D → T L {L.in = T.type}, L → L₁ , id {L₁.in = L.in} the attribute <b>in</b> is inherited (it flows from T to the identifiers).</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Counting <b>temporaries</b> or instructions when the same sub-expression appears twice (DAG vs tree) and when the code uses unary minus or array indexing.</li><li>Statements like "every L-attributed definition is S-attributed" (false — it is the other way round) or "inherited attributes can't be evaluated in LR parsers" (they can, with extra machinery, but plain postfix SDTs can't).</li><li>Basic-block questions with conditional jumps in loops — carefully apply the three leader rules; jump targets given as line numbers.</li><li>SDT evaluation where actions are in the middle of a rule (not postfix) — the action runs at the exact position it appears during the traversal.</li></ul>`],
"Compiler Design|Lexical analysis, optimisation & runtime":[`<p><b>Weight:</b> about 1–2 marks a year, but spread over many small ideas: phases, tokens, symbol table, scoping, parameter passing, runtime stack, optimisation and data-flow analysis. Read the traps — the outputs of call-by-name and scoping questions are easy to get wrong.</p>
<h4>1. Phases of a compiler</h4><ul><li><b>Source → lexical analysis</b> (tokens) <b>→ syntax analysis</b> (parse tree) <b>→ semantic analysis</b> (type checking, annotated tree) <b>→ intermediate code generation → code optimisation → code generation</b> (target code). The <b>symbol table</b> and the <b>error handler</b> are used by all phases.</li><li><b>Front end</b> (analysis: lexical, syntax, semantic, IR) depends on the source language; <b>back end</b> (synthesis: optimisation, code generation) depends on the machine. A <b>pass</b> reads the whole program once; a compiler may be one-pass or multi-pass.</li><li>A <b>compiler</b> translates the whole program before running it; an <b>interpreter</b> executes statement by statement; an <b>assembler</b> translates assembly to machine code (usually in <b>two passes</b>: the first builds the symbol table / resolves label addresses, the second generates code); the <b>linker</b> combines object files and resolves external references; the <b>loader</b> places the program in memory (relocation).</li></ul>
<h4>2. Lexical analysis</h4><ul><li>The lexical analyser reads characters and produces <b>tokens</b>: <b>token</b> = a category (identifier, keyword, operator, number, punctuation); <b>lexeme</b> = the actual characters; <b>pattern</b> = the rule (usually a regular expression) describing the lexemes. Whitespace and comments are discarded (they are not tokens).</li><li>It is implemented as a DFA built from regular expressions (tools like Lex). Two rules: <b>longest match</b> (maximal munch) — keep reading while the lexeme can still match — and, if two patterns match the same lexeme, the <b>earlier rule</b> (so keywords win over identifiers).</li><li><b>Counting tokens:</b> scan left to right and cut at the longest match. <code>printf("i = %d, &amp;i = %x", i, &amp;i);</code> has <b>10 tokens</b> (printf, (, the string literal, comma, i, comma, &amp;, i, ), ;). <code>a+++b</code> splits as <code>a ++ + b</code> = 4 tokens. A string literal or a comment is one lexeme, no matter what is inside it.</li><li>Lexical errors (illegal characters, a malformed number) are detected here; many syntax and semantic errors (missing brackets, undeclared variables, type mismatches) are not.</li></ul>
<h4>3. Symbol table, scope and types</h4><ul><li>The <b>symbol table</b> stores each name's type, scope, memory location etc. It is usually a hash table. <b>Semantic analysis</b> checks declarations, types, and coercions (for example int → float).</li><li><b>Scope rules:</b> with <b>static (lexical) scoping</b> a name refers to the declaration in the <i>enclosing text</i> of the program; with <b>dynamic scoping</b> it refers to the most recent binding on the <i>call stack</i>. Example: global <code>int x = 10;</code> function f prints x; function g declares a local <code>int x = 20;</code> and calls f. Calling g(): static scoping prints <b>10</b>, dynamic scoping prints <b>20</b>. C, Java, Python and most languages are statically scoped.</li></ul>
<h4>4. Runtime environment</h4><ul><li><b>Activation record (stack frame)</b> — created at each call and holding: parameters, return value, return address, saved registers, local variables, temporaries, the <b>control link</b> (pointer to the caller's record; dynamic chain) and, for nested procedures, the <b>access link</b> (pointer to the lexically enclosing procedure's record; used for static scoping).</li><li>Storage areas: <b>static</b> (globals, fixed size), <b>stack</b> (calls, local variables; allows recursion), <b>heap</b> (dynamic allocation; needs garbage collection or manual free).</li><li><b>Parameter passing:</b><ul><li><b>Call by value:</b> the callee gets a copy; changes are invisible to the caller.</li><li><b>Call by reference:</b> the callee gets the address of the actual argument (computed <i>at the time of the call</i>); changes are visible, and aliases can appear.</li><li><b>Copy-restore (value-result):</b> copy in, then copy the final value back out when the procedure returns.</li><li><b>Call by name:</b> the argument expression is <i>re-evaluated each time the formal parameter is used</i>, in the caller's environment (like a macro; implemented with a thunk).</li></ul></li><li><b>Example:</b> <code>int i = 2, a[4] = {0,10,20,30}; void p(int x){ i = i + 1; x = x + 5; }</code> and the call <code>p(a[i]);</code>. <b>By value:</b> a unchanged, i = 3. <b>By reference</b> (and copy-restore): x is a[2] ⇒ a[2] becomes 25 (a = {0,10,25,30}), i = 3. <b>By name:</b> x means a[i] evaluated afresh; after i becomes 3, x = x + 5 updates <b>a[3]</b> ⇒ a = {0,10,20,35}, i = 3.</li></ul>
<h4>5. Code optimisation</h4><ul><li><b>Machine-independent optimisations:</b> <b>constant folding</b> (2 * 3 → 6 at compile time); <b>constant propagation</b>; <b>copy propagation</b>; <b>common sub-expression elimination</b>; <b>dead-code elimination</b> (code whose result is never used or that is unreachable); <b>strength reduction</b> (replace x * 2 by x &lt;&lt; 1, or a multiplication in a loop by an addition); <b>loop-invariant code motion</b> (move a computation that doesn't change inside the loop to before it); <b>induction-variable elimination</b>; loop unrolling; function inlining.</li><li><b>Peephole optimisation</b> looks at a small window of generated instructions (machine-dependent): removes redundant loads/stores, jumps to jumps, algebraic simplifications.</li><li>Optimisations must preserve the meaning of the program; they apply within a basic block (local) or across blocks (global, using data-flow analysis).</li></ul>
<h4>6. Data-flow analysis</h4><ul><li>A data-flow problem computes a set at each block entry and exit from <b>gen</b> (facts created in the block) and <b>kill</b> (facts destroyed). Forward: <b>OUT[B] = gen[B] ∪ (IN[B] − kill[B])</b> with IN[B] = combine of OUT of predecessors. Backward: IN[B] = gen[B] ∪ (OUT[B] − kill[B]) with OUT[B] = combine of IN of successors.</li><li>Four classic problems:</li></ul><table><tr><th>Problem</th><th>Direction</th><th>Combine at merge points</th><th>Used for</th></tr><tr><td>Reaching definitions</td><td>forward</td><td>union (may)</td><td>constant/copy propagation</td></tr><tr><td>Available expressions</td><td>forward</td><td>intersection (must)</td><td>common sub-expression elimination</td></tr><tr><td>Live variables</td><td>backward</td><td>union (may)</td><td>register allocation, dead code</td></tr><tr><td>Very busy expressions</td><td>backward</td><td>intersection (must)</td><td>code hoisting</td></tr></table><ul><li><b>Liveness example:</b> a = b + c; d = a + e; f = d * a. A variable is <i>live</i> between its definition and its last use. Working backward: before the last line, d and a are live; before line 2, a, e (and d is defined here); before line 1, b, c, e. The maximum number of simultaneously live variables is 3 (b, c, e) ⇒ at least 3 registers if all values must stay in registers.</li></ul>
<h4>How GATE makes it hard</h4><ul><li>Token counts with strings, comments, operators like <code>++</code>, <code>&gt;=</code>, <code>-&gt;</code>, or an unterminated string — apply maximal munch literally.</li><li>Scoping questions with nested functions and a callee that uses a variable also defined in the caller — decide static vs dynamic first, then follow the chain of enclosing declarations (static) or calls (dynamic).</li><li>Parameter-passing programs where the argument has a side effect (like <code>a[i++]</code>) — call by name evaluates it multiple times.</li><li>Data-flow questions that ask for IN/OUT of a given block — pay attention to the direction and to whether the merge is union or intersection.</li></ul>`]
