ptitude", "t": "Quantitative aptitude", "q": "A rewording of something written or spoken is a ______________.\n (A) paraphrase (B) paradox (C) paradigm (D) paraffin"}, {"y": 2016, "p": "2016_CS", "n": 3, "m": 1, "s": "General Aptitude", "t": "Verbal ability", "q": "Archimedes said, \u201cGive me a lever long enough and a fulcrum on which to place it, and I will move\n the world.\u201d\n The sentence above is an example of a ___________ statement.\n (A) figurative (B) collateral\n (C) literal (D) figurine"}, {"y": 2016, "p": "2016_CS", "n": 4, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "If \u2018relftaga\u2019 means carefree, \u2018otaga\u2019 means careful and \u2018fertaga\u2019 means careless, which of the\n following could mean \u2018aftercare\u2019?\n (A) zentaga (B) tagafer (C) tagazen (D) relffer"}, {"y": 2016, "p": "2016_CS", "n": 5, "m": 1, "s": "General Aptitude", "t": "Spatial & geometry", "q": "A cube is built using 64 cubic blocks of side one unit. After it is built, one cubic block is removed\n from every corner of the cube. The resulting surface area of the body (in square units) after the\n removal is __________.\n (A) 56 (B) 64 (C) 72 (D) 96\n 1/3\n GATE 2016 General Aptitude - GA Set-5"}, {"y": 2016, "p": "2016_CS", "n": 7, "m": 2, "s": "General Aptitude", "t": "Verbal ability", "q": "Indian currency notes show the denomination indicated in at least seventeen languages. If this is not\n an indication of the nation\u2019s diversity, nothing else is.\n Which of the following can be logically inferred from the above sentences?\n (A) India is a country of exactly seventeen languages.\n (B) Linguistic pluralism is the only indicator of a nation\u2019s diversity.\n (C) Indian currency notes have sufficient space for all the Indian languages.\n (D) Linguistic pluralism is strong evidence of India\u2019s diversity."}, {"y": 2016, "p": "2016_CS", "n": 8, "m": 2, "s": "General Aptitude", "t": "Verbal ability", "q": "Consider the following statements relating to the level of poker play of four players P, Q, R and S.\n I. P always beats Q\n II. R always beats S\n III. S loses to P only sometimes\n IV. R always loses to Q\n Which of the following can be logically inferred from the above statements?\n (i) P is likely to beat all the three other players\n (ii) S is the absolute worst player in the set\n (A) (i) only (B) (ii) only (C) (i) and (ii) (D) neither (i) nor (ii)"}, {"y": 2016, "p": "2016_CS", "n": 9, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "If f(\ud835\udc65\ud835\udc65) = 2\ud835\udc65\ud835\udc65 7 + 3\ud835\udc65\ud835\udc65 \u2212 5, which of the following is a factor of f(x)?\n (A) (x3+8) (B) (x-1) (C) (2x-5) (D) (x+1)\n 2/3\n GATE 2016 General Aptitude - GA Set-5"}, {"y": 2016, "p": "2016_CS", "n": 10, "m": 2, "s": "General Aptitude", "t": "Spatial & geometry", "q": "In a process, the number of cycles to failure decreases exponentially with an increase in load. At a\n load of 80 units, it takes 100 cycles for failure. When the load is halved, it takes 10000 cycles for\n failure. The load for which the failure will happen in 5000 cycles is ________.\n (A) 40.00 (B) 46.02 (C) 60.01 (D) 92.02\n END OF THE QUESTION PAPER\n 3/3\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 11, "m": 1, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "Consider the following directed graph:\n b c\n a f\n d e\n The number of different topological orderings of the vertices of the graph is ."}, {"y": 2016, "p": "2016_CS", "n": 12, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Consider the following C program.\n void f(int, short);\n void main()\n {\n int i = 100;\n short s = 12;\n short *p = &s;\n __________ ; // call to f()\n }\n Which one of the following expressions, when placed in the blank above, will NOT result in\n a type checking error?\n (A) f(s,*s)\n (B) i = f(i,s)\n (C) f(i,*s)\n (D) f(i,*p)\n CS(Set A) 3/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 13, "m": 1, "s": "Algorithms", "t": "Sorting & searching", "q": "The worst case running times of Insertion sort, Merge sort and Quick sort, respectively, are:\n (A) \u0398(n log n), \u0398(n log n), and \u0398(n2 )\n (B) \u0398(n2 ), \u0398(n2 ), and \u0398(n log n)\n (C) \u0398(n2 ), \u0398(n log n), and \u0398(n log n)\n (D) \u0398(n2 ), \u0398(n log n), and \u0398(n2 )"}, {"y": 2016, "p": "2016_CS", "n": 14, "m": 1, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "Let G be a weighted connected undirected graph with distinct positive edge weights. If every\n edge weight is increased by the same value, then which of the following statements is/are\n TRUE?\n P: Minimum spanning tree of G does not change\n Q: Shortest path between any pair of vertices does not change\n (A) P only\n (B) Q only\n (C) Neither P nor Q\n (D) Both P and Q\n CS(Set A) 4/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 15, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Consider the following C program.\n #include<stdio.h>\n void mystery(int *ptra, int *ptrb) {\n int *temp;\n temp = ptrb;\n ptrb = ptra;\n ptra = temp;\n }\n int main() {\n int a=2016, b=0, c=4, d=42;\n mystery(&a, &b);\n if (a < c)\n mystery(&c, &a);\n mystery(&a, &d);\n printf(\"%d\\n\", a);\n }\n The output of the program is ."}, {"y": 2016, "p": "2016_CS", "n": 17, "m": 1, "s": "Algorithms", "t": "NP-completeness", "q": "Which of the following decision problems are undecidable?\n I. Given NFAs N1 and N2 , is L(N1 ) \u2229 L(N2 ) = \u03a6?\n II. Given a CFG G = (N, \u03a3, P, S) and a string x \u2208 \u03a3\u2217 , does x \u2208 L(G)?\n III. Given CFGs G1 and G2 , is L(G1 ) = L(G2 )?\n IV. Given a TM M, is L(M) = \u03a6?\n (A) I and IV only\n (B) II and III only\n (C) III and IV only\n (D) II and IV only"}, {"y": 2016, "p": "2016_CS", "n": 18, "m": 1, "s": "Databases", "t": "SQL & relational algebra", "q": "Which one of the following regular expressions represents the language: the set of all binary\n strings having two consecutive 0s and two consecutive 1s?\n (A) (0 + 1)\u2217 0011(0 + 1)\u2217 + (0 + 1)\u2217 1100(0 + 1)\u2217\n (B) (0 + 1)\u2217 (00(0 + 1)\u2217 11 + 11(0 + 1)\u2217 00)(0 + 1)\u2217\n (C) (0 + 1)\u2217 00(0 + 1)\u2217 + (0 + 1)\u2217 11(0 + 1)\u2217\n (D) 00(0 + 1)\u2217 11 + 11(0 + 1)\u2217 00"}, {"y": 2016, "p": "2016_CS", "n": 19, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Consider the following code segment.\n x = u - t;\n y = x * v;\n x = y + w;\n y = t - z;\n y = x * y;\n The minimum number of total variables required to convert the above code segment to static\n single assignment form is .\n CS(Set A) 6/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 20, "m": 1, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "Consider an arbitrary set of CPU-bound processes with unequal CPU burst lengths\n submitted at the same time to a computer system. Which one of the following process\n scheduling algorithms would minimize the average waiting time in the ready queue?\n (A) Shortest remaining time first\n (B) Round-robin with time quantum less than the shortest CPU burst\n (C) Uniform random\n (D) Highest priority first with priority proportional to CPU burst length"}, {"y": 2016, "p": "2016_CS", "n": 22, "m": 1, "s": "Operating Systems", "t": "Scheduling & deadlock", "q": "Which one of the following is NOT a part of the ACID properties of database transactions?\n (A) Atomicity\n (B) Consistency\n (C) Isolation\n (D) Deadlock-freedom\n CS(Set A) 7/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 23, "m": 1, "s": "Databases", "t": "Normalization & functional dependencies", "q": "A database of research articles in a journal uses the following schema.\n (VOLUME , N UMBER , S TART PAGE , E ND PAGE , T ITLE , Y EAR , P RICE )\n The primary key is (VOLUME , N UMBER , S TART PAGE , E ND PAGE ) and the following\n functional dependencies exist in the schema.\n (VOLUME , N UMBER , S TART PAGE , E ND PAGE ) \u2192 T ITLE\n (VOLUME , N UMBER ) \u2192 Y EAR\n (VOLUME , N UMBER , S TART PAGE , E ND PAGE ) \u2192 P RICE\n The database is redesigned to use the following schemas.\n (VOLUME , N UMBER , S TART PAGE , E ND PAGE , T ITLE , P RICE )\n (VOLUME , N UMBER , Y EAR )\n Which is the weakest normal form that the new database satisfies, but the old one does not?\n (A) 1NF\n (B) 2NF\n (C) 3NF\n (D) BCNF"}, {"y": 2016, "p": "2016_CS", "n": 24, "m": 1, "s": "Computer Networks", "t": "Application layer & security", "q": "Which one of the following protocols is NOT used to resolve one form of address to another\n one?\n (A) DNS\n (B) ARP\n (C) DHCP\n (D) RARP"}, {"y": 2016, "p": "2016_CS", "n": 25, "m": 1, "s": "Computer Networks", "t": "Application layer & security", "q": "Which of the following is/are example(s) of stateful application layer protocols?\n (i) HTTP\n (ii) FTP\n (iii) TCP\n (iv) POP3\n (A) (i) and (ii) only\n (B) (ii) and (iii) only\n (C) (ii) and (iv) only\n (D) (iv) only\n CS(Set A) 8/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 27, "m": 1, "s": "Discrete Mathematics", "t": "Combinatorics & probability", "q": "Consider the recurrence relation a1 = 8, an = 6n2 + 2n + an\u22121 . Let a99 = K \u00d7 104 . The value\n of K is ."}, {"y": 2016, "p": "2016_CS", "n": 29, "m": 1, "s": "Discrete Mathematics", "t": "Combinatorics & probability", "q": "Consider the following experiment.\n Step 1. Flip a fair coin twice.\n Step 2. If the outcomes are (TAILS, HEADS) then output Y and stop.\n Step 3. If the outcomes are either (HEADS, HEADS) or (HEADS, TAILS), then output N and\n stop.\n Step 4. If the outcomes are (TAILS, TAILS), then go to Step 1.\n The probability that the output of the experiment is Y is (up to two decimal places)\n .\n CS(Set A) 9/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 30, "m": 1, "s": "Digital Logic", "t": "Combinational circuits & K-maps", "q": "Consider the two cascaded 2-to-1 multiplexers as shown in the figure.\n R\n 0 0 2\u2212to\u22121 0 2\u2212to\u22121 X\n R 1 MUX 1 MUX\n s s\n P Q\n The minimal sum of products form of the output X is\n (A) P\u0304 Q\u0304 + PQR\n (B) P\u0304Q + QR\n (C) PQ + P\u0304 Q\u0304R\n (D) Q\u0304 R\u0304 + PQR"}, {"y": 2016, "p": "2016_CS", "n": 31, "m": 1, "s": "Computer Organization", "t": "Cache & memory hierarchy", "q": "The size of the data count register of a DMA controller is 16 bits. The processor needs to\n transfer a file of 29,154 kilobytes from disk to main memory. The memory is byte addressable.\n The minimum number of times the DMA controller needs to get the control of the system bus\n from the processor to transfer the file from the disk to main memory is ."}, {"y": 2016, "p": "2016_CS", "n": 32, "m": 1, "s": "Computer Organization", "t": "Pipelining", "q": "The stage delays in a 4-stage pipeline are 800, 500, 400 and 300 picoseconds. The first\n stage (with delay 800 picoseconds) is replaced with a functionally equivalent design involving\n two stages with respective delays 600 and 350 picoseconds. The throughput increase of the\n pipeline is percent."}, {"y": 2016, "p": "2016_CS", "n": 33, "m": 1, "s": "Algorithms", "t": "Complexity & recurrences", "q": "Consider a carry lookahead adder for adding two n-bit integers, built using gates of fan-in at\n most two. The time to perform addition using this adder is\n (A) \u0398(1)\n (B) \u0398(log(n))\n \u221a\n (C) \u0398( n)\n (D) \u0398(n)\n CS(Set A) 10/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 34, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "The following function computes the maximum value contained in an integer array p[] of size\n n (n >= 1).\n int max(int *p, int n) {\n int a=0, b=n-1;\n while (__________) {\n if (p[a] <= p[b]) { a = a+1; }\n else { b = b-1; }\n }\n return p[a];\n }\n The missing loop condition is\n (A) a != n\n (B) b != 0\n (C) b > (a + 1)\n (D) b != a"}, {"y": 2016, "p": "2016_CS", "n": 35, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "What will be the output of the following C program?\n void count(int n){\n static int d=1;\n printf(\"%d \", n);\n printf(\"%d \", d);\n d++;\n if(n>1) count(n-1);\n printf(\"%d \", d);\n }\n void main(){\n count(3);\n }\n (A) 3 1 2 2 1 3 4 4 4\n (B) 3 1 2 1 1 1 2 2 2\n (C) 3 1 2 2 1 3 4\n (D) 3 1 2 1 1 1 2\n CS(Set A) 11/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 36, "m": 2, "s": "Compiler Design", "t": "Lexical analysis, optimisation & runtime", "q": "What will be the output of the following pseudo-code when parameters are passed by reference\n and dynamic scoping is assumed?\n a=3;\n void n(x) {x = x * a; print(x);}\n void m(y) {a = 1; a = y - a; n(a); print(a);}\n void main() {m(a);}\n (A) 6, 2\n (B) 6, 6\n (C) 4, 2\n (D) 4, 4"}, {"y": 2016, "p": "2016_CS", "n": 37, "m": 2, "s": "Algorithms", "t": "Complexity & recurrences", "q": "An operator delete(i) for a binary heap data structure is to be designed to delete the item in\n the i-th node. Assume that the heap is implemented in an array and i refers to the i-th index\n of the array. If the heap tree has depth d (number of edges on the path from the root to the\n farthest leaf), then what is the time complexity to re-fix the heap efficiently after the removal\n of the element?\n (A) O(1)\n (B) O(d) but not O(1)\n (C) O(2d ) but not O(d)\n (D) O(d 2d ) but not O(2d )"}, {"y": 2016, "p": "2016_CS", "n": 38, "m": 2, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "Consider the weighted undirected graph with 4 vertices, where the weight of edge {i, j} is\n given by the entry Wi j in the matrix W .\n \uf8ee \uf8f9\n 0 2 8 5\n \uf8ef 2 0 5 8 \uf8fa\n W =\uf8ef\uf8f0 8 5 0 x \uf8fb\n \uf8fa\n 5 8 x 0\n The largest possible integer value of x, for which at least one shortest path between some pair\n of vertices will contain the edge with weight x is ."}, {"y": 2016, "p": "2016_CS", "n": 39, "m": 2, "s": "Discrete Mathematics", "t": "Graph theory", "q": "Let G be a complete undirected graph on 4 vertices, having 6 edges with weights being 1, 2,\n 3, 4, 5, and 6. The maximum possible weight that a minimum weight spanning tree of G can\n have is .\n CS(Set A) 12/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 40, "m": 2, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "G = (V, E) is an undirected simple graph in which each edge has a distinct weight, and e is a\n particular edge of G. Which of the following statements about the minimum spanning trees\n (MSTs) of G is/are TRUE?\n I. If e is the lightest edge of some cycle in G, then every MST of G includes e\n II. If e is the heaviest edge of some cycle in G, then every MST of G excludes e\n (A) I only (B) II only (C) both I and II (D) neither I nor II"}, {"y": 2016, "p": "2016_CS", "n": 41, "m": 2, "s": "Algorithms", "t": "Complexity & recurrences", "q": "Let Q denote a queue containing sixteen numbers and S be an empty stack. Head(Q) returns\n the element at the head of the queue Q without removing it from Q. Similarly Top(S) returns\n the element at the top of S without removing it from S. Consider the algorithm given below.\n while Q is not Empty do\n if S is Empty OR Top(S) \u2264 Head(Q) then\n x := Dequeue(Q);\n Push(S, x);\n else\n x := Pop(S);\n Enqueue(Q, x);\n end\n end\n The maximum possible number of iterations of the while loop in the algorithm is\n ."}, {"y": 2016, "p": "2016_CS", "n": 42, "m": 2, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "Consider the following context-free grammars:\n G1 : S \u2192 aS|B, B \u2192 b|bB\n G2 : S \u2192 aA|bB, A \u2192 aA|B|\u03b5, B \u2192 bB|\u03b5\n Which one of the following pairs of languages is generated by G1 and G2 , respectively?\n (A) {am bn |m > 0 or n > 0} and {am bn |m > 0 and n > 0}\n (B) {am bn |m > 0 and n > 0} and {am bn |m > 0 or n \u2265 0}\n (C) {am bn |m \u2265 0 or n > 0} and {am bn |m > 0 and n > 0}\n (D) {am bn |m \u2265 0 and n > 0} and {am bn |m > 0 or n > 0}\n CS(Set A) 13/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 43, "m": 2, "s": "Theory of Computation", "t": "CFLs & pushdown automata", "q": "Consider the transition diagram of a PDA given below with input alphabet \u03a3 = {a, b} and\n stack alphabet \u0393 = {X, Z}. Z is the initial stack symbol. Let L denote the language accepted\n by the PDA.\n a, X/XX\n a, Z/XZ b, X/\u03b5\n b, X/\u03b5 \u03b5, Z/Z\n Which one of the following is TRUE?\n (A) L = {an bn |n \u2265 0} and is not accepted by any finite automata\n (B) L = {an |n \u2265 0} \u222a {an bn |n \u2265 0} and is not accepted by any deterministic PDA\n (C) L is not accepted by any Turing machine that halts on every input\n (D) L = {an |n \u2265 0} \u222a {an bn |n \u2265 0} and is deterministic context-free"}, {"y": 2016, "p": "2016_CS", "n": 44, "m": 2, "s": "Theory of Computation", "t": "Decidability & Turing machines", "q": "Let X be a recursive language and Y be a recursively enumerable but not recursive language.\n Let W and Z be two languages such that Y reduces to W , and Z reduces to X (reduction means\n the standard many-one reduction). Which one of the following statements is TRUE?\n (A) W can be recursively enumerable and Z is recursive.\n (B) W can be recursive and Z is recursively enumerable.\n (C) W is not recursively enumerable and Z is recursive.\n (D) W is not recursively enumerable and Z is not recursive."}, {"y": 2016, "p": "2016_CS", "n": 45, "m": 2, "s": "Digital Logic", "t": "Number systems & arithmetic", "q": "The attributes of three arithmetic operators in some programming language are given below.\n Operator Precedence Associativity Arity\n + High Left Binary\n \u2212 Medium Right Binary\n \u2217 Low Left Binary\n The value of the expression 2 \u2212 5 + 1 \u2212 7 \u2217 3 in this language is .\n CS(Set A) 14/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 46, "m": 2, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "Consider the following Syntax Directed Translation Scheme (SDTS), with non-terminals\n {S, A} and terminals {a, b}.\n S \u2212\u2192 aA { print 1 }\n S \u2212\u2192 a { print 2 }\n A \u2212\u2192 Sb { print 3 }\n Using the above SDTS, the output printed by a bottom-up parser, for the input aab is:\n (A) 1 3 2\n (B) 2 2 3\n (C) 2 3 1\n (D) syntax error"}, {"y": 2016, "p": "2016_CS", "n": 47, "m": 2, "s": "Operating Systems", "t": "Memory management & virtual memory", "q": "Consider a computer system with 40-bit virtual addressing and page size of sixteen\n kilobytes. If the computer system has a one-level page table per process and each page table\n entry requires 48 bits, then the size of the per-process page table is megabytes."}, {"y": 2016, "p": "2016_CS", "n": 48, "m": 2, "s": "Data Structures", "t": "Stacks, queues, linked lists", "q": "Consider a disk queue with requests for I/O to blocks on cylinders 47, 38, 121, 191, 87, 11,\n 92, 10. The C-LOOK scheduling algorithm is used. The head is initially at cylinder number\n 63, moving towards larger cylinder numbers on its servicing pass. The cylinders are numbered\n from 0 to 199. The total head movement (in number of cylinders) incurred while servicing\n these requests is ."}, {"y": 2016, "p": "2016_CS", "n": 49, "m": 2, "s": "Operating Systems", "t": "Memory management & virtual memory", "q": "Consider a computer system with ten physical page frames. The system is provided with\n an access sequence (a1 , a2 , . . . , a20 , a1 , a2 , . . . , a20 ), where each ai is a distinct virtual page\n number. The difference in the number of page faults between the last-in-first-out page\n replacement policy and the optimal page replacement policy is .\n CS(Set A) 15/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 50, "m": 2, "s": "Operating Systems", "t": "Process synchronization", "q": "Consider the following proposed solution for the critical section problem. There are n\n processes: P0 . . . Pn\u22121 . In the code, function pmax returns an integer not smaller than any\n of its arguments. For all i, t[i] is initialized to zero.\n Code for Pi :\n do {\n c[i]=1; t[i] = pmax(t[0],. . .,t[n-1])+1; c[i]=0;\n for every j 6= i in {0,. . .,n-1} {\n while (c[j]);\n while (t[j] != 0 && t[j]<=t[i]);\n }\n Critical Section;\n t[i]=0;\n Remainder Section;\n } while (true);\n Which one of the following is TRUE about the above solution?\n (A) At most one process can be in the critical section at any time\n (B) The bounded wait condition is satisfied\n (C) The progress condition is satisfied\n (D) It cannot cause a deadlock"}, {"y": 2016, "p": "2016_CS", "n": 51, "m": 2, "s": "Operating Systems", "t": "Scheduling & deadlock", "q": "Consider the following two phase locking protocol. Suppose a transaction T accesses (for\n read or write operations), a certain set of objects {O1 , . . . , Ok }. This is done in the following\n manner:\n Step 1. T acquires exclusive locks to O1 , . . . , Ok in increasing order of their addresses.\n Step 2. The required operations are performed.\n Step 3. All locks are released.\n This protocol will\n (A) guarantee serializability and deadlock-freedom\n (B) guarantee neither serializability nor deadlock-freedom\n (C) guarantee serializability but not deadlock-freedom\n (D) guarantee deadlock-freedom but not serializability\n CS(Set A) 16/17\n GATE 2016 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2016, "p": "2016_CS", "n": 52, "m": 2, "s": "Computer Networks", "t": "Application layer & security", "q": "Consider that B wants to send a message m that is digitally signed to A. Let the pair of private\n and public keys for A and B be denoted by Kx\u2212 and Kx+ for x = A, B, respectively. Let Kx (m)\n represent the operation of encrypting m with a key Kx and H(m) represent the message digest.\n Which one of the following indicates the CORRECT way of sending the message m along\n with the digital signature to A?\n (A) {m, KB+ (H(m))} (B) {m, KB\u2212 (H(m))} (C) {m, KA\u2212 (H(m))} (D) {m, KA+ (m)}"}, {"y": 2016, "p": "2016_CS", "n": 53, "m": 2, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "An IP datagram of size 1000 bytes arrives at a router. The router has to forward this packet on\n a link whose MTU (maximum transmission unit) is 100 bytes. Assume that the size of the IP\n header is 20 bytes.\n The number of fragments that the IP datagram will be divided into for transmission is\n ."}, {"y": 2016, "p": "2016_CS", "n": 54, "m": 2, "s": "Algorithms", "t": "Complexity & recurrences", "q": "For a host machine that uses the token bucket algorithm for congestion control, the token\n bucket has a capacity of 1 megabyte and the maximum output rate is 20 megabytes per second.\n Tokens arrive at a rate to sustain output at a rate of 10 megabytes per second. The token bucket\n is currently full and the machine needs to send 12 megabytes of data. The minimum time\n required to transmit the data is seconds."}, {"y": 2016, "p": "2016_CS", "n": 55, "m": 2, "s": "Operating Systems", "t": "Memory management & virtual memory", "q": "A sender uses the Stop-and-Wait ARQ protocol for reliable transmission of frames. Frames\n are of size 1000 bytes and the transmission rate at the sender is 80 Kbps (1Kbps = 1000\n bits/second). Size of an acknowledgement is 100 bytes and the transmission rate at the receiver\n is 8 Kbps. The one-way propagation delay is 100 millis s), CPU burst time (in milliseconds).\nand priority (0 is the highest priority) shown below. None of the processes have I/O burst time.\nProcess Burst Time Priority\nRA | oT\nCe a\n2\nPy ss\n[a\nThe average waiting time (in milliseconds) of all the processes using preemptive priority\nscheduling algorithm is \u2018"}, {"y": 2017, "p": "2017_CS2", "n": 52, "m": 2, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "Correct : 2 Wrong: 0\nIf the characteristic polynomial of a 3 x 3 matrix M over R (the set of real numbers) is\n23 \u2014 42? + ad +30. aE R, and one eigenvalue of M is 2, then the largest among the absolute\nvalues of the eigenvalues of M is :"}, {"y": 2017, "p": "2017_CS2", "n": 53, "m": 2, "s": "Computer Organization", "t": "Cache & memory hierarchy", "q": "Correct : 2 Wrong: 0\nConsider a machine with a byte addressable main memory of 23? bytes divided into blocks of size\n32 bytes. Assume that a direct mapped cache having 512 cache lines is used with this machine. The\nsize of the tag field in bits is :"}, {"y": 2017, "p": "2017_CS2", "n": 54, "m": 2, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Correct : 2 Wrong: 0\nConsider the following C Program.\n#include<stdio.h>\nint main() {\nint m = 10;\nint n; niy\nn = ++m;\nnl = mt+;\nfina;\nwohl?\nn -= nl;\nprinti( 3d\", nj;\nreturn 0;\n}\nThe output of the program is 5"}, {"y": 2017, "p": "2017_CS2", "n": 55, "m": 2, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Correct :2 Wrong: 0\nConsider the following C Program.\n#include<stdio.h>\n#include<string.h>\nint main() {\nchar* c = \"GATECSIT2017\";\nchar* p = c;\nprintf(\"%d\", (int) strlen(c+2[p]-6[p]-1));\nreturn 0;\n}\nThe output of the program is ;"}, {"y": 2017, "p": "2017_CS2", "n": 60, "m": 2, "s": "Discrete Mathematics", "t": "Combinatorics & probability", "q": "Correct : 1 Wrong : -0.33\nThere are 3 red socks, 4 green socks and 3 blue socks. You choose 2 socks. The probability that\nthey are of the same colour is\n(A) 1/5 (B) 7/30 (C) 1/4 (D) 4/15"}, {"y": 2017, "p": "2017_CS2", "n": 64, "m": 2, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "Correct : 2 Wrong : -0.66\nThe number of roots of e* + 0.5x? \u2014 2 = 0 in the range [\u20145, 5] is\n(A)0 (B)1 (c)2 (D) 3"}, {"y": 2017, "p": "2017_CS2", "n": 65, "m": 2, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "Correct : 2 Wrong : -0.66\nAn air pressure contour line joins locations in a region having the same atmospheric pressure. The\nfollowing is an air pressure contour plot of a geographical region. Contour lines are shown at 0.05\nbar intervals in this plot.\n2%\n91\n\u2014\u2014 |\no 1 2km\nIf the possibility of a thunderstorm is given by how fast airpressure rises or drops over a region.\nwhich of the following regions is most likely to have a thunderstorm?\n(A)P (B)Q (C)R (D)s\n[G.No. | Type | Section [Key | Marks\n[41 wea fsa)\n[2 wea [6822 a\n[3s cafes\n[4 | mca fcs2 |e) 1\nfs | mca | cs2 | c) 1\n[6 | wea cs2_ [aA ot\n[7 wea [6s\n[wea fest\n[9s wea [esa\n[40 cafes\n[| wea fcs2 [At\n[2 | caf cs2 fc) 1\n[43__|wca_[ esa | 8\n[4 cafes\n[1s wca [esa\n[16 caf esa)\n[48 caf cs2 |e) 1\n[49 war | cs2 | 0000) 1\n[20 war_[ cs2_| 90090) 1\n[a nar 682 | 01 00r |\n[nares | 201020\n[a3 NAT 682 | t6.010 160) 1\n[24 | nar | cs2 | o0e0 | 1\n[25 | "}, {"y": 2018, "p": "2018_CS", "n": 2, "m": 1, "s": "General Aptitude", "t": "Verbal ability", "q": "\u201cA _________ investigation can sometimes yield new facts, but typically organized ones\n are more successful.\u201d\n The word that best fills the blank in the above sentence is\n (A) meandering (B) timely (C) consistent (D) systematic"}, {"y": 2018, "p": "2018_CS", "n": 3, "m": 1, "s": "General Aptitude", "t": "Spatial & geometry", "q": "The area of a square is \ud835\udc51. What is the area of the circle which has the diagonal of the\n square as its diameter?\n 1 1\n (A) \ud835\udf0b\ud835\udc51 (B) \ud835\udf0b\ud835\udc51 2 (C) \ud835\udf0b\ud835\udc51 2 (D) \ud835\udf0b\ud835\udc51\n 4 2"}, {"y": 2018, "p": "2018_CS", "n": 4, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "What would be the smallest natural number which when divided either by 20 or by 42 or\n by 76 leaves a remainder of 7 in each case?\n (A) 3047 (B) 6047 (C) 7987 (D) 63847"}, {"y": 2018, "p": "2018_CS", "n": 5, "m": 1, "s": "General Aptitude", "t": "Logical reasoning & data interpretation", "q": "What is the missing number in the following sequence?\n 2, 12, 60, 240, 720, 1440, _____, 0\n (A) 2880 (B) 1440 (C) 720 (D) 0\nGA 1/3\nGATE 2018 General Aptitude (GA) Set-3"}, {"y": 2018, "p": "2018_CS", "n": 7, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "If \ud835\udc5d\ud835\udc5e\ud835\udc5f \u2260 0 and \ud835\udc5d\u2212\ud835\udc65 = , \ud835\udc5e \u2212\ud835\udc66 = , \ud835\udc5f \u2212\ud835\udc67 = , what is the value of the product \ud835\udc65\ud835\udc66\ud835\udc67?\n \ud835\udc5e \ud835\udc5f \ud835\udc5d\n (A) \u22121 1 (C) 1 (D) \ud835\udc5d\ud835\udc5e\ud835\udc5f\n (B)\n \ud835\udc5d\ud835\udc5e\ud835\udc5f"}, {"y": 2018, "p": "2018_CS", "n": 8, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "In a party, 60% of the invited guests are male and 40% are female. If 80% of the invited\n guests attended the party and if all the invited female guests attended, what would be the\n ratio of males to females among the attendees in the party?\n (A) 2:3 (B) 1:1 (C) 3:2 (D) 2:1"}, {"y": 2018, "p": "2018_CS", "n": 9, "m": 2, "s": "General Aptitude", "t": "Spatial & geometry", "q": "In the figure below, \u2220\ud835\udc37\ud835\udc38\ud835\udc36 + \u2220\ud835\udc35\ud835\udc39\ud835\udc36 is equal to ____________ .\n E\n D C\n F\n B\n A\n (A) \u2220\ud835\udc35\ud835\udc36\ud835\udc37 \u2212 \u2220\ud835\udc35\ud835\udc34\ud835\udc37 (B) \u2220\ud835\udc35\ud835\udc34\ud835\udc37 + \u2220\ud835\udc35\ud835\udc36\ud835\udc39\n (C) \u2220\ud835\udc35\ud835\udc34\ud835\udc37 + \u2220\ud835\udc35\ud835\udc36\ud835\udc37 (D) \u2220\ud835\udc36\ud835\udc35\ud835\udc34 + \u2220\ud835\udc34\ud835\udc37\ud835\udc36\nGA 2/3\nGATE 2018 General Aptitude (GA) Set-3"}, {"y": 2018, "p": "2018_CS", "n": 10, "m": 2, "s": "General Aptitude", "t": "Spatial & geometry", "q": "A six sided unbiased die with four green faces and two red faces is rolled seven times.\n Which of the following combinations is the most likely outcome of the experiment?\n (A) Three green faces and four red faces.\n (B) Four green faces and three red faces.\n (C) Five green faces and two red faces.\n (D) Six green faces and one red face.\n END OF THE QUESTION PAPER\nGA 3/3\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 11, "m": 1, "s": "Databases", "t": "ER model, indexing & B+ trees", "q": "In an Entity-Relationship (ER) model, suppose \ud835\udc45 is a many-to-one relationship from entity\n set E1 to entity set E2. Assume that E1 and E2 participate totally in \ud835\udc45 and that the cardinality\n of E1 is greater than the cardinality of E2.\n Which one of the following is true about \ud835\udc45?\n (A) Every entity in E1 is associated with exactly one entity in E2.\n (B) Some entity in E1 is associated with more than one entity in E2.\n (C) Every entity in E2 is associated with exactly one entity in E1.\n (D) Every entity in E2 is associated with at most one entity in E1.\nCS 3/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 12, "m": 1, "s": "Databases", "t": "SQL & relational algebra", "q": "Consider the following two tables and four queries in SQL.\n Book (isbn, bname), Stock (isbn, copies)\n Query 1: SELECT B.isbn, S.copies\n FROM Book B INNER JOIN Stock S\n ON B.isbn = S.isbn;\n Query 2: SELECT B.isbn, S.copies\n FROM Book B LEFT OUTER JOIN Stock S\n ON B.isbn = S.isbn;\n Query 3: SELECT B.isbn, S.copies\n FROM Book B RIGHT OUTER JOIN Stock S\n ON B.isbn = S.isbn;\n Query 4: SELECT B.isbn, S.copies\n FROM Book B FULL OUTER JOIN Stock S\n ON B.isbn = S.isbn;\n Which one of the queries above is certain to have an output that is a superset of the outputs\n of the other three queries?\n (A) Query 1 (B) Query 2 (C) Query 3 (D) Query 4"}, {"y": 2018, "p": "2018_CS", "n": 13, "m": 1, "s": "Computer Networks", "t": "Transport layer (TCP/UDP)", "q": "Match the following:\n Field Length in bits\n P. UDP Header\u2019s Port Number I. 48\n Q. Ethernet MAC Address II. 8\n R. IPv6 Next Header III. 32\n S. TCP Header\u2019s Sequence Number IV. 16\n (A) P-III, Q-IV, R-II, S-I (B) P-II, Q-I, R-IV, S-III\n (C) P-IV, Q-I, R-II, S-III (D) P-IV, Q-I, R-III, S-II\nCS 4/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 14, "m": 1, "s": "Computer Networks", "t": "Transport layer (TCP/UDP)", "q": "Consider the following statements regarding the slow start phase of the TCP congestion\n control algorithm. Note that cwnd stands for the TCP congestion window and MSS denotes\n the Maximum Segment Size.\n (i) The cwnd increases by 2 MSS on every successful acknowledgment.\n (ii) The cwnd approximately doubles on every successful acknowledgement.\n (iii) The cwnd increases by 1 MSS every round trip time.\n (iv) The cwnd approximately doubles every round trip time.\n Which one of the following is correct?\n (A) Only (ii) and (iii) are true (B) Only (i) and (iii) are true\n (C) Only (iv) is true (D) Only (i) and (iv) are true"}, {"y": 2018, "p": "2018_CS", "n": 15, "m": 1, "s": "Discrete Mathematics", "t": "Combinatorics & probability", "q": "Two people, P and Q, decide to independently roll two identical dice, each with 6 faces,\n numbered 1 to 6. The person with the lower number wins. In case of a tie, they roll the dice\n repeatedly until there is no tie. Define a trial as a throw of the dice by P and Q. Assume that\n all 6 numbers on each dice are equi-probable and that all trials are independent. The\n probability (rounded to 3 decimal places) that one of them wins on the third trial is _____."}, {"y": 2018, "p": "2018_CS", "n": 16, "m": 1, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "\ud835\udf0b/4\n The value of \u222b0 \ud835\udc65 cos(\ud835\udc65 2 )\ud835\udc51\ud835\udc65 correct to three decimal places\n (assuming that \ud835\udf0b = 3.14 ) is _____."}, {"y": 2018, "p": "2018_CS", "n": 17, "m": 1, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "Consider a matrix A \uf03d uv\n T where u \uf03d \uf0e6 1 \uf0f6 , v \uf03d \uf0e61\uf0f6 . Note that vT denotes the\n \uf0e7 \uf0f7 \uf0e7 \uf0f7\n \uf0e8 2\uf0f8 \uf0e81\uf0f8\n transpose of v. The largest eigenvalue of A is _____."}, {"y": 2018, "p": "2018_CS", "n": 18, "m": 1, "s": "Discrete Mathematics", "t": "Graph theory", "q": "The chromatic number of the following graph is _______.\nCS 5/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 19, "m": 1, "s": "Discrete Mathematics", "t": "Logic, sets, relations & algebra", "q": "Let G be a finite group on 84 elements. The size of a largest possible proper subgroup of G\n is ________."}, {"y": 2018, "p": "2018_CS", "n": 20, "m": 1, "s": "Algorithms", "t": "Complexity & recurrences", "q": "The postorder traversal of a binary tree is 8,9,6,7,4,5,2,3,1. The inorder traversal of the same\n tree is 8,6,9,4,7,2,5,1,3. The height of a tree is the length of the longest path from the root to\n any leaf. The height of the binary tree above is ______."}, {"y": 2018, "p": "2018_CS", "n": 21, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Consider the following C program:\n #include <stdio.h>\n int counter = 0;\n int calc (int a, int b) {\n int c;\n counter++;\n if (b==3) return (a*a*a);\n else {\n c = calc(a, b/3);\n return (c*c*c);\n }\n }\n int main (){\n calc(4, 81);\n printf (\"%d\", counter);\n }\n The output of this program is _____."}, {"y": 2018, "p": "2018_CS", "n": 22, "m": 1, "s": "Digital Logic", "t": "Sequential circuits", "q": "Consider the sequential circuit shown in the figure, where both flip-flops used are positive\n edge-triggered D flip-flops.\n in out\n D Q D Q\n clock\n The number of states in the state transition diagram of this circuit that have a transition back\n to the same state on some value of \u201cin\u201d is _____.\nCS 6/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 23, "m": 1, "s": "Computer Organization", "t": "Cache & memory hierarchy", "q": "A 32-bit wide main memory unit with a capacity of 1 GB is built using 256M \u00d7 4-bit DRAM\n chips. The number of rows of memory cells in the DRAM chip is 214 . The time taken to\n perform one refresh operation is 50 nanoseconds. The refresh period is 2 milliseconds. The\n percentage (rounded to the closest integer) of the time available for performing the memory\n read/write operations in the main memory unit is __________."}, {"y": 2018, "p": "2018_CS", "n": 24, "m": 1, "s": "Operating Systems", "t": "Scheduling & deadlock", "q": "Consider a system with 3 processes that share 4 instances of the same resource type. Each\n process can request a maximum of \ud835\udc3e instances. Resource instances can be requested and\n released only one at a time. The largest value of \ud835\udc3e that will always avoid deadlock is ____."}, {"y": 2018, "p": "2018_CS", "n": 25, "m": 1, "s": "Computer Networks", "t": "Transport layer (TCP/UDP)", "q": "Consider a long-lived TCP session with an end-to-end bandwidth of 1 Gbps (= 109 bits-per-\n second). The session starts with a sequence number of 1234. The minimum time (in seconds,\n rounded to the closest integer) before this sequence number can be used again is _______."}, {"y": 2018, "p": "2018_CS", "n": 27, "m": 1, "s": "Theory of Computation", "t": "Decidability & Turing machines", "q": "Let N be the set of natural numbers. Consider the following sets.\n P: Set of Rational numbers (positive and negative)\n Q: Set of functions from {0, 1} to N\n R: Set of functions from N to {0, 1}\n S: Set of finite subsets of N.\n Which of the sets above are countable?\n (A) Q and S only (B) P and S only (C) P and R only (D) P, Q and S only"}, {"y": 2018, "p": "2018_CS", "n": 28, "m": 1, "s": "Discrete Mathematics", "t": "Logic, sets, relations & algebra", "q": "Consider the first-order logic sentence\n \ud835\udf11 \u2261 \u2203\ud835\udc60\u2203\ud835\udc61\u2203\ud835\udc62\u2200\ud835\udc63\u2200\ud835\udc64\u2200\ud835\udc65\u2200\ud835\udc66 \ud835\udf13(\ud835\udc60, \ud835\udc61, \ud835\udc62, \ud835\udc63, \ud835\udc64, \ud835\udc65, \ud835\udc66)\n where \ud835\udf13(\ud835\udc60, \ud835\udc61, \ud835\udc62, \ud835\udc63, \ud835\udc64, \ud835\udc65, \ud835\udc66) is a quantifier-free first-order logic formula using only predicate\n symbols, and possibly equality, but no function symbols. Suppose \ud835\udf11 has a model with a\n universe containing 7 elements.\n Which one of the following statements is necessarily true?\n (A) There exists at least one model of \ud835\udf11 with universe of size less than or equal to 3.\n (B) There exists no model of \ud835\udf11 with universe of size less than or equal to 3.\n (C) There exists no model of \ud835\udf11 with universe of size greater than 7.\n (D) Every model of \ud835\udf11 has a universe of size equal to 7.\nCS 8/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 29, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Consider the following C program:\n #include<stdio.h>\n void fun1(char *s1, char *s2){\n char *tmp;\n tmp = s1;\n s1 = s2;\n s2 = tmp;\n }\n void fun2(char **s1, char **s2){\n char *tmp;\n tmp = *s1;\n *s1 = *s2;\n *s2 = tmp;\n }\n int main(){\n char *str1 = \"Hi\", *str2 = \"Bye\";\n fun1(str1, str2); printf(\"%s %s \", str1, str2);\n fun2(&str1, &str2); printf(\"%s %s\", str1, str2);\n return 0;\n }\n The output of the program above is\n (A) Hi Bye Bye Hi (B) Hi Bye Hi Bye\n (C) Bye Hi Hi Bye (D) Bye Hi Bye Hi"}, {"y": 2018, "p": "2018_CS", "n": 30, "m": 1, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "Let G be a simple undirected graph. Let TD be a depth first search tree of G. Let TB be a\n breadth first search tree of G. Consider the following statements.\n (I) No edge of G is a cross edge with respect to TD. (A cross edge in G is between two\n nodes neither of which is an ancestor of the other in TD.)\n (II) For every edge (u,v) of G, if u is at depth i and v is at depth j in TB, then |\ud835\udc56 \u2212 \ud835\udc57| = 1.\n Which of the statements above must necessarily be true?\n (A) I only (B) II only\n (C) Both I and II (D) Neither I nor II\nCS 9/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 31, "m": 1, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "Assume that multiplying a matrix G1 of dimension \ud835\udc5d \u00d7 \ud835\udc5e with another matrix G2 of\n dimension \ud835\udc5e \u00d7 \ud835\udc5f requires \ud835\udc5d\ud835\udc5e\ud835\udc5f scalar multiplications. Computing the product of n matrices\n G1G2G3\u2026Gn can be done by parenthesizing in different ways. Define Gi Gi+1 as an explicitly\n computed pair for a given paranthesization if they are directly multiplied. For example, in\n the matrix multiplication chain G1G2G3G4G5G6 using parenthesization\n (G1(G2G3))(G4(G5G6)), G2G3 and G5G6 are the only explicitly computed pairs.\n Consider a matrix multiplication chain F1F2F3F4F5, where matrices F1, F2, F3, F4 and F5 are\n of dimensions 2\u00d725, 25\u00d73, 3\u00d716, 16\u00d71 and 1\u00d71000, respectively. In the parenthesization of\n F1F2F3F4F5 that minimizes the total number of scalar multiplications, the explicitly\n computed pairs is/are\n (A) F1F2 and F3F4 only (B) F2F3 only\n (C) F3F4 only (D) F1F2 and F4F5 only"}, {"y": 2018, "p": "2018_CS", "n": 32, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Consider the following C code. Assume that unsigned long int type length is 64\n bits.\n unsigned long int fun(unsigned long int n){\n unsigned long int i, j = 0, sum = 0;\n for (i = n; i > 1; i = i/2) j++;\n for ( ; j > 1; j = j/2) sum++;\n return(sum);\n }\n The value returned when we call fun with the input 240 is\n (A) 4 (B) 5 (C) 6 (D) 40"}, {"y": 2018, "p": "2018_CS", "n": 33, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Consider the unsigned 8-bit fixed point binary number representation below,\n b7 b6 b5 b4 b3 . b2 b1 b0\n where the position of the binary point is between b3 and b2. Assume b7 is the most significant\n bit. Some of the decimal numbers listed below cannot be represented exactly in the above\n representation:\n (i) 31.500 (ii) 0.875 (iii) 12.100 (iv) 3.001\n Which one of the following statements is true?\n (A) None of (i), (ii), (iii), (iv) can be exactly represented\n (B) Only (ii) cannot be exactly represented\n (C) Only (iii) and (iv) cannot be exactly represented\n (D) Only (i) and (ii) cannot be exactly represented\nCS 10/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 34, "m": 1, "s": "Computer Organization", "t": "Cache & memory hierarchy", "q": "The size of the physical address space of a processor is 2\ud835\udc43 bytes. The word length is\n 2\ud835\udc4a bytes. The capacity of cache memory is 2\ud835\udc41 bytes. The size of each cache block is\n 2\ud835\udc40 words. For a \ud835\udc3e-way set-associative cache memory, the length (in number of bits) of the\n tag field is\n (A) \ud835\udc43 \u2212 \ud835\udc41 \u2212 log 2 \ud835\udc3e (B) \ud835\udc43 \u2212 \ud835\udc41 + log 2 \ud835\udc3e\n (C) \ud835\udc43 \u2212 \ud835\udc41 \u2212 \ud835\udc40 \u2212 \ud835\udc4a \u2212 log 2 \ud835\udc3e (D) \ud835\udc43 \u2212 \ud835\udc41 \u2212 \ud835\udc40 \u2212 \ud835\udc4a + log 2 \ud835\udc3e"}, {"y": 2018, "p": "2018_CS", "n": 35, "m": 1, "s": "Theory of Computation", "t": "CFLs & pushdown automata", "q": "Consider the following languages:\n I. {\ud835\udc4e\ud835\udc5a \ud835\udc4f \ud835\udc5b \ud835\udc50 \ud835\udc5d \ud835\udc51 \ud835\udc5e | \ud835\udc5a + \ud835\udc5d = \ud835\udc5b + \ud835\udc5e, where \ud835\udc5a, \ud835\udc5b, \ud835\udc5d, \ud835\udc5e \u2265 0}\n II. {\ud835\udc4e\ud835\udc5a \ud835\udc4f \ud835\udc5b \ud835\udc50 \ud835\udc5d \ud835\udc51 \ud835\udc5e | \ud835\udc5a = \ud835\udc5b and \ud835\udc5d = \ud835\udc5e, where \ud835\udc5a, \ud835\udc5b, \ud835\udc5d, \ud835\udc5e \u2265 0}\n III. {\ud835\udc4e\ud835\udc5a \ud835\udc4f \ud835\udc5b \ud835\udc50 \ud835\udc5d \ud835\udc51 \ud835\udc5e | \ud835\udc5a = \ud835\udc5b = \ud835\udc5d and \ud835\udc5d \u2260 \ud835\udc5e, where \ud835\udc5a, \ud835\udc5b, \ud835\udc5d, \ud835\udc5e \u2265 0}\n IV. {\ud835\udc4e\ud835\udc5a \ud835\udc4f \ud835\udc5b \ud835\udc50 \ud835\udc5d \ud835\udc51 \ud835\udc5e | \ud835\udc5a\ud835\udc5b = \ud835\udc5d + \ud835\udc5e, where \ud835\udc5a, \ud835\udc5b, \ud835\udc5d, \ud835\udc5e \u2265 0}\n Which of the languages above are context-free?\n (A) I and IV only (B) I and II only\n (C) II and III only (D) II and IV only"}, {"y": 2018, "p": "2018_CS", "n": 36, "m": 2, "s": "Theory of Computation", "t": "Decidability & Turing machines", "q": "Consider the following problems. \ud835\udc3f(\ud835\udc3a) denotes the language generated by a grammar \ud835\udc3a.\n \ud835\udc3f(\ud835\udc40) denotes the language accepted by a machine \ud835\udc40.\n (I) For an unrestricted grammar \ud835\udc3a and a string \ud835\udc64, whether \ud835\udc64 \u2208 \ud835\udc3f(\ud835\udc3a)\n (II) Given a Turing machine M, whether L(M) is regular\n (III) Given two grammars \ud835\udc3a1 and \ud835\udc3a2 , whether \ud835\udc3f(\ud835\udc3a1 ) = \ud835\udc3f(\ud835\udc3a2 )\n (IV) Given an NFA N, whether there is a deterministic PDA P such that N and P\n accept the same language.\n Which one of the following statements is correct?\n (A) Only I and II are undecidable (B) Only III is undecidable\n (C) Only II and IV are undecidable (D) Only I, II and III are undecidable\nCS 11/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 37, "m": 2, "s": "Compiler Design", "t": "Lexical analysis, optimisation & runtime", "q": "A lexical analyzer uses the following patterns to recognize three tokens T1, T2, and T3 over\n the alphabet {a,b,c}.\n \ud835\udc471 : \ud835\udc4e? (\ud835\udc4f|\ud835\udc50)\u2217 \ud835\udc4e\n \ud835\udc472 : \ud835\udc4f? (\ud835\udc4e|\ud835\udc50)\u2217 \ud835\udc4f\n \ud835\udc473 : \ud835\udc50? (\ud835\udc4f|\ud835\udc4e)\u2217 \ud835\udc50\n Note that \u2018x?\u2019 means 0 or 1 occurrence of the symbol x. Note also that the analyzer outputs\n the token that matches the longest possible prefix.\n If the string \ud835\udc4f\ud835\udc4f\ud835\udc4e\ud835\udc4e\ud835\udc50\ud835\udc4e\ud835\udc4f\ud835\udc50 is processed by the analyzer, which one of the following is the\n sequence of tokens it outputs?\n (A) \ud835\udc471 \ud835\udc472 \ud835\udc473 (B) \ud835\udc471 \ud835\udc471 \ud835\udc473 (C) \ud835\udc472 \ud835\udc471 \ud835\udc473 (D) \ud835\udc473 \ud835\udc473"}, {"y": 2018, "p": "2018_CS", "n": 38, "m": 2, "s": "Data Structures", "t": "Trees, BST, AVL, heaps", "q": "Consider the following parse tree for the expression a#b$c$d#e#f, involving two binary\n operators $ and #.\n Which one of the following is correct for the given parse tree?\n (A) $ has higher precedence and is left associative; # is right associative\n (B) # has higher precedence and is left associative; $ is right associative\n (C) $ has higher precedence and is left associative; # is left associative\n (D) # has higher precedence and is right associative; $ is left associative\nCS 12/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 39, "m": 2, "s": "Operating Systems", "t": "Scheduling & deadlock", "q": "In\n 0 a system, there are three types of resources: E, F and G. Four processes P0, P1, P2 and P3\n execute concurrently. At the outset, the processes have declared their maximum resource\n requirements using a matrix named Max as given below. For example, Max[P2,F] is the\n maximum number of instances of F that P2 would require. The number of instances of the\n resources allocated to the various processes at any given state is given by a matrix named\n Allocation.\n Consider a state of the system with the Allocation matrix as shown below, and in which 3\n instances of E and 3 instances of F are the only resources available.\n Allocation Max\n E F G E F G\n P0 1 0 1 P0 4 3 1\n P1 1 1 2 P1 2 1 4\n P2 1 0 3 P2 1 3 3\n P3 2 0 0 P3 5 4 1\n From the perspective of deadlock avoidance, which one of the following is true?\n (A) The system is in safe state.\n (B) The system is not in safe state, but would be safe"}, {"y": 2018, "p": "2018_CS", "n": 40, "m": 2, "s": "Operating Systems", "t": "Process synchronization", "q": "Consider the following solution to the producer-consumer synchronization problem. The\n shared buffer size is \ud835\udc41. Three semaphores empty, full and mutex are defined with respective\n initial values of 0, \ud835\udc41 and 1. Semaphore empty denotes the number of available slots in the\n buffer, for the consumer to read from. Semaphore full denotes the number of available slots\n in the buffer, for the producer to write to. The placeholder variables, denoted by P, Q, R,\n and S, in the code below can be assigned either empty or full. The valid semaphore\n operations are: wait() and signal().\n Producer: Consumer:\n do{ do{\n wait(P); wait(R);\n wait(mutex); wait(mutex);\n //Add item to buffer //Consume item from buffer\n signal(mutex); signal(mutex);\n signal(Q); signal(S);\n }while(1); }while(1);\n Which one of the following assignments to P, Q, R and S will yield the correct solution?\n (A) P: full, Q: full, R: emp"}, {"y": 2018, "p": "2018_CS", "n": 41, "m": 2, "s": "Databases", "t": "SQL & relational algebra", "q": "Consider the relations r(A, B) and s(B, C), where s.B is a primary key and r.B is a foreign\n key referencing s.B. Consider the query\n Q: \ud835\udc5f \u22c8 (\ud835\udf0e\ud835\udc35<5 (\ud835\udc60))\n Let LOJ denote the natural left outer-join operation. Assume that r and s contain no null\n values.\n Which one of the following queries is NOT equivalent to Q?\n (A) \ud835\udf0e\ud835\udc35<5 (\ud835\udc5f \u22c8 \ud835\udc60) (B) \ud835\udf0e\ud835\udc35<5 (\ud835\udc5f \ud835\udc3f\ud835\udc42\ud835\udc3d \ud835\udc60)\n (C) \ud835\udc5f \ud835\udc3f\ud835\udc42\ud835\udc3d (\ud835\udf0e\ud835\udc35<5 (\ud835\udc60)) (D) \ud835\udf0e\ud835\udc35<5 (\ud835\udc5f) \ud835\udc3f\ud835\udc42\ud835\udc3d \ud835\udc60\nCS 14/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 42, "m": 2, "s": "Computer Networks", "t": "Application layer & security", "q": "Consider the following four relational schemas. For each schema, all non-trivial functional\n dependencies are listed. The underlined attributes are the respective primary keys.\n Schema I: Registration (rollno, courses)\n Field \u2018courses\u2019 is a set-valued attribute containing the set of courses a student has\n registered for.\n Non-trivial functional dependency:\n rollno \uf0ae courses\n Schema II: Registration (rollno, courseid, email)\n Non-trivial functional dependencies:\n rollno, courseid \uf0ae email\n email \uf0ae rollno\n Schema III: Registration (rollno, courseid, marks, grade)\n Non-trivial functional dependencies:\n rollno, courseid \uf0ae marks, grade\n marks \uf0ae grade\n Schema IV: Registration (rollno, courseid, credit)\n Non-trivial functional dependencies:\n rollno, courseid \uf0ae credit\n courseid \uf0ae credit\n Which one of the relational schemas above is in 3NF but not in BCNF?\n (A) Schema I (B) Schema II (C) Schema II"}, {"y": 2018, "p": "2018_CS", "n": 43, "m": 2, "s": "Discrete Mathematics", "t": "Graph theory", "q": "Let G be a graph with 100! vertices, with each vertex labelled by a distinct permutation of\n the numbers 1,2, \u2026 , 100. There is an edge between vertices \ud835\udc62 and \ud835\udc63 if and only if the label\n of \ud835\udc62 can be obtained by swapping two adjacent numbers in the label of \ud835\udc63. Let \ud835\udc66 denote the\n degree of a vertex in G, and \ud835\udc67 denote the number of connected components in G.\n Then, \ud835\udc66 + 10\ud835\udc67 = _____.\nCS 15/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 44, "m": 2, "s": "Discrete Mathematics", "t": "Combinatorics & probability", "q": "Consider Guwahati (G) and Delhi (D) whose temperatures can be classified as high (\ud835\udc3b),\n medium (\ud835\udc40) and low (\ud835\udc3f). Let \ud835\udc43(\ud835\udc3b\ud835\udc3a ) denote the probability that Guwahati has high\n temperature. Similarly, \ud835\udc43(\ud835\udc40\ud835\udc3a ) and \ud835\udc43(\ud835\udc3f\ud835\udc3a ) denotes the probability of Guwahati having\n medium and low temperatures respectively. Similarly, we use \ud835\udc43(\ud835\udc3b\ud835\udc37 ), \ud835\udc43(\ud835\udc40\ud835\udc37 ) and \ud835\udc43(\ud835\udc3f\ud835\udc37 ) for\n Delhi.\n The following table gives the conditional probabilities for Delhi\u2019s temperature given\n Guwahati\u2019s temperature.\n \ud835\udc3b\ud835\udc37 \ud835\udc40\ud835\udc37 \ud835\udc3f\ud835\udc37\n \ud835\udc3b\ud835\udc3a 0.40 0.48 0.12\n \ud835\udc40\ud835\udc3a 0.10 0.65 0.25\n \ud835\udc3f\ud835\udc3a 0.01 0.50 0.49\n Consider the first row in the table above. The first entry denotes that if Guwahati has high\n temperature (\ud835\udc3b\ud835\udc3a ) then the probability of Delhi also having a high temperature (\ud835\udc3b\ud835\udc37 ) is 0.40;\n i.e., \ud835\udc43(\ud835\udc3b\ud835\udc37 |\ud835\udc3b\ud835\udc3a ) = 0.40. Similarly, the next two entries are \ud835\udc43(\ud835\udc40\ud835\udc37 |\ud835\udc3b\ud835\udc3a ) = 0.48 and\n \ud835\udc43(\ud835\udc3f\ud835\udc37 |\ud835\udc3b\ud835\udc3a ) = 0.12. Similarly for the other rows.\n If it is known that \ud835\udc43(\ud835\udc3b\ud835\udc3a ) = 0.2, \ud835\udc43(\ud835\udc40\ud835\udc3a ) = 0"}, {"y": 2018, "p": "2018_CS", "n": 45, "m": 2, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "Consider the following program written in pseudo-code. Assume that x and y are integers.\n Count(x,y) {\n if (y != 1){\n if (x != 1) {\n print(\"*\");\n Count(x/2, y);\n }\n else {\n y = y-1;\n Count(1024, y);\n }\n }\n }\n The number of times that the print statement is executed by the call\n Count(1024,1024) is _____."}, {"y": 2018, "p": "2018_CS", "n": 46, "m": 2, "s": "Data Structures", "t": "Trees, BST, AVL, heaps", "q": "The number of possible min-heaps containing each value from {1, 2, 3, 4, 5, 6, 7} exactly once\n is _____.\nCS 16/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 47, "m": 2, "s": "Discrete Mathematics", "t": "Graph theory", "q": "Consider the following undirected graph G:\n 4 x\n 1 3\n 4\n 5\n 4\n Choose a value for x that will maximize the number of minimum weight spanning trees\n (MWSTs) of G. The number of MWSTs of G for this value of x is ______."}, {"y": 2018, "p": "2018_CS", "n": 48, "m": 2, "s": "Algorithms", "t": "Greedy & graph algorithms", "q": "Consider the weights and values of items listed below. Note that there is only one unit of\n each item.\n Item number Weight Value\n (in Kgs) (in Rupees)\n 1 10 60\n 2 7 28\n 3 4 20\n 4 2 24\n The task is to pick a subset of these items such that their total weight is no more than 11 Kgs\n and their total value is maximized. Moreover, no item may be split. The total value of items\n picked by an optimal algorithm is denoted by \ud835\udc49opt . A greedy algorithm sorts the items by\n their value-to-weight ratios in descending order and packs them greedily, starting from the\n first item in the ordered list. The total value of items picked by the greedy algorithm is\n denoted by \ud835\udc49greedy .\n The value of \ud835\udc49opt \u2212 \ud835\udc49greedy is ____________."}, {"y": 2018, "p": "2018_CS", "n": 49, "m": 2, "s": "Digital Logic", "t": "Combinational circuits & K-maps", "q": "Consider the minterm list form of a Boolean function \ud835\udc39 given below.\n \ud835\udc39(\ud835\udc43, \ud835\udc44, \ud835\udc45, \ud835\udc46) = \u2211 \ud835\udc5a(0, 2, 5, 7, 9, 11) + \ud835\udc51(3, 8, 10, 12, 14)\n Here, \ud835\udc5a denotes a minterm and \ud835\udc51 denotes a don\u2019t care term. The number of essential prime\n implicants of the function \ud835\udc39 is ______.\nCS 17/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 50, "m": 2, "s": "Computer Organization", "t": "Pipelining", "q": "The instruction pipeline of a RISC processor has the following stages: Instruction Fetch (IF),\n Instruction Decode (ID), Operand Fetch (OF), Perform Operation (PO) and Writeback (WB).\n The IF, ID, OF and WB stages take 1 clock cycle each for every instruction. Consider a\n sequence of 100 instructions. In the PO stage, 40 instructions take 3 clock cycles each, 35\n instructions take 2 clock cycles each, and the remaining 25 instructions take 1 clock cycle\n each. Assume that there are no data hazards and no control hazards.\n The number of clock cycles required for completion of execution of the sequence of\n instructions is ______."}, {"y": 2018, "p": "2018_CS", "n": 51, "m": 2, "s": "Computer Organization", "t": "Instruction set, addressing & control unit", "q": "A processor has 16 integer registers (R0, R1, .. , R15) and 64 floating point registers (F0,\n F1,\u2026 , F63). It uses a 2-byte instruction format. There are four categories of instructions:\n Type-1, Type-2, Type-3, and Type-4. Type-1 category consists of four instructions, each\n with 3 integer register operands (3Rs). Type-2 category consists of eight instructions, each\n with 2 floating point register operands (2Fs). Type-3 category consists of fourteen\n instructions, each with one integer register operand and one floating point register operand\n (1R+1F). Type-4 category consists of N instructions, each with a floating point register\n operand (1F).\n The maximum value of N is __________."}, {"y": 2018, "p": "2018_CS", "n": 53, "m": 2, "s": "Operating Systems", "t": "Files, disk, I/O, system calls", "q": "Consider a storage disk with 4 platters (numbered as 0, 1, 2 and 3), 200 cylinders (numbered\n as 0, 1, \u2026 , 199), and 256 sectors per track (numbered as 0, 1, \u2026 , 255). The following 6\n disk requests of the form [sector number, cylinder number, platter number] are received by\n the disk controller at the same time:\n [120, 72, 2] , [180, 134, 1] , [60, 20, 0] , [212, 86, 3] , [56, 116, 2] , [118, 16, 1]\n Currently the head is positioned at sector number 100 of cylinder 80, and is moving towards\n higher cylinder numbers. The average power dissipation in moving the head over 100\n cylinders is 20 milliwatts and for reversing the direction of the head movement once is 15\n milliwatts. Power dissipation associated with rotational latency and switching of head\n between different platters is negligible.\n The total power consumption in milliwatts to satisfy all of the above disk requests using the\n "}, {"y": 2018, "p": "2018_CS", "n": 54, "m": 2, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "Consider an IP packet with a length of 4,500 bytes that includes a 20-byte IPv4 header and\n a 40-byte TCP header. The packet is forwarded to an IPv4 router that supports a Maximum\n Transmission Unit (MTU) of 600 bytes. Assume that the length of the IP header in all the\n outgoing fragments of this packet is 20 bytes. Assume that the fragmentation offset value\n stored in the first fragment is 0.\n The fragmentation offset value stored in the third fragment is _______.\nCS 19/20\nGATE 2018 COMPUTER SCIENCE AND INFORMATION TECHNOLOGY"}, {"y": 2018, "p": "2018_CS", "n": 55, "m": 2, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "Consider a simple communication system where multiple nodes are connected by a shared\n broadcast medium (like Ethernet or wireless). The nodes in the system use the following\n carrier-sense based medium access protocol. A node that receives a packet to transmit will\n carrier-sense the medium for 5 units of time. If the node does not detect any other\n transmission in this duration, it starts transmitting its packet in the next time unit. If the node\n detects another transmission, it waits until this other transmission finishes, and then begins\n to carrier-sense for 5 time units again. Once they start to transmit, nodes do not perform any\n collision detection and continue transmission even if a collision occurs. All transmissions\n last for 20 units of time. Assume that the transmission signal travels at the speed of 10 meters\n per unit time in the medium.\n Assume that the system has two no"}, {"y": 2019, "p": "2019_CS", "n": 1, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "The expenditure on the project as follows: equipment Rs.20 lakhs, salaries Rs.12\nlakhs, and contingency Rs.3 lakhs.\n(A) break down (B) break (C) breaks down (D) breaks"}, {"y": 2019, "p": "2019_CS", "n": 2, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "The search engine\u2019s business model around the fulcrum of trust.\n(A) revolves (B) plays (C) sinks (D) bursts"}, {"y": 2019, "p": "2019_CS", "n": 3, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "Two cars start at the same time from the same location and go in the same direction. The\nspeed of the first car is 50 kn/h and the speed of the second car is 60 km/h. The number of\nhours it takes for the distance between the two cars tobe 20kmis__.\n(A)1 (B)2 (\u00a9) 3 (D) 6"}, {"y": 2019, "p": "2019_CS", "n": 4, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "Ten friends planned to share equally the cost of buying a gift for their teacher. When two of\nthem decided not to contribute, each of the other friends had to pay Rs 150 more. The cost\nof the gift was Rs. :\n(A) 666 (B) 3000 (C) 6000 (D) 12000"}, {"y": 2019, "p": "2019_CS", "n": 5, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "Acourt is to a judge as is to a teacher.\n(A) a student (B)apunishment \u2014(C) a syllabus (D) aschool\nQ.6-Q. 10 carry two marks each."}, {"y": 2019, "p": "2019_CS", "n": 6, "m": 2, "s": "General Aptitude", "t": "Logical reasoning & data interpretation", "q": "The police arrested four criminals \u2014 P, Q, R and S. The criminals knew each other. They\nmade the following statements:\nP says \u201cQ committed the crime.\u201d\nQ says \u201cS committed the crime.\u201d\nR says \u201cI did not do it.\u201d\nS says \u201cWhat Q said about me is false.\u201d\nAssume only one of the arrested four committed the crime and only one of the statements\nmade above is true. Who committed the crime?\n(AyP (\u00ae)R \u00a9s \u00a9) Q\nGA 13\nGATE 2019 General Aptitude (GA) Set-6"}, {"y": 2019, "p": "2019_CS", "n": 7, "m": 2, "s": "General Aptitude", "t": "Spatial & geometry", "q": "In the given diagram, teachers are represented in the triangle, researchers in the circle and\nadministrators in the rectangle. Out of the total number of the people, the percentage of\nadministrators shall be in the range of :\nTeachers\n10.\n. 70 a\n: ya 20 Administrators\n/ 20\nResearchers \\\n40 /\n(A) 0 to 15 (B) 16 to 30 (C) 31 to 45 (D) 46 to 60"}, {"y": 2019, "p": "2019_CS", "n": 8, "m": 2, "s": "General Aptitude", "t": "Verbal ability", "q": "\u201cA recent High Court judgement has sought to dispel the idea of begging as a disease \u f the following is TRUE?\n(A) Limplies I; II does not imply I.\n(B) Il implies I; I does not imply I.\n(\u00a9) I does not imply IL; II does not imply I.\n(D) [ and II are equivalent statements."}, {"y": 2019, "p": "2019_CS", "n": 11, "m": 1, "s": "Databases", "t": "Transactions & concurrency", "q": "Consider the following two statements about database transaction schedules:\nalg Strict two-phase locking protocol generates conflict serializable schedules that\nare also recoverable.\nIL Timestamp-ordering concurrency control protocol with Thomas\u2019 Write Rule can\ngenerate view serializable schedules that are not conflict serializable.\nWhich of the above statements is/are TRUE?\n(A) Ionly (B) Honly (\u00a9 Both I and II (D) Neither I nor II"}, {"y": 2019, "p": "2019_CS", "n": 12, "m": 1, "s": "Discrete Mathematics", "t": "Graph theory", "q": "Let G be an undirected complete graph on n vertices, where n > 2. Then, the number of\ndifferent Hamiltonian cycles in G is equal to\nAn \u00aea-yD! (one (p) 2!\n2"}, {"y": 2019, "p": "2019_CS", "n": 13, "m": 1, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "x4-81\nCompute lim 2x2\u20145x\u2014-3\n(A)1 (B) 53/12\n(\u00a9) 1108/7 (D) Limit does not exist"}, {"y": 2019, "p": "2019_CS", "n": 14, "m": 1, "s": "Data Structures", "t": "Trees, BST, AVL, heaps", "q": "Which one of the following statements is NOT correct about the B+ tree data structure used\nfor creating an index of a relational database table?\n(A) B# Tree is a height-balanced tree\n(B) Non-leaf nodes have pointers to data records\n(C) Key values in each node are kept in sorted order\n(D) Each leaf node has a pointer to the next leaf node"}, {"y": 2019, "p": "2019_CS", "n": 15, "m": 1, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "For \u00a5 = {a,b}, let us consider the regular language L = {x |x = a?*3* or x = pt0t12k,\nk = 0}. Which one of the following can be a pumping length (the constant guaranteed by\nth wer Type (NAT), carry TWO mark each (no negative marks).\nQA8 | Consider the following ANSI C function:\nint SimpleFunction(int Y[], int n, int x)\nit\nint total = Y[0], loopIndex;\nfor (loopIndex = 1; loopIndex <= n - 1; loopIndex++)\ntotal = x * total + Y[loopIndex] ;\nreturn total;\na\nLet Z be an array of 10 elements with Z[\u00e9]=1, for all \u00a2 such that 0 <i <9. The\nvalue returned by SimpleFunction(Z, 10,2) is ______.\nQ.A9 | Consider the sliding window flow-control protocol operating between a sender and\na receiver over a full-duplex error-free link. Assume the following:\nThe time taken for processing the data frame by the receiver is negligible.\nThe time taken for processing, the acknowledgement frame by the sender is neg-\nligible.\nThe sender has infinite number of frames available for transmission\nThe size of the data frame is 2,000 bits and the size of the acknowledgement\nf"}, {"y": 2021, "p": "2021_CS", "n": 50, "m": 2, "s": "Compiler Design", "t": "Syntax-directed translation & intermediate code", "q": "| Consider the following C code segment:\na=b+e;\ne=a+i;\nd=b+c\u00a2;\nfed+1;\ng=e+t;\nIn a compiler, this code segment is represented internally as a directed acyclic graph\n(DAG). The number of nodes in the DAG is \u2014\u2014___.\nCS, Set-1 - Copyright \u00a9 GATE 2021 \n(e7:\\ i <a Graduate Aptitude Test in Engineering 2021 a\n2221 \nComputer Science and Information Technology (CS, Set-1)"}, {"y": 2021, "p": "2021_CS", "n": 51, "m": 2, "s": "Data Structures", "t": "Stacks, queues, linked lists", "q": "| Ina pushdown automaton P = (Q,2,T',d, qo, F), a transition of the form,\na,X +Y\n(@)\u2014\u2014\u2014-@ q)\ns WY\nwhere p,q \u20ac Q, a \u20ac DU {e}, and X,Y \u20acTu fe}, represents\n(9. Y) \u20ac d(p,a, X).\nConsider the following pushdown automaton over the input alphabet U = {a,b}\nand stack alphabet [ = {#, A}.\naesA b,Aze\nQ Q .\nti a C+ # f e+e , 6AvA @)\nstart \u2014( 40 }\u2014\u2014\u2014>\"_+ (4 } \u2014\u2014\u2014\"_+-(42 \u ORY|R3] + R2 4\nINC R3 R3 \u00a2 R341 2\nDEC R1 Re RII 2\nBNZ 1004 Branch if not zero to the 2\ngiven absolute address\nHALT Stop 1\nAssume that the content of the memory location 5000 is 10, and the content of\nthe register R3 is 3000. The content of each of the memory locations from 3000 to\n3010 is 50. The instruction sequence starts from the memory location 1000. All\nthe numbers are in decimal format. Assume that the memory is byte addressable\nAfter the execution of the program, the content of memory location 3010 is\nEND OF QUESTION PAPER\nCS, Set-1 - Copyright \u00a9 GATE 2021 \nGATE 2021 Answer Key"}, {"y": 2021, "p": "2021_CS", "n": 5, "m": 1, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "Which one of the following circuits implements the Boolean function given below?\nf(x,y, 2) = mo +m + mg + ma + ms + me, where m, is the i\u201d minterm.\n1 mai\niim |,\n(A) x\u20142 Mux\nX23 5, b\nye\nx\u2014o\nisi aa Ly\n(B) x\u2019\u2014\\2 Mux\n13 5, 5%\nyz\ni\u2014o\n1 Lo 4h f\n(C) \u20142 Mux\nx13 5, 5\nyo?\nx\u2014fo\nijl 4a\n(D) x\u2014|2 Mux f\n123 515\nye\nCS, Set-2 - Copyright \u00a9 GATE 2021 \n(ey. 4 ag Graduate Aptitude Test in Engineering 2021 ume: 7\n2021 \nComputer Science and Information Technology (CS, Set-2)"}, {"y": 2021, "p": "2021_CS", "n": 15, "m": 1, "s": "Discrete Mathematics", "t": "Logic, sets, relations & algebra", "q": "| Choose the correct choice(s) regarding the following propositional logic assertion\nSs:\nS:((PAQ) > R) > ((PAQ) > (Q> R))\ncee\nCS, Set-2 - Copyright \u00a9 GATE 2021 \n(e7:\\ i <a Graduate Aptitude Test in Engineering 2021 me]\n2221 \nComputer Science and Information Technology (CS, Set-2)"}, {"y": 2021, "p": "2021_CS", "n": 44, "m": 2, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "| If the numerical value of a 2-byte unsigned integer on a little endian computer\nis 255 more than that on a big endian computer, which of the following choices\nrepresent(s) the unsigned integer on a  3: No student is inquisitive.\n Statement 4: Some students are not inquisitive.\n From the given four statements, find the two statements that CANNOT BE\n TRUE simultaneously, assuming that there is at least one student in the class.\n (A) Statement 1 and Statement 3\n (B) Statement 1 and Statement 2\n (C) Statement 2 and Statement 4\n (D) Statement 3 and Statement 4"}, {"y": 2022, "p": "2022_CS", "n": 5, "m": 1, "s": "General Aptitude", "t": "Verbal ability", "q": "A palindrome is a word that reads the same forwards and backwards. In a game\n of words, a player has the following two plates painted with letters.\n From the additional plates given in the options, which one of the combinations\n of additional plates would allow the player to construct a five-letter palindrome.\n The player should use all the five plates exactly once. The plates can be rotated\n in their plane.\n (A)\n (B)\n (C)\n (D)"}, {"y": 2022, "p": "2022_CS", "n": 7, "m": 2, "s": "General Aptitude", "t": "Verbal ability", "q": "In a recently conducted national entrance test, boys constituted 65% of those who\n appeared for the test. Girls constituted the remaining candidates and they\n accounted for 60% of the qualified candidates.\n Which one of the following is the correct logical inference based on the\n information provided in the above passage?\n (A) Equal number of boys and girls qualified\n (B) Equal number of boys and girls appeared for the test\n (C) The number of boys who appeared for the test is less than the number of girls\n who appeared\n (D) The number of boys who qualified the test is less than the number of girls who\n qualified\n A box contains five balls of same size and shape. Three of them are green"}, {"y": 2022, "p": "2022_CS", "n": 8, "m": 2, "s": "General Aptitude", "t": "Quantitative aptitude", "q": "coloured balls and two of them are orange coloured balls. Balls are drawn from\n the box one at a time. If a green ball is drawn, it is not replaced. If an orange ball\n is drawn, it is replaced with another orange ball.\n First ball is drawn. What is the probability of getting an orange ball in the next\n draw?\n (A) 1\n 2\n (B) 8\n 25\n (C) 19\n 50\n (D) 23\n 50"}, {"y": 2022, "p": "2022_CS", "n": 9, "m": 2, "s": "General Aptitude", "t": "Verbal ability", "q": "The corners and mid-points of the sides of a triangle are named using the distinct\n letters P, Q, R, S, T and U, but not necessarily in the same order. Consider the\n following statements:\n \uf0b7 The line joining P and R is parallel to the line joining Q and S.\n \uf0b7 P is placed on the side opposite to the corner T.\n \uf0b7 S and U cannot be placed on the same side.\n Which one of the following statements is correct based on the above\n information?\n (A) P cannot be placed at a corner\n (B) S cannot be placed at a corner\n (C) U cannot be placed at a mid-point\n (D) R cannot be placed at a corner"}, {"y": 2022, "p": "2022_CS", "n": 10, "m": 2, "s": "General Aptitude", "t": "Spatial & geometry", "q": "A plot of land must be divided between four families. They want their\n individual plots to be similar in shape, not necessarily equal in area. The land\n has equally spaced poles, marked as dots in the below figure. Two ropes, R1 and\n R2, are already present and cannot be moved.\n What is the least number of additional straight ropes needed to create the\n desired plots? A single rope can pass through three poles that are aligned in a\n straight line.\n (A) 2\n (B) 4\n (C) 5\n (D) 3\nGATE 2022 Computer Science and Information Technology (CS)"}, {"y": 2022, "p": "2022_CS", "n": 12, "m": 1, "s": "Theory of Computation", "t": "Regular languages & finite automata", "q": "Which one of the following regular expressions correctly represents the language\n of the finite automaton given below?\n (A) ab*bab* \uf02b ba* aba*\n (B) (ab*b)* ab* \uf02b (ba*a)* ba*\n (C) (ab*b \uf02b ba*a)* (a* \uf02b b* )\n (D) (ba*a \uf02b ab*b)* (ab* \uf02b ba* )\nGATE 2022 Computer Science and Information Technology (CS)"}, {"y": 2022, "p": "2022_CS", "n": 13, "m": 1, "s": "Compiler Design", "t": "Parsing (LL, LR)", "q": "Which one of the following statements is TRUE?\n(A) The LALR (1) parser for a grammar G cannot have reduce-reduce conflict if the\n LR (1) parser for G does not have reduce-reduce conflict.\n(B) Symbol table is accessed only during the lexical analysis phase.\n(C) Data flow analysis is necessary for run-time memory management.\n(D) LR (1) parsing is sufficient for deterministic context-free languages."}, {"y": 2022, "p": "2022_CS", "n": 14, "m": 1, "s": "Databases", "t": "Normalization & functional dependencies", "q": "In a relational data model, which one of the following statements is TRUE?\n(A) A relation with only two attributes is always in BCNF.\n(B) If all attributes of a relation are prime attributes, then the relation is in BCNF.\n(C) Every relation has at least one non-prime attribute.\n(D) BCNF decompositions preserve functional dependencies.\nGATE 2022 Computer Science and Information Technology (CS)"}, {"y": 2022, "p": "2022_CS", "n": 15, "m": 1, "s": "Algorithms", "t": "Complexity & recurrences", "q": "Consider the problem of reversing a singly linked list. To take an example, given\n the linked list below,\n the reversed linked list should look like\n Which one of the following statements is TRUE about the time complexity of\n algorithms that solve the above problem in O (1) space?\n(A) The best algorithm for the problem takes \uf071 ( n) time in the worst case.\n(B) The best algorithm for the problem takes \uf071 (n log n ) time in the worst case.\n(C) The best algorithm for the problem takes \uf071 (n2 ) time in the worst case.\n(D) It is not possible to reverse a singly linked list in O (1) space."}, {"y": 2022, "p": "2022_CS", "n": 16, "m": 1, "s": "Data Structures", "t": "Hashing", "q": "Suppose we are given n keys, m hash table slots, and two simple uniform hash\n functions h1 and h2 . Further suppose our hashing scheme uses h1 for the odd keys\n and h2 for the even keys. What is the expected number of keys in a slot?\n(A) m\n n\n(B) n\n m\n(C) 2n\n m\n(D) n\n 2m\nGATE 2022 Computer Science and Information Technology (CS)"}, {"y": 2022, "p": "2022_CS", "n": 17, "m": 1, "s": "Computer Networks", "t": "Transport layer (TCP/UDP)", "q": "Which one of the following facilitates transfer of bulk data from hard disk to main\n memory with the highest throughput?\n(A) DMA based I/O transfer\n(B) Interrupt driven I/O transfer\n(C) Polling based I/O transfer\n(D) Programmed I/O transfer"}, {"y": 2022, "p": "2022_CS", "n": 18, "m": 1, "s": "Digital Logic", "t": "Number systems & arithmetic", "q": "Let R1 and R2 be two 4-bit registers that store numbers in 2\u2019s complement form.\n For the operation R1+R2, which one of the following values of R1 and R2 gives an\n arithmetic overflow?\n(A) R1 = 1011 and R2 = 1110\n(B) R1 = 1100 and R2 = 1010\n(C) R1 = 0011 and R2 = 0100\n(D) R1 = 1001 and R2 = 1111\nGATE 2022 Computer Science and Information Technology (CS)"}, {"y": 2022, "p": "2022_CS", "n": 19, "m": 1, "s": "Operating Systems", "t": "Process synchronization", "q": "Consider the following threads, T1, T2, and T3 executing on a single processor,\n synchronized using three binary semaphore variables, S1, S2, and S3, operated upon\n using standard wait() and signal(). The threads can be context switched in\n any order and at any time.\n T1 T2 T3\n while(true){ while(true){ while(true){\n wait(S3); wait(S1); wait(S2);\n print(\u201cC\u201d); print(\u201cB\u201d); print(\u201cA\u201d);\n signal(S2); } signal(S3); } signal(S1); }\n Which initialization of the semaphores would print the sequence BCABCABCA\u2026.?\n(A) S1 = 1; S2 = 1; S3 = 1\n(B) S1 = 1; S2 = 1; S3 = 0\n(C) S1 = 1; S2 = 0; S3 = 0\n(D) S1 = 0; S2 = 1; S3 = 1\nGATE 2022 Computer Science and Information Technology (CS)"}, {"y": 2022, "p": "2022_CS", "n": 20, "m": 1, "s": "Discrete Mathematics", "t": "Linear algebra & calculus", "q": "Consider the following two statements with respect to the matrices Am\uf0b4n , Bn\uf0b4m ,\n Cn\uf0b4n and Dn\uf0b4n .\n Statement 1: tr(AB) = tr(BA)\n Statement 2: tr(CD) = tr(DC)\n where tr() represents the trace of a matrix. Which one of the following holds?\n(A) Statement 1 is correct and Statement 2 is wrong.\n(B) Statement 1 is wrong and Statement 2 is correct.\n(C) Both Statement 1 and Statement 2 are correct.\n(D) Both Statement 1 and Statement 2 are wrong.\nGATE 2022 Computer Science and Information Technology (CS)"}, {"y": 2022, "p": "2022_CS", "n": 21, "m": 1, "s": "Programming in C", "t": "Pointers, recursion & output tracing", "q": "What is printed by the following ANSI C program?\n #include<stdio.h>\n int main(int argc, char *argv[])\n {\n int x = 1, z[2] = {10, 11};\n int *p = NULL;\n p = &x;\n *p = 10;\n p = &z[1];\n *(&z[0] + 1) += 3;\n printf(\"%d, %d, %d\\n\", x, z[0], z[1]);\n return 0;\n }\n(A) 1, 10, 11\n(B) 1, 10, 14\n(C) 10, 14, 11\n(D) 10, 10, 14\nGATE 2022 Computer Science and Information Technology (CS)"}, {"y": 2022, "p": "2022_CS", "n": 22, "m": 1, "s": "Computer Networks", "t": "IP, subnetting & routing", "q": "Consider an enterprise network with two Ethernet segments, a web server and a\n firewall, connected via three routers as shown below.\n What is the number of subnets inside the enterprise network?\n(A) 3\n(B) 12\n(C) 6\n(D) 8\nGATE 2022 Computer Science and Information Technology (CS)"}, {"y": 2022, "p": "2022_CS", "n": 24, "m": 1, "s": "Computer Organization", "t": "Cache & memory hierarchy", "q": "Let WB and WT be two set associative cache organizations that use LRU algorithm\n for cache block replacement. WB is a write back cache and WT is a write through\n cache. Which of the following statements is/are FALSE?\n (A) Each cache block in WB and WT has a dirty bit.\n (B) Every write hit in WB leads to a data transfer from cache to main memory.\n (C) Eviction of a block from WT will not lead to data transfer from cache to main\n me
